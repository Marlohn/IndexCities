name: 'PR57 #301 bounded vehicle-field changes on pose-stationary slices'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-workset-301.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  physical-step:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build existing observational harness and test simulation
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic #259 REAL and artificial GRID saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process ABBA with exact checkpoints and per-slice field audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/workset-301
          for case in gridARTIFICIAL real14hREAL; do
            input="artifacts/input/${case}-control/checkpoint-0.json"
            test -s "$input"
            calls=100
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; fi
            for arm in control1 probe1 probe2 control2; do
              mode=control
              if [[ "$arm" == probe* ]]; then mode=probe; fi
              output="artifacts/workset-301/${case}-${arm}"
              mkdir -p "$output"
              if [[ "$mode" == probe ]]; then
                PR57_300_BOUNDARY=1 PR57_187_SLICE_WORKSET=1 dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" "$mode" "$calls" "$output" \
                  > "artifacts/workset-301/${case}-${arm}.log" 2>&1
              else
                dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" "$mode" "$calls" "$output" \
                  > "artifacts/workset-301/${case}-${arm}.log" 2>&1
              fi
            done
          done
          python3 scripts/pr57-301-workset-audit.py artifacts/workset-301
      - name: Preserve raw logs and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-workset-301
          path: artifacts/workset-301/**
          retention-days: 14
