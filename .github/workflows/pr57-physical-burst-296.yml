name: 'PR57 #296 physical burst vehicle-class census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-physical-burst-296.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  physical-burst:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build existing observational harness and run simulation tests
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore original #259 REAL and GRID saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process A/B physical cost classification with unchanged Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/burst-296
          for case in gridARTIFICIAL real14hREAL; do
            input="artifacts/input/${case}-control/checkpoint-0.json"
            test -s "$input"
            calls=100
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; fi
            for mode in control probe; do
              output="artifacts/burst-296/${case}-${mode}"
              mkdir -p "$output"
              if [[ "$mode" == probe ]]; then
                PR57_VEHICLE_COST_PROBE=1 dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" "$mode" "$calls" "$output" \
                  > "artifacts/burst-296/${case}-${mode}.log" 2>&1
              else
                dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" "$mode" "$calls" "$output" \
                  > "artifacts/burst-296/${case}-${mode}.log" 2>&1
              fi
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('artifacts/burst-296')
          for case,calls in [('gridARTIFICIAL',50),('real14hREAL',100)]:
              for at in sorted({0,20,calls//2,calls}):
                  a=(root/f'{case}-control'/f'checkpoint-{at}.json').read_bytes()
                  b=(root/f'{case}-probe'/f'checkpoint-{at}.json').read_bytes()
                  assert a==b,(case,at,'FULL_JSON_MISMATCH')
                  json.loads(a)
                  print('PR57_296_PARITY',case,at,hashlib.sha256(a).hexdigest(),flush=True)
              logs={}
              for mode in ('control','probe'):
                  log=(root/f'{case}-{mode}.log').read_text()
                  logs[mode]=log
                  assert log.count('PR57_294_FINAL ')==1,(case,mode,'final')
                  assert log.count('PR57_294_CHECKPOINT ')==4,(case,mode,'checkpoints')
                  assert log.count('PR57_294_STEP ')==(calls if mode=='probe' else 0),(case,mode,'steps')
              rows=[line for line in logs['probe'].splitlines() if line.startswith('PR57_VEHICLE_COST ')]
              assert rows and len(rows)%8==0,(case,'missing vehicle-class rows',len(rows))
              assert not any(line.startswith('PR57_VEHICLE_COST ') for line in logs['control'].splitlines())
              snapshots=sorted({int(re.search(r'slices=(\d+)',line).group(1)) for line in rows})
              assert snapshots[-1]>=calls,(case,'insufficient physical slices',snapshots)
              print('PR57_296_CENSUS',case,'calls='+str(calls),
                    'snapshots='+str(snapshots),'rows='+str(len(rows)),
                    'fullJsonParity=True','allAdvance2=True','noPhysicsSkip=True',flush=True)
          print('PR57_296_VERIFIED cases=2 processes=4 checkpointPairs=8',flush=True)
          PY
      - name: Preserve raw logs and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-burst-296
          path: artifacts/burst-296/**
          retention-days: 14
