name: 'PR57 #316 isolated phase snapshot-diff cost'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-phase-diff-cost-316.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  phase-diff-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test existing simulation
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL and GRID saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: ABBA baseline versus phase-diff alone, uniform harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase-diff-316
          for case in real14hREAL gridARTIFICIAL; do
            input="artifacts/input/${case}-control/checkpoint-0.json"
            test -s "$input"
            calls=100; start=76
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; start=26; fi
            for arm in control1 probe1 probe2 control2; do
              output="artifacts/phase-diff-316/${case}-${arm}"
              mkdir -p "$output"
              if [[ "$arm" == probe* ]]; then
                PR57_310_PHASE_FANOUT=1 PR57_310_START="$start" \
                  dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" control "$calls" "$output" \
                  > "artifacts/phase-diff-316/${case}-${arm}.log" 2>&1
              else
                dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" control "$calls" "$output" \
                  > "artifacts/phase-diff-316/${case}-${arm}.log" 2>&1
              fi
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          root=Path('artifacts/phase-diff-316')
          def fields(line): return dict(re.findall(r'([A-Za-z][A-Za-z0-9]*)=([^\s]+)',line))
          pairs=0
          for case,calls,start in [('real14hREAL',100,76),('gridARTIFICIAL',50,26)]:
              rows={}
              for arm in ('control1','probe1','probe2','control2'):
                  log=(root/f'{case}-{arm}.log').read_text()
                  final=[fields(x) for x in log.splitlines() if x.startswith('PR57_294_FINAL ')]
                  assert len(final)==1,(case,arm,'final')
                  f=final[0]
                  assert f['mode']=='control' and f['cadence']=='Advance2'
                  assert f['noCache']=='True' and f['noSkippedSlices']=='True'
                  assert f['exactCheckpoints']=='True' and int(f['calls'])==calls
                  phase=[fields(x) for x in log.splitlines() if x.startswith('PR57_310_PHASE ')]
                  assert len(phase)==(75 if arm.startswith('probe') else 0),(case,arm,len(phase))
                  if phase:
                      for i in range(start,calls+1):
                          assert [x['phase'] for x in phase if int(x['call'])==i]==['vehicles','paving','citizens']
                  rows[arm]=f
              for suffix in ('1','2'):
                  for step in (0,20,calls//2,calls):
                      a=(root/f'{case}-control{suffix}'/f'checkpoint-{step}.json').read_bytes()
                      b=(root/f'{case}-probe{suffix}'/f'checkpoint-{step}.json').read_bytes()
                      assert a==b,(case,suffix,step)
                      pairs+=1
              for metric in ('wallMs','cpuMs','allocatedBytes'):
                  base=statistics.mean(float(rows[f'control{i}'][metric]) for i in ('1','2'))
                  probe=statistics.mean(float(rows[f'probe{i}'][metric]) for i in ('1','2'))
                  print(f'PR57_316_DELTA case={case} metric={metric} base={base:.3f} probe={probe:.3f} delta={probe-base:.3f} ratio={probe/base:.6f} scope=INSTRUMENTATION_NOT_ENGINE_SPEEDUP')
          assert pairs==16,pairs
          print('PR57_316_VERIFIED checkpointPairs=16/16 processes=8 allAdvance2=True uniformHarness=True phaseDiffOnly=True')
          PY
      - name: Preserve raw logs and complete checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-phase-diff-cost-316
          path: artifacts/phase-diff-316/**
          retention-days: 14
