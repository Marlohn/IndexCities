name: PR57 progress shipment mutation adversarial (opt-in)
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-progress-shipment-adversarial.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  progress-shipment-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build tests
        run: dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Adversarial mutations and save parity in fresh baseline/candidate processes
        shell: bash
        run: |
          set -euo pipefail
          for mode in off on; do
            enabled=0
            if [[ "$mode" == on ]]; then enabled=1; fi
            mkdir -p "artifacts/progress-mutation/$mode"
            PR57_GRID_DIAG=1 PR57_PROGRESS_MUTATION_DIR="$PWD/artifacts/progress-mutation/$mode" \
            PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
            PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
            PR57_PROGRESS_SHIPMENT_LOOKUP="$enabled" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Pr57ProgressShipmentMutationAdversarial \
                --logger "console;verbosity=normal" | tee "artifacts/progress-mutation/$mode.log"
            expected=False
            if [[ "$mode" == on ]]; then expected=True; fi
            grep -F "PR57_PROGRESS_SHIPMENT_LOOKUP active=$expected" "artifacts/progress-mutation/$mode.log"
            grep -F "PR57_PROGRESS_MUTATION cargo-live=True crew-return=True synthetic=True" "artifacts/progress-mutation/$mode.log"
          done
          for checkpoint in before after-restoration after-resume; do
            cmp "artifacts/progress-mutation/off/$checkpoint.json" \
                "artifacts/progress-mutation/on/$checkpoint.json"
            echo "PR57_PROGRESS_ADVERSARIAL checkpoint=$checkpoint identical=True"
          done
      - name: Full regression suites in fresh opt-out and opt-in processes
        shell: bash
        run: |
          set -euo pipefail
          for enabled in 0 1; do
            PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
            PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
            PR57_PROGRESS_SHIPMENT_LOOKUP="$enabled" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --verbosity quiet
          done
      - name: Preserve adversarial checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-progress-mutation-adversarial
          path: artifacts/progress-mutation/**
          retention-days: 14
