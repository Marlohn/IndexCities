name: 'PR57 #331 adversarial tow writer publication'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-tow-writers-331.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  tow-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject opt-in observational physical shadow and adversarial fixtures
        run: python3 scripts/pr57-331-inject.py
      - name: Full baseline test suite with injected fixture (actor-major)
        run: |
          set -euo pipefail
          PR57_330_ACTOR_LOCAL=0 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity normal
      - name: Fresh testhost - actor-local writer publication
        run: |
          set -euo pipefail
          PR57_330_ACTOR_LOCAL=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Pr57Physical331Tests' --verbosity normal
      - name: Fresh testhost - actor-major scan control
        run: |
          set -euo pipefail
          PR57_330_ACTOR_LOCAL=0 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Pr57Physical331Tests' --verbosity normal
