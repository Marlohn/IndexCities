name: 'PR57 #441 REAL pollution and electricity work census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-pollution-electric-census-441.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-causal-census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Instrument existing DetailTicks in disposable runner only
        run: |
          python3 scripts/pr57-440-inject.py
          python3 scripts/pr57-441-inject.py
      - name: Build and full regression suite
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes and all individual Advance(2) calls
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in first second; do
            mkdir -p "artifacts/census441/$arm"
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/census441/$arm" \
              > "artifacts/census441/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/census441/$arm/full.log"
          done
          cmp artifacts/census441/first/checkpoint-10800.json artifacts/census441/second/checkpoint-10800.json
          sha256sum artifacts/census441/*/checkpoint-10800.json > artifacts/census441/checkpoints.sha256
          python3 - <<'PY_AUDIT' | tee artifacts/census441/summary.json
          import json, hashlib
          from pathlib import Path
          root=Path('artifacts/census441')
          stages=['infra-presence','infra-demands','infra-electricity','infra-water',
                  'infra-sewage-pollution','infra-finalize','needs-pollution','needs-citizens']
          phases=['vehicles','paving-returns','citizen-mobility','construction',
                  'maintenance','relocation','infrastructure','businesses','needs',
                  'economy-review','construction-dispatch','market-followups',
                  'demolition-finance-loans']
          arms={}; signatures=[]
          for arm in ('first','second'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              details=rows('PR57_440_STAGE')
              phase_rows=rows('PR57_440_PHASE')
              states=rows('PR57_440_STATE')
              pollution=rows('PR57_441_POLLUTION')
              electric=rows('PR57_441_ELECTRIC')
              final=rows('PR57_337_FINAL')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert [int(x['calls']) for x in boundaries]==list(range(100,10801,100))
              assert all(x['quantum']=='2' for x in boundaries)
              assert len(details)==48 and len(phase_rows)==78 and len(states)==6
              assert len(pollution)==66 and len(electric)==42
              pnames=['needsSnapshotTicks','homeBuildTicks','homeSampleTicks','needsSnapshotCalls','homesSampled','homeCellProducts','factorLayoutRefreshes','factorRecomputes','cellLayoutChanges','needsSnapshotCells','fallbackHomeSamples']
              enames=['allocateTicks','allocateCalls','noCapacityOrDemand','sufficientCapacity','constrainedCapacity','sources','consumers']
              assert all([x['metric'] for x in pollution if int(x['hour'])==h]==pnames for h in range(1,7))
              assert all([x['metric'] for x in electric if int(x['hour'])==h]==enames for h in range(1,7))
              pc={name:sum(int(x['value']) for x in pollution if x['metric']==name) for name in pnames}
              ec={name:sum(int(x['value']) for x in electric if x['metric']==name) for name in enames}
              assert pc['needsSnapshotCalls']==10800 and ec['allocateCalls']==10800
              assert ec['noCapacityOrDemand']+ec['sufficientCapacity']+ec['constrainedCapacity']==10800
              assert pc['homesSampled']>0 and all(v>=0 for v in pc.values()) and all(v>=0 for v in ec.values())
              assert all([x['name'] for x in details if int(x['hour'])==h]==stages for h in range(1,7))
              assert all([x['name'] for x in phase_rows if int(x['hour'])==h]==phases for h in range(1,7))
              assert all(int(x['living'])==121 and int(x['vehicles'])==98 for x in states)
              assert final[0]['parity']=='IDENTICAL'
              signatures.append([tuple(h[k] for k in
                  ('hour','slices','actors','claimChanges','spaceCountChanges',
                   'living','ledger','history')) for h in hours])
              detail_ms={name:sum(float(x['ms']) for x in details if x['name']==name) for name in stages}
              phase_ms={name:sum(float(x['ms']) for x in phase_rows if x['name']==name) for name in phases}
              infra=sum(detail_ms[name] for name in stages[:6])
              needs=sum(detail_ms[name] for name in stages[6:])
              # Nested detail timers exclude the outer phase boundary; allow only
              # small Stopwatch/Mark bookkeeping differences, not unbounded overlap.
              assert infra <= phase_ms['infrastructure']*1.05+1
              assert needs <= phase_ms['needs']*1.05+1
              arms[arm]={
                  'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                  'cpuMs':round(sum(float(h['cpuMs']) for h in hours),3),
                  'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                  'detailMs':{k:round(v,3) for k,v in detail_ms.items()},
                  'pollutionCensus':pc,'electricCensus':ec,
                  'phaseMs':{k:round(phase_ms[k],3) for k in ('vehicles','infrastructure','needs')},
                  'infraDetailMs':round(infra,3),'needsDetailMs':round(needs,3),
                  'detailFractionOfParent':{
                      k:round(v/(phase_ms['infrastructure'] if k.startswith('infra-') else phase_ms['needs']),4)
                      for k,v in detail_ms.items()},
                  'stateByHour':states}
          assert signatures[0]==signatures[1], 'intermediate ledger/history diverged'
          saves=[(root/a/'checkpoint-10800.json').read_bytes() for a in ('first','second')]
          assert saves[0]==saves[1] and len(saves[0])==2254838
          sha=hashlib.sha256(saves[0]).hexdigest()
          assert sha=='e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa'
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'arms':arms,'saveSha256':sha,
              'observational':True,'causalClosure':False,
              'experiment':'441_pollution_electricity_census',
              'optimizationGainAccepted':False},sort_keys=True))
          PY_AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-pollution-electric-census-441
          path: artifacts/census441
          retention-days: 14
