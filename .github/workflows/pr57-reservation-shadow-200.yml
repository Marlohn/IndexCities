name: 'PR57 #200 bounded reservation shadow index and independent oracle'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-reservation-shadow-200.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  shadow-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic GRID checkpoint from #184
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-retained-heap-184
          run-id: 40451480020
          github-token: ${{ github.token }}
          path: artifacts/reference
      - name: Independent control and shadow probe processes
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/reference -type f -path '*/gridARTIFICIAL/plain/checkpoint-0.json' -print -quit)"
          test -s "$source"
          mkdir -p artifacts/shadow-200/control artifacts/shadow-200/probe
          timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/shadow-200/control" | tee artifacts/shadow-200/control.log
          PR57_193_JUNCTION_READERS=1 PR57_200_RESERVATION_SHADOW=1 timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/shadow-200/probe" | tee artifacts/shadow-200/probe.log
      - name: Exact full-state parity and bounded oracle report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/shadow-200')
          for i in (0,50,100,150,200):
              assert (root/'control'/f'checkpoint-{i}.json').read_bytes()==(root/'probe'/f'checkpoint-{i}.json').read_bytes(),('FULL_JSON_DIFFERENCE',i)
          lines=(root/'probe.log').read_text().splitlines()
          rows=[dict(kv.split('=',1) for kv in s.split()[1:] if '=' in kv)
                for s in lines if s.startswith('PR57_200_RESERVATION_SHADOW ')]
          assert len(rows)==1,('SHADOW_SAMPLES',len(rows))
          row=rows[0]
          assert int(row['admissions'])>0 and int(row['oracleVehicleChecks'])>0,row
          assert int(row['hookCalls'])>0,row
          assert int(row['indexedCandidatesSum'])>=0 and int(row['actualCandidatesSum'])>=0,row
          assert int(row['missingCandidateReads'])>=0 and int(row['extraCandidateReads'])>=0,row
          for mode in ('control','probe'):
              assert any(s.startswith('PR57_186_DONE ') and 'cadence=ADVANCE_2' in s
                         for s in (root/f'{mode}.log').read_text().splitlines()),mode
          print('PR57_200_VALIDATED checkpoints=5 parity=EXACT_FULL_JSON cadence=ADVANCE_2')
          print('PR57_200_SHADOW_ORACLE',row)
          PY
      - name: Preserve logs and complete saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-reservation-shadow-200
          path: artifacts/shadow-200/**
          retention-days: 14
