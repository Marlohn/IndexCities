name: PR57 isolated controlled boundary real-save adversarial
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-controlled-boundary.yml
      - tests/IndexCities.Simulation.Tests/Pr57ControlledBoundaryAdversarial.cs
      - tests/IndexCities.Simulation.Tests/Pr57VehicleOrderSensitivity.cs
      - tests/IndexCities.Simulation.Tests/Pr57StructuralIntegratedGate.cs
      - tests/IndexCities.Simulation.Tests/Pr57DependencyExecutorPoc.cs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  boundary-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile isolated C# adapter against actual simulation
        run: dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic active-construction economy
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/real-growth
      - name: Restore authentic congested economy
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real-congested
      - name: Adversarial aliases, controlled commands, maintenance costs and exact engine checkpoints
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          mkdir -p artifacts/controlled-boundary
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            echo "PR57_BOUNDARY_INPUT case=$case sha256=$(sha256sum "$save" | cut -d' ' -f1)"
            PR57_CONTROLLED_CASE="$case" PR57_CONTROLLED_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Pr57ControlledBoundaryAdversarial \
                --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/$case.log"
            grep -F "PR57_CONTROLLED_BOUNDARY case=$case" "artifacts/controlled-boundary/$case.log"
            grep -F "byteEqual=True aliasIsolation=True" "artifacts/controlled-boundary/$case.log"
          done
      - name: Adversarial ordered vehicle list on authentic saves
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          mkdir -p artifacts/controlled-boundary
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            PR57_CONTROLLED_CASE="$case" PR57_CONTROLLED_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Pr57VehicleOrderSensitivity \
                --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/order-$case.log"
            grep -F "PR57_ORDER_REAL case=$case" "artifacts/controlled-boundary/order-$case.log"
            grep -F "PR57_ADJACENT_REAL case=$case" "artifacts/controlled-boundary/order-$case.log"
          done
      - name: Dependency executor M0 on authentic saves (mandatory causal fallback)
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          mkdir -p artifacts/controlled-boundary
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            PR57_DEPENDENCY_CASE="$case" PR57_DEPENDENCY_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Authentic_saves_dependency_executor_m0_causal_parity_and_cost \
                --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/dependency-$case.log"
            grep -F "PR57_DEPENDENCY_M0 case=$case" "artifacts/controlled-boundary/dependency-$case.log"
            grep -F "avoidedSteps=0" "artifacts/controlled-boundary/dependency-$case.log"
            test "$(grep -c 'PR57_DEPENDENCY_CHECKPOINT' "artifacts/controlled-boundary/dependency-$case.log")" -eq 12
          done
      - name: Cross-check opt-in causal agenda with external edits and save-load (fresh ABBA)
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            for trial in baseline-1 alternate-1 alternate-2 baseline-2; do
              mode="${trial%-*}"
              if [[ "$mode" == alternate ]]; then
                export PR57_LIVING_ROSTER=1 PR57_CITIZEN_AGENDA=1
              else
                unset PR57_LIVING_ROSTER PR57_CITIZEN_AGENDA || true
              fi
              PR57_DEPENDENCY_CASE="$case" PR57_DEPENDENCY_SAVE_PATH="$PWD/$save" \
                dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                  -c Release --no-build --filter FullyQualifiedName~Authentic_saves_dependency_executor_m0_causal_parity_and_cost \
                  --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
              grep 'PR57_DEPENDENCY_CHECKPOINT' "artifacts/controlled-boundary/dependency-abba-$case-$trial.log" \
                | sed -E 's/^[^P]*PR57_DEPENDENCY_CHECKPOINT/PR57_DEPENDENCY_CHECKPOINT/' \
                > "artifacts/controlled-boundary/dependency-abba-$case-$trial.hashes"
              test "$(wc -l < "artifacts/controlled-boundary/dependency-abba-$case-$trial.hashes")" -eq 12
              grep -F 'PR57_DEPENDENCY_RESUME' "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
            done
            for trial in alternate-1 alternate-2 baseline-2; do
              diff -u "artifacts/controlled-boundary/dependency-abba-$case-baseline-1.hashes" \
                "artifacts/controlled-boundary/dependency-abba-$case-$trial.hashes"
            done
            echo "PR57_DEPENDENCY_ABBA_PARITY case=$case exactJsonHashes=True externalCommands=3 postLoadSteps=10 fallbackSteps=120 no-structural-speedup-claim"
          done
      - name: Falsify 10x public-boundary batching against real causal saves
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            set +e
            PR57_DEPENDENCY_CASE="$case" PR57_DEPENDENCY_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Authentic_saves_batched_public_boundary_exact_causal_gate \
                --logger "console;verbosity=detailed" > "artifacts/controlled-boundary/batch-$case.log" 2>&1
            result=$?
            set -e
            cat "artifacts/controlled-boundary/batch-$case.log"
            if [[ "$result" -ne 0 ]]; then
              grep -F "Public-boundary batching changed full JSON" "artifacts/controlled-boundary/batch-$case.log"
              echo "PR57_BATCH_VERDICT case=$case rejected=causal-divergence no-speedup-claim"
            else
              grep -F "PR57_BATCH_BOUNDARY_COST case=$case" "artifacts/controlled-boundary/batch-$case.log"
              echo "PR57_BATCH_VERDICT case=$case parity-at-12-checkpoints-only requires-intermediate-parity-and-fresh-ABBA"
            fi
          done
      # PR57_BOUNDARY_CEILING temporarily disabled: the integrated gate does not
      # emit PR57_ADVANCE_BOUNDARY. Do not let an absent probe block real ABBA.
      - name: Integrated alternate mode checkpoint parity on both authentic saves
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            # Fresh dotnet test processes, ABBA ordering, with identical inputs.
            # This measures the integrated mode rather than a local selector.
            for trial in baseline-1 alternate-1 alternate-2 baseline-2; do
              mode="${trial%-*}"
              if [[ "$mode" == alternate ]]; then
                export PR57_LIVING_ROSTER=1 PR57_CITIZEN_AGENDA=1
              else
                unset PR57_LIVING_ROSTER PR57_CITIZEN_AGENDA || true
              fi
              PR57_ADVANCE_BOUNDARY_PROBE=1 PR57_STRUCTURAL_SAVE_PATH="$PWD/$save" PR57_STRUCTURAL_CASE="$case" PR57_STRUCTURAL_MODE="$mode" \
                dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                  -c Release --no-build --filter FullyQualifiedName~Pr57StructuralIntegratedGate \
                  --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/structural-$case-$trial.log"
              # The existing Step-vs-Advance observer emits at call 100. Its
              # upper bound tests whether eliminating ALL public-boundary work
              # could plausibly yield a macro speedup, without skipping phases.
              grep -F "PR57_ADVANCE_BOUNDARY calls=100" "artifacts/controlled-boundary/structural-$case-$trial.log"
              grep 'PR57_STRUCTURAL_CHECKPOINT' "artifacts/controlled-boundary/structural-$case-$trial.log" \
                | sed -E 's/^[^P]*PR57_STRUCTURAL_CHECKPOINT/PR57_STRUCTURAL_CHECKPOINT/' \
                > "artifacts/controlled-boundary/checkpoints-$case-$trial.txt"
              test "$(wc -l < "artifacts/controlled-boundary/checkpoints-$case-$trial.txt")" -eq 12
            done
            for trial in alternate-1 alternate-2 baseline-2; do
              diff -u "artifacts/controlled-boundary/checkpoints-$case-baseline-1.txt" \
                      "artifacts/controlled-boundary/checkpoints-$case-$trial.txt"
            done
            python3 - "$case" <<'PY'
          import pathlib, re, statistics, sys
          case = sys.argv[1]
          base = pathlib.Path("artifacts/controlled-boundary")
          times = {}
          for trial in ("baseline-1", "alternate-1", "alternate-2", "baseline-2"):
              log = (base / f"structural-{case}-{trial}.log").read_text()
              matches = re.findall(r"PR57_STRUCTURAL_COST[^\n]*advanceWallMs=([0-9.]+)", log)
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one integrated cost for {case} {trial}, got {len(matches)}")
              times[trial] = float(matches[0])
          baseline = statistics.mean(times[k] for k in ("baseline-1", "baseline-2"))
          alternate = statistics.mean(times[k] for k in ("alternate-1", "alternate-2"))
          target_ms_per_advance = 21600.0 / 1_260_000_000 * 1000
          baseline_us = baseline * 1000 / 120
          alternate_us = alternate * 1000 / 120
          print(f"PR57_STRUCTURAL_ABBA case={case} baselineMeanMs={baseline:.3f} alternateMeanMs={alternate:.3f} speedup={baseline/alternate:.5f} trials={times} samples=2-per-mode-not-statistically-robust")
          print(f"PR57_STRUCTURAL_TARGET_GAP case={case} population=real-save-not-10k baselineUsPerAdvance={baseline_us:.3f} alternateUsPerAdvance={alternate_us:.3f} exploratory10kTargetUs={target_ms_per_advance*1000:.4f} baselineGapRatio={baseline_us/(target_ms_per_advance*1000):.1f} alternateGapRatio={alternate_us/(target_ms_per_advance*1000):.1f} interpretation=reference-only-not-10k-extrapolation")
          PY
            echo "PR57_STRUCTURAL_PARITY case=$case fullJsonHashEqual=True steps=120"
          done
      - name: Preserve test and maintenance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-controlled-boundary
          path: artifacts/controlled-boundary/**
          retention-days: 14
