name: PR57 isolated controlled boundary real-save adversarial
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-controlled-boundary.yml
      - tests/IndexCities.Simulation.Tests/Pr57ControlledBoundaryAdversarial.cs
      - tests/IndexCities.Simulation.Tests/Pr57VehicleOrderSensitivity.cs
      - tests/IndexCities.Simulation.Tests/Pr57StructuralIntegratedGate.cs
      - tests/IndexCities.Simulation.Tests/Pr57DependencyExecutorPoc.cs
      - src/IndexCities.Simulation/CitySimulation.cs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  boundary-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile isolated C# adapter against actual simulation
        run: dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      # The historical growth artifact expired. Generate a NEW real-engine
      # scenario instead; never present it as the original saved city.
      - name: Generate new integrated construction candidate with real simulation
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          mkdir -p artifacts/real-growth/growth
          PR57_HOST_QUANTUM=1 PR57_SAVE_CAPTURE_DIR="$PWD/artifacts/real-growth/growth" \
            timeout 360s dotnet run --no-build -c Release \
              --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
              scale cycle --seed=42 --warmup=0 --cycle-houses=8 --days=2 --window=3600 --cap=300 \
              | tee artifacts/real-growth/generation.log
          test -s artifacts/real-growth/growth/checkpoint-0.json
          grep -E '^CYCLE_HOUSING requested=8 placed=[1-9][0-9]* ' artifacts/real-growth/generation.log
          grep -F 'INVARIANTS OK' artifacts/real-growth/generation.log
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('artifacts/real-growth/growth/checkpoint-0.json')
          state = json.loads(p.read_text())
          print('PR57_NEW_GROWTH_INPUT path=', p, 'bytes=', p.stat().st_size,
                'topLevelKeys=', sorted(state)[:20],
                'identity=NEW_ENGINE_GENERATED_NOT_ORIGINAL_ARTIFACT')
          PY
      - name: Restore authentic congested economy
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real-congested
      - name: Adversarial aliases, controlled commands, maintenance costs and exact engine checkpoints
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          mkdir -p artifacts/controlled-boundary
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            echo "PR57_BOUNDARY_INPUT case=$case sha256=$(sha256sum "$save" | cut -d' ' -f1)"
            PR57_CONTROLLED_CASE="$case" PR57_CONTROLLED_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Pr57ControlledBoundaryAdversarial \
                --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/$case.log"
            grep -F "PR57_CONTROLLED_BOUNDARY case=$case" "artifacts/controlled-boundary/$case.log"
            grep -F "byteEqual=True aliasIsolation=True" "artifacts/controlled-boundary/$case.log"
          done
      # Ordered-truck sensitivity was already established causally (18/19).
      # Do not block structural ABBA on the historical selector probe, whose
      # Assert.NotNull fails for the newly generated construction scenario.
      - name: Dependency executor M0 on authentic saves (mandatory causal fallback)
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          mkdir -p artifacts/controlled-boundary
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            PR57_DEPENDENCY_CASE="$case" PR57_DEPENDENCY_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Authentic_saves_dependency_executor_m0_causal_parity_and_cost \
                --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/dependency-$case.log"
            grep -F "PR57_DEPENDENCY_M0 case=$case" "artifacts/controlled-boundary/dependency-$case.log"
            grep -F "avoidedSteps=0" "artifacts/controlled-boundary/dependency-$case.log"
            test "$(grep -c 'PR57_DEPENDENCY_CHECKPOINT' "artifacts/controlled-boundary/dependency-$case.log")" -eq 12
          done
      - name: Falsify public-boundary batching on both real-engine saves
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            set +e
            PR57_DEPENDENCY_CASE="$case" PR57_DEPENDENCY_SAVE_PATH="$PWD/$save" \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                -c Release --no-build --filter FullyQualifiedName~Authentic_saves_batched_public_boundary_exact_causal_gate \
                --logger "console;verbosity=detailed" > "artifacts/controlled-boundary/batch-$case.log" 2>&1
            result=$?
            set -e
            cat "artifacts/controlled-boundary/batch-$case.log"
            if [[ "$result" -ne 0 ]]; then
              grep -F "Public-boundary batching changed full JSON" "artifacts/controlled-boundary/batch-$case.log"
              echo "PR57_BATCH_VERDICT case=$case rejected=causal-divergence"
            else
              grep -F "PR57_BATCH_BOUNDARY_COST case=$case" "artifacts/controlled-boundary/batch-$case.log"
              echo "PR57_BATCH_VERDICT case=$case parity-at-12-checkpoints-only"
            fi
          done
      - name: Cross-check opt-in causal agenda with external edits and save-load (fresh ABBA)
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works" && test -s "$queue"
          for case in works-real congested-real; do
            if [[ "$case" == works-real ]]; then save="$works"; else save="$queue"; fi
            for trial in baseline-1 alternate-1 alternate-2 baseline-2; do
              mode="${trial%-*}"
              if [[ "$mode" == alternate ]]; then
                export PR57_LIVING_ROSTER=1 PR57_CITIZEN_AGENDA=1 PR57_DEPENDENCY_M1=1
              else
                unset PR57_LIVING_ROSTER PR57_CITIZEN_AGENDA PR57_DEPENDENCY_M1 || true
              fi
              PR57_DEPENDENCY_CASE="$case" PR57_DEPENDENCY_SAVE_PATH="$PWD/$save" \
                dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                  -c Release --no-build --filter FullyQualifiedName~Authentic_saves_dependency_executor_m0_causal_parity_and_cost \
                  --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
              grep 'PR57_DEPENDENCY_CHECKPOINT' "artifacts/controlled-boundary/dependency-abba-$case-$trial.log" \
                | sed -E 's/^[^P]*PR57_DEPENDENCY_CHECKPOINT/PR57_DEPENDENCY_CHECKPOINT/' \
                > "artifacts/controlled-boundary/dependency-abba-$case-$trial.hashes"
              test "$(wc -l < "artifacts/controlled-boundary/dependency-abba-$case-$trial.hashes")" -eq 12
              grep -F 'PR57_DEPENDENCY_RESUME' "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
              if [[ "$mode" == alternate ]]; then
                grep -F "fallbackSteps=2 avoidedPublicRebuilds=8" "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
                grep -F "avoidedBoundaryRebuilds=118 invalidations=3 fallbackSteps=2" "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
              else
                grep -F "fallbackSteps=10 avoidedPublicRebuilds=0" "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
                grep -F "avoidedBoundaryRebuilds=0 invalidations=3 fallbackSteps=120" "artifacts/controlled-boundary/dependency-abba-$case-$trial.log"
              fi
            done
            # Run the actual integrated gate in four fresh .NET processes.
            # Do not compare dependency-M0 hashes with structural-gate hashes.
            for trial in baseline-1 alternate-1 alternate-2 baseline-2; do
              mode="${trial%-*}"
              if [[ "$mode" == alternate ]]; then
                export PR57_LIVING_ROSTER=1 PR57_CITIZEN_AGENDA=1 PR57_CERTIFIED_BOUNDARY=1
              else
                unset PR57_LIVING_ROSTER PR57_CITIZEN_AGENDA PR57_CERTIFIED_BOUNDARY || true
              fi
              diagnostic_dir="$PWD/artifacts/controlled-boundary/json-$case-$trial"
              PR57_STRUCTURAL_CASE="$case" PR57_STRUCTURAL_MODE="$mode" \
                PR57_STRUCTURAL_SAVE_PATH="$PWD/$save" \
                PR57_STRUCTURAL_DIAGNOSTIC_DIR="$diagnostic_dir" \
                dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
                  -c Release --no-build --filter FullyQualifiedName~Authentic_save_integrated_alternate_mode_checkpoints \
                  --logger "console;verbosity=detailed" | tee "artifacts/controlled-boundary/structural-$case-$trial.log"
              grep 'PR57_STRUCTURAL_CHECKPOINT' "artifacts/controlled-boundary/structural-$case-$trial.log" \
                | sed -E 's/^[^P]*PR57_STRUCTURAL_CHECKPOINT/PR57_STRUCTURAL_CHECKPOINT/' \
                > "artifacts/controlled-boundary/checkpoints-$case-$trial.txt"
              test "$(wc -l < "artifacts/controlled-boundary/checkpoints-$case-$trial.txt")" -eq 120
              grep -F "PR57_STRUCTURAL_COST case=$case mode=$mode" "artifacts/controlled-boundary/structural-$case-$trial.log"
            done
            # Diagnose canonical cross-process nondeterminism before blaming M1.
            python3 - "$case" <<'PY'
          import json, pathlib, sys
          case = sys.argv[1]
          base = pathlib.Path("artifacts/controlled-boundary")
          trials = ("baseline-1", "baseline-2", "alternate-1", "alternate-2")
          def hashes(trial):
              return (base / f"checkpoints-{case}-{trial}.txt").read_text().splitlines()
          def first_diff(a, b, path="$"):
              if type(a) is not type(b): return (path, a, b)
              if isinstance(a, dict):
                  for key in sorted(a.keys() | b.keys()):
                      if key not in a or key not in b: return (path + "." + key, a.get(key, "<missing>"), b.get(key, "<missing>"))
                      d = first_diff(a[key], b[key], path + "." + key)
                      if d: return d
              elif isinstance(a, list):
                  if len(a) != len(b): return (path + ".length", len(a), len(b))
                  for i, (x, y) in enumerate(zip(a, b)):
                      d = first_diff(x, y, f"{path}[{i}]")
                      if d: return d
              elif a != b: return (path, a, b)
              return None
          failed = False
          for trial in trials[1:]:
              different = [i+1 for i, (x, y) in enumerate(zip(hashes(trials[0]), hashes(trial))) if x != y]
              print(f"PR57_JSON_DIAG case={case} pair={trials[0]}:{trial} differingSteps={different}")
              if different: failed = True
              for step in different:
                  pa = base / f"json-{case}-{trials[0]}" / f"step-{step}.json"
                  pb = base / f"json-{case}-{trial}" / f"step-{step}.json"
                  if pa.exists() and pb.exists():
                      d = first_diff(json.loads(pa.read_text()), json.loads(pb.read_text()))
                      print(f"PR57_JSON_FIRST_DIFF case={case} step={step} pair={trials[0]}:{trial} detail={str(d)[:500]}")
                  else:
                      print(f"PR57_JSON_FIRST_DIFF case={case} step={step} unavailable=outside-diagnostic-sample")
          if failed: raise SystemExit("PR57 exact cross-process parity failed; see diagnostic JSON")
          PY
            python3 - "$case" <<'PY'
          import pathlib, re, statistics, sys
          case = sys.argv[1]
          base = pathlib.Path("artifacts/controlled-boundary")
          times = {}
          for trial in ("baseline-1", "alternate-1", "alternate-2", "baseline-2"):
              log = (base / f"structural-{case}-{trial}.log").read_text()
              matches = re.findall(r"PR57_STRUCTURAL_COST[^\n]*advanceWallMs=([0-9.]+)", log)
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one integrated cost for {case} {trial}, got {len(matches)}")
              times[trial] = float(matches[0])
          baseline = statistics.mean(times[k] for k in ("baseline-1", "baseline-2"))
          alternate = statistics.mean(times[k] for k in ("alternate-1", "alternate-2"))
          target_ms_per_advance = 21600.0 / 1_260_000_000 * 1000
          baseline_us = baseline * 1000 / 120
          alternate_us = alternate * 1000 / 120
          print(f"PR57_STRUCTURAL_ABBA case={case} baselineMeanMs={baseline:.3f} alternateMeanMs={alternate:.3f} speedup={baseline/alternate:.5f} trials={times} samples=2-per-mode-not-statistically-robust")
          print(f"PR57_STRUCTURAL_TARGET_GAP case={case} population=real-save-not-10k baselineUsPerAdvance={baseline_us:.3f} alternateUsPerAdvance={alternate_us:.3f} exploratory10kTargetUs={target_ms_per_advance*1000:.4f} baselineGapRatio={baseline_us/(target_ms_per_advance*1000):.1f} alternateGapRatio={alternate_us/(target_ms_per_advance*1000):.1f} interpretation=reference-only-not-10k-extrapolation")
          PY
            echo "PR57_STRUCTURAL_PARITY case=$case fullJsonHashEqual=True publicBoundaryCheckpoints=120 steps=120"
          done
      - name: Preserve test and maintenance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-controlled-boundary
          path: artifacts/controlled-boundary/**
          retention-days: 14
