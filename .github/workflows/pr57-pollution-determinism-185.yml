name: 'PR57 #185 independent-process pollution decimal divergence repro'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-pollution-determinism-185.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  pollution-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build unchanged isolated observer
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RetentionBench/Pr57RetentionBench.csproj -c Release
      - name: Restore same authentic congested checkpoint as #184
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Run independent-process plain/plain and retained/retained controls
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          test -s "$source"
          echo "PR57_185_SOURCE sha256=$(sha256sum "$source" | cut -d' ' -f1) steps=300 cadence=Advance2"
          mkdir -p artifacts/pollution-185
          for trial in plainA retainedA retainedB plainB; do
            mode=plain
            if [[ "$trial" == retained* ]]; then mode=retained; fi
            out="$PWD/artifacts/pollution-185/$trial"
            mkdir -p "$out"
            timeout 90s dotnet run --project scripts/Pr57RetentionBench/Pr57RetentionBench.csproj \
              -c Release --no-build -- "$source" "$trial" "$mode" 300 "$out" \
              | tee "artifacts/pollution-185/$trial.log"
          done
      - name: Compare exact JSON decimals and report first divergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from decimal import Decimal
          import json,pathlib
          root=pathlib.Path("artifacts/pollution-185")
          def diffs(a,b,path=""):
              if type(a)!=type(b):
                  yield (path,a,b);return
              if isinstance(a,dict):
                  for key in sorted(set(a)|set(b)):
                      if key not in a or key not in b:
                          yield (path+"/"+key,a.get(key),b.get(key))
                      else:
                          yield from diffs(a[key],b[key],path+"/"+key)
              elif isinstance(a,list):
                  if len(a)!=len(b):yield (path+"/length",len(a),len(b))
                  for i,(x,y) in enumerate(zip(a,b)):
                      yield from diffs(x,y,path+"/"+str(i))
              elif a!=b:yield (path,a,b)
          for left,right in (("plainA","plainB"),("retainedA","retainedB"),
                             ("plainA","retainedA"),("plainB","retainedB")):
              for i in range(5):
                  a=json.loads((root/left/f"checkpoint-{i}.json").read_text(),parse_float=Decimal)
                  b=json.loads((root/right/f"checkpoint-{i}.json").read_text(),parse_float=Decimal)
                  delta=list(diffs(a,b))
                  first=";".join(f"{p}:{x}!={y}" for p,x,y in delta[:4])
                  print(f"PR57_185_PAIR left={left} right={right} index={i} " +
                        f"differences={len(delta)} first={first or 'NONE'} " +
                        "scope=EXACT_DECIMAL_FIELDS_NOT_PARITY_IF_NONZERO")
          print("PR57_185_PROBE_COMPLETE pairs=4 checkpointsPerPair=5")
          PY
      - name: Retain all full checkpoints and comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-pollution-determinism-185
          path: artifacts/pollution-185/**
          retention-days: 14
