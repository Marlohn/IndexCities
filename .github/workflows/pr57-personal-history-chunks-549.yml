name: 'PR57 #549 personal history block compression A/B'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-personal-history-chunks-549.yml, tests/IndexCities.Simulation.Tests/Pr57TurnWayWorksetAdversarialTests.cs]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  personal-history-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_PARALLEL_NEEDS: '0'
      PR57_NEEDS_SINGLE_PASS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run full regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          PR57_PERSONAL_HISTORY_CHUNKS=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --verbosity quiet
      - name: Restore authentic REAL congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input259
      - name: Restore authentic REAL construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossphase-access-445
          run-id: 41052837425
          github-token: ${{ github.token }}
          path: artifacts/input445
      - name: Unprofiled ABBA, fresh processes, two full checkpoints per arm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUN'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          cases=[
            ('congestedREAL121',Path('artifacts/input259/real14hREAL-control/checkpoint-0.json'),3600,121,98,'779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'),
            ('worksREAL47',Path('artifacts/input445/pr57-445/A/checkpoint-0.json'),400,47,42,'b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'),
            ('gridARTIFICIAL',None,200,None,None,None)
          ]
          root=Path('artifacts/pr57-549');root.mkdir(parents=True,exist_ok=True)
          summary={'experiment':549,'gainAccepted':False,'mode':'unprofiled scale, public Advance(2)',
                   'comparison':'composed flags vs same flags plus personal history block compression, fresh ABBA',
                   'cases':{}}
          for name,source,seconds,alive,vehicles,expected in cases:
            raw=source.read_bytes() if source else None
            if raw is not None:
              assert hashlib.sha256(raw).hexdigest()==expected,name
              state=json.loads(raw)
              assert sum(bool(c['Alive']) for c in state['Citizens'])==alive
              assert len(state['Vehicles'])==vehicles
            checkpoints=[];diagnostics=[];arms={}
            for arm in ('A1','B1','B2','A2'):
              dest=root/name/arm;dest.mkdir(parents=True,exist_ok=True)
              enabled=arm.startswith('B')
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',PR57_GRID_DIAG='0',
                         PR57_SAVE_CAPTURE_DIR=str(dest.resolve()),
                         PR57_SHARED_STEP_SHIPMENTS='0', PR57_SHARED_STEP_DIAG='0',
                         PR57_PERSONAL_HISTORY_CHUNKS='1' if enabled else '0')
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','scale','cycle' if source else 'grid',
                   '--seed=42','--warmup=0','--days=2',f'--window={seconds//2}','--cap=300']
              if source:cmd.append(f'--resume={source.resolve()}')
              else:cmd.extend(['--rows=3','--length=400'])
              with (dest/'full.log').open('w') as out:
                subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,check=True,timeout=300)
              log=(dest/'full.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,arm,log[-2500:])
              windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(windows)==2,(name,arm,'two measured windows')
              snaps=[(dest/f'checkpoint-{i}.json').read_bytes() for i in range(3)]
              if raw is not None:assert snaps[0]==raw,(name,arm,'input mismatch')
              checkpoints.append(snaps)
              rows=[] # no diagnostic instrumentation in timed A/B
              metrics=[]
              for line in windows:
                m=re.search(r'wall=([\d.]+)s .* cpu=([\d.]+)s allocMB=([\d.]+) gc0=(\d+) gc2=(\d+)',line)
                assert m,(name,arm,'missing unprofiled metrics',line)
                metrics.append([float(m.group(i)) for i in range(1,4)]+[int(m.group(i)) for i in (4,5)])
              arms[arm]={'enabled':enabled,'windows':windows,'metrics':metrics,
                         'checkpointsSha256':[hashlib.sha256(s).hexdigest() for s in snaps],
                         'lastDiagnostic':rows[-1] if rows else None}
              print('PR57_549_ARM',name,arm,'wall',sum(x[0] for x in metrics),
                    'cpu',sum(x[1] for x in metrics),'allocMB',sum(x[2] for x in metrics),flush=True)
            for i in range(3):
              assert all(x[i]==checkpoints[0][i] for x in checkpoints),(name,'FULL_JSON_PARITY_FAIL',i)
            summary['cases'][name]={'stepsPerArm':seconds//2,'fullJsonParityAt':[0,1,2],
                                     'artificial':source is None,'arms':arms}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_549_PERSONAL_HISTORY_CHUNKS_ABBA_PASS',flush=True)
          PY_RUN
      - name: Diagnostic retained heap and sealed block bytes in REAL replays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-549/diagnostic
          for item in "congestedREAL121:artifacts/input259/real14hREAL-control/checkpoint-0.json" "worksREAL47:artifacts/input445/pr57-445/A/checkpoint-0.json"; do
            name="${item%%:*}"; source="${item#*:}"
            PR57_PERSONAL_HISTORY_CHUNKS=1 PR57_PERSONAL_HISTORY_DIAG=1 PR57_HOST_QUANTUM=1 \
              dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
              scale cycle --seed=42 --warmup=0 --days=2 --window=100 --cap=300 --resume="$source" \
              > "artifacts/pr57-549/diagnostic/$name.log" 2>&1
            grep -q "INVARIANTS OK" "artifacts/pr57-549/diagnostic/$name.log"
          grep -q "PR57_PERSONAL_HISTORY window=" "artifacts/pr57-549/diagnostic/$name.log"
          done
      - name: Preserve full logs and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-personal-history-chunks-549
          path: artifacts/pr57-549
          retention-days: 14
          if-no-files-found: warn
