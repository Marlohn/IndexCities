name: 'PR57 #365 REAL nested physical content phase shadow'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-365-inject.py, .github/workflows/pr57-nested-shadow-365.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  bounded-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject reversible observers in checkout only
        run: |
          python3 scripts/pr57-345-observe.py
          python3 scripts/pr57-359-inject.py
          python3 scripts/pr57-360-inject.py
          python3 scripts/pr57-361-inject.py
          python3 scripts/pr57-362-inject.py
          python3 scripts/pr57-363-inject.py
          python3 scripts/pr57-364-inject.py
          python3 scripts/pr57-365-inject.py
      - name: Build replay and test canonical engine
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay individual Advance(2) calls in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/nested365/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_363_OCCUPANCY_WRITES="0" \
            PR57_364_CROSS_PHASE_WRITES="1" \
            PR57_365_NESTED_SHADOW="$flag" \
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/nested365/$mode" \
              > "artifacts/nested365/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|364_(PHASE|WINDOW)|365_(PHASE|WINDOW)) ' \
              "artifacts/nested365/$mode/full.log" \
              > "artifacts/nested365/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/nested365/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/nested365/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/nested365/$mode/census.log"
          done
          cmp artifacts/nested365/control/checkpoint-10800.json \
              artifacts/nested365/probe/checkpoint-10800.json
          sha256sum artifacts/nested365/{control,probe}/checkpoint-10800.json \
            | tee artifacts/nested365/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/nested365/summary.txt
          from pathlib import Path
          root=Path("artifacts/nested365")
          def parse(mode,prefix):
              return [{k:v for k,v in (part.split("=",1) for part in line.split()[1:] if "=" in part)}
                      for line in (root/mode/"census.log").read_text().splitlines()
                      if line.startswith(prefix+" ")]
          assert not parse("control","PR57_365_WINDOW")
          assert not parse("control","PR57_365_PHASE")
          windows=parse("probe","PR57_365_WINDOW")
          phases=parse("probe","PR57_365_PHASE")
          assert len(windows)==2 and len(phases)==30,(len(windows),len(phases))
          assert [(int(x["window"]),int(x["calls"])) for x in windows]==[(0,87),(1,88)],windows
          expected=["pre","vehicles","paving","citizens","construction",
                    "maintenance","relocation","infrastructure","businesses",
                    "needs","economy","dispatch","followups","demolition","post"]
          keys=("route","site","dock","spaces","admission","detour")
          for window in (0,1):
              subset=[p for p in phases if int(p["window"])==window]
              assert [p["phase"] for p in subset]==expected
              for key in keys:
                  assert sum(int(p[key]) for p in subset)==int(windows[window][key]),(window,key)
          for row in windows:print("PR57_365_AUDIT",row)
          print("PR57_365_AUDIT windows=2 phases=30 controls=0 cadence=Advance2 checkpoint=IDENTICAL")
          PY
      - name: Upload raw evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-nested-365
          path: artifacts/nested365/
          if-no-files-found: warn
