name: PR57 phase allocation census (observational)
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-phase-allocation-160.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and test
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore REAL economy checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore REAL pre-gridlock checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Profile phase allocations and plain wall in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          test -s "$works"; test -s "$queue"
          for case in works queue10 gridARTIFICIAL; do
            window=300; windows=4; source=""
            if [[ "$case" == works ]]; then window=900; source="$works"; fi
            if [[ "$case" == queue10 ]]; then source="$queue"; fi
            if [[ "$case" == gridARTIFICIAL ]]; then windows=2; fi
            echo "PR57_ALLOC_CASE case=$case window=$window windows=$windows cadence=Advance2 class=$([[ $case == gridARTIFICIAL ]] && echo ARTIFICIAL || echo REAL)"
            for mode in profile plain; do
              output="$PWD/artifacts/allocation/$case-$mode"; mkdir -p "$output"
              command=scale; probe=0
              if [[ "$mode" == profile ]]; then command=profile; probe=1; fi
              options=(--seed=42 --warmup=0 --days="$windows" --window="$window" --cap=200)
              if [[ -n "$source" ]]; then options+=(--resume="$source"); else options+=(--rows=2 --length=160); fi
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_SAVE_CAPTURE_DIR="$output" \
              PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
              PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
              PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
              PR57_PHASE_ALLOC_PROBE="$probe" PR57_BLOCK_DEP_PROBE=0 \
              PR57_GRAPH_PROBE=0 PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 \
                timeout 240s dotnet run --no-build -c Release \
                  --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                  "$command" "$([[ $case == gridARTIFICIAL ]] && echo grid || echo cycle)" "${options[@]}" \
                  | tee "artifacts/allocation/$case-$mode.log"
            done
          done
      - name: Validate phase allocation and exact replay parity
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/allocation")
          for case,windows,window in (("works",4,900),("queue10",4,300),("gridARTIFICIAL",2,300)):
              logs={m:(root/f"{case}-{m}.log").read_text() for m in ("profile","plain")}
              for mode,log in logs.items():
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode,"invariants/save")
                  rows=[s for s in log.splitlines() if s.startswith("WINDOW ")]
                  assert len(rows)==windows,(case,mode,"windows",len(rows))
                  wall=sum(float(re.search(r"\bwall=([0-9.]+)s",s).group(1)) for s in rows)
                  cpu=sum(float(re.search(r"\bcpu=([0-9.]+)s",s).group(1)) for s in rows)
                  alloc=sum(float(re.search(r"\ballocMB=([0-9.]+)",s).group(1)) for s in rows)
                  print(f"PR57_ALLOC_WALL case={case} mode={mode} seconds={windows*window} wall={wall:.2f}s cpu={cpu:.2f}s allocMB={alloc:.1f} sps={windows*window/wall:.2f} optimizationAB=False")
              phase=[s for s in logs["profile"].splitlines() if s.startswith("PR57_PHASE_ALLOC name=")]
              assert len(phase)==13,(case,"probe inactive",len(phase))
              assert "PR57_PHASE_ALLOC " not in logs["plain"],(case,"plain contaminated")
              allocations=[(re.search(r"name=([^ ]+)",s).group(1),int(re.search(r"\bbytes=(\d+)",s).group(1))) for s in phase]
              total=sum(v for _,v in allocations)
              assert total>0 and all(v>=0 for _,v in allocations),(case,"alloc")
              reported=int(re.search(r"phaseBytes=(\d+)",next(s for s in logs["profile"].splitlines() if s.startswith("PR57_PHASE_ALLOC_SUM "))).group(1))
              assert total==reported,(case,"sum")
              print(f"PR57_ALLOC_TOP case={case} totalMB={total/1e6:.2f} top={sorted(allocations,key=lambda x:-x[1])[:6]}")
              for i in range(windows+1):
                  a=(root/f"{case}-profile"/f"checkpoint-{i}.json").read_bytes()
                  b=(root/f"{case}-plain"/f"checkpoint-{i}.json").read_bytes()
                  assert a==b,(case,i,"byte-exact checkpoint mismatch")
              print(f"PR57_ALLOC_PARITY case={case} checkpoints={windows+1} exact=True")
          PY
      - name: Preserve logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-phase-allocation-160
          path: artifacts/allocation/**
          retention-days: 14
