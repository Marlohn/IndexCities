name: 'PR57 #267 discriminate tiered JIT from physical stage drift'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-tiering-discriminant-267.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  tiering:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and regression tests
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic economic checkpoints from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Four fresh processes ABBA with and without tiered compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import hashlib, json, os, re, subprocess
          root=Path('artifacts/real-tiering-267')
          root.mkdir(parents=True,exist_ok=True)
          earlier=Path('artifacts/prior/overnight-05/checkpoint-1.json')
          source=Path('artifacts/prior/overnight-08/checkpoint-1.json')
          assert earlier.is_file() and source.is_file()
          def load(path): return json.loads(path.read_text(),parse_float=Decimal)
          before,after=load(earlier),load(source)
          av={v['Id']:v for v in before['Vehicles'] if v.get('Status')=='Travelling'}
          bv={v['Id']:v for v in after['Vehicles'] if v.get('Status')=='Travelling'}
          fields=('Position','Heading','WaitingSince','Cause','RouteIndex')
          persistent=sorted(i for i in av.keys()&bv.keys()
                            if all(av[i].get(k)==bv[i].get(k) for k in fields))
          assert len(persistent)==24
          assert sum(bool(x.get('Alive')) for x in after['Citizens'])==121
          assert len(after['Vehicles'])==98
          print('PR57_267_SOURCE sha256='+hashlib.sha256(source.read_bytes()).hexdigest(),
                'cohort='+','.join(map(str,persistent)),flush=True)
          common={
              'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
              'PR57_206_RESIDUAL_EXCLUSIVE':'0','PR57_IDLE_SCAN_PROBE':'0',
              'PR57_261_PATH_REACH':'0','PR57_263_ALL_CAN_TURN':'0',
              'PR57_253_STATE_EFFECTS':'0','PR57_260_READ_EXPOSURE':'0',
              'PR57_244_STATE_COST':'0','PR57_264_FULL_COHORT':'0',
              'PR57_266_COHORT_STAGES':'1',
              'PR57_244_PERSISTENT_IDS':','.join(map(str,persistent))
          }
          checkpoints=[]
          for index,mode in enumerate(('default','tiering-off','tiering-off','default')):
              dest=root/f'{index}-{mode}'
              dest.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy()
              env.update(common)
              env.pop('DOTNET_TieredCompilation',None)
              env.pop('DOTNET_TieredPGO',None)
              if mode=='tiering-off':
                  env['DOTNET_TieredCompilation']='0'
                  env['DOTNET_TieredPGO']='0'
              env['PR57_SAVE_CAPTURE_DIR']=str(dest.resolve())
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','profile','cycle','--seed=42','--warmup=0','--days=1',
                   '--window=200','--cap=600',f'--resume={source.resolve()}']
              with (dest/'run.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=300)
              log=(dest/'run.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log
              assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
              checkpoints.append((dest/'checkpoint-1.json').read_bytes())
              summary=[x for x in log.splitlines() if x.startswith('PR57_266_SUM ')]
              rows=[x for x in log.splitlines() if x.startswith('PR57_266_ROW ')]
              windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(summary)==1 and len(rows)==144 and len(windows)==1
              assert 'slices=600 cohort=24 passes=14400 causeChanges=14 ' in summary[0]
              parsed=[{k:Decimal(v) for k,v in re.findall(r'(\w+)=([0-9.]+)',x)}
                      for x in rows]
              assert len({(r['window'],r['id']) for r in parsed})==144
              assert all(r['passes']==100 for r in parsed)
              def aggregate(field):
                  return [sum(r[field] for r in parsed if r['window']==w)
                          for w in range(6)]
              stage=[aggregate(f's{i}Ms') for i in range(9)]
              segments=[aggregate(f's{i}Segments') for i in range(9)]
              assert all(segments[i]==[2400]*6 for i in (0,1))
              assert all(segments[i]==[2200]*6 for i in (2,3,4,5,6))
              assert segments[7]==[300]*6 and segments[8]==[0]*6
              wall=re.search(r'wall=([0-9.]+)s',windows[0]).group(1)
              print('PR57_267_RESULT order='+str(index)+' mode='+mode+
                    ' wallS='+wall+
                    ' cohortMsByWindow='+','.join(str(sum(stage[i][w] for i in range(9)))
                                                 for w in range(6))+
                    ' s3MsByWindow='+','.join(map(str,stage[3]))+
                    ' s7MsByWindow='+','.join(map(str,stage[7]))+
                    ' allocMBByWindow='+','.join(map(str,aggregate('totalMB')))+
                    ' stageSegmentsStable=True checkpointSha256='+
                    hashlib.sha256(checkpoints[-1]).hexdigest(),flush=True)
          assert all(x==checkpoints[0] for x in checkpoints), 'cross-mode full checkpoint mismatch'
          assert load(root/'0-default'/'checkpoint-1.json')==load(root/'3-default'/'checkpoint-1.json')
          print('PR57_267_PARITY fullJson=EXACT allFour=True decimalDiffs=0',
                'Advance2CallsPerArm=100 order=ABBA noOptimization=True',flush=True)
          PY
      - name: Preserve raw logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-tiering-267
          path: artifacts/real-tiering-267/**
          retention-days: 14
