name: CausalLab automation pre-merge smoke

on:
  push:
    branches: [automation/laboratorio-causal-continuo]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify trusted scripts compile and API-key absence pauses safely
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/causal_lab_gate.py .github/scripts/validate_causal_lab.py
          echo '{}' > /tmp/causal-lab-event.json
          GITHUB_REPOSITORY=Marlohn/IndexCities \
          GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH=/tmp/causal-lab-event.json \
          HAS_API_KEY=false GITHUB_OUTPUT=/tmp/causal-lab-outputs \
            python3 .github/scripts/causal_lab_gate.py
          grep -q '^proceed=false$' /tmp/causal-lab-outputs
          test -f .github/workflows/causal-lab-loop.yml
          test -f .github/workflows/causal-lab-ci.yml
