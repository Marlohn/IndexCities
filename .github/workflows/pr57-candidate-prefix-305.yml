name: 'PR57 #305 actual onward-body and pedestrian candidate-prefix census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-junction-blockers-305.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  candidate-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test existing simulation
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL 14h save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process ABBA and exact selected candidate-prefix census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/junction-305
          input=artifacts/input/real14hREAL-control/checkpoint-0.json
          test -s "$input"
          for arm in control1 probe1 probe2 control2; do
            mode=control
            if [[ "$arm" == probe* ]]; then mode=probe; fi
            output="artifacts/junction-305/real14hREAL-$arm"
            mkdir -p "$output"
            if [[ "$mode" == probe ]]; then
              PR57_300_BOUNDARY=1 PR57_187_SLICE_WORKSET=1 PR57_302_CAUSE_IDS=1 PR57_303_JUNCTION_EXITS=1 PR57_304_BLOCKERS=1 PR57_305_CANDIDATES=1 dotnet run --no-build -c Release \
                --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                "$input" real14hREAL "$mode" 100 "$output" \
                > "artifacts/junction-305/real14hREAL-$arm.log" 2>&1
            else
              dotnet run --no-build -c Release \
                --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                "$input" real14hREAL "$mode" 100 "$output" \
                > "artifacts/junction-305/real14hREAL-$arm.log" 2>&1
            fi
          done
          python3 scripts/pr57-305-candidate-audit.py artifacts/junction-305
      - name: Preserve raw logs and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-candidates-305
          path: artifacts/junction-305/**
          retention-days: 14
