name: 'PR57 #340 authentic REAL BodyOnWay visited-prefix stability'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-body-prefix-340.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  prefix-census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
      PR57_340_BODY_PREFIX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject checkout-only canonical visited-prefix trace
        run: python3 scripts/pr57-340-inject.py
      - name: Build authentic six-hour observational replay
        run: dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay 10800 individual Advance(2) calls
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          mkdir -p artifacts/prefix340
          dotnet run --no-build -c Release \
            --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
            -- "$input" artifacts/prefix340 \
            > artifacts/prefix340/full.log
          grep -E 'PR57_340_(PREFIX_CHANGE|SUMMARY)|PR57_246_(RETURNS|COHORT)|PR57_337_(HOUR|FINAL)' \
            artifacts/prefix340/full.log > artifacts/prefix340/census.log
          test "$(grep -c '^PR57_337_HOUR ' artifacts/prefix340/census.log)" -eq 6
          grep -q 'parity=IDENTICAL' artifacts/prefix340/census.log
          test "$(grep -c '^PR57_340_SUMMARY ' artifacts/prefix340/census.log)" -ge 4
          grep '^PR57_340_SUMMARY ' artifacts/prefix340/census.log | tail -n 4
          grep '^PR57_337_FINAL ' artifacts/prefix340/census.log
      - name: Upload raw trace and canonical checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-body-prefix-340
          path: artifacts/prefix340/**
          if-no-files-found: warn
