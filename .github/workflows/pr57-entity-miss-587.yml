name: 'PR57 #587 exact EntityIndex miss resolution REAL ABBA'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-entity-miss-587.yml
      - src/IndexCities.Simulation/EntityIndex.cs
      - src/IndexCities.Simulation/CitySimulation.cs
      - tests/IndexCities.Simulation.Tests/Pr57EntityIndexMissTests.cs
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  exact-miss:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run both modes including external mutation adversarials
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          PR57_587_EXACT_MISS_SCAN=0 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          PR57_587_EXACT_MISS_SCAN=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL construction, congestion and separate artificial saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: ABBA in fresh .NET processes, every public Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/miss-587
          for case in worksREAL queueREAL gridARTIFICIAL; do
            input="artifacts/input/$case-control/checkpoint-0.json"
            test -s "$input"
            days=3
            window=1200
            if [[ "$case" == gridARTIFICIAL ]]; then days=2; window=100; fi
            for arm in A1 B1 B2 A2; do
              enabled=0
              if [[ "$arm" == B* ]]; then enabled=1; fi
              output="$PWD/artifacts/miss-587/$case-$arm"
              mkdir -p "$output"
              echo "PR57_587_RUN case=$case arm=$arm enabled=$enabled inputSha=$(sha256sum "$input" | cut -d' ' -f1)"
              PR57_587_EXACT_MISS_SCAN="$enabled" PR57_587_MISS_DIAG="$enabled" \
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=0 \
              PR57_SAVE_CAPTURE_DIR="$output" \
                timeout 240s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                scale cycle --seed=42 --warmup=0 --days="$days" --window="$window" --cap=220 --resume="$input" \
                > "$output.log" 2>&1
            done
          done
      - name: Assert byte-exact intermediate state and paired end-to-end timings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('artifacts/miss-587')
          for case in ('worksREAL','queueREAL','gridARTIFICIAL'):
              arms={}
              days=2 if case=='gridARTIFICIAL' else 3
              for arm in ('A1','B1','B2','A2'):
                  log=(root/f'{case}-{arm}.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,arm,'invariants/save')
                  windows=[w for w in log.splitlines() if w.startswith('WINDOW ')]
                  assert len(windows)==days,(case,arm,'windows',len(windows))
                  def metric(key):
                      return sum(float(re.search(r'\b'+key+r'=([0-9.]+)',w).group(1)) for w in windows)
                  arms[arm]={k:metric(k) for k in ('wall','cpu','allocMB')}
                  arms[arm]['last']=windows[-1]
                  if arm.startswith('B'):
                      samples=re.findall(r'PR57_587_MISS calls=(\d+) citizen=(\d+) citizenFound=(\d+) vehicle=(\d+) vehicleFound=(\d+) building=(\d+) company=(\d+) family=(\d+)',log)
                      assert samples,(case,arm,'no candidate diagnostic')
                      last=[int(x) for x in samples[-1]]
                      arms[arm]['scans']=sum(last[i] for i in (1,3,5,6,7))
                  for i in range(days+1):
                      p=root/f'{case}-{arm}'/f'checkpoint-{i}.json'
                      data=p.read_bytes()
                      json.loads(data)
                      assert data==(root/f'{case}-A1'/f'checkpoint-{i}.json').read_bytes(),(case,arm,i,'CAUSAL_DIVERGENCE')
                  print('PR57_587_ARM',case,arm,arms[arm],flush=True)
              for a,b in (('A1','B1'),('A2','B2')):
                  print('PR57_587_PAIR',case,a,b,'speedup',round(arms[a]['wall']/arms[b]['wall'],5),flush=True)
              print('PR57_587_CAUSAL_PARITY',case,'checkpoints',4*(days+1),flush=True)
          PY
      - name: Preserve full checkpoint states and process logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-entity-miss-587
          path: artifacts/miss-587/**
          retention-days: 14
