name: 'PR57 #263 authentic all-candidate CanTurnNow census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-all-canturn-census-263.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  all-canturn-census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and regression tests
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic economic queue from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Canonical control versus bounded all-candidate CanTurnNow census at Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import os, subprocess, json, hashlib
          root=Path('artifacts/real-all-canturn-census-263')
          root.mkdir(parents=True,exist_ok=True)
          source=Path('artifacts/prior/overnight-08/checkpoint-1.json')
          assert source.is_file()
          def load(p): return json.loads(p.read_text(),parse_float=Decimal)
          state=load(source)
          assert sum(bool(c.get('Alive')) for c in state['Citizens'])==121
          vehicles={v['Id']:v for v in state['Vehicles']}
          assert 1071 in vehicles and len(vehicles)==98
          print('PR57_263_SOURCE',hashlib.sha256(source.read_bytes()).hexdigest(),
                'alive',121,'vehicles',len(vehicles),flush=True)
          common={
              'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
              'PR57_206_RESIDUAL_EXCLUSIVE':'0','PR57_IDLE_SCAN_PROBE':'0',
              'PR57_VEHICLE_MUTATION_AUDIT':'0','PR57_PHASE_ALLOC_PROBE':'0',
              'PR57_260_READ_EXPOSURE':'0','PR57_253_STATE_EFFECTS':'0'
          }
          def run(mode):
              dest=root/mode;dest.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy();env.update(common)
              env['PR57_261_PATH_REACH']='1' if mode=='probe' else '0'
              env['PR57_263_ALL_CAN_TURN']='1' if mode=='probe' else '0'
              env['PR57_SAVE_CAPTURE_DIR']=str(dest.resolve())
              cmd=['dotnet','run','--no-build','-c','Release',
                  '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                  '--','profile' if mode=='probe' else 'scale','cycle','--seed=42',
                  '--warmup=0','--days=1','--window=200','--cap=600',
                  f'--resume={source.resolve()}']
              with (root/f'{mode}.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=300)
              log=(root/f'{mode}.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(mode,log[-4000:])
              assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
              assert (dest/'checkpoint-1.json').is_file()
              if mode=='probe':
                  lines=[x for x in log.splitlines()
                         if x.startswith('PR57_261_REACH ')]
                  assert len(lines)==1,('expected one authentic reader',lines,log[-4000:])
                  assert 'slices=600 reader=1071 ' in lines[0],lines[0]
                  print(lines[0],flush=True)
                  census=[x for x in log.splitlines() if x.startswith('PR57_263_')]
                  for line in census: print(line,flush=True)
                  assert len(census)==3,census
                  assert census[0].startswith('PR57_263_FANOUT slices=600 '),census
                  import re
                  calls=int(re.search(r'calls=(\d+)',census[0]).group(1))
                  denied=int(re.search(r'denied=(\d+)',census[0]).group(1))
                  assert calls>=412 and denied>0,census[0]
              for line in log.splitlines():
                  if line.startswith(('WINDOW ','STEP_PROFILE','  STEP_PHASE')):
                      print('PR57_263_METRIC',mode,line.strip(),flush=True)
              return dest
          control=run('control')
          probe=run('probe')
          a=(control/'checkpoint-1.json').read_bytes()
          b=(probe/'checkpoint-1.json').read_bytes()
          assert a==b,'full JSON checkpoint mismatch'
          assert load(control/'checkpoint-1.json')==load(probe/'checkpoint-1.json')
          print('PR57_263_PARITY fullJson=EXACT decimalDiffs=0',
                'Advance2CallsPerArm=100 noSkippedSlices=True',
                'noOptimization=True',flush=True)
          PY
      - name: Preserve raw logs and full checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-all-canturn-census-263
          path: artifacts/real-all-canturn-census-263/**
          retention-days: 14
