name: 'PR57 #211 isolate closure allocation in physical street-body guard'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-streetbody-closure-211.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  streetbody-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic works checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore explicitly ARTIFICIAL GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Execute Advance(2) ABBA and bounded profile
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; sha256sum "$source"; done
          mkdir -p artifacts/streetbody-closure-211
          for case in worksREAL queueREAL gridARTIFICIAL; do
            source="$works"; fixture=cycle; horizon=300
            if [[ "$case" == queueREAL ]]; then source="$queue"; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; fixture=grid; horizon=100; fi
            for mode in control1 variant1 variant2 control2 profileControl profileVariant; do
              output="$PWD/artifacts/streetbody-closure-211/$case-$mode"
              mkdir -p "$output"
              enabled=0; command=scale; observed=0
              if [[ "$mode" == variant* || "$mode" == profileVariant ]]; then enabled=1; fi
              if [[ "$mode" == profile* ]]; then command=profile; observed=1; fi
              echo "PR57_211_RUN case=$case mode=$mode horizon=$horizon cadence=ADVANCE_2 foreach=1 noCapture=$enabled"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_210_POSE_FOREACH=1 PR57_211_NO_CAPTURE_STREETBODY="$enabled" \
              PR57_206_RESIDUAL_EXCLUSIVE="$observed" PR57_207_POSE_GUARD="$observed" \
              PR57_208_BODY_SAT_CENSUS="$observed" PR57_209_SHIPMENT_READ_CENSUS=0 \
              PR57_LANE_READWRITE_PROBE=0 PR57_BLOCK_DEP_PROBE=0 \
              PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" "$fixture" --seed=42 --warmup=0 --days=1 \
                --window="$horizon" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify full-state parity, counters and A/B wall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          root=Path('artifacts/streetbody-closure-211')
          def metric(line,key):
              m=re.search(r'(?:^| )'+re.escape(key)+r'=([-0-9.]+)',line)
              assert m,(key,line)
              return float(m.group(1))
          for case,horizon in [('worksREAL',300),('queueREAL',300),('gridARTIFICIAL',100)]:
              modes=['control1','variant1','variant2','control2','profileControl','profileVariant']
              logs={mode:(root/f'{case}-{mode}.log').read_text() for mode in modes}
              baseline=[(root/f'{case}-control1'/f'checkpoint-{i}.json').read_bytes() for i in (0,1)]
              for mode,log in logs.items():
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,mode)
                  assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1,(case,mode)
                  for i in (0,1):
                      assert (root/f'{case}-{mode}'/f'checkpoint-{i}.json').read_bytes()==baseline[i],(case,mode,i,'full JSON mismatch')
              loops=[x for x in logs['profileVariant'].splitlines() if x.startswith('PR57_210_LOOP ')]
              poses=[x for x in logs['profileVariant'].splitlines() if x.startswith('PR57_207_POSE ')]
              sats=[x for x in logs['profileVariant'].splitlines() if x.startswith('PR57_208_SAT ')]
              assert len(loops)==len(poses)==len(sats)==3,(case,'bounded rows',len(loops),len(poses),len(sats))
              for i,(row,pose,sat) in enumerate(zip(loops,poses,sats),1):
                  assert int(metric(row,'sample'))==i and int(metric(row,'eligibleSlice'))==36+i,(case,row)
                  near=int(metric(row,'near'));street=int(metric(row,'street'))
                  excluded=int(metric(row,'entryExcluded'));turn=int(metric(row,'turn'))
                  hits=int(metric(row,'hits'));visited=int(metric(row,'visited'))
                  assert near==street+excluded+turn,(case,'branch conservation',row)
                  assert near==int(metric(pose,'geometryCandidates')),(case,'candidate mismatch',row,pose)
                  assert 0<=hits<=street+turn and near<=visited,(case,row)
                  assert int(metric(sat,'satCalls'))>=street+turn,(case,'SAT coverage',row,sat)
                  print('PR57_211_BRANCH',case,'sample',i,'visited',visited,'near',near,'street',street,'entryExcluded',excluded,'turn',turn,'hits',hits,'sat',metric(sat,'satCalls'),'guardMB',metric(pose,'guardMB'))
              for mode in ('profileControl','profileVariant'):
                  rows=[x for x in logs[mode].splitlines() if x.startswith('PR57_207_POSE ')]
                  bodies=[x for x in logs[mode].splitlines() if x.startswith('PR57_211_STREETBODY ')]
                  loops2=[x for x in logs[mode].splitlines() if x.startswith('PR57_210_LOOP ')]
                  assert len(rows)==len(bodies)==len(loops2)==3,(case,mode,'bounded rows')
                  for body,loop in zip(bodies,loops2):
                      assert int(metric(body,'calls'))==int(metric(loop,'near')),(case,mode,'street body count',body,loop)
                      assert ('noCapture=True' in body)==(mode=='profileVariant'),(case,mode,body)
                  print('PR57_211_PROFILE',case,mode,'calls',sum(metric(x,'calls') for x in bodies),'bodyBytes',sum(metric(x,'bytes') for x in bodies),'guardMB',sum(metric(x,'guardMB') for x in rows),'guardMs',sum(metric(x,'guardMs') for x in rows))
              summary={}
              for mode in modes[:4]:
                  row=next(x for x in logs[mode].splitlines() if x.startswith('WINDOW '))
                  summary[mode]={k:metric(row,k) for k in ('wall','cpu','allocMB')}
              for k in ('wall','cpu','allocMB'):
                  a=statistics.mean(summary[m][k] for m in ('control1','control2'))
                  b=statistics.mean(summary[m][k] for m in ('variant1','variant2'))
                  print('PR57_211_ABBA',case,'metric',k,'controlMean',round(a,6),'variantMean',round(b,6),'controlOverVariant',round(a/b,5) if b else None)
              print('PR57_211_PARITY',case,'checkpoints',2,'processes',6,'horizon',horizon,'cadence','ADVANCE_2','fullJSON','EXACT')
          PY
      - name: Preserve full checkpoints and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-streetbody-closure-211
          path: artifacts/streetbody-closure-211/**
          retention-days: 14
