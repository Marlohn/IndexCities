name: Experimento agenda inativos - custo de varredura

on:
  push:
    branches:
      - experimento/agenda-inativos-profiling

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do experimento
        uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testes gerais
        run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --logger 'console;verbosity=minimal'
      - name: Sonda com 400 pessoas reais apos um dia
        shell: bash
        run: |
          set -euo pipefail
          INDEXCITIES_IDLE_PROBE=1 dotnet run -c Release --project src/IndexCities.Headless -- scale grid --rows=5 --length=800 --seed=42 --warmup=0 --days=1 --cap=600 | tee idle400.txt
          grep -E '^(IDLE_PROBE_PHASE|IDLE_PROBE|MOVE_PROFILE|DAY 1|SUMMARY|SAVE|INVARIANTS OK)' idle400.txt
          sha=$(grep -o 'sha256=[0-9A-F]*' idle400.txt | tail -1 | cut -d= -f2)
          test "$sha" = "D8B89B27089971A8" || { echo "ESTADO DIVERGENTE do baseline E05 (main)"; exit 1; }
      - name: Preservar sonda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-inativos-400-real
          path: idle400.txt
          if-no-files-found: ignore
