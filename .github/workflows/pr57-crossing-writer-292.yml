name: 'PR57 #292 crossing writer to admission reader exposure'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-crossing-writer-292.yml
      - scripts/pr57-crossing-292/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  crossing-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build observer and run full simulation tests
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-crossing-292/Pr57Crossing292.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic #259 checkpoint saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: ABBA fresh-process canonical Advance(2) and full JSON checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/crossing-292
          for case in worksREAL queueREAL real14hREAL gridARTIFICIAL; do
            input="artifacts/input/${case}-control/checkpoint-0.json"
            test -s "$input"
            calls=100
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; fi
            order="control probe"
            if [[ "$case" == queueREAL || "$case" == gridARTIFICIAL ]]; then order="probe control"; fi
            for mode in $order; do
              output="artifacts/crossing-292/${case}-${mode}"
              mkdir -p "$output"
              probe=0
              if [[ "$mode" == probe ]]; then probe=1; fi
              PR57_292_CROSSING="$probe" dotnet run --no-build -c Release \
                --project scripts/pr57-crossing-292/Pr57Crossing292.csproj -- \
                "$input" "$case" "$mode" "$calls" "$output" \
                > "artifacts/crossing-292/${case}-${mode}.log" 2>&1
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifacts/crossing-292')
          for case in ('worksREAL','queueREAL','real14hREAL','gridARTIFICIAL'):
              calls=50 if case=='gridARTIFICIAL' else 100
              for at in sorted({0,20,calls//2,calls}):
                  a=(root/f'{case}-control'/f'checkpoint-{at}.json').read_bytes()
                  b=(root/f'{case}-probe'/f'checkpoint-{at}.json').read_bytes()
                  assert a==b,(case,at,'FULL_JSON_MISMATCH')
                  json.loads(a)
                  print('PR57_292_PARITY',case,at,'sha256='+hashlib.sha256(a).hexdigest(),flush=True)
              for mode in ('control','probe'):
                  log=(root/f'{case}-{mode}.log').read_text()
                  assert f'PR57_292_FINAL case={case} mode={mode} calls={calls}' in log
                  assert log.count('PR57_292_WINDOW ')==3,(case,mode,'windows')
                  assert log.count('PR57_292_PHASE ')==39,(case,mode,'phases')
                  assert log.count('PR57_292_CHECKPOINT ')==4,(case,mode,'checkpoints')
                  assert log.count('PR57_292_READER ')==(4 if mode=='probe' else 0)
              print('PR57_292_COMPLETE',case,'processes=2','callsPerArm='+str(calls),
                    'cadence=Advance2','fullJsonParity=True',flush=True)
          PY
      - name: Preserve raw logs and complete checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-292
          path: artifacts/crossing-292/**
          retention-days: 14
