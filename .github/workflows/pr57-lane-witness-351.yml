name: 'PR57 #351 REAL consecutive lane candidate witness'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-lane-witness-351.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational six-slice lane candidate witness
        run: |
          python3 scripts/pr57-346-inject.py
          python3 scripts/pr57-345-observe.py
          python3 scripts/pr57-348-inject.py
          python3 scripts/pr57-351-inject.py
      - name: Build authentic REAL replay and run simulation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay 10800 individual Advance(2) control and probe
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/witness351/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_206_RESIDUAL_EXCLUSIVE="$flag" \
            PR57_244_STATE_COST="$flag" \
            PR57_348_STAGE_EFFECTS="$flag" \
            PR57_351_LANE_WITNESS="$flag" \
            PR57_244_PERSISTENT_IDS="1071,1243,1282,1380" \
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/witness351/$mode" > "artifacts/witness351/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|206_RESIDUAL|244_STATE|348_(EFFECT|ACTOR)|350_SAFETY) ' \
              "artifacts/witness351/$mode/full.log" > "artifacts/witness351/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/witness351/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/witness351/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/witness351/$mode/census.log"
          done
          cmp artifacts/witness351/control/checkpoint-10800.json \
              artifacts/witness351/probe/checkpoint-10800.json
          python3 - <<'PY' | tee artifacts/witness351/summary.txt
          from pathlib import Path
          root=Path("artifacts/witness351")
          def parse(mode,prefix):
              return [
                  {k:v for k,v in (item.split("=",1) for item in line.split()[1:] if "=" in item)}
                  for line in (root/mode/"census.log").read_text().splitlines()
                  if line.startswith(prefix+" ")
              ]
          rows=parse("probe","PR57_351_WITNESS")
          assert len(rows)==6,len(rows)
          assert [int(x["eligibleSlice"]) for x in rows]==[40001,40002,40003,50001,50002,50003]
          assert len(parse("probe","PR57_206_RESIDUAL"))==6
          assert len(parse("probe","PR57_348_ACTOR"))==186
          assert not parse("control","PR57_351_WITNESS")
          keys=("eligible","compared","selfSame","winnerSame","candidateSetSame",
                "allCandidatesSame","selfAllSame","changedCandidates",
                "candidateVisits","nonconsecutive")
          for i,row in enumerate(rows):
              values={k:int(row[k]) for k in keys}
              assert values["eligible"]>0
              assert values["compared"]<=values["eligible"]
              assert values["selfAllSame"]<=values["allCandidatesSame"]<=values["compared"]
              assert values["winnerSame"]<=values["compared"]
              assert values["candidateSetSame"]<=values["compared"]
              if i:
                  assert values["eligible"]>=int(rows[i-1]["eligible"])
                  assert values["compared"]>=int(rows[i-1]["compared"])
              print("PR57_351_SAMPLE slice="+row["eligibleSlice"]+" "+
                    " ".join(f"{k}={values[k]}" for k in keys))
          print("PR57_351_PARITY byteIdentical=TRUE sixSlices=TRUE "+
                "scope=AUTHENTIC_REAL_ADVANCE2 exactReadset=FALSE "+
                "transientWritesUnseen=TRUE noSkippedSlices=TRUE")
          PY
      - name: Upload raw logs, candidate witnesses, summary and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-lane-witness-351
          path: artifacts/witness351/**
          if-no-files-found: warn
