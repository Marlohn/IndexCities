name: 'PR57 #368 REAL canonical identity guard ABBA'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-368-inject.py, .github/workflows/pr57-canonical-guard-368.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  bounded-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject both reversible observers in checkout only
        run: |
          python3 scripts/pr57-367-inject.py
          python3 scripts/pr57-368-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: ABBA individual Advance(2) and independent parity checks
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in baselineA guardedA guardedB baselineB; do
            mkdir -p "artifacts/guard368/$mode"
            case "$mode" in guarded*) flag=1;; *) flag=0;; esac
            PR57_367_DIRECT_WRITERS=1 PR57_368_CANONICAL_GUARD="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/guard368/$mode" \
                > "artifacts/guard368/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|367_(FIELD|PHASE|SUMMARY)|368_GUARD) ' \
              "artifacts/guard368/$mode/full.log" \
              > "artifacts/guard368/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/guard368/$mode/census.log")" -eq 6
            grep -q 'parity=IDENTICAL' "artifacts/guard368/$mode/census.log"
          done
          for mode in guardedA guardedB baselineB; do
            cmp artifacts/guard368/baselineA/checkpoint-10800.json \
                "artifacts/guard368/$mode/checkpoint-10800.json"
          done
          sha256sum artifacts/guard368/*/checkpoint-10800.json \
            | tee artifacts/guard368/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/guard368/summary.txt
          from pathlib import Path
          root=Path("artifacts/guard368")
          modes=["baselineA","guardedA","guardedB","baselineB"]
          def rows(mode,prefix):
              return [dict(x.split("=",1) for x in line.split()[1:] if "=" in x)
                      for line in (root/mode/"census.log").read_text().splitlines()
                      if line.startswith(prefix+" ")]
          def scalar(mode):
              s=rows(mode,"PR57_367_SUMMARY")
              assert len(s)==1
              return s[0]
          for mode in modes:
              guard=rows(mode,"PR57_368_GUARD")
              assert len(guard)==1
              assert guard[0]["enabled"]==("1" if mode.startswith("guarded") else "0")
              assert len(rows(mode,"PR57_337_HOUR"))==6
              assert len(rows(mode,"PR57_337_FINAL"))==1
              s=scalar(mode)
              assert int(s["canonical"])==98
              assert int(s["writes"])==1852, (mode,s)
              assert int(s["writes"])==sum(int(x["writes"]) for x in rows(mode,"PR57_367_FIELD"))
              assert int(s["writes"])==sum(int(x["writes"]) for x in rows(mode,"PR57_367_PHASE"))
              if mode.startswith("guarded"):
                  assert int(s["noncanonical"])==0
              else:
                  assert int(s["noncanonical"])>1000000
          for prefix in ("PR57_367_FIELD","PR57_367_PHASE"):
              reference=sorted(tuple(sorted(x.items())) for x in rows("baselineA",prefix))
              for mode in modes[1:]:
                  assert sorted(tuple(sorted(x.items())) for x in rows(mode,prefix))==reference
          def hour(mode):
              return rows(mode,"PR57_337_HOUR")[0]
          for mode in modes:
              h=hour(mode)
              print("PR57_368_RESULT",mode,"canonical",scalar(mode)["writes"],
                    "temporaryCallbacks",scalar(mode)["noncanonical"],
                    "hour1WallMs",h["wallMs"],
                    "hour1AllocatedBytes",h["totalAllocatedBytes"])
          print("PR57_368_PARITY exactFields=True exactPhases=True savesIdentical=True ABBA=True")
          PY
      - name: Upload raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-guard-368
          path: artifacts/guard368/
          if-no-files-found: warn
