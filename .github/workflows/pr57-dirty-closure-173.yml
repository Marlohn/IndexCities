name: 'PR57 #173 sampled dirty-ID writer closure falsification'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-dirty-closure-173.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --verbosity quiet
      - name: Run explicit dirty-closure adversarial repros
        shell: bash
        run: |
          PR57_VEHICLE_MUTATION_AUDIT=1 PR57_DIRTY_CLOSURE_PROBE=1             dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build             --filter FullyQualifiedName~Pr57DirtyClosureTests --verbosity normal
      - name: Restore authentic works city
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested city
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Sample writer coverage in authentic host-cadence replays
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          test -s "$works"; test -s "$queue"
          mkdir -p artifacts/dirty-closure-173
          for case in worksREAL queueREAL; do
            source="$works"; window=3600; windows=1
            if [[ "$case" == queueREAL ]]; then source="$queue"; window=600; windows=2; fi
            for mode in plain probe; do
              output="$PWD/artifacts/dirty-closure-173/$case-$mode"
              mkdir -p "$output"
              command=scale; enabled=0
              if [[ "$mode" == probe ]]; then command=profile; enabled=1; fi
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1               PR57_SAVE_CAPTURE_DIR="$output" PR57_VEHICLE_MUTATION_AUDIT="$enabled"               PR57_DIRTY_CLOSURE_PROBE="$enabled"               PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1               PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1               PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1               PR57_SAFE_SITE_BUFFER=1 PR57_BLOCK_DEP_PROBE=0 PR57_GRAPH_PROBE=0               PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0                 timeout 300s dotnet run --no-build -c Release                 --project src/IndexCities.Headless/IndexCities.Headless.csproj --                 "$command" cycle --seed=42 --warmup=0 --days="$windows"                 --window="$window" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify complete parity and print dirty writer census
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/dirty-closure-173")
          for case,windows,seconds in (("worksREAL",1,3600),("queueREAL",2,1200)):
              logs={}
              for mode in ("plain","probe"):
                  log=(root/f"{case}-{mode}.log").read_text()
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode,"invariants/save")
                  rows=[line for line in log.splitlines() if line.startswith("WINDOW ")]
                  assert len(rows)==windows,(case,mode,"windows",len(rows))
                  logs[mode]=(log,rows)
                  for i in range(windows+1):
                      a=(root/f"{case}-plain"/f"checkpoint-{i}.json").read_bytes()
                      b=(root/f"{case}-{mode}"/f"checkpoint-{i}.json").read_bytes()
                      assert a==b,(case,mode,i,"checkpoint divergence")
              plain,rows=logs["plain"]
              probe,_=logs["probe"]
              census=[line for line in probe.splitlines() if line.startswith("PR57_DIRTY_CLOSURE ")]
              assert census,(case,"missing probe")
              assert "PR57_DIRTY_CLOSURE " not in plain,(case,"plain contaminated")
              def val(line,key):
                  match=re.search(r"\b"+re.escape(key)+r"=([0-9.]+)",line)
                  assert match,(case,key,line)
                  return float(match.group(1))
              metrics={k:sum(val(row,k) for row in rows) for k in ("wall","cpu","allocMB")}
              metrics.update({k:val(rows[-1],k) for k in ("alive","travelling","openWorks")})
              if case=="worksREAL": assert metrics["openWorks"]>0,metrics
              if case=="queueREAL": assert metrics["alive"]>=100,metrics
              last=census[-1]
              keys=("samples","marks","uniqueTouched","actualChanged","missed","overmarked",
                    "newIds","preQueryMisses","markTicks","markBytes")
              counts={k:int(val(last,k)) for k in keys}
              assert counts["samples"]>0 and counts["marks"]>0,(case,counts)
              print("PR57_173_RESULT",case,"simSeconds",seconds,"plain",metrics,
                    "simSecondsPerWallSecond",round(seconds/metrics["wall"],2),
                    "fullCheckpoints",windows+1,"dirtyCensus",counts,
                    "interpretation","observational; no physical index; no A/B acceleration")
          PY
      - name: Preserve checkpoints and probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-dirty-closure-173
          path: artifacts/dirty-closure-173/**
          retention-days: 14
