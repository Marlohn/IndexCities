name: 'PR57 #408 canonical lane winner causes REAL (corrected injector)'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-lane-winner-cause-408.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-lane-winners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject in disposable checkout
        run: |
          set -euo pipefail
          python3 scripts/pr57-408-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, 10800 Advance(2) each, exact checkpoint parity
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            mkdir -p "artifacts/queuecause408/$arm"
            PR57_408_WINNER_CAUSE="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/queuecause408/$arm" \
                > "artifacts/queuecause408/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/queuecause408/$arm/full.log"
          done
          cmp artifacts/queuecause408/base/checkpoint-10800.json artifacts/queuecause408/probe/checkpoint-10800.json
          sha256sum artifacts/queuecause408/*/checkpoint-10800.json | tee artifacts/queuecause408/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/queuecause408/summary.json
          import json
          from pathlib import Path
          root=Path("artifacts/queuecause408")
          arms={}
          for arm in ("base","probe"):
              lines=(root/arm/"full.log").read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split("=",1) for x in line.split()[1:] if "=" in x)
                          for line in lines if line.startswith(prefix+" ")]
              hours=rows("PR57_337_HOUR")
              boundaries=rows("PR57_ADVANCE_BOUNDARY")
              final=rows("PR57_337_FINAL")
              cells=rows("PR57_408_CELL")
              holds=rows("PR57_408_HOLD")
              sums=rows("PR57_408_SUMMARY")
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1,(arm,len(hours),len(boundaries),len(final))
              assert int(boundaries[-1]["calls"])==10800 and final[0]["parity"]=="IDENTICAL"
              assert all(int(h["living"])==121 for h in hours)
              if arm=="probe":
                  assert len(cells)==28 and len(holds)==7 and len(sums)==1
                  s=sums[0]
                  assert s["observational"]=="True" and s["noSkippedSlices"]=="True" and s["causalClosure"]=="False"
                  assert int(s["physical"])==600
                  assert sum(int(c["scans"]) for c in cells)==int(s["scans"])
                  assert sum(int(c["scans"]) for c in cells if c["binding"]=="1")==int(s["binding"])
                  assert sum(int(c["scans"]) for c in cells if c["cause"]!="0")==int(s["winners"])
                  assert int(s["scans"])>10000 and int(s["candidates"])>1000000
              else:
                  assert not cells and not holds and not sums
              arms[arm]={"hours":hours,"final":final[0],"boundaries":len(boundaries)}
              if sums: arms[arm].update({"summary":s,"cells":cells,"holds":holds})
          print(json.dumps({"arms":arms,"fixture":"REAL","parity":"byte-identical","cadence":"Advance(2)","observation_only":True},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-queuecause-408
          path: artifacts/queuecause408
          retention-days: 14
