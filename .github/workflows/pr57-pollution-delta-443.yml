name: 'PR57 #443 REAL pollution cell churn and IEEE delta shadow'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-pollution-delta-443.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  pollution-delta-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational shadow in disposable checkout
        run: |
          set -euo pipefail
          python3 scripts/pr57-440-inject.py
          python3 scripts/pr57-443-inject.py
      - name: Build and run full regression suite
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh .NET processes, 10800 individual Advance(2) calls each
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in first second; do
            mkdir -p "artifacts/pollution443/$arm"
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/pollution443/$arm" \
              > "artifacts/pollution443/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/pollution443/$arm/full.log"
          done
          cmp artifacts/pollution443/first/checkpoint-10800.json artifacts/pollution443/second/checkpoint-10800.json
          sha256sum artifacts/pollution443/*/checkpoint-10800.json > artifacts/pollution443/checkpoints.sha256
          python3 - <<'PY_AUDIT' | tee artifacts/pollution443/summary.json
          import json, hashlib
          from pathlib import Path
          root=Path('artifacts/pollution443')
          names=['steps','comparableSteps','cellsObserved','decimalCellChanges',
                 'doubleCellChanges','allCellsChangedSteps','unchangedSteps',
                 'layoutChanges','homeSamples','deltaComparisons',
                 'deltaBitwiseMismatches','firstMismatchStep']
          arms={}; signatures=[]
          for arm in ('first','second'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              census=rows('PR57_443_CENSUS')
              final=rows('PR57_337_FINAL')
              examples=rows('PR57_443_EXAMPLE')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert [int(x['calls']) for x in boundaries]==list(range(100,10801,100))
              assert all(x['quantum']=='2' for x in boundaries)
              assert len(census)==72
              assert all([x['metric'] for x in census if int(x['hour'])==h]==names for h in range(1,7))
              totals={name:sum(int(x['value']) for x in census if x['metric']==name) for name in names}
              assert totals['steps']==10800 and totals['comparableSteps']==10799
              assert totals['cellsObserved']>0 and totals['homeSamples']>0
              assert totals['deltaComparisons']>0
              assert totals['deltaBitwiseMismatches']<=totals['deltaComparisons']
              assert totals['allCellsChangedSteps']<=totals['comparableSteps']
              assert totals['unchangedSteps']<=totals['comparableSteps']
              assert totals['layoutChanges']<=totals['comparableSteps']
              assert final[0]['parity']=='IDENTICAL'
              signatures.append([tuple(h[k] for k in
                  ('hour','slices','actors','claimChanges','spaceCountChanges',
                   'living','ledger','history')) for h in hours])
              arms[arm]={
                  'census':totals,
                  'examples':examples[:1],
                  'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                  'cpuMs':round(sum(float(h['cpuMs']) for h in hours),3),
                  'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours)}
          assert signatures[0]==signatures[1], 'intermediate ledger/history divergence'
          assert arms['first']['census']==arms['second']['census'], 'shadow census divergence'
          saves=[(root/a/'checkpoint-10800.json').read_bytes() for a in ('first','second')]
          assert saves[0]==saves[1] and len(saves[0])==2254838
          sha=hashlib.sha256(saves[0]).hexdigest()
          assert sha=='e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa'
          print(json.dumps({'experiment':'443_pollution_cell_churn_delta_shadow',
              'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'arms':arms,'saveSha256':sha,
              'observational':True,'causalClosure':False,
              'optimizationGainAccepted':False},sort_keys=True))
          PY_AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-pollution-delta-443
          path: artifacts/pollution443
          retention-days: 14
