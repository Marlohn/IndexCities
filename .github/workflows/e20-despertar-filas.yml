name: E20 - acordar veiculos por dependencia fisica

on:
  push:
    branches:
      - experimento/e20-despertar-filas

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --logger 'console;verbosity=minimal'

  ablation:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: small-108-day
            rows: 3
            length: 400
            seconds: 86400
          - label: 400-congested-2h
            rows: 5
            length: 800
            seconds: 7200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: A/B bloqueados adormecidos x motor original, mesma cidade
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project src/IndexCities.Headless -- scale grid \
            --rows=${{ matrix.rows }} --length=${{ matrix.length }} --warmup=1 --seed=42 \
            --e20=compare --e20-window=${{ matrix.seconds }} | tee "e20_${{ matrix.label }}.log"
          grep -q '^E20_COMPARE ' "e20_${{ matrix.label }}.log"
          grep '^E20_COMPARE' "e20_${{ matrix.label }}.log"
          grep '^E20_RESULT' "e20_${{ matrix.label }}.log"
      - name: Arquivar resultados e divergencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e20-${{ matrix.label }}
          path: e20_*.log
          if-no-files-found: ignore
