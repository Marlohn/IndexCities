name: 'PR57 #444 REAL zero-demand electric additive no-op A/B'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-electric-zero-444.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  electric-noop-abba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject reversible opt-in no-op in disposable checkout
        run: python3 scripts/pr57-444-inject.py
      - name: Build and run full regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic congested REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/real14h
      - name: Restore authentic REAL construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Fresh-process ABBA, every Advance(2), full intermediate JSON parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY_ABBA' | tee artifacts/pr57-444-summary.log
          import os, subprocess, json, re, hashlib, time
          from pathlib import Path
          from decimal import Decimal
          root=Path('artifacts/pr57-444');root.mkdir(parents=True,exist_ok=True)
          real=Path('artifacts/real14h/real14hREAL-control/checkpoint-0.json')
          matches=list(Path('artifacts/works').rglob('worksREAL-control1/checkpoint-0.json'))
          assert real.is_file() and len(matches)==1,(real,matches)
          cases=[('worksEarlyREAL',matches[0],200,1,47,42,68),
                 ('congested14hREAL',real,3600,6,121,98,0)]
          expected={'worksEarlyREAL':('b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5',
                                     '686ed27e0cc458d3d8f411a1e308a2dc98e87bf588c12d5dcf1ea787bad1c883'),
                    'congested14hREAL':('779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f',
                                        'e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa')}
          results={}
          for name,source,window,windows,living,vehicles,projects in cases:
              original=source.read_bytes()
              state=json.loads(original,parse_float=Decimal)
              assert hashlib.sha256(original).hexdigest()==expected[name][0],name
              assert sum(bool(c['Alive']) for c in state['Citizens'])==living
              assert len(state['Vehicles'])==vehicles
              if projects: assert len(state['Projects'])>=projects # 68 open; total may include completed
              arms=[]
              for index,mode in enumerate(('A','B','B','A')):
                  dest=root/name/f'{index+1}-{mode}';dest.mkdir(parents=True,exist_ok=True)
                  env=os.environ.copy()
                  env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                             PR57_GRID_DIAG='0',PR57_444_ZERO_DEMAND_ADD='1' if mode=='B' else '0',
                             PR57_SAVE_CAPTURE_DIR=str(dest.resolve()))
                  cmd=['dotnet','run','--no-build','-c','Release',
                       '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                       '--','profile','cycle','--seed=42','--warmup=0',
                       f'--days={windows}',f'--window={window}','--cap=600',
                       f'--resume={source.resolve()}']
                  start=time.perf_counter()
                  with (dest/'full.log').open('w') as out:
                      subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                     check=True,timeout=420)
                  processWall=time.perf_counter()-start
                  log=(dest/'full.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,mode,log[-2500:])
                  assert f'STEP_PROFILE steps={windows*window//2}' in log,(name,mode,'STEP_COUNT')
                  rows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
                  checkpoints=[x for x in log.splitlines() if x.startswith('PR57_AB_CHECKPOINT ')]
                  assert len(rows)==windows and len(checkpoints)==windows,(name,mode,len(rows),len(checkpoints))
                  phase=[x for x in log.splitlines() if x.lstrip().startswith('STEP_PHASE ')]
                  assert len(phase)==13,(name,mode,len(phase))
                  def field(row,key):
                      m=re.search(r'(?<!\w)'+re.escape(key)+r'=([^ ]+)',row)
                      assert m,(name,mode,key,row)
                      return m.group(1)
                  wall=sum(float(field(x,'wall').removesuffix('s')) for x in rows)
                  cpu=sum(float(field(x,'cpu').removesuffix('s')) for x in rows)
                  alloc=sum(float(field(x,'allocMB')) for x in rows)
                  phases={field(x,'name'):float(field(x,'wall').removesuffix('s')) for x in phase}
                  assert all(v>=0 for v in phases.values())
                  assert (dest/'checkpoint-0.json').read_bytes()==original
                  final=(dest/f'checkpoint-{windows}.json').read_bytes()
                  assert hashlib.sha256(final).hexdigest()==expected[name][1],(name,mode,'FINAL_HASH')
                  arms.append({'mode':mode,'run':index+1,'wallSeconds':wall,
                               'cpuSeconds':cpu,'allocatedMB':alloc,'processWallSeconds':round(processWall,3),
                               'phaseSeconds':phases})
              for checkpoint in range(windows+1):
                  saves=[(root/name/f'{i+1}-{mode}'/f'checkpoint-{checkpoint}.json').read_bytes()
                         for i,mode in enumerate(('A','B','B','A'))]
                  assert all(s==saves[0] for s in saves),(name,checkpoint,'FULL_JSON_DIVERGENCE')
                  json.loads(saves[0],parse_float=Decimal)
              results[name]={'advance2PerProcess':windows*window//2,'runs':arms,
                             'fullCheckpointsPerProcess':windows+1,
                             'saveSha256':expected[name][1],
                             'scope':'AUTHENTIC_REAL_NOT_GRID'}
              print('PR57_444_CASE',name,'fullParity=EXACT','callsPerArm='+str(windows*window//2),
                    'runs=ABBA',flush=True)
          summary={'experiment':'444_zero_demand_add_opt_in',
                   'baseline':'PR57_COMPOSED_FLAGS_NO_ZERO_DEMAND_SKIP',
                   'realEconomyActive':True,'constructionREAL':True,
                   'allAdvance2':True,'fullIntermediateSaveParity':True,
                   'optimizationGainAccepted':False,'cases':results}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_444_SUMMARY',json.dumps(summary,sort_keys=True),flush=True)
          PY_ABBA
      - name: Preserve raw logs, all checkpoints and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-electric-zero-444
          path: artifacts/pr57-444
          retention-days: 14
