name: 'PR57 #271 exact Penetration argument repetition census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-penetration-keys-271.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  penetration-census:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic real economic queue at 14h from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/real-prior
      - name: Restore authentic construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works-prior
      - name: Restore explicitly artificial GRID checkpoint from #237
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/grid-prior
      - name: Observe only final 20 physical slices and verify complete-state parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, json, hashlib, re
          root=Path('artifacts/penetration-keys-271')
          root.mkdir(parents=True,exist_ok=True)
          real=Path('artifacts/real-prior/overnight-08/checkpoint-1.json')
          works=list(Path('artifacts/works-prior').rglob('growth/checkpoint-0.json'))
          grid=list(Path('artifacts/grid-prior').rglob('gridARTIFICIAL-control1/checkpoint-5.json'))
          assert real.is_file() and len(works)==1 and len(grid)==1
          cases=[('queueREAL14h',real,'cycle',200,600),
                 ('worksREAL',works[0],'cycle',200,600),
                 ('gridARTIFICIAL',grid[0],'grid',100,300)]
          common={'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
                  'PR57_GRID_DIAG':'0','PR57_206_RESIDUAL_EXCLUSIVE':'0',
                  'PR57_266_COHORT_STAGES':'0','PR57_270_MANOEUVRE_SCRATCH':'0'}
          for name,source,fixture,horizon,cap in cases:
              state=json.loads(source.read_text())
              print('PR57_271_SOURCE',name,'sha256',hashlib.sha256(source.read_bytes()).hexdigest(),
                    'alive',sum(bool(c.get('Alive')) for c in state['Citizens']),
                    'vehicles',len(state['Vehicles']),flush=True)
              paths={}
              for mode in ('control','observer'):
                  dest=root/f'{name}-{mode}';dest.mkdir(parents=True,exist_ok=True)
                  env=os.environ.copy();env.update(common)
                  env['PR57_271_PENETRATION_KEYS']='1' if mode=='observer' else '0'
                  env['PR57_271_FROM']=str(cap-19)
                  env['PR57_271_TO']=str(cap)
                  env['PR57_SAVE_CAPTURE_DIR']=str(dest.resolve())
                  cmd=['dotnet','run','--no-build','-c','Release',
                       '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                       '--','profile',fixture,'--seed=42','--warmup=0',
                       '--days=1',f'--window={horizon}',f'--cap={cap}',
                       f'--resume={source.resolve()}']
                  logpath=root/f'{name}-{mode}.log'
                  with logpath.open('w') as out:
                      subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                     check=True,timeout=240)
                  log=logpath.read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,mode,log[-2000:])
                  assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
                  assert (dest/'checkpoint-1.json').is_file()
                  if mode=='observer':
                      rows=[x for x in log.splitlines() if x.startswith('PR57_271_KEYS ')]
                      stages=[x for x in log.splitlines() if x.startswith('PR57_271_STAGE ')]
                      assert len(rows)==1 and len(stages)==10,(name,rows,stages)
                      assert 'observed=20 ' in rows[0],rows[0]
                      print('PR57_271_RESULT',name,rows[0],flush=True)
                      for line in stages:print(line,flush=True)
                  windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
                  assert len(windows)==1,(name,mode,windows)
                  print('PR57_271_WINDOW',name,mode,windows[0],flush=True)
                  paths[mode]=dest
              for i in (0,1):
                  assert (paths['control']/f'checkpoint-{i}.json').read_bytes()==(paths['observer']/f'checkpoint-{i}.json').read_bytes(),(name,i,'FULL_JSON_MISMATCH')
              print('PR57_271_PARITY',name,'fullJson=EXACT','Advance2CallsPerArm',horizon//2,
                    'noSkippedSlices=True','observationalOnly=True',flush=True)
          PY
      - name: Preserve logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-penetration-keys-271
          path: artifacts/penetration-keys-271/**
          retention-days: 14
