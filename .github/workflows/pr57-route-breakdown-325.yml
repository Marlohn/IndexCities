name: 'PR57 #325 pedestrian route branch cost and BFS census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-route-expansions-324.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  route-expansions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and existing tests
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore same authentic REAL and explicitly ARTIFICIAL GRID saves as #321
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process ABBA and bounded route expansion counters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/route-325
          for case in real14hREAL gridARTIFICIAL; do
            input="artifacts/input/${case}-control/checkpoint-0.json"
            test -s "$input"
            calls=100
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; fi
            for arm in control1 probe1 probe2 control2; do
              output="artifacts/route-325/${case}-${arm}"
              mkdir -p "$output"
              observed=0
              if [[ "$arm" == probe* ]]; then observed=1; fi
              cmd=(dotnet run --no-build -c Release --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- "$input" "$case" probe "$calls" "$output")
              PR57_323_CITIZEN_PER_CALL="$observed" \
              PR57_224_CITIZEN_STATE_COST="$observed" \
              PR57_239_CITIZEN_PHASES="$observed" \
              PR57_240_WALK_SPLIT="$observed" \
              PR57_241_ARRIVAL_SPLIT="$observed" \
              PR57_242_FOOD_SEARCH="$observed" \
              PR57_324_ROUTE_EXPANSIONS="$observed" \
              PR57_325_WALK_BREAKDOWN="$observed" \
                "${cmd[@]}" > "artifacts/route-325/${case}-${arm}.log" 2>&1
            done
          done
      - name: Verify checkpoints and per-call route expansion deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,statistics
          root=Path("artifacts/route-325")
          def fields(s):
              return dict(re.findall(r"([A-Za-z][A-Za-z0-9]*)=([^\s]+)",s))
          def snapshots(lines):
              out={}
              for line in lines:
                  if not line.startswith("PR57_324_COUNTER "): continue
                  m=re.match(r"PR57_324_COUNTER case=\S+ call=(\d+) PR57_324_ROUTE name=(\w+) (.*)",line)
                  assert m,line
                  call=int(m.group(1)); name=m.group(2)
                  assert name not in out.setdefault(call,{}),(call,name)
                  out[call][name]=fields(m.group(3))
              return out
          pairs=0
          for case,calls in (("real14hREAL",100),("gridARTIFICIAL",50)):
              totals={}; snapshots_by_arm={}
              for arm in ("control1","probe1","probe2","control2"):
                  lines=(root/f"{case}-{arm}.log").read_text().splitlines()
                  final=[fields(line) for line in lines if line.startswith("PR57_294_FINAL ")]
                  assert len(final)==1,(case,arm,"final")
                  f=final[0]
                  assert f["cadence"]=="Advance2" and f["all13Phases"]=="True"
                  assert f["noSkippedSlices"]=="True" and f["exactCheckpoints"]=="True"
                  assert f["mode"]=="probe" and int(f["calls"])==calls
                  steps=[fields(line) for line in lines if line.startswith("PR57_294_STEP ")]
                  assert [int(s["call"]) for s in steps]==list(range(1,calls+1))
                  totals[arm]=f; snapshots_by_arm[arm]=snapshots(lines)
                  if arm.startswith("probe"):
                      for call in (0,1,2,21,22,23,30,31,32,50):
                          assert set(snapshots_by_arm[arm].get(call,{}))=={"walkCache","surface","sidewalk","nearest","roadRoute","recovery","legalWalk","fallback"},(case,arm,call)
                  else:
                      assert not snapshots_by_arm[arm],(case,arm,"unexpected route probe")
              for i in (1,2):
                  for step in (0,20,calls//2,calls):
                      a=(root/f"{case}-control{i}"/f"checkpoint-{step}.json").read_bytes()
                      b=(root/f"{case}-probe{i}"/f"checkpoint-{step}.json").read_bytes()
                      assert a==b,(case,i,step,"full checkpoint mismatch")
                      pairs+=1
              for metric in ("wallMs","cpuMs","allocatedBytes"):
                  c=statistics.mean(float(totals[f"control{i}"][metric]) for i in (1,2))
                  p=statistics.mean(float(totals[f"probe{i}"][metric]) for i in (1,2))
                  print(f"PR57_325_FULL case={case} metric={metric} control={c:.3f} probe={p:.3f} scope=INTRUSIVE_NOT_SPEEDUP")
              for before,after in ((0,1),(1,2),(21,22),(22,23),(30,31),(31,32)):
                  for arm in ("probe1","probe2"):
                      snaps=snapshots_by_arm[arm]
                      row={}
                      for name,metrics in (("walkCache",("calls","misses","missMs")),
                                           ("surface",("calls","builds","ms")),
                                           ("sidewalk",("calls","ms","edgesBuilt","expanded","pops","legalChecks","goalLinks")),
                                           ("nearest",("calls","ms","bytes")),
                                           ("roadRoute",("calls","empty","bfsPops","ms","bytes")),
                                           ("recovery",("calls","nodes","ms","bytes")),
                                           ("legalWalk",("calls","rejected","ms","bytes")),
                                           ("fallback",("calls",))):
                          for metric in metrics:
                              value=float(snaps[after][name][metric])-float(snaps[before][name][metric])
                              assert value>=-0.001,(case,arm,before,after,name,metric,value)
                              row[f"{name}_{metric}"]=round(value,5)
                      print(f"PR57_325_DELTA case={case} arm={arm} call={after} "+ " ".join(f"{k}={v}" for k,v in row.items()))
              print(f"PR57_325_PARITY case={case} checkpointPairs=8/8")
          assert pairs==16,pairs
          print("PR57_325_VERIFIED checkpointPairs=16/16 processes=8 cadence=Advance2 all13Phases=True")
          PY
      - name: Preserve raw logs and complete checkpoints on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-route-325
          path: artifacts/route-325/**
          retention-days: 14
