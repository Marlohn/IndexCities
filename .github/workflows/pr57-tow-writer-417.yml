name: 'PR57 #417 tow-target exact writer/read census REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-tow-writer-417.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-tow-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational hooks only in disposable checkout
        run: python3 scripts/pr57-417-inject.py
      - name: Build and run all tests including #416 adversarial witnesses
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes with individual Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            mkdir -p "artifacts/tow417/$arm"
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            PR57_417_TOW_WRITER_READ="$flag" dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/tow417/$arm" \
              > "artifacts/tow417/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/tow417/$arm/full.log"
          done
          cmp artifacts/tow417/base/checkpoint-10800.json artifacts/tow417/probe/checkpoint-10800.json
          sha256sum artifacts/tow417/*/checkpoint-10800.json | tee artifacts/tow417/checkpoints.sha256
          python3 - <<'PY_SUMMARY' | tee artifacts/tow417/summary.json
          import json
          from pathlib import Path
          root=Path('artifacts/tow417')
          arms={}
          for arm in ('base','probe'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              summary=rows('PR57_417_SUMMARY')
              writes=rows('PR57_417_WRITE')
              reads=rows('PR57_417_READ')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert int(boundaries[-1]['calls'])==10800 and final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              if arm=='probe':
                  assert len(summary)==1
                  s=summary[0]
                  assert int(s['steps'])==10800
                  assert int(s['passes'])==int(s['unsplit'])+int(s['operations'])+int(s['physical'])
                  assert int(s['arrivalsParked'])>=int(s['writes'])
                  assert int(s['writes'])>=int(s['writesUnsplit'])+int(s['writesPhysical'])
                  assert int(s['sameStepReads'])>=int(s['samePassReads'])
                  assert s['observational']=='True' and s['causalClosure']=='False'
                  assert int(s['witnesses'])==len(writes)+len(reads)
              else:
                  assert not summary and not writes and not reads
              arms[arm]={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                         'cpuMs':sum(float(h['cpuMs']) for h in hours),
                         'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                         'final':final[0], 'census':summary[0] if summary else None,
                         'writeWitnesses':writes,'readWitnesses':reads}
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
                            'advance2PerArm':10800,'arms':arms,
                            'observational':True,'causalClosure':False,
                            'optimizationGainAccepted':False},sort_keys=True))
          PY_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-tow-writer-417
          path: artifacts/tow417
          retention-days: 14
