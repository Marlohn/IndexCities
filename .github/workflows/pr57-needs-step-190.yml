name: 'PR57 #190 exact per-Step needs input census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-needs-step-190.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  needs-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build observer and run full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57NeedsStepBench/Pr57NeedsStepBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic works checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore artificial GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Observe exact per-Step inputs with independent control and probe processes
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; done
          mkdir -p artifacts/needs-190
          for case in worksREAL queueREAL gridARTIFICIAL; do
            source="$works"; steps=60
            if [[ "$case" == queueREAL ]]; then source="$queue"; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; steps=20; fi
            echo "PR57_190_SOURCE case=$case sha256=$(sha256sum "$source" | cut -d' ' -f1) steps=$steps"
            for mode in control probe; do
              out="$PWD/artifacts/needs-190/$case/$mode"
              mkdir -p "$out"
              timeout 180s dotnet run --project scripts/Pr57NeedsStepBench/Pr57NeedsStepBench.csproj \
                -c Release --no-build -- "$source" "$case" "$mode" "$steps" "$out" \
                | tee "artifacts/needs-190/$case-$mode.log"
            done
          done
      - name: Verify full-state parity and complete per-Step coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("artifacts/needs-190")
          for case,steps in (("worksREAL",60),("queueREAL",60),("gridARTIFICIAL",20)):
              for i in range(3):
                  a=(root/case/"control"/f"checkpoint-{i}.json").read_bytes()
                  b=(root/case/"probe"/f"checkpoint-{i}.json").read_bytes()
                  assert a==b,(case,i,"FULL_JSON_DIFFERENCE")
              lines=(root/f"{case}-probe.log").read_text().splitlines()
              assert sum(s.startswith("PR57_190_STEP ") for s in lines)==steps,(case,"STEP_COVERAGE")
              assert sum(s.startswith("PR57_190_SUMMARY ") for s in lines)==1,(case,"SUMMARY")
              assert any(s.startswith("PR57_190_DONE ") and "cadence=ADVANCE_2" in s for s in lines)
              print(f"PR57_190_VALIDATED case={case} steps={steps} checkpoints=3 parity=EXACT_FULL_JSON")
          PY
      - name: Preserve complete saves and observational logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-needs-step-190
          path: artifacts/needs-190/**
          retention-days: 14
