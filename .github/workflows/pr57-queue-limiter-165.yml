name: PR57 #165 sampled first zero-step queue limiter attribution
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-queue-limiter-165.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  residual-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test current composed flags
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
          PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
          PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
          PR57_SAFE_SITE_BUFFER=1 \
            dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic works checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore ARTIFICIAL 1111 living grid
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Profile moving and blocked physical attempts against plain replay
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; echo "PR57_165_SOURCE $(sha256sum "$source")"; done
          mkdir -p artifacts/queue-limiter-165
          for case in worksREAL queueREAL gridARTIFICIAL; do
            fixture=cycle; window=3600; windows=1; source="$works"
            if [[ "$case" == queueREAL ]]; then source="$queue"; window=600; windows=2; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; fixture=grid; window=200; windows=3; fi
            for mode in plain probe; do
              output="$PWD/artifacts/queue-limiter-165/$case-$mode"
              mkdir -p "$output"
              command=scale; enabled=0
              if [[ "$mode" == probe ]]; then command=profile; enabled=1; fi
              echo "PR57_165_RUN case=$case mode=$mode horizon=$((window*windows)) Advance2=True"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_HOT_TIMING=0 \
              PR57_VEHICLE_COST_PROBE=0 PR57_QUEUE_LIMITER_PROBE="$enabled" \
              PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
              PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
              PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
              PR57_SAFE_SITE_BUFFER=1 PR57_LANE_READWRITE_PROBE=0 \
              PR57_BLOCK_DEP_PROBE=0 PR57_GRAPH_PROBE=0 PR57_PHASE_ALLOC_PROBE=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" "$fixture" --seed=42 --warmup=0 --days="$windows" \
                --window="$window" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify full checkpoints and summarize first zero-step gates
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/queue-limiter-165")
          def metric(line,key):
              m=re.search(r"\\b"+re.escape(key)+r"=([-0-9.]+)",line)
              assert m,(key,line)
              return float(m.group(1))
          for case,windows,horizon in (("worksREAL",1,3600),("queueREAL",2,1200),("gridARTIFICIAL",3,600)):
              logs={mode:(root/f"{case}-{mode}.log").read_text() for mode in ("plain","probe")}
              for mode,log in logs.items():
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode,"save/invariants")
                  rows=[x for x in log.splitlines() if x.startswith("WINDOW ")]
                  assert len(rows)==windows,(case,mode,"windows",len(rows))
                  for i in range(windows+1):
                      a=(root/f"{case}-plain"/f"checkpoint-{i}.json").read_bytes()
                      b=(root/f"{case}-{mode}"/f"checkpoint-{i}.json").read_bytes()
                      assert a==b,(case,mode,i,"full state divergence")
              assert "PR57_QUEUE_LIMITER " not in logs["plain"]
              observations=[x for x in logs["probe"].splitlines() if x.startswith("PR57_QUEUE_LIMITER ")]
              assert observations,(case,"missing limiter observation")
              lastSlice=max(metric(x,"slices") for x in observations)
              stages={}
              for x in observations:
                  if metric(x,"slices")==lastSlice:
                      name=re.search(r"\\bstage=([^ ]+)",x).group(1)
                      stages[name]={k:metric(x,k) for k in ("attempts","fila","leader","entry","laneMs","bendMs")}
              assert len(stages)==10,(case,stages)
              rows=[x for x in logs["plain"].splitlines() if x.startswith("WINDOW ")]
              totals={k:sum(metric(x,k) for x in rows) for k in ("wall","cpu","allocMB")}
              activity={k:metric(rows[-1],k) for k in ("alive","pop","travelling","openWorks","history","ledger")}
              if case=="gridARTIFICIAL":
                  assert activity["alive"]>=1000 and activity["travelling"]>=200
                  assert sum(x["fila"] for x in stages.values())>0
              if case=="worksREAL": assert activity["openWorks"]>0
              print("PR57_165_RESULT",case,"horizon",horizon,"plain",totals,"activity",activity,
                    "rate",round(horizon/totals["wall"],2),"checkpoints",windows+1,
                    "sampledSlices",lastSlice,"firstZeroGates",stages)
          PY
      - name: Preserve complete checkpoints and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-queue-limiter-165
          path: artifacts/queue-limiter-165/**
          retention-days: 14
