name: PR57 owner roster same-count invalidation and economic A/B
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-site-roster-adversarial.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  roster-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and exercise external-owner transitions and complete test suites
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          PR57_SITE_OWNER_ROSTER=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter FullyQualifiedName~Pr57SiteOwnerRosterAdversarial --verbosity normal
          PR57_SITE_OWNER_ROSTER=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter FullyQualifiedName~Same_count_list_replacement_reordering_and_swap_invalidate_in_slice_roster --verbosity normal
          for flag in 0 1; do
            PR57_SITE_OWNER_ROSTER="$flag" dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          done
      - name: Restore authentic active-construction and congested economic saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/real-growth
      - name: Restore authentic later congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real-congested
      - name: Restore artificial high-traffic reference
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/curve-reference
      - name: ABBA with fresh processes, actual Advance(2) and intermediate complete saves
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          congested="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          grid="artifacts/curve-reference/grid18-0/checkpoint-1.json"
          test -s "$works" && test -s "$congested" && test -s "$grid"
          mkdir -p artifacts/site-roster-extended
          for case in works4h real121 grid18 cycle; do
            if [[ "$case" == works4h ]]; then
              args=(scale cycle --seed=42 --warmup=0 --days=4 --window=3600 --cap=300 --resume="$works")
              class=REAL_ACTIVE_CONSTRUCTION
            elif [[ "$case" == real121 ]]; then
              args=(scale cycle --seed=42 --warmup=0 --days=2 --window=1800 --cap=300 --resume="$congested")
              class=REAL_CONGESTED
            elif [[ "$case" == grid18 ]]; then
              args=(scale grid --seed=42 --warmup=0 --days=3 --window=100 --cap=300 --resume="$grid")
              class=ARTIFICIAL
            else
              args=(scale cycle --seed=42 --warmup=0 --days=2 --window=900 --cap=300)
              class=REAL_INITIAL
            fi
            n=0
            for mode in control candidate candidate control; do
              enabled=0
              if [[ "$mode" == candidate ]]; then enabled=1; fi
              out="artifacts/site-roster-extended/$case-$n"
              mkdir -p "$out"
              echo "PR57_SITE_ROSTER_EXTENDED case=$case class=$class index=$n mode=$mode flag=$enabled cadence=Advance2"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SITE_OWNER_ROSTER="$enabled" PR57_BUILDING_WORK_ACCESS=0 \
              PR57_DYNAMIC_BVH=0 PR57_PARALLEL_NEEDS=0 PR57_STAFF_PHASE_FUSION=0 \
              PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 PR57_PARALLEL_POLLUTION=0 \
              PR57_CONSTRUCTION_WAIT_AGENDA=0 PR57_DISPATCH_SHIPMENT_LOOKUP=0 \
              PR57_ROUTE_TREE=0 PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 \
              PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 PR57_PEDESTRIAN_GRID=0 \
              PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0 PR57_ZERO_SITE_SKIP=0 \
              PR57_ENTRY_SWEEP_FILTER=0 \
              PR57_SAVE_CAPTURE_DIR="$PWD/$out" \
                timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- "${args[@]}" | tee "$out.log"
              n=$((n+1))
            done
          done
      - name: Verify causal checkpoints, flags, invariants, economic activity and A/B metrics
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/site-roster-extended')
          for case,seconds,windows in (('works4h',14400,4),('real121',3600,2),('grid18',300,3),('cycle',1800,2)):
              results=[]
              for i in range(4):
                  log=(root/f'{case}-{i}.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,i,'invariants/save')
                  rows=[s for s in log.splitlines() if s.startswith('WINDOW ')]
                  assert len(rows)==windows,(case,i,'window count',len(rows))
                  def metric(row,key):
                      m=re.search(r'\b'+re.escape(key)+r'=([0-9.]+)',row)
                      assert m,(case,i,key,row)
                      return float(m.group(1))
                  result={key:sum(metric(row,key) for row in rows) for key in ('wall','cpu','allocMB')}
                  for key in ('pop','alive','openWorks'):
                      result[key]=metric(rows[-1],key)
                  results.append(result)
                  if case=='works4h':
                      assert metric(rows[0],'openWorks')>0,(case,i,'no genuine active works')
                  if i in (1,2) and case in ('works4h','real121','grid18'):
                      assert 'PR57_SITE_OWNER_ROSTER used=True' in log,(case,i,'flag not exercised')
                  for n in range(windows+1):
                      current=root/f'{case}-{i}'/f'checkpoint-{n}.json'
                      control=root/f'{case}-0'/f'checkpoint-{n}.json'
                      assert current.is_file() and current.read_bytes()==control.read_bytes(),(case,i,n,'causal divergence')
              print('PR57_SITE_ROSTER_EXTENDED_RESULT',case,'simSeconds',seconds,
                    'order',('control','candidate','candidate','control'),
                    'results',results,'pairWallImprovementPct',[
                        round(100*(results[c]['wall']-results[t]['wall'])/results[c]['wall'],2)
                        for c,t in ((0,1),(3,2))],
                    'throughput',[round(seconds/x['wall'],2) for x in results],
                    'fullCheckpointsPerProcess',windows+1,'equal',True)
          PY
      - name: Preserve full checkpoints and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-site-roster-extended
          path: artifacts/site-roster-extended/**
          retention-days: 14
