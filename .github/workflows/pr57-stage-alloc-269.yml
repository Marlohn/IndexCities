name: 'PR57 #269 real cohort stage allocation and warm actor fanout'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-stage-alloc-269.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  stage-alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and regression tests
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic economic checkpoints from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Compare per-ID stage attribution at Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import os, subprocess, json, hashlib, re
          root=Path('artifacts/real-stage-alloc-269')
          root.mkdir(parents=True,exist_ok=True)
          earlier=Path('artifacts/prior/overnight-05/checkpoint-1.json')
          source=Path('artifacts/prior/overnight-08/checkpoint-1.json')
          assert earlier.is_file() and source.is_file()
          def load(p): return json.loads(p.read_text(),parse_float=Decimal)
          before=load(earlier); after=load(source)
          av={v['Id']:v for v in before['Vehicles'] if v.get('Status')=='Travelling'}
          bv={v['Id']:v for v in after['Vehicles'] if v.get('Status')=='Travelling'}
          fields=('Position','Heading','WaitingSince','Cause','RouteIndex')
          persistent=sorted(i for i in av.keys()&bv.keys()
                            if all(av[i].get(k)==bv[i].get(k) for k in fields))
          assert len(persistent)==24,('expected authentic cohort',persistent)
          assert sum(bool(c.get('Alive')) for c in after['Citizens'])==121
          assert len(after['Vehicles'])==98
          print('PR57_269_SOURCE',hashlib.sha256(source.read_bytes()).hexdigest(),
                'persistentIds',','.join(map(str,persistent)),'alive',121,'vehicles',98,flush=True)
          common={
              'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
              'PR57_206_RESIDUAL_EXCLUSIVE':'0','PR57_IDLE_SCAN_PROBE':'0',
              'PR57_261_PATH_REACH':'0','PR57_263_ALL_CAN_TURN':'0',
              'PR57_253_STATE_EFFECTS':'0','PR57_260_READ_EXPOSURE':'0',
              'PR57_244_STATE_COST':'0','PR57_264_FULL_COHORT':'0',
              'PR57_244_PERSISTENT_IDS':','.join(map(str,persistent))
          }
          def run(mode):
              dest=root/mode;dest.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy();env.update(common)
              env['PR57_266_COHORT_STAGES']='1' if mode=='probe' else '0'
              env['PR57_269_STAGE_BYTES']='1' if mode=='probe' else '0'
              env['PR57_SAVE_CAPTURE_DIR']=str(dest.resolve())
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','profile' if mode=='probe' else 'scale','cycle','--seed=42',
                   '--warmup=0','--days=1','--window=200','--cap=600',
                   f'--resume={source.resolve()}']
              with (root/f'{mode}.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=300)
              log=(root/f'{mode}.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(mode,log[-4000:])
              assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
              assert (dest/'checkpoint-1.json').is_file()
              for line in log.splitlines():
                  if line.startswith(('WINDOW ','STEP_PROFILE','  STEP_PHASE','PR57_266_')):
                      print('PR57_269_LOG',mode,line.strip(),flush=True)
              if mode=='probe':
                  summaries=[x for x in log.splitlines() if x.startswith('PR57_266_SUM ')]
                  rows=[x for x in log.splitlines() if x.startswith('PR57_266_ROW ')]
                  assert len(summaries)==1 and len(rows)==144,(summaries,len(rows))
                  summary=summaries[0]
                  assert 'slices=600 cohort=24 ' in summary,summary
                  assert int(re.search(r'passes=(\d+)',summary).group(1))==14400,summary
                  assert int(re.search(r'causeChanges=(\d+)',summary).group(1))==14,summary
                  assert all(int(re.search(r'passes=(\d+)',x).group(1))==100 for x in rows)
                  assert len({(int(re.search(r'window=(\d+)',x).group(1)),
                               int(re.search(r'id=(\d+)',x).group(1))) for x in rows})==144
                  assert sum(Decimal(re.search(r's7Ms=([0-9.]+)',x).group(1))
                             for x in rows)>0
                  print('PR57_269_STAGE_TIME', ' '.join(
                      f's{i}Ms={sum(Decimal(re.search(fr"s{i}Ms=([0-9.]+)",x).group(1)) for x in rows):.6f}'
                      for i in range(9)),flush=True)
              if mode=='probe':
                  parsed=[]
                  for line in rows:
                      stages={key:int(value) for key,value in re.findall(r'(s[0-8]Bytes)=([0-9]+)',line)}
                      assert len(stages)==9,(line,stages)
                      raw=sum(stages.values())
                      rounded=Decimal(re.search(r'totalMB=([0-9.]+)',line).group(1))*Decimal(1000000)
                      assert abs(Decimal(raw)-rounded)<=Decimal('0.5'),(raw,rounded)
                      parsed.append((int(re.search(r'window=([0-9]+)',line).group(1)),
                                     int(re.search(r'id=([0-9]+)',line).group(1)),stages))
                  stage_bytes=[sum(row[f's{i}Bytes'] for _,_,row in parsed) for i in range(9)]
                  warm=[(id,row) for window,id,row in parsed if window==5]
                  assert len(warm)==24
                  heavy_ids={23,1071,1243,1453,1477,1495}
                  warm_heavy=sum(sum(row.values()) for id,row in warm if id in heavy_ids)
                  warm_total=sum(sum(row.values()) for _,row in warm)
                  assert warm_total>0 and warm_heavy>0
                  print('PR57_269_ALLOCATION allStageBytes='+str(sum(stage_bytes))+
                        ' byStageBytes='+','.join(map(str,stage_bytes))+
                        ' warmBytes='+str(warm_total)+
                        ' warmSixIdsBytes='+str(warm_heavy)+
                        ' warmSixPct='+f'{100*warm_heavy/warm_total:.3f}'+
                        ' warmStageBytes='+','.join(str(sum(row[f's{i}Bytes'] for _,row in warm))
                                                    for i in range(9)),
                        flush=True)
              return dest
          control=run('control')
          probe=run('probe')
          a=(control/'checkpoint-1.json').read_bytes()
          b=(probe/'checkpoint-1.json').read_bytes()
          assert a==b,'full JSON checkpoint mismatch'
          assert load(control/'checkpoint-1.json')==load(probe/'checkpoint-1.json')
          print('PR57_269_PARITY fullJson=EXACT decimalDiffs=0',
                'Advance2CallsPerArm=100 noSkippedSlices=True',
                'noOptimization=True',flush=True)
          PY
      - name: Preserve raw logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-stage-alloc-269
          path: artifacts/real-stage-alloc-269/**
          retention-days: 14
