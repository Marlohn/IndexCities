name: 'PR57 #366 REAL active-hour immediate physical writers'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-366-inject.py, .github/workflows/pr57-immediate-writers-366.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  bounded-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject reversible observer in checkout only
        run: python3 scripts/pr57-366-inject.py
      - name: Build and test canonical engine
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay individual Advance(2) calls in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/immediate366/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_366_IMMEDIATE_WRITERS="$flag" dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/immediate366/$mode" \
              > "artifacts/immediate366/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|366_(SITE|SUMMARY)) ' \
              "artifacts/immediate366/$mode/full.log" \
              > "artifacts/immediate366/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/immediate366/$mode/census.log")" -eq 6
            grep -q 'parity=IDENTICAL' "artifacts/immediate366/$mode/census.log"
          done
          ! grep -q '^PR57_366_' artifacts/immediate366/control/census.log
          test "$(grep -c '^PR57_366_SUMMARY ' artifacts/immediate366/probe/census.log)" -eq 1
          test "$(grep -c '^PR57_366_SITE ' artifacts/immediate366/probe/census.log)" -ge 1
          cmp artifacts/immediate366/control/checkpoint-10800.json \
              artifacts/immediate366/probe/checkpoint-10800.json
          sha256sum artifacts/immediate366/{control,probe}/checkpoint-10800.json \
            | tee artifacts/immediate366/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/immediate366/summary.txt
          from pathlib import Path
          root=Path("artifacts/immediate366")
          lines=(root/"probe"/"census.log").read_text().splitlines()
          sites=[s for s in lines if s.startswith("PR57_366_SITE ")]
          summaries=[s for s in lines if s.startswith("PR57_366_SUMMARY ")]
          assert len(summaries)==1 and len(sites)>0
          def parse(line):
              return dict(part.split("=",1) for part in line.split()[1:] if "=" in part)
          rows=[parse(s) for s in sites]
          total=sum(int(r["calls"]) for r in rows)
          changed=sum(int(r["changed"]) for r in rows)
          summary=parse(summaries[0])
          assert int(summary["comparisons"])>=total
          print("PR57_366_AUDIT",summary)
          print(f"PR57_366_AUDIT sites={len(sites)} calls={total} changed={changed} parity=IDENTICAL")
          for s in sites: print(s)
          PY
      - name: Upload raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-immediate-366
          path: artifacts/immediate366/
          if-no-files-found: warn
