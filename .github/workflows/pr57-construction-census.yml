name: PR57 construction visit census at Advance(2)
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-construction-census.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  construction-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and tests
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore real construction save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore real congestion save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real
      - name: Count real construction work in independent .NET processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/census
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          real="$(find artifacts/real -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works"; test -s "$real"
          for case in works real121; do
            source="$works"; window=3600
            if [[ "$case" == real121 ]]; then source="$real"; window=1800; fi
            echo "PR57_CENSUS_CASE case=$case class=REAL sourceSha256=$(sha256sum "$source" | cut -d' ' -f1) window=$window windows=4 cadence=Advance2"
            for mode in plain profiled; do
              command=scale
              if [[ "$mode" == profiled ]]; then command=profile; fi
              output="artifacts/census/$case-$mode"
              mkdir -p "$output"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_SAVE_CAPTURE_DIR="$PWD/$output" \
              PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
              PR57_IDLE_SCAN_PROBE=0 PR57_HOT_TIMING=0 \
                timeout 240s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                  "$command" cycle --seed=42 --warmup=0 --days=4 --window="$window" --cap=200 --resume="$source" \
                  | tee "$output.log"
            done
          done
      - name: Verify complete saves and census coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/census")
          for case,window in (("works",3600),("real121",1800)):
              logs={m:(root/f"{case}-{m}.log").read_text() for m in ("plain","profiled")}
              for mode,log in logs.items():
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode)
                  assert len([x for x in log.splitlines() if x.startswith("WINDOW ")])==4,(case,mode)
              for i in range(5):
                  a=(root/f"{case}-plain"/f"checkpoint-{i}.json").read_bytes()
                  b=(root/f"{case}-profiled"/f"checkpoint-{i}.json").read_bytes()
                  assert a==b,(case,i,"full checkpoint mismatch")
              assert "PR57_CONSTRUCTION_CENSUS" not in logs["plain"],case
              row=next((x for x in logs["profiled"].splitlines() if x.startswith("PR57_CONSTRUCTION_CENSUS ")),None)
              assert row,(case,"missing profile census")
              vals={k:int(v) for k,v in re.findall(r"([A-Za-z]+)=([0-9]+)",row)}
              assert vals["steps"]==2*window,(case,vals)
              assert vals["orderProjects"]>=0 and vals["progressProjects"]>=0,(case,vals)
              assert vals["shipmentVisits"]>=vals["shipmentQueries"] or vals["shipmentVisits"]==0,(case,vals)
              if case=="works":
                  assert vals["orderProjects"]>0 and vals["progressProjects"]>0 and vals["workAccess"]>0,(case,vals)
              rows=[x for x in logs["plain"].splitlines() if x.startswith("WINDOW ")]
              wall=sum(float(re.search(r"\bwall=([0-9.]+)s",x).group(1)) for x in rows)
              cpu=sum(float(re.search(r"\bcpu=([0-9.]+)s",x).group(1)) for x in rows)
              alloc=sum(float(re.search(r"\ballocMB=([0-9.]+)",x).group(1)) for x in rows)
              print(f"PR57_CENSUS_PLAIN case={case} simSeconds={4*window} wall={wall:.2f}s cpu={cpu:.2f}s allocMB={alloc:.1f} throughput={4*window/wall:.2f}sps")
              print(f"PR57_CENSUS_RESULT case={case} {row}")
              print(f"PR57_CENSUS_PARITY case={case} checkpoints=5")
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-construction-census
          path: artifacts/census/**
          retention-days: 14
