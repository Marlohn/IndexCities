name: 'PR57 #342 REAL canonical cause roundtrip journal'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-cause-roundtrip-342.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  cause-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
      PR57_342_CAUSE_ROUNDTRIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject checkout-only canonical setter observer
        run: python3 scripts/pr57-342-inject.py
      - name: Build authentic six-hour replay
        run: dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay 10800 individual Advance(2) calls and audit journal
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          mkdir -p artifacts/cause342
          dotnet run --no-build -c Release \
            --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
            -- "$input" artifacts/cause342 > artifacts/cause342/full.log
          grep -E 'PR57_342_(GLOBAL|READER|REASON)|PR57_337_(HOUR|FINAL)' \
            artifacts/cause342/full.log > artifacts/cause342/census.log
          test "$(grep -c '^PR57_337_HOUR ' artifacts/cause342/census.log)" -eq 6
          grep -q 'parity=IDENTICAL' artifacts/cause342/census.log
          test "$(grep -c '^PR57_342_READER ' artifacts/cause342/census.log)" -ge 4
          grep '^PR57_342_GLOBAL ' artifacts/cause342/census.log | tail -n 1
          grep '^PR57_342_READER ' artifacts/cause342/census.log | tail -n 4
          grep '^PR57_342_REASON ' artifacts/cause342/census.log | tail -n 3
          grep '^PR57_337_FINAL ' artifacts/cause342/census.log
      - name: Upload raw trace and canonical checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-cause-roundtrip-342
          path: artifacts/cause342/**
          if-no-files-found: warn
