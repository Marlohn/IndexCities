name: 'PR57 #454 per-slice CanTurnNow fanout observational'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-preference-fanout-454.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject strictly observational census into disposable checkout
        run: python3 scripts/pr57-454-inject.py
      - name: Build and full regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/real
      - name: Restore authentic construction and artificial GRID checkpoints
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/mixed
      - name: Canonical A and observational B, individual Advance(2), full save parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FANOUT' | tee artifacts/pr57-454-console.log
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          from decimal import Decimal
          root=Path('artifacts/fanout-454')
          root.mkdir(parents=True,exist_ok=True)
          real=Path('artifacts/real/real14hREAL-control/checkpoint-0.json')
          works=list(Path('artifacts/mixed').rglob('worksREAL-control1/checkpoint-0.json'))
          grid=list(Path('artifacts/mixed').rglob('gridARTIFICIAL-control1/checkpoint-5.json'))
          assert real.is_file() and len(works)==1 and len(grid)==1
          cases=[('economyREAL14h',real,'cycle',3600,3900,121,98),
                 ('worksREAL',works[0],'cycle',200,600,47,42),
                 ('gridARTIFICIAL',grid[0],'grid',100,300,1111,None)]
          results={}
          for name,source,fixture,horizon,cap,alive,vehicles in cases:
              original=source.read_bytes()
              state=json.loads(original,parse_float=Decimal)
              assert sum(bool(c['Alive']) for c in state['Citizens'])==alive
              if vehicles is not None: assert len(state['Vehicles'])==vehicles
              if name=='economyREAL14h':
                  assert hashlib.sha256(original).hexdigest()=='779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'
              if name=='worksREAL':
                  assert hashlib.sha256(original).hexdigest()=='b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'
              finals={};summaries={}
              for mode in ('A','B'):
                  dest=root/name/mode
                  dest.mkdir(parents=True,exist_ok=True)
                  env=os.environ.copy()
                  env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                             PR57_GRID_DIAG='0',PR57_270_MANOEUVRE_SCRATCH='0',
                             PR57_272_PENETRATION_MEMO='0',PR57_PENETRATION_STACK_AXES='0',
                             PR57_454_FANOUT='1' if mode=='B' else '0',
                             PR57_SAVE_CAPTURE_DIR=str(dest.resolve()))
                  cmd=['dotnet','run','--no-build','-c','Release',
                       '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                       '--','scale',fixture,'--seed=42','--warmup=0',
                       '--days=1',f'--window={horizon}',f'--cap={cap}',
                       f'--resume={source.resolve()}']
                  with (dest/'full.log').open('w') as out:
                      subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                     check=True,timeout=300)
                  log=(dest/'full.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log
                  assert (dest/'checkpoint-0.json').read_bytes()==original
                  finals[mode]=(dest/'checkpoint-1.json').read_bytes()
                  rows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
                  assert len(rows)==1,(name,mode,rows)
                  summaries[mode]={'window':rows[0]}
                  if mode=='B':
                      census=[x for x in log.splitlines() if x.startswith('PR57_454_SUM ')]
                      assert census,(name,'no census')
                      values={k:int(v) for k,v in re.findall(r'([A-Za-z][A-Za-z0-9]*)=([0-9]+)',census[-1])}
                      for prefix in ('zero','positive'):
                          assert values[prefix+'Calls']==values[prefix+'Unique']+values[prefix+'Repeats']
                          assert values[prefix+'Flips']<=values[prefix+'Repeats']
                          assert values[prefix+'Allowed']<=values[prefix+'Calls']
                      assert values['maxFanout']>=1 or values['positiveCalls']+values['zeroCalls']==0
                      if name=='economyREAL14h': assert values['positiveCalls']>0
                      summaries[mode]['census']=values
                      summaries[mode]['lastRawCensus']=census[-1]
              assert finals['A']==finals['B'],(name,'FULL_JSON_MISMATCH')
              results[name]={'callsAdvance2PerArm':horizon//2,'living':alive,
                             'vehicles':len(state['Vehicles']),
                             'inputSha256':hashlib.sha256(original).hexdigest(),
                             'finalSha256':hashlib.sha256(finals['A']).hexdigest(),
                             'fullJsonParity':True,'arms':summaries}
              print('PR57_454_PARITY',name,'Advance2PerArm',horizon//2,
                    'finalSha256',results[name]['finalSha256'],flush=True)
              print('PR57_454_CENSUS',name,json.dumps(summaries['B']['census'],sort_keys=True),flush=True)
          output={'experiment':454,'scope':'observational per-slice repeated CanTurnNow calls',
                  'baseline':'PR57 composed flags, stack axes off',
                  'allAdvance2':True,'cases':results,
                  'limitations':'Same candidate/result is not causal equivalence; all global writers still matter. GRID is artificial. No throughput claim.'}
          (root/'summary.json').write_text(json.dumps(output,indent=2,sort_keys=True))
          print('PR57_454_SUMMARY '+json.dumps(output,sort_keys=True),flush=True)
          PY_FANOUT
      - name: Preserve raw logs, full checkpoints and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-preference-fanout-454
          path: |
            artifacts/fanout-454
            artifacts/pr57-454-console.log
          retention-days: 14
          if-no-files-found: warn
