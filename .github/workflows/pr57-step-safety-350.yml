name: 'PR57 #350 REAL late-jam safety gates and call costs'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-step-safety-350.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational six-slice physical stage and safety probes
        run: |
          python3 scripts/pr57-346-inject.py
          python3 scripts/pr57-345-observe.py
          python3 scripts/pr57-348-inject.py
          python3 scripts/pr57-350-inject.py
      - name: Build authentic REAL replay and run simulation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay 10800 Advance(2) control and probe
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/safety350/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_206_RESIDUAL_EXCLUSIVE="$flag" \
            PR57_244_STATE_COST="$flag" \
            PR57_348_STAGE_EFFECTS="$flag" \
            PR57_350_STEP_SAFETY="$flag" \
            PR57_244_PERSISTENT_IDS="1071,1243,1282,1380" \
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/safety350/$mode" > "artifacts/safety350/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|206_RESIDUAL|244_STATE|348_(EFFECT|ACTOR)|350_SAFETY) ' \
              "artifacts/safety350/$mode/full.log" > "artifacts/safety350/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/safety350/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/safety350/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/safety350/$mode/census.log"
          done
          cmp artifacts/safety350/control/checkpoint-10800.json \
              artifacts/safety350/probe/checkpoint-10800.json
          python3 - <<'PY' | tee artifacts/safety350/summary.txt
          from pathlib import Path
          root=Path("artifacts/safety350")
          def parse(mode,prefix):
              return [
                  {k:v for k,v in (item.split("=",1) for item in line.split()[1:] if "=" in item)}
                  for line in (root/mode/"census.log").read_text().splitlines()
                  if line.startswith(prefix+" ")
              ]
          samples=parse("probe","PR57_206_RESIDUAL")
          effects=parse("probe","PR57_348_EFFECT")
          actors=parse("probe","PR57_348_ACTOR")
          safety=parse("probe","PR57_350_SAFETY")
          assert len(samples)==6 and len(effects)==30 and len(safety)==30, (
              len(samples),len(effects),len(safety))
          assert [int(s["eligibleSlice"]) for s in samples]==[40001,40002,40003,50001,50002,50003]
          assert len(actors)==186
          assert not parse("control","PR57_350_SAFETY")
          assert sum(int(e["actors"]) for e in effects)==588
          assert sum(int(s["gateVisits"]) for s in safety)>0
          assert sum(int(s["siteCalls"]) for s in safety)>0
          for group in sorted({s["group"] for s in safety}):
              rows=[s for s in safety if s["group"]==group]
              count={key:sum(int(s[key]) for s in rows) for key in
                     ("siteCalls","siteZeroInput","siteRestricted","crossCalls",
                      "crossZeroInput","crossRestricted","turnCalls","turnAccepted",
                      "gateVisits","preSiteZero","siteMadeZero","crossMadeZero",
                      "finalZero","leaderWithinGap","bendLeaders","siteStateDiff",
                      "crossStateDiff","siteInputPositive","crossInputPositive",
                      "blockerPresent","blockerNotStranded","blockerStranded","finalPositive")}
              assert count["siteCalls"]>=count["siteZeroInput"]
              assert count["crossCalls"]>=count["crossZeroInput"]
              assert count["gateVisits"]>=count["finalZero"]
              assert count["blockerPresent"]==count["blockerNotStranded"]+count["blockerStranded"]
              print("PR57_350_SUMMARY group="+group+" "+
                    " ".join(f"{k}={v}" for k,v in count.items())+" "+
                    " ".join(f"{k}={sum(float(s[k]) for s in rows):.6f}" for k in
                             ("siteMs","crossMs","turnMs"))+" "+
                    " ".join(f"{k}={sum(int(s[k]) for s in rows)}" for k in
                             ("siteBytes","crossBytes","turnBytes")))
          print("PR57_350_PARITY byteIdentical=TRUE sixSlices=TRUE actors=588 "+
                "scope=AUTHENTIC_REAL_ADVANCE2 noSkippedSlices=TRUE")
          PY
      - name: Upload raw logs, census, summary and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-step-safety-350
          path: artifacts/safety350/**
          if-no-files-found: warn
