name: 'PR57 #183 cross-phase worker presence and crew candidate census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-crossphase-presence-183.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  crossphase-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        run: |
          set -euo pipefail
          dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --verbosity quiet
      - name: Restore real works checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore real queue checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore artificial GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Run same-save cross-phase probe with full parity
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; done
          mkdir -p artifacts/presence-183
          for case in worksREAL queueREAL gridARTIFICIAL; do
            source="$works";steps=600
            if [[ "$case" == queueREAL ]]; then source="$queue";fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid";steps=150;fi
            output="$PWD/artifacts/presence-183/$case"
            mkdir -p "$output"
            echo "PR57_183_SOURCE case=$case sha256=$(sha256sum "$source" | cut -d' ' -f1) steps=$steps"
            PR57_181_SOURCE="$PWD/$source" PR57_181_CASE="$case" \
            PR57_181_STEPS="$steps" PR57_181_OUTPUT="$output" PR57_183_PROBE=1 \
            PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
            PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
            PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
            PR57_SAFE_SITE_BUFFER=1 \
              timeout 240s dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
              -c Release --no-build --filter FullyQualifiedName~Pr57MobilityInfrastructureWorksetTests \
              --logger 'console;verbosity=detailed' | tee "$output.log"
            grep -q "^PR57_183_PRESENCE_SUMMARY " "$output.log"
            test "$(grep -c '^PR57_183_PRESENCE_PHASE ' "$output.log")" -eq 13
            test "$(find "$output" -name 'checkpoint-*.json' | wc -l)" -eq 4
            test "$(grep -c 'parity=FULL_JSON' "$output.log")" -eq 3
          done
      - name: Preserve saves and probe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-crossphase-presence-183
          path: artifacts/presence-183/**
          retention-days: 14
