name: 'PR57 #191 GRID causal slice lower-bound probe (nullable fix)'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-causal-slice-191.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  causal-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-retained-heap-184
          run-id: 40451480020
          github-token: ${{ github.token }}
          path: artifacts/reference
      - name: Replay control and one bounded observational slice
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/reference -type f -path '*/gridARTIFICIAL/plain/checkpoint-0.json' -print -quit)"
          test -s "$source"
          mkdir -p artifacts/causal-191/control artifacts/causal-191/probe
          timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/causal-191/control" | tee artifacts/causal-191/control.log
          PR57_191_CAUSAL_SLICE=1 timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/causal-191/probe" | tee artifacts/causal-191/probe.log
      - name: Check complete JSON parity and sampled-slice coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/causal-191')
          for i in (0,50,100,150,200):
              assert (root/'control'/f'checkpoint-{i}.json').read_bytes()==(root/'probe'/f'checkpoint-{i}.json').read_bytes(),('FULL_JSON_DIFFERENCE',i)
          lines=(root/'probe.log').read_text().splitlines()
          rows=[dict(kv.split('=',1) for kv in s.split()[1:] if '=' in kv) for s in lines if s.startswith('PR57_191_CAUSAL_SLICE ')]
          assert len(rows)==1,('SAMPLE_COUNT',len(rows))
          row=rows[0]
          assert 3608<=float(row['time'])<=3644,row
          assert int(row['laneVisits'])>0,row
          assert int(row['uniqueHoldEdges'])<=int(row['holdCalls']),row
          assert int(row['changedHoldEdges'])<=int(row['uniqueHoldEdges']),row
          for mode in ('control','probe'):
              assert any(s.startswith('PR57_186_DONE ') and 'cadence=ADVANCE_2' in s for s in (root/f'{mode}.log').read_text().splitlines())
          print('PR57_191_VALIDATED checkpoints=5 parity=EXACT_FULL_JSON scope=OBSERVATIONAL_NOT_AB')
          print('PR57_191_SAMPLE',row)
          PY
      - name: Preserve logs and complete saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-causal-slice-191
          path: artifacts/causal-191/**
          retention-days: 14
