name: 'PR57 #218 bounded physical execution path census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-exec-path-218.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  exec-path:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic works checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore explicitly ARTIFICIAL GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Replay all Advance(2) with and without bounded observation
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; sha256sum "$source"; done
          mkdir -p artifacts/exec-path-218
          for case in worksREAL queueREAL gridARTIFICIAL; do
            source="$works"; fixture=cycle; horizon=300
            if [[ "$case" == queueREAL ]]; then source="$queue"; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; fixture=grid; horizon=100; fi
            for mode in plain probe; do
              output="$PWD/artifacts/exec-path-218/$case-$mode"
              mkdir -p "$output"
              command=scale; observed=0
              if [[ "$mode" == probe ]]; then command=profile; observed=1; fi
              echo "PR57_218_RUN case=$case mode=$mode horizon=$horizon cadence=ADVANCE_2"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_206_RESIDUAL_EXCLUSIVE="$observed" \
              PR57_218_EXEC_PATH="$observed" PR57_214_CANDIDATE_READS=0 \
              PR57_213_CROSS_SLICE_INPUTS=0 PR57_217_NEGATIVE_FILTERS=0 \
              PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" "$fixture" --seed=42 --warmup=0 --days=1 \
                --window="$horizon" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify exact full JSON and bounded path arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('artifacts/exec-path-218')
          def metric(line,key):
              m=re.search(r'(?:^| )'+re.escape(key)+r'=([-0-9.]+)',line)
              assert m,(key,line)
              return float(m.group(1))
          for case,horizon in [('worksREAL',300),('queueREAL',300),('gridARTIFICIAL',100)]:
              logs={m:(root/f'{case}-{m}.log').read_text() for m in ('plain','probe')}
              for mode,log in logs.items():
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,mode)
                  assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1,(case,mode)
                  for i in (0,1):
                      assert (root/f'{case}-{mode}'/f'checkpoint-{i}.json').is_file(),(case,mode,i)
              for i in (0,1):
                  assert (root/f'{case}-plain'/f'checkpoint-{i}.json').read_bytes()==(root/f'{case}-probe'/f'checkpoint-{i}.json').read_bytes(),(case,i,'full JSON mismatch')
              assert 'PR57_218_EXEC ' not in logs['plain']
              rows=[x for x in logs['probe'].splitlines() if x.startswith('PR57_218_EXEC ')]
              residual=[x for x in logs['probe'].splitlines() if x.startswith('PR57_206_RESIDUAL ')]
              assert len(rows)==len(residual)==3,(case,'expected 3 consecutive slices',len(rows),len(residual))
              for i,row in enumerate(rows,1):
                  g=lambda key:metric(row,key)
                  assert int(g('sample'))==i and int(g('eligibleSlice'))==36+i,(case,row)
                  assert g('visits')==metric(residual[i-1],'vehicles')>0,(case,row)
                  assert 0<=g('fullPathNoMove')<=g('fullPath')<=g('visits'),(case,row)
                  assert 0<=g('moved')<=g('visits'),(case,row)
                  assert 0<=g('ownProjectionChanged')<=g('visits'),(case,row)
                  assert g('sameSincePreviousEnd')+g('boundaryChanged')==g('compared'),(case,row)
                  for key in ('sameBefore','sameStagePath','sameStagePathAndBefore','sameStagePathBeforeAfter','fullPathSameBefore'):
                      assert 0<=g(key)<=g('compared'),(case,key,row)
                  assert g('sameStagePathAndBefore')<=min(g('sameBefore'),g('sameStagePath')),(case,row)
                  assert g('sameStagePathBeforeAfter')<=g('sameStagePathAndBefore'),(case,row)
                  assert g('fullPathSameBefore')<=g('sameStagePathAndBefore'),(case,row)
                  assert 0<=g('fullMs')<=g('totalMs')+0.001,(case,row)
                  assert 0<=g('repeatedMs')<=g('totalMs')+0.001,(case,row)
                  if i==1: assert g('compared')==0,(case,row)
                  print('PR57_218_VERIFIED',case,row)
              print('PR57_218_PARITY',case,'checkpoints',2,'processes',2,'horizon',horizon,'cadence','ADVANCE_2','fullJSON','EXACT')
          PY
      - name: Preserve checkpoints and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-exec-path-218
          path: artifacts/exec-path-218/**
          retention-days: 14
