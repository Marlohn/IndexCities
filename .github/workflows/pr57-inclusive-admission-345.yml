name: 'PR57 #345 REAL inclusive admission versus all phases'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-inclusive-admission-345.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  inclusive-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational phase printouts in existing harness only
        run: python3 scripts/pr57-345-observe.py
      - name: Build authentic REAL replay and run simulation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh .NET control and timing probe with each Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/admission345/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_HOT_TIMING="$flag" dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/admission345/$mode" > "artifacts/admission345/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|HOT_TIMING) ' \
              "artifacts/admission345/$mode/full.log" > "artifacts/admission345/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/admission345/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/admission345/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/admission345/$mode/census.log"
          done
          cmp artifacts/admission345/control/checkpoint-10800.json \
              artifacts/admission345/probe/checkpoint-10800.json
          python3 - <<'PY' | tee artifacts/admission345/summary.txt
          from pathlib import Path
          root=Path("artifacts/admission345")
          def parse(prefix,mode):
              lines=(root/mode/"census.log").read_text().splitlines()
              return [{p.split("=",1)[0]:p.split("=",1)[1] for p in line.split()[1:] if "=" in p}
                      for line in lines if line.startswith(prefix+" ")]
          control=parse("PR57_345_PHASE","control")
          probe=parse("PR57_345_PHASE","probe")
          hot=parse("PR57_HOT_TIMING","probe")
          assert len(control)==len(probe)==78 and len(hot)>100
          assert not parse("PR57_HOT_TIMING","control")
          assert len({(r["hour"],r["phase"]) for r in probe})==78
          h={int(r["slices"]):r for r in hot}
          # #155 counts extra zero-dt operations; these are 300-slice sampled
          # boundaries, not exact wall-clock boundaries.
          lo=max(s for s in h if s<=37800)
          hi=max(s for s in h if s<=75600)
          assert lo>=37500 and hi>=75300 and hi>lo,(lo,hi)
          names=["siteMs","crossingMs","turnMs","junctionMs","ownerMs","areaMs",
                 "bendHolderMs","bendPriorityMs","preferenceMs","turnWayMs","bodyOnWayMs"]
          delta={k:float(h[hi][k])-float(h[lo][k]) for k in names}
          calls=int(h[hi]["junctionCalls"])-int(h[lo]["junctionCalls"])
          wall=sum(float(r["wallMs"]) for r in parse("PR57_337_HOUR","probe") if int(r["hour"])>=4)
          assert wall>0 and 0<=delta["junctionMs"]<wall,(wall,delta["junctionMs"])
          frac=delta["junctionMs"]/wall
          print(f"PR57_345_WINDOW slices={lo}:{hi} wallHour4to6Ms={wall:.3f} "
                f"junctionCalls={calls} junctionInclusiveMs={delta['junctionMs']:.3f} "
                f"junctionSharePct={100*frac:.4f} hypotheticalFreeJunctionCeilingX={1/(1-frac):.5f} "
                "scope=INTRUSIVE_ALL_ADMISSIONS_INCLUDING_HOOKS_NOT_NEGATIVES_ONLY")
          for k in names:
              print(f"PR57_345_SUBPHASE name={k} ms={delta[k]:.3f} "
                    "scope=NESTED_SUBPHASES_NOT_ADDITIVE")
          for phase in sorted({r["phase"] for r in probe}):
              a=sum(float(r["ms"]) for r in control if r["phase"]==phase and int(r["hour"])>=4)
              b=sum(float(r["ms"]) for r in probe if r["phase"]==phase and int(r["hour"])>=4)
              print(f"PR57_345_PHASE_WINDOW name={phase} controlMs={a:.3f} probeMs={b:.3f} "
                    "scope=PHASE_TICKS_OBSERVATIONAL_NOT_OPTIMIZATION_AB")
          print("PR57_345_CHECKPOINTS_IDENTICAL no_skipped_slices=TRUE")
          PY
      - name: Upload logs, summary and canonical checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-inclusive-admission-345
          path: artifacts/admission345/**
          if-no-files-found: warn
