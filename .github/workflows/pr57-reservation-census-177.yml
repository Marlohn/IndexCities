name: 'PR57 #177 authentic reservation read versus mutation census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-reservation-census-177.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-reservation-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --verbosity quiet
      - name: Restore authentic economy-with-works save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Observe full integrated Step(2) and compare complete saves
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          test -s "$source"
          echo "PR57_177_SOURCE sha256=$(sha256sum "$source" | cut -d' ' -f1)"
          mkdir -p artifacts/reservation-census-177
          PR57_RESERVE_REAL_SAVE="$PWD/$source" \
          PR57_RESERVE_OUTPUT_DIR="$PWD/artifacts/reservation-census-177" \
          PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
          PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
          PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
          PR57_SAFE_SITE_BUFFER=1 \
            dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj \
              -c Release --no-build --filter FullyQualifiedName~Pr57ReservationRealWorksetTests \
              --logger 'console;verbosity=detailed' | tee artifacts/reservation-census-177/test.log
          grep -q 'PR57_177_RESULT' artifacts/reservation-census-177/test.log
          test "$(find artifacts/reservation-census-177 -name 'checkpoint-*.json' | wc -l)" -eq 4
      - name: Preserve complete checkpoints and actual read census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-reservation-census-177
          path: artifacts/reservation-census-177/**
          retention-days: 14
