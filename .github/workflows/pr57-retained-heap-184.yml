name: 'PR57 #184 retained heap and GC across authentic history horizons'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-retained-heap-184.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  retained-heap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build isolated observer and run regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RetentionBench/Pr57RetentionBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic 12h and 72h economic saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/growth
      - name: Restore authentic congested save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore artificial GRID stress save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Measure authentic horizons with plain and retained processes
        shell: bash
        run: |
          set -euo pipefail
          real12="$(find artifacts/growth -type f -path '*/growth/checkpoint-1.json' -print -quit)"
          real72="$(find artifacts/growth -type f -path '*/growth/checkpoint-6.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for file in "$real12" "$real72" "$queue" "$grid"; do test -s "$file"; done
          mkdir -p artifacts/retention-184
          for case in real12h real72h queueREAL gridARTIFICIAL; do
            source="$real12"; steps=1200
            if [[ "$case" == real72h ]]; then source="$real72"; fi
            if [[ "$case" == queueREAL ]]; then source="$queue"; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; steps=200; fi
            echo "PR57_184_SOURCE case=$case sha256=$(sha256sum "$source" | cut -d' ' -f1) steps=$steps"
            for mode in plain retained; do
              out="$PWD/artifacts/retention-184/$case/$mode"
              mkdir -p "$out"
              timeout 240s dotnet run --project scripts/Pr57RetentionBench/Pr57RetentionBench.csproj \
                -c Release --no-build -- "$source" "$case" "$mode" "$steps" "$out" \
                | tee "artifacts/retention-184/$case-$mode.log"
            done
          done
      - name: Verify full checkpoints and chronology across independent processes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("artifacts/retention-184")
          for case,steps in (("real12h",1200),("real72h",1200),("queueREAL",1200),("gridARTIFICIAL",200)):
              plain=root/case/"plain"
              retained=root/case/"retained"
              histories=[]
              for i in range(5):
                  a=(plain/f"checkpoint-{i}.json").read_bytes()
                  b=(retained/f"checkpoint-{i}.json").read_bytes()
                  assert a==b,(case,i,"full-state parity")
                  state=json.loads(a)
                  histories.append(sum(len(c["History"]) for c in state["Citizens"]))
              assert histories==sorted(histories),(case,histories)
              for mode in ("plain","retained"):
                  lines=(root/f"{case}-{mode}.log").read_text().splitlines()
                  assert sum(x.startswith("PR57_184_SAMPLE ") for x in lines)==5,(case,mode)
                  assert sum(x.startswith("PR57_184_WINDOW ") for x in lines)==4,(case,mode)
                  assert any(x.startswith("PR57_184_DONE ") and "cadence=ADVANCE_2" in x for x in lines),(case,mode)
              print(f"PR57_184_VALIDATED case={case} steps={steps} checkpoints=5 parity=FULL_JSON history=NONDECREASING")
          PY
      - name: Retain full checkpoints and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-retained-heap-184
          path: artifacts/retention-184/**
          retention-days: 14
