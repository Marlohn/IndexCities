name: 'PR57 #598 event-time satisfaction materialization REAL ABBA'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-lazy-satisfaction-598.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  lazy-satisfaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run canonical and experimental modes
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          PR57_598_DEFER_SATISFACTION=0 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          PR57_598_DEFER_SATISFACTION=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL saves and artificial control
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Short lazy-satisfaction shadow in both REAL saves and artificial control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lazy-satisfaction-598
          for case in worksREAL queueREAL gridARTIFICIAL; do
            input="artifacts/input/$case-control/checkpoint-0.json"
            test -s "$input"
            window=1200
            if [[ "$case" == gridARTIFICIAL ]]; then window=200; fi
            output="$PWD/artifacts/lazy-satisfaction-598/$case-shadow"
            mkdir -p "$output"
            PR57_598_DEFER_SATISFACTION=1 PR57_598_SHADOW=1 PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=0 PR57_SAVE_CAPTURE_DIR="$output" \
              timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
              scale cycle --seed=42 --warmup=0 --days=1 --window="$window" --cap=220 --resume="$input" \
              > "$output.log" 2>&1
          done
      - name: Gate full benchmark on real activation, not a synthetic unit test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for case in ('worksREAL','queueREAL'):
              log=Path(f'artifacts/lazy-satisfaction-598/{case}-shadow.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,'invariants/save')
              certs=[int(v) for v in re.findall(r'PR57_598_LAZY [^\n]*overwritten=(\d+)',log)]
              print('PR57_598_SHADOW',case,'overwritten',max(certs,default=0),flush=True)
              assert certs and max(certs)>0,(case,'NO_REAL_LAZY_SKIP')
          PY
      - name: ABBA fresh .NET processes and exact checkpoints
        shell: bash
        run: |
          set -euo pipefail
          for case in worksREAL queueREAL gridARTIFICIAL; do
            input="artifacts/input/$case-control/checkpoint-0.json"
            days=3
            window=1200
            if [[ "$case" == gridARTIFICIAL ]]; then days=2; window=100; fi
            for arm in A1 B1 B2 A2; do
              enabled=0
              if [[ "$arm" == B* ]]; then enabled=1; fi
              output="$PWD/artifacts/lazy-satisfaction-598/$case-$arm"
              mkdir -p "$output"
              PR57_598_DEFER_SATISFACTION="$enabled" PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=0 PR57_SAVE_CAPTURE_DIR="$output" \
                timeout 240s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                scale cycle --seed=42 --warmup=0 --days="$days" --window="$window" --cap=220 --resume="$input" \
                > "$output.log" 2>&1
            done
          done
      - name: Check byte-exact intermediate state, measured wall CPU allocation and real contact fusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('artifacts/lazy-satisfaction-598')
          for case in ('worksREAL','queueREAL','gridARTIFICIAL'):
              arms={}
              days=2 if case=='gridARTIFICIAL' else 3
              for arm in ('A1','B1','B2','A2'):
                  log=(root/f'{case}-{arm}.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,arm,'invariants/save')
                  windows=[w for w in log.splitlines() if w.startswith('WINDOW ')]
                  assert len(windows)==days,(case,arm,'windows',len(windows))
                  def metric(key):
                      return sum(float(re.search(r'\b'+key+r'=([0-9.]+)',w).group(1)) for w in windows)
                  arms[arm]={k:metric(k) for k in ('wall','cpu','allocMB')}
                  if arm.startswith('B'):
                      hits=[int(x) for x in re.findall(r'PR57_598_LAZY [^\n]*overwritten=(\d+)',log)]
                      arms[arm]['overwritten']=max(hits,default=0)
                      assert arms[arm]['overwritten']>0,(case,arm,'NO_LAZY_SKIP')
                  for i in range(days+1):
                      p=root/f'{case}-{arm}'/f'checkpoint-{i}.json'
                      data=p.read_bytes()
                      json.loads(data)
                      assert data==(root/f'{case}-A1'/f'checkpoint-{i}.json').read_bytes(),(case,arm,i,'CAUSAL_DIVERGENCE')
                  print('PR57_598_ARM',case,arm,arms[arm],flush=True)
              for a,b in (('A1','B1'),('A2','B2')):
                  print('PR57_598_PAIR',case,a,b,'speedup',round(arms[a]['wall']/arms[b]['wall'],5),flush=True)
              print('PR57_598_PARITY',case,'checkpoints',4*(days+1),flush=True)
          PY
      - name: Preserve checkpoints and process logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-lazy-satisfaction-598
          path: artifacts/lazy-satisfaction-598/**
          retention-days: 14
