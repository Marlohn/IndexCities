name: Causal Engine - integrated reality check

on:
  push:
    branches:
      - experimento/motor-causal-10k-80y-autonomo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Release
        run: dotnet build experiments/IndexCities.CausalEngine/IndexCities.CausalEngine.csproj -c Release
      - name: Validate determinism, trips, ledger, births and physical history
        run: dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --self-test | tee self-test.json
      - name: Validate two independent annual workload cycles without pretending continuity
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --sims=256 --annual-load-cycles=2 --adversarial | tee annual-workload-smoke.json
          python3 - <<'PY'
          import json
          d=json.load(open('annual-workload-smoke.json'))
          assert d['status']=='TECHNICAL_REPEAT_LOAD_ONLY_NOT_CONTINUOUS_CITY'
          assert d['independentAnnualCycles']==2 and d['representedGregorianDays']==731
          assert d['minLivingAgentsAcrossIndependentCycles']>=256
          assert d['totalIndividualJourneys']>0 and d['totalRealFoodSalesUnitsAcrossCycles']>0
          assert d['allCycleMoneyAndFoodConserved'] and not d['historyPersistent']
          PY
      - name: Run city with 1k concurrent citizens 30 days and real fact file
        run: dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --sims=1000 --days=30 --seed=42 --history=artifacts/causal-1000-30d.facts --adversarial | tee city-1000-30d.json
      - name: Inspect individual recorded lifetime events
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- inspect artifacts/causal-1000-30d.facts 0 0 30 3 2>&1 | tee inspected-sim0.log
          grep -q 'HISTORY_QUERY sim=0 found=' inspected-sim0.log
      - name: Reject false positives
        run: |
          grep -q '"moneyConserved": true' city-1000-30d.json
          grep -q '"simulatedDays": 30' city-1000-30d.json
          grep -q '"historyPersistent": true' city-1000-30d.json
          grep -q '"deterministic": true' self-test.json
          test -s artifacts/causal-1000-30d.facts
      - name: Keep reports, never upload huge simulation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-smoke
          path: |
            self-test.json
            city-1000-30d.json
          if-no-files-found: ignore

  scale-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute 10,000 individual agents for 30 days, with persisted histories
        run: |
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=30 --seed=42 --history=artifacts/causal-10000-30d.facts --adversarial | tee city-10000-30d.json
          grep -q '"moneyConserved": true' city-10000-30d.json
          grep -q '"simulatedDays": 30' city-10000-30d.json
          grep -q '"historyPersistent": true' city-10000-30d.json
          test -s artifacts/causal-10000-30d.facts
      - name: Keep metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-metrics
          path: city-10000-30d.json
          if-no-files-found: ignore

  year-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 10k active lives for one actual Gregorian year, with compressed factual history
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=366 --seed=42 --history=artifacts/causal-10000-366d.facts.gz --adversarial | tee year-10000.json
          grep -q '"moneyConserved": true' year-10000.json
          grep -q '"foodConserved": true' year-10000.json
          grep -q '"simulatedDays": 366' year-10000.json
          grep -q '"historyPersistent": true' year-10000.json
          test -s artifacts/causal-10000-366d.facts.gz
          gzip -t artifacts/causal-10000-366d.facts.gz
      - name: Preserve 10k/one-year metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-366days
          path: year-10000.json
          if-no-files-found: ignore

  decade-10k:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ten real Gregorian years with 10k persons, physical travel and compressed factual history
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=3653 --seed=42 --history=artifacts/causal-10k-10y.ich2.gz --adversarial | tee decade-10000.json
          python3 - <<'PY'
          import json
          r=json.load(open('decade-10000.json'))
          assert r['moneyConserved'] and r['foodConserved'] and r['simulatedDays']==3653
          assert r['births']>0 and r['journeys']>0 and r['cargoDeliveries']>0
          print('DECADE',r['aliveEnd'],r['minimumAliveAtDayBoundary'],r['unmetMeals'],r['wallSeconds'])
          PY
          test -s artifacts/causal-10k-10y.ich2.gz
          gzip -t artifacts/causal-10k-10y.ich2.gz
          du -h artifacts/causal-10k-10y.ich2.gz
      - name: Preserve 10-year report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-decade-metrics
          path: decade-10000.json
          if-no-files-found: ignore

  eighty-years-10k:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute 2020-2100 without skipping days, with factual history on disk
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=29220 --seed=42 --history=artifacts/causal-10k-80y.ich2.gz --adversarial | tee 80years-10000.json
          python3 - <<'PY'
          import json
          r=json.load(open('80years-10000.json'))
          assert r['simulatedDays']==29220 and r['gregorianEnd']=='2100-01-01'
          assert r['moneyConserved'] and r['foodConserved'] and r['historyPersistent']
          assert r['births']>0 and r['deaths']>0
          assert r['journeys']>0 and r['cargoDeliveries']>0
          assert r['minimumAliveAtDayBoundary']>=10000, 'Does not sustain 10k living citizens'
          print('EIGHTY_YEARS_PARTIAL_FIXTURE',r['wallSeconds'],r['aliveEnd'])
          PY
          test -s artifacts/causal-10k-80y.ich2.gz
          gzip -t artifacts/causal-10k-80y.ich2.gz
          du -h artifacts/causal-10k-80y.ich2.gz
      - name: Preserve 80-year result (not a SPEC-complete acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-80y-fixture-metrics
          path: 80years-10000.json
          if-no-files-found: ignore

  eighty-years-population-diagnostic:
    # A separate, explicitly requested causal/demographic probe. It does NOT
    # persist facts; the long-history workload remains a separate acceptance
    # problem and this job can never prove the complete IndexCities SPEC.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[80y-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run 80 Gregorian years with corrected household purchasing
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=29220 --seed=42 --adversarial 2>&1 | tee eighty-years-population.log
          python3 - <<'PY'
          import json
          lines=open("eighty-years-population.log").readlines()
          report_start=next(i for i,line in enumerate(lines) if line.startswith('{'))
          result=json.loads(''.join(lines[report_start:]))
          assert result['simulatedDays'] == 29220 and result['gregorianEnd'] == '2100-01-01'
          assert result['foodConserved'] and result['moneyConserved']
          print('EIGHTY_YEAR_POPULATION_DIAGNOSTIC', result['aliveEnd'],
                result['minimumAliveAtDayBoundary'], result['unmetMeals'],
                result['wallSeconds'])
          assert result['minimumAliveAtDayBoundary'] >= 10000, 'Living population fell below 10,000'
          PY
      - name: Keep diagnostic results even if the population collapses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-80y-population-no-history
          path: eighty-years-population.log
          if-no-files-found: ignore

  vacancy-market-1y:
    # Only expand to ten/eighty years after workers can actually serve a city.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-1y]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Measure one year of real-demand-funded farm/store vacancies
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=366 --seed=42 --adversarial --vacancy-market --cohort-renewal 2>&1 | tee vacancy-market-1y.log
          python3 - <<'PY'
          import json
          lines=open('vacancy-market-1y.log').readlines()
          i=next(i for i,line in enumerate(lines) if line.startswith('{'))
          d=json.loads(''.join(lines[i:]))
          assert d['simulatedDays']==366 and d['vacancyMarketFixture']
          assert d['foodConserved'] and d['moneyConserved']
          assert d['salesFoodUnits']>0 and d['paidWagesCents']>0
          print('MARKET_YEAR_1',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['deniedPurchases'],d['employedAlive'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Real vacancy fixture did not sustain 10k even 1 year'
          PY
      - name: Preserve poor outcomes for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-real-vacancy-one-year
          path: vacancy-market-1y.log
          if-no-files-found: ignore

  integrated-second-cycle-10y:
    # Both independently passed one-year POCs connected in the same market.
    # Ten-year result is required to expose macroeconomic viability, not just
    # confirm valid individual deliveries and construction work.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[second-cycle-10y]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Challenge 10k Sims for ten years with paid freight and housebuilding
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=3653 --seed=42 --adversarial --vacancy-market --cohort-renewal --construction-pilot --freight-labor 2>&1 | tee economic-second-cycle-10y.log
          python3 - <<'PY'
          import json
          rows=open('economic-second-cycle-10y.log').readlines()
          idx=next(i for i,v in enumerate(rows) if v.startswith('{'))
          d=json.loads(''.join(rows[idx:]))
          assert d['simulatedDays']==3653 and d['freightLaborFixture'] and d['constructionPilotFixture']
          assert d['moneyConserved'] and d['foodConserved'] and d['materialConserved']
          assert d['realWorkerFreightTrips']>0 and d['constructionPaidShifts']>0
          assert d['constructionContractsCompleted']>0
          assert d['businessInitialCashCents']+d['businessOperatingNetCents']==d['businessCurrentCashCents']
          print('SECOND_CYCLE_10Y',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['constructionContractsCompleted'],
                d['realWorkerFreightTrips'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Real construction and freight did not prevent collapse'
          PY
      - name: Keep complete decade metrics even when the population fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-2nd-economy-10y
          path: economic-second-cycle-10y.log
          if-no-files-found: ignore

  real-municipal-shift-coverage:
    # Prevent one-day-per-week resting public workers from being counted as
    # 30/30 attending workers. Staff monthly contracts under real treasury cash.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[attendance-municipal]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare fair collection with and without paid shift coverage
        run: |
          set -o pipefail
          dotnet build experiments/IndexCities.CausalEngine -c Release
          BASE='--sims=10000 --days=3653 --adversarial --vacancy-market --cohort-renewal --freight-labor --construction-pilot --capacity-priced-food --attendance-aware-farms --cross-farm-freight --farm-cost-pricing --basket-retail-service --retail-shop-fallback --retail-baskets-per-shift=20 --fair-household-hiring --municipal-sanitation-pilot --municipal-waste-treatment-pilot --fair-sanitation-dispatch'
          dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- $BASE --seed=42 --municipal-collection-interval=4 2>&1 | tee naive-coverage-4-42.log
          for n in 4 3; do
            for seed in 42 73; do
              dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- $BASE --seed=$seed --municipal-collection-interval=$n --attendance-aware-municipal-shifts 2>&1 | tee real-coverage-$n-$seed.log
            done
          done
          python3 - <<'PY'
          import json
          def read(path):
              lines=open(path).readlines()
              idx=next(i for i,s in enumerate(lines) if s.startswith('{'))
              return json.loads(''.join(lines[idx:]))
          control=read('naive-coverage-4-42.log')
          assert not control['attendanceAwareMunicipalShiftsFixture']
          passing=[]
          for n in [4,3]:
              both=True
              for seed in [42,73]:
                  r=read(f'real-coverage-{n}-{seed}.log')
                  assert r['simulatedDays']==3653 and r['moneyConserved'] and r['foodConserved'] and r['materialConserved']
                  assert r['attendanceAwareMunicipalShiftsFixture'] and r['fairSanitationDispatchFixture']
                  assert r['municipalWasteTreatmentPilotFixture'] and r['wasteTreatedAtDepot']>0
                  both &= r['minimumAliveAtAnyEvent']>=10000
                  print('REAL_MUNICIPAL_COVERAGE',n,seed,
                    'alive',r['aliveEnd'],'min',r['minimumAliveAtAnyEvent'],
                    'unservedHomes15d',r['homesWithoutPickupFor15Days'],
                    'dirtyHomes',r['homesPastSanitationHygieneThreshold'],
                    'wasteTreated',r['wasteTreatedAtDepot'],
                    'municipalJobs',r['municipalSanitationJobs']+r['municipalWasteTreatmentJobs'],
                    'paidCityWages',r['municipalSanitationWagesPaidCents'],
                    'tax',r['municipalTaxCollectedCents'])
              if both: passing.append(n)
          open('coverage-80y-rate.txt','w').write(str(passing[0]) if passing else 'none')
          PY
          RATE="$(cat coverage-80y-rate.txt)"
          if test "$RATE" != none; then
            echo '10k never fell during a decade in two seeds: run full history for 80y.'
            dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=29220 --seed=42 --adversarial --vacancy-market --cohort-renewal --freight-labor --construction-pilot --capacity-priced-food --attendance-aware-farms --cross-farm-freight --farm-cost-pricing --basket-retail-service --retail-shop-fallback --retail-baskets-per-shift=20 --fair-household-hiring --municipal-sanitation-pilot --municipal-waste-treatment-pilot --fair-sanitation-dispatch --attendance-aware-municipal-shifts --municipal-collection-interval=$RATE --history=full-real-municipal-80y.facts.gz 2>&1 | tee full-real-municipal-80y.log
          else
            echo 'Decadal demographic sustainability failed, no 80-year assertion.'
          fi
      - name: Keep proofs and failed scenarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-municipal-worker-attendance-80y
          path: |
            naive-coverage-4-42.log
            real-coverage-*.log
            full-real-municipal-80y.log
            full-real-municipal-80y.facts.gz
          if-no-files-found: ignore

  residential-real-property-revenue-80y:
    # The same real residents own the same existing houses. Only the
    # actual monthly property tax amount changes (0/50/150/300 cents).
    # Assessed-but-unpaid obligations never count as income. All other
    # workers, taxpayers, food, firms and service jobs are held fixed.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[residential-tax-multi-seed]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run two 10-year worlds per actual-home tax and continue qualifying cases to 80 years
        run: |
          set -o pipefail
          dotnet build experiments/IndexCities.CausalEngine -c Release
          BASE='--sims=10000 --adversarial --vacancy-market --cohort-renewal --freight-labor --construction-pilot --capacity-priced-food --attendance-aware-farms --cross-farm-freight --farm-cost-pricing --basket-retail-service --retail-shop-fallback --retail-baskets-per-shift=20 --fair-household-hiring --municipal-sanitation-pilot --municipal-waste-treatment-pilot --fair-sanitation-dispatch --attendance-aware-municipal-shifts --municipal-collection-interval=3 --tax-inclusive-product-price --tax-cost-recovery-percent=25'
          for tax in 0 50 150 300; do
            for seed in 42 73; do
              dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- $BASE --days=3653 --seed=$seed --monthly-residential-tax-cents=$tax 2>&1 | tee residential-tax-$tax-seed$seed-10y.log
            done
          done
          python3 - <<'PY'
          import json
          rows={}
          for tax in (0,50,150,300):
              for seed in (42,73):
                  raw=open(f'residential-tax-{tax}-seed{seed}-10y.log').readlines()
                  k=next(i for i,s in enumerate(raw) if s.startswith('{'))
                  r=json.loads(''.join(raw[k:]))
                  assert r['simulatedDays']==3653 and r['moneyConserved'] and r['foodConserved'] and r['materialConserved']
                  assert r['monthlyResidentialPropertyTaxCents']==tax
                  assert r['residentialTaxAssessedCents']==r['residentialPropertyTaxActuallyPaidCents']+r['residentialPropertyTaxDebtOutstandingCents']
                  assert not r['fullIndexCitiesTargetValidated']
                  if tax: assert r['residentialPropertyTaxActuallyPaidCents']>0 and r['privateOwnedResidenceCount']>0
                  print('REAL_HOME_TAX_10Y',tax,seed,'alive',r['aliveEnd'],
                        'min',r['minimumAliveAtAnyEvent'],
                        'homeTaxesActuallyPaid',r['residentialPropertyTaxActuallyPaidCents'],
                        'homeTaxDebtUnpaid',r['residentialPropertyTaxDebtOutstandingCents'],
                        'cityCash',r['treasuryCashCents'],
                        'householdMoney',r['personalCashCents'],
                        'firmMoney',r['businessCurrentCashCents'],
                        'unmetMeals',r['unmetMeals'],flush=True)
                  rows[tax,seed]=r
          valid=[tax for tax in (0,50,150,300)
                 if all(rows[tax,seed]['minimumAliveAtAnyEvent']>=10000 for seed in (42,73))]
          open('residential-qualified.txt','w').write(' '.join(map(str,valid)))
          PY
          for tax in $(cat residential-qualified.txt); do
            echo "EIGHTY_YEAR_RESIDENTIAL_TRIAL tax=$tax, 10000 minimum required for all 29,220 days."
            dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- $BASE --days=29220 --seed=42 --monthly-residential-tax-cents=$tax 2>&1 | tee residential-tax-$tax-80y-no-history.log
          done
          python3 - <<'PY'
          import glob,json
          for file in sorted(glob.glob('residential-tax-*-80y-no-history.log')):
              raw=open(file).readlines()
              k=next(i for i,s in enumerate(raw) if s.startswith('{'))
              r=json.loads(''.join(raw[k:]))
              assert r['simulatedDays']==29220 and r['moneyConserved'] and r['foodConserved'] and r['materialConserved']
              assert not r['fullIndexCitiesTargetValidated']
              print('REAL_HOME_TAX_80Y',r['monthlyResidentialPropertyTaxCents'],
                    'alive',r['aliveEnd'],'min',r['minimumAliveAtAnyEvent'],
                    'paid',r['residentialPropertyTaxActuallyPaidCents'],
                    'unpaidDebt',r['residentialPropertyTaxDebtOutstandingCents'],
                    'municipalCash',r['treasuryCashCents'],
                    'companyCash',r['businessCurrentCashCents'],
                    'householdCash',r['personalCashCents'],
                    'wallSeconds',r['wallSeconds'],flush=True)
          PY
      - name: Keep raw comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: municipal-residential-property-tax-two-seed-eighty-year
          path: |
            residential-tax-*.log
          if-no-files-found: ignore

  tax-cost-incidence-sensitivity:
    # Every firm pays exactly the SAME real municipal property tax. Only
    # its ability to recover 25/50/75% of those costs via genuine retail
    # purchases/wholesale price changes differs; no fictitious income.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[tax-incidence-sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Falsify company and family solvency under three real cost splits
        run: |
          set -o pipefail
          dotnet build experiments/IndexCities.CausalEngine -c Release
          BASE='--sims=10000 --days=3653 --adversarial --vacancy-market --cohort-renewal --freight-labor --construction-pilot --capacity-priced-food --attendance-aware-farms --cross-farm-freight --farm-cost-pricing --basket-retail-service --retail-shop-fallback --retail-baskets-per-shift=20 --fair-household-hiring --municipal-sanitation-pilot --municipal-waste-treatment-pilot --fair-sanitation-dispatch --attendance-aware-municipal-shifts --municipal-collection-interval=3 --tax-inclusive-product-price'
          for percent in 25 50 75; do
            for seed in 42 73; do
              dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- $BASE --seed=$seed --tax-cost-recovery-percent=$percent 2>&1 | tee tax-incidence-$percent-$seed-10y.log
            done
          done
          python3 - <<'PY'
          import json
          runs={}
          for percent in (25,50,75):
              for seed in (42,73):
                  raw=open(f'tax-incidence-{percent}-{seed}-10y.log').readlines()
                  i=next(i for i,line in enumerate(raw) if line.startswith('{'))
                  r=json.loads(''.join(raw[i:]))
                  assert r['simulatedDays']==3653 and r['taxCostRecoveryPercent']==percent
                  assert r['moneyConserved'] and r['foodConserved'] and r['materialConserved']
                  assert not r['fullIndexCitiesTargetValidated']
                  print('TAX_INCIDENCE_RESULT',
                        'costRecovery',percent,'seed',seed,
                        'endAlive',r['aliveEnd'],'minAlive',r['minimumAliveAtAnyEvent'],
                        'familyMoney',r['personalCashCents'],'firmCash',r['businessCurrentCashCents'],
                        'unmetMeals',r['unmetMeals'],'price',r['averageRetailUnitPriceCents'])
                  runs[(percent,seed)] = r
          passing=[p for p in (25,50,75) if
              runs[(p,42)]['minimumAliveAtAnyEvent']>=10000 and
              runs[(p,73)]['minimumAliveAtAnyEvent']>=10000]
