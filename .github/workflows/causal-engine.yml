name: Causal Engine - integrated reality check

on:
  push:
    branches:
      - experimento/motor-causal-10k-80y-autonomo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Release
        run: dotnet build experiments/IndexCities.CausalEngine/IndexCities.CausalEngine.csproj -c Release
      - name: Validate determinism, trips, ledger, births and physical history
        run: dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --self-test | tee self-test.json
      - name: Validate two independent annual workload cycles without pretending continuity
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --sims=256 --annual-load-cycles=2 --adversarial | tee annual-workload-smoke.json
          python3 - <<'PY'
          import json
          d=json.load(open('annual-workload-smoke.json'))
          assert d['status']=='TECHNICAL_REPEAT_LOAD_ONLY_NOT_CONTINUOUS_CITY'
          assert d['independentAnnualCycles']==2 and d['representedGregorianDays']==731
          assert d['minLivingAgentsAcrossIndependentCycles']>=256
          assert d['totalIndividualJourneys']>0 and d['totalRealFoodSalesUnitsAcrossCycles']>0
          assert d['allCycleMoneyAndFoodConserved'] and not d['historyPersistent']
          PY
      - name: Run city with 1k concurrent citizens 30 days and real fact file
        run: dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- --sims=1000 --days=30 --seed=42 --history=artifacts/causal-1000-30d.facts --adversarial | tee city-1000-30d.json
      - name: Inspect individual recorded lifetime events
        run: |
          set -o pipefail
          dotnet run --no-build -c Release --project experiments/IndexCities.CausalEngine -- inspect artifacts/causal-1000-30d.facts 0 0 30 3 2>&1 | tee inspected-sim0.log
          grep -q 'HISTORY_QUERY sim=0 found=' inspected-sim0.log
      - name: Reject false positives
        run: |
          grep -q '"moneyConserved": true' city-1000-30d.json
          grep -q '"simulatedDays": 30' city-1000-30d.json
          grep -q '"historyPersistent": true' city-1000-30d.json
          grep -q '"deterministic": true' self-test.json
          test -s artifacts/causal-1000-30d.facts
      - name: Keep reports, never upload huge simulation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-smoke
          path: |
            self-test.json
            city-1000-30d.json
          if-no-files-found: ignore

  scale-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute 10,000 individual agents for 30 days, with persisted histories
        run: |
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=30 --seed=42 --history=artifacts/causal-10000-30d.facts --adversarial | tee city-10000-30d.json
          grep -q '"moneyConserved": true' city-10000-30d.json
          grep -q '"simulatedDays": 30' city-10000-30d.json
          grep -q '"historyPersistent": true' city-10000-30d.json
          test -s artifacts/causal-10000-30d.facts
      - name: Keep metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-metrics
          path: city-10000-30d.json
          if-no-files-found: ignore

  year-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 10k active lives for one actual Gregorian year, with compressed factual history
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=366 --seed=42 --history=artifacts/causal-10000-366d.facts.gz --adversarial | tee year-10000.json
          grep -q '"moneyConserved": true' year-10000.json
          grep -q '"foodConserved": true' year-10000.json
          grep -q '"simulatedDays": 366' year-10000.json
          grep -q '"historyPersistent": true' year-10000.json
          test -s artifacts/causal-10000-366d.facts.gz
          gzip -t artifacts/causal-10000-366d.facts.gz
      - name: Preserve 10k/one-year metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-366days
          path: year-10000.json
          if-no-files-found: ignore

  decade-10k:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ten real Gregorian years with 10k persons, physical travel and compressed factual history
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=3653 --seed=42 --history=artifacts/causal-10k-10y.ich2.gz --adversarial | tee decade-10000.json
          python3 - <<'PY'
          import json
          r=json.load(open('decade-10000.json'))
          assert r['moneyConserved'] and r['foodConserved'] and r['simulatedDays']==3653
          assert r['births']>0 and r['journeys']>0 and r['cargoDeliveries']>0
          print('DECADE',r['aliveEnd'],r['minimumAliveAtDayBoundary'],r['unmetMeals'],r['wallSeconds'])
          PY
          test -s artifacts/causal-10k-10y.ich2.gz
          gzip -t artifacts/causal-10k-10y.ich2.gz
          du -h artifacts/causal-10k-10y.ich2.gz
      - name: Preserve 10-year report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-decade-metrics
          path: decade-10000.json
          if-no-files-found: ignore

  eighty-years-10k:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute 2020-2100 without skipping days, with factual history on disk
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=29220 --seed=42 --history=artifacts/causal-10k-80y.ich2.gz --adversarial | tee 80years-10000.json
          python3 - <<'PY'
          import json
          r=json.load(open('80years-10000.json'))
          assert r['simulatedDays']==29220 and r['gregorianEnd']=='2100-01-01'
          assert r['moneyConserved'] and r['foodConserved'] and r['historyPersistent']
          assert r['births']>0 and r['deaths']>0
          assert r['journeys']>0 and r['cargoDeliveries']>0
          assert r['minimumAliveAtDayBoundary']>=10000, 'Does not sustain 10k living citizens'
          print('EIGHTY_YEARS_PARTIAL_FIXTURE',r['wallSeconds'],r['aliveEnd'])
          PY
          test -s artifacts/causal-10k-80y.ich2.gz
          gzip -t artifacts/causal-10k-80y.ich2.gz
          du -h artifacts/causal-10k-80y.ich2.gz
      - name: Preserve 80-year result (not a SPEC-complete acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-10k-80y-fixture-metrics
          path: 80years-10000.json
          if-no-files-found: ignore

  eighty-years-population-diagnostic:
    # A separate, explicitly requested causal/demographic probe. It does NOT
    # persist facts; the long-history workload remains a separate acceptance
    # problem and this job can never prove the complete IndexCities SPEC.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[80y-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run 80 Gregorian years with corrected household purchasing
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=29220 --seed=42 --adversarial 2>&1 | tee eighty-years-population.log
          python3 - <<'PY'
          import json
          lines=open("eighty-years-population.log").readlines()
          report_start=next(i for i,line in enumerate(lines) if line.startswith('{'))
          result=json.loads(''.join(lines[report_start:]))
          assert result['simulatedDays'] == 29220 and result['gregorianEnd'] == '2100-01-01'
          assert result['foodConserved'] and result['moneyConserved']
          print('EIGHTY_YEAR_POPULATION_DIAGNOSTIC', result['aliveEnd'],
                result['minimumAliveAtDayBoundary'], result['unmetMeals'],
                result['wallSeconds'])
          assert result['minimumAliveAtDayBoundary'] >= 10000, 'Living population fell below 10,000'
          PY
      - name: Keep diagnostic results even if the population collapses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-80y-population-no-history
          path: eighty-years-population.log
          if-no-files-found: ignore

  vacancy-market-1y:
    # Only expand to ten/eighty years after workers can actually serve a city.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-1y]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Measure one year of real-demand-funded farm/store vacancies
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=366 --seed=42 --adversarial --vacancy-market --cohort-renewal 2>&1 | tee vacancy-market-1y.log
          python3 - <<'PY'
          import json
          lines=open('vacancy-market-1y.log').readlines()
          i=next(i for i,line in enumerate(lines) if line.startswith('{'))
          d=json.loads(''.join(lines[i:]))
          assert d['simulatedDays']==366 and d['vacancyMarketFixture']
          assert d['foodConserved'] and d['moneyConserved']
          assert d['salesFoodUnits']>0 and d['paidWagesCents']>0
          print('MARKET_YEAR_1',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['deniedPurchases'],d['employedAlive'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Real vacancy fixture did not sustain 10k even 1 year'
          PY
      - name: Preserve poor outcomes for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-real-vacancy-one-year
          path: vacancy-market-1y.log
          if-no-files-found: ignore

  integrated-second-cycle-10y:
    # Both independently passed one-year POCs connected in the same market.
    # Ten-year result is required to expose macroeconomic viability, not just
    # confirm valid individual deliveries and construction work.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[second-cycle-10y]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Challenge 10k Sims for ten years with paid freight and housebuilding
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=3653 --seed=42 --adversarial --vacancy-market --cohort-renewal --construction-pilot --freight-labor 2>&1 | tee economic-second-cycle-10y.log
          python3 - <<'PY'
          import json
          rows=open('economic-second-cycle-10y.log').readlines()
          idx=next(i for i,v in enumerate(rows) if v.startswith('{'))
          d=json.loads(''.join(rows[idx:]))
          assert d['simulatedDays']==3653 and d['freightLaborFixture'] and d['constructionPilotFixture']
          assert d['moneyConserved'] and d['foodConserved'] and d['materialConserved']
          assert d['realWorkerFreightTrips']>0 and d['constructionPaidShifts']>0
          assert d['constructionContractsCompleted']>0
          assert d['businessInitialCashCents']+d['businessOperatingNetCents']==d['businessCurrentCashCents']
          print('SECOND_CYCLE_10Y',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['constructionContractsCompleted'],
                d['realWorkerFreightTrips'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Real construction and freight did not prevent collapse'
          PY
      - name: Keep complete decade metrics even when the population fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-2nd-economy-10y
          path: economic-second-cycle-10y.log
          if-no-files-found: ignore

  demographic-ceiling-80y:
    # An intentionally permissive mathematical bound, NOT population survival.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cohort-bound-80y]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Bound 80-year age/carer/household renewal independently of money
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --demographic-upper-bound | tee demographic-ceiling.json
          python3 - <<'PY'
          import json
          d=json.load(open('demographic-ceiling.json'))
          assert d['status']=='DEMOGRAPHIC_THEORETICAL_UPPER_BOUND_ONLY'
          assert d['years']==80 and d['days']==29220
          assert d['rotatingFixtureUpperBound']['demographicOnly']
          assert not d['rotatingFixtureUpperBound']['physicallyAndEconomicallyValid']
          assert d['rotatingFixtureUpperBound']['births']>0
          PY
      - name: Preserve 80-year theoretical ceiling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-demographic-ceiling
          path: demographic-ceiling.json
          if-no-files-found: ignore

  household-hiring-3y:
    # A/B diagnostic against the prior identical three-year integrated scenario.
    # Job counts, product, cash and food are never manufactured for this test.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[distribution-3y]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test household-first access to the SAME real funded vacancies
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=1096 --seed=42 --adversarial --vacancy-market --cohort-renewal --freight-labor --construction-pilot --fair-household-hiring 2>&1 | tee household-hiring-3y.log
          python3 - <<'PY'
          import json
          lines=open('household-hiring-3y.log').readlines()
          start=next(i for i,line in enumerate(lines) if line.startswith('{'))
          r=json.loads(''.join(lines[start:]))
          assert r['simulatedDays']==1096 and r['moneyConserved'] and r['foodConserved'] and r['materialConserved']
          assert r['fairHouseholdHiringFixture'] and r['freightLaborFixture'] and r['constructionPilotFixture']
          print('HOUSEHOLD_FAIRNESS_3Y', r['aliveEnd'], r['minimumAliveAtDayBoundary'], r['unmetMeals'], r['householdsWithEmployedAdults'])
          PY
      - name: Keep diagnostic whether population survives or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-household-hiring-3y
          path: household-hiring-3y.log
          if-no-files-found: ignore

  construction-pilot-1y:
    # Separate isolated site + real payroll + finite outside materials;
    # no new gameplay rule and no full city construction coverage.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[construction-1y]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify contractor receipts, finite material and site wages without ledger drift
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=366 --seed=42 --adversarial --vacancy-market --cohort-renewal --construction-pilot 2>&1 | tee construction-1y.log
          python3 - <<'PY'
          import json
          rows=open('construction-1y.log').readlines()
          i=next(i for i,v in enumerate(rows) if v.startswith('{'))
          d=json.loads(''.join(rows[i:]))
          assert d['simulatedDays']==366 and d['constructionPilotFixture']
          assert d['moneyConserved'] and d['foodConserved'] and d['materialConserved']
          assert d['constructionContractsStarted']>0
          assert d['constructionPaidShifts']>0
          assert d['constructionContractsCompleted']>0
          print('CONSTRUCTION_1Y',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['constructionContractsStarted'],d['constructionContractsCompleted'],
                d['constructionPaidShifts'],d['unmetMeals'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Construction pilot did not sustain 10k in first year'
          PY
      - name: Keep real completed and incomplete worksite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-construction-pilot-1y
          path: construction-1y.log
          if-no-files-found: ignore

  freight-pilot-1y:
    # Opt-in physical freight worker experiment, never automatic deliveries.
    # This is NOT the final trucks/fuel system nor a full second V1 economy.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[freight-1y]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare funded extra drivers while preserving production crews
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=366 --seed=42 --adversarial --vacancy-market --cohort-renewal --freight-labor 2>&1 | tee freight-pilot-1y.log
          python3 - <<'PY'
          import json
          lines=open('freight-pilot-1y.log').readlines()
          i=next(i for i,line in enumerate(lines) if line.startswith('{'))
          d=json.loads(''.join(lines[i:]))
          assert d['simulatedDays']==366 and d['vacancyMarketFixture'] and d['freightLaborFixture']
          assert d['foodConserved'] and d['moneyConserved']
          assert d['realWorkerFreightTrips']>0 and d['freightChargesPaidCents']>=35*d['realWorkerFreightTrips']
          assert d['salesFoodUnits']>0 and d['paidWagesCents']>0
          print('REAL_FREIGHT_1Y',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['realWorkerFreightTrips'],d['freightChargesPaidCents'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Real physical freight reduced survivors below 10k'
          PY
      - name: Preserve one-year metrics regardless of rejection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-real-freight-1y
          path: freight-pilot-1y.log
          if-no-files-found: ignore

  freight-pilot-10y:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[freight-1y]')
    needs: freight-pilot-1y
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test same real freight pilot for ten continuous years
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=3653 --seed=42 --adversarial --vacancy-market --cohort-renewal --freight-labor 2>&1 | tee freight-pilot-10y.log
          python3 - <<'PY'
          import json
          lines=open('freight-pilot-10y.log').readlines()
          i=next(i for i,line in enumerate(lines) if line.startswith('{'))
          d=json.loads(''.join(lines[i:]))
          assert d['simulatedDays']==3653 and d['freightLaborFixture']
          assert d['foodConserved'] and d['moneyConserved']
          assert d['realWorkerFreightTrips']>0
          print('REAL_FREIGHT_10Y',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['realWorkerFreightTrips'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Real freight + existing market did not sustain 10k'
          PY
      - name: Preserve ten-year comparison even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-real-freight-10y
          path: freight-pilot-10y.log
          if-no-files-found: ignore

  vacancy-market-10y:
    # The V1 narrow food-sector job market is a deliberate falsification POC.
    # No new money, guaranteed jobs, instant travel or salary without work.
    # Still not complete SPEC (notably material and delivery-truck staffing).
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vacancy-10y]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare 10k Sims over ten years with real paid vacancies
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --days=3653 --seed=42 --adversarial --vacancy-market --cohort-renewal 2>&1 | tee vacancy-10y.log
          python3 - <<'PY'
          import json
          lines=open('vacancy-10y.log').readlines()
          i=next(i for i,v in enumerate(lines) if v.startswith('{'))
          d=json.loads(''.join(lines[i:]))
          assert d['simulatedDays']==3653 and d['vacancyMarketFixture']
          assert d['moneyConserved'] and d['foodConserved']
          assert d['paidWagesCents']>0 and d['salesFoodUnits']>0
          assert d['unemployedAdults']>=0 and d['employedAlive']>=0
          assert d['businessInitialCashCents']+d['businessOperatingNetCents']==d['businessCurrentCashCents']
          print('VACANCY_MARKET_TEN_YEARS',d['aliveEnd'],d['minimumAliveAtDayBoundary'],
                d['unmetMeals'],d['employedAlive'],d['unemployedAdults'],d['wallSeconds'])
          assert d['minimumAliveAtDayBoundary']>=10000, 'Vacancy market fails 10k living population'
          PY
      - name: Preserve negative economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-engine-vacancy-market-10y
          path: vacancy-10y.log
          if-no-files-found: ignore

  sustained-workload-80y:
    # Synthetic workload comparison: 80 independent one-year, LIVE 10k worlds,
    # real physical trips and economic transfers within each year. Explicitly
    # NOT one continuous world, its historical data, or a SPEC acceptance test.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[load-80y]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Stress 80 independent live 10k annual loads with exact Gregorian day count
        run: |
          set -o pipefail
          dotnet run -c Release --project experiments/IndexCities.CausalEngine -- --sims=10000 --annual-load-cycles=80 --seed=42 --adversarial 2>&1 | tee live-10k-annual-workload.log
          python3 - <<'PY'
          import json
          s=open('live-10k-annual-workload.log').readlines()
          start=next(i for i,v in enumerate(s) if v.startswith('{'))
          d=json.loads(''.join(s[start:]))
          assert d['status']=='TECHNICAL_REPEAT_LOAD_ONLY_NOT_CONTINUOUS_CITY'
          assert d['independentAnnualCycles']==80 and d['representedGregorianDays']==29220
          assert d['baselinePopulationPerIndependentCycle']==10000
          assert d['minLivingAgentsAcrossIndependentCycles']>=10000
          assert d['totalIndividualJourneys']>0 and d['totalRealFoodSalesUnitsAcrossCycles']>0
