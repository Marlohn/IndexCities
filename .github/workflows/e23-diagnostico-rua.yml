name: E28 - restricao causal de repouso ao bloqueador exclusivo

on:
  push:
    branches:
      - experimento/e28-repouso-so-lider-real

permissions:
  contents: read

jobs:
  diagnostic:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: seed43-reversed
            seed: 43
            reversed: 1
          - label: seed44
            seed: 44
            reversed: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: E28 - cobertura adversarial e paridade causal por checkpoint
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project src/IndexCities.Headless -- scale grid \
            --rows=5 --length=800 --seed=${{ matrix.seed }} --signals=1 \
            --warmup=1 --e22=compare --e22-window=3000 \
            --e22-adversary=mixed --e22-reverse=${{ matrix.reversed }} \
            --e23-diff=1 --e23-roadguard=0 --e24-flush-only=1 --e28-leader-only=1 | tee "e28_${{ matrix.label }}.log"
          # E28 candidate: a green CI requires exact comparison and real
          # intervention coverage. A green sample is not a general proof.
          log="e28_${{ matrix.label }}.log"
          grep -q '^E22_COMPARE mode=events ' "$log"
          grep -q '^E22_COMPARE mode=queue ' "$log"
          grep -Eq '^E22_COVERAGE adversary=mixed .*appliedTow=3 appliedJunction=3 appliedRoadWithRoute=3 towStrandedArms=3 towDispatchArms=3 ' "$log"
          grep -Eq '^E22_RESULT mode=events .*roadFlushes=[1-9][0-9]* .*flushWithoutPause=True' "$log"
          grep -Eq '^E22_RESULT mode=queue .*roadFlushes=[1-9][0-9]* .*flushWithoutPause=True' "$log"
          grep -Eq '^E22_RESULT mode=events .*e28LeaderOnly=True e28NonLeaderDenied=[1-9][0-9]*' "$log"
          grep -Eq '^E22_RESULT mode=queue .*e28LeaderOnly=True e28NonLeaderDenied=[1-9][0-9]*' "$log"
          grep '^E22_COMPARE ' "$log"
          if grep -q '^E22_COMPARE mode=events exactCheckpoints=True ' "$log" &&
             grep -q '^E22_COMPARE mode=queue exactCheckpoints=True ' "$log"; then
            echo 'E28_CAUSAL equivalence=True (only for this measured seed/window)'
          else
            echo 'E28_CAUSAL equivalence=False (candidate rejected; no performance claim)'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e28-${{ matrix.label }}
          path: e28_*.log
          if-no-files-found: ignore
