name: PR57 #162 residual phase and allocation cost at 1111 ARTIFICIAL live SIMs
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-grid-residual-162.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  residual-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and check composed opt-in behavior
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
          PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
          PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
          PR57_SAFE_SITE_BUFFER=1 \
            dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic economic city
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic pre-gridlock city
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore 1111-living-SIM ARTIFICIAL grid checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Compare non-intrusive wall with phase/vehicle/alloc probes in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; echo "PR57_162_SOURCE $(sha256sum "$source")"; done
          mkdir -p artifacts/residual-162
          for case in worksREAL queueREAL gridARTIFICIAL; do
            fixture=cycle; window=3600; windows=1; source="$works"
            if [[ "$case" == queueREAL ]]; then source="$queue"; window=600; windows=2; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; fixture=grid; window=100; windows=3; fi
            for mode in plain profile; do
              output="$PWD/artifacts/residual-162/$case-$mode"
              mkdir -p "$output"
              phase_alloc=0; if [[ "$mode" == profile ]]; then phase_alloc=1; fi
              echo "PR57_162_RUN case=$case mode=$mode horizon=$((window*windows)) hostQuantum=Advance2 composed=6 safeSite=1"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_PHASE_ALLOC_PROBE="$phase_alloc" \
              PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
              PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
              PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
              PR57_SAFE_SITE_BUFFER=1 PR57_BLOCK_DEP_PROBE=0 PR57_GRAPH_PROBE=0 \
              PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$mode" "$fixture" --seed=42 --warmup=0 --days="$windows" \
                --window="$window" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify complete intermediate saves and summarize residual cost
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/residual-162")
          for case,windows,seconds in (("worksREAL",1,3600),("queueREAL",2,1200),("gridARTIFICIAL",3,300)):
              logs={}
              for mode in ("plain","profile"):
                  log=(root/f"{case}-{mode}.log").read_text()
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode,"invariants/save")
                  rows=[line for line in log.splitlines() if line.startswith("WINDOW ")]
                  assert len(rows)==windows,(case,mode,"windows",len(rows))
                  logs[mode]=(log,rows)
                  for i in range(windows+1):
                      a=(root/f"{case}-plain"/f"checkpoint-{i}.json").read_bytes()
                      b=(root/f"{case}-{mode}"/f"checkpoint-{i}.json").read_bytes()
                      assert a==b,(case,mode,i,"full causal checkpoint divergence")
              plain,rows=logs["plain"]
              profile,_=logs["profile"]
              assert "STEP_PROFILE steps=" in profile and "VEHICLE_PROFILE steps=" in profile,(case,"missing phase probe")
              assert "PR57_PHASE_ALLOC_SUM steps=" in profile,(case,"missing alloc probe")
              assert "PR57_PHASE_ALLOC_SUM" not in plain,(case,"plain profiler contamination")
              def val(line,key):
                  match=re.search(r"\b"+re.escape(key)+r"=([0-9.]+)",line)
                  assert match,(case,key,line)
                  return float(match.group(1))
              metrics={k:sum(val(row,k) for row in rows) for k in ("wall","cpu","allocMB")}
              last=rows[-1]
              metrics.update({k:val(last,k) for k in ("alive","pop","travelling","openWorks","history","ledger")})
              if case=="gridARTIFICIAL":
                  assert metrics["alive"]>=1000 and metrics["travelling"]>=200,(case,"load not representative",metrics)
              if case=="worksREAL":
                  assert metrics["openWorks"]>0,(case,"no active works")
              phase=[(m.group(1),float(m.group(2)),float(m.group(3))) for m in
                     re.finditer(r"STEP_PHASE name=(\S+) wall=([0-9.]+)s share=([0-9.]+)%",profile)]
              alloc=[(m.group(1),int(m.group(2)),float(m.group(3))) for m in
                     re.finditer(r"PR57_PHASE_ALLOC name=(\S+) bytes=(\d+) share=([0-9.]+)%",profile)]
              vehicle=[(m.group(1),float(m.group(2)),float(m.group(3))) for m in
                     re.finditer(r"VEHICLE_DETAIL name=(\S+) wall=([0-9.]+)s parentShare=([0-9.]+)%",profile)]
              scans=[(m.group(1),float(m.group(2)),int(m.group(3)),int(m.group(4))) for m in
                     re.finditer(r"VEHICLE_SCAN name=(\S+) wall=([0-9.]+)s visits=(\d+) hits=(\d+)",profile)]
              assert phase and alloc and vehicle and scans,(case,"missing detailed profile")
              print("PR57_162_RESULT",case,"seconds",seconds,"plain",metrics,
                    "simSecondsPerWallSecond",round(seconds/metrics["wall"],2),
                    "exactCheckpoints",windows+1,
                    "topPhases",sorted(phase,key=lambda x:-x[1])[:6],
                    "topAllocated",sorted(alloc,key=lambda x:-x[1])[:6],
                    "topVehicle",sorted(vehicle,key=lambda x:-x[1])[:8],
                    "topScans",sorted(scans,key=lambda x:-x[1])[:8])
          PY
      - name: Preserve logs and complete checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-grid-residual-162
          path: artifacts/residual-162/**
          retention-days: 14
