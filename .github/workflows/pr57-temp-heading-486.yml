name: 'PR57 #486 REAL transient heading nested-reader census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-temp-heading-486.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  transient-heading:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational hooks only into disposable checkout
        run: python3 scripts/pr57-486-temp-heading-inject.py
      - name: Build and run complete regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore original REAL congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/real
      - name: ABBA 100 authentic Advance(2) calls with complete save parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CENSUS'
          import hashlib,json,os,re,subprocess,time
          from pathlib import Path
          root=Path('artifacts/pr57-486')
          root.mkdir(parents=True,exist_ok=True)
          source=Path('artifacts/real/real14hREAL-control/checkpoint-0.json')
          raw=source.read_bytes()
          input_hash=hashlib.sha256(raw).hexdigest()
          assert input_hash=='779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'
          state=json.loads(raw)
          assert sum(bool(c['Alive']) for c in state['Citizens'])==121
          assert len(state['Vehicles'])==98
          finals=[]; probes=[]; arms={}
          for arm in ('A1','B1','B2','A2'):
              dest=root/arm
              dest.mkdir(parents=True,exist_ok=True)
              enabled=arm.startswith('B')
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                         PR57_GRID_DIAG='0',PR57_SAVE_CAPTURE_DIR=str(dest.resolve()),
                         PR57_270_MANOEUVRE_SCRATCH='0',
                         PR57_272_PENETRATION_MEMO='0',
                         PR57_PENETRATION_STACK_AXES='0',
                         PR57_486_TEMP_HEADING='1' if enabled else '0')
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','scale','cycle','--seed=42','--warmup=0',
                   '--days=1','--window=200','--cap=300',f'--resume={source.resolve()}']
              started=time.perf_counter()
              with (dest/'full.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=300)
              wall=time.perf_counter()-started
              log=(dest/'full.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(arm,log[-3000:])
              assert (dest/'checkpoint-0.json').read_bytes()==raw
              final=(dest/'checkpoint-1.json').read_bytes()
              finals.append(final)
              windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(windows)==1 and re.search(r'\bseconds=200\b',windows[0]),(arm,windows)
              rows=[x for x in log.splitlines() if x.startswith('PR57_486_TEMP ')]
              if enabled:
                  assert len(rows)==1,(arm,rows)
                  counts={k:int(v) for k,v in re.findall(
                      r'([A-Za-z][A-Za-z0-9]*)=(-?\d+)',rows[0])}
                  assert set(['entries','changed','nested','tempNow','tempPose',
                              'hookTicks','preferenceTicks']).issubset(counts)
                  assert 0<=counts['changed']<=counts['entries']
                  assert all(counts[k]>=0 for k in counts)
                  probes.append(counts)
                  arms[arm]={'census':counts,'row':rows[0],
                             'window':windows[0],'wallSeconds':wall}
              else:
                  assert not rows
                  arms[arm]={'window':windows[0],'wallSeconds':wall}
              arms[arm]['finalSha256']=hashlib.sha256(final).hexdigest()
          assert all(x==finals[0] for x in finals),'FULL_SAVE_JSON_MISMATCH'
          assert probes[0]==probes[1],('NONDETERMINISTIC_COUNTS',probes)
          final_hash=hashlib.sha256(finals[0]).hexdigest()
          assert final_hash=='9ef479844aa324867c0c7d7733c61af7d0f5227e4ca4f1ba4a4d0365522cca23'
          summary={'experiment':486,'scope':'REAL congested 121 living/98 vehicles',
                   'allAdvance2':True,'callsAdvance2PerArm':100,
                   'baseline':'same composed PR57 flags; stack axes off',
                   'observational':True,'acceptedGain':False,
                   'inputSha256':input_hash,'finalSha256':final_hash,
                   'fullSaveByteParity':True,'arms':arms,
                   'limits':'Counters observe temporary heading, nested CanTurnNow and BodyOnWay reads only; no universal journal, no cache, no skipped slices. Timers intrusive and non-deterministic.'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_486_TEMP_CENSUS',json.dumps(probes[0],sort_keys=True),flush=True)
          print('PR57_486_FULL_SAVE_PARITY',final_hash,flush=True)
          PY_CENSUS
      - name: Preserve original logs, full saves and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-temp-heading-486
          path: artifacts/pr57-486
          retention-days: 14
          if-no-files-found: warn
