name: 'PR57 #334 broken exterior tow writer coverage'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-broken-tow-334.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  broken-tow-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational shadow and artificial broken exterior tow fixtures
        run: python3 scripts/pr57-334-inject.py
      - name: Fresh testhost - missing writer is detected by canonical BodyOnWay
        run: |
          set -euo pipefail
          PR57_330_ACTOR_LOCAL=1 PR57_334_REPAIR_PUBLISH=0 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter 'FullyQualifiedName~Pr57Physical334Tests' --logger 'console;verbosity=normal'
      - name: Fresh testhost - opt-in writer publication removes the stale shadow
        run: |
          set -euo pipefail
          PR57_330_ACTOR_LOCAL=1 PR57_334_REPAIR_PUBLISH=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Pr57Physical334Tests' --logger 'console;verbosity=normal'
      - name: Full baseline suite with the observer disabled
        run: |
          set -euo pipefail
          PR57_330_ACTOR_LOCAL=1 PR57_334_REPAIR_PUBLISH=0 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --logger 'console;verbosity=normal'
