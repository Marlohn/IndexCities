name: 'PR57 #312 actual citizen crossing gate writer transitions'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-crossing-writer-312.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  crossing-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated replay and run regression tests
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL and GRID checkpoints from #259
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process ABBA Advance(2), writer census and exact checkpoint parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/crossing-312
          for case in real14hREAL gridARTIFICIAL; do
            input="artifacts/input/$case-control/checkpoint-0.json"
            test -s "$input"
            calls=100
            start=76
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; start=26; fi
            for arm in control1 probe1 probe2 control2; do
              mode=control
              if [[ "$arm" == probe* ]]; then mode=probe; fi
              output="artifacts/crossing-312/$case-$arm"
              mkdir -p "$output"
              if [[ "$mode" == probe ]]; then
                PR57_312_CROSSING_WRITER=1 PR57_312_START="$start" \
                  dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" "$mode" "$calls" "$output" \
                  > "artifacts/crossing-312/$case-$arm.log" 2>&1
              else
                dotnet run --no-build -c Release \
                  --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- \
                  "$input" "$case" "$mode" "$calls" "$output" \
                  > "artifacts/crossing-312/$case-$arm.log" 2>&1
              fi
            done
          done
          python3 scripts/pr57-312-crossing-writer-audit.py artifacts/crossing-312 \
            | tee artifacts/crossing-312/audit.txt
      - name: Preserve logs and full checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-writer-312
          path: artifacts/crossing-312/**
          retention-days: 14
