name: Integrated core PR57 real housing and migration constraint audit

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  growth-gate:
    name: Twelve-hour legal housing, construction and migration audit
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated simulation Release
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Observe normal construction, housing and migration after twelve hours
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-growth-gate
          PR57_SAVE_CAPTURE_DIR=artifacts/pr57-growth-gate PR57_CYCLE_SOUTH_EXTENSION=1 PR57_CYCLE_SOUTH_HOUSING=1 PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 PR57_PROFILE_FROM_WINDOW=2 timeout 160s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --warmup=0 --cycle-houses=40 --cycle-bypass=1 --days=1 --window=43200 --cap=260 | tee artifacts/pr57-growth-gate/run.log
      - name: Audit completed and occupied buildings, candidates and open projects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/pr57-growth-gate/summary.log
          import collections, decimal, json, pathlib
          root=pathlib.Path('artifacts/pr57-growth-gate')
          log=(root/'run.log').read_text()
          assert 'PR57_EXTENSION_READY completed=2/2' in log
          assert 'CYCLE_HOUSING requested=40 placed=40 attempted=40 ' in log
          assert 'WINDOW 1 seconds=43200 ' in log
          assert 'PR57_WORK_DIAG window=1 ' in log
          assert 'PR57_AB_CHECKPOINT window=1 ' in log
          assert 'INVARIANTS OK' in log and '\nSAVE ' in log
          state=json.loads((root/'checkpoint-1.json').read_text(),parse_float=decimal.Decimal)
          buildings=state['Buildings']
          families=state['FamilyCandidates']
          citizens=state['Citizens']
          projects=state['Projects']
          print(f"PR57_GROWTH_GATE scope=12h buildings={len(buildings)} residents={sum(bool(c.get('Alive') and c.get('Resident')) for c in citizens)} familiesCandidates={len(families)} migrated={sum(bool(f.get('Migrated')) for f in families)} remaining={sum(not f.get('Migrated') for f in families)} projectsOpen={sum(str(p.get('Status')) in ('Waiting','InProgress','0','1') for p in projects)}",flush=True)
          groups=collections.defaultdict(list)
          for b in buildings:
              if not b.get('Removed'):groups[str(b.get('Kind'))].append(b)
          for kind, group in sorted(groups.items()):
              print(f"PR57_BUILDING_KIND kind={kind} count={len(group)} completed={sum(bool(b.get('Completed')) for b in group)} owned={sum(b.get('OwnerAccount') is not None for b in group)} families={sum(b.get('FamilyId') is not None for b in group)} vacantCompleted={sum(bool(b.get('Completed')) and b.get('OwnerAccount') is None and b.get('FamilyId') is None for b in group)}",flush=True)
          for status,count in sorted(collections.Counter(str(p.get('Status')) for p in projects).items()):
              print(f"PR57_PROJECT_STATUS status={status} count={count}",flush=True)
          for cause,count in collections.Counter(str(b.get('Cause')) for b in buildings if b.get('Completed') and b.get('FamilyId') is None).most_common(8):
              print(f"PR57_VACANCY_CAUSE count={count} cause={cause[:150]}",flush=True)
          print('PR57_GROWTH_SCOPE same legal 40 orders as previous four-day fixture; one 12h window only, no speedup or sustainability claim',flush=True)
          PY
      - name: Preserve raw state, real work causes and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-growth-gate
          path: artifacts/pr57-growth-gate/**
          if-no-files-found: warn
          retention-days: 14
