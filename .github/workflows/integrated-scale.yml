name: Integrated real-core authentic lane queue checkpoint repro

on:
  push:
    branches:
      - experimento/escala-motor-integrado-10k-80y
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  causal-repro:
    name: Replay actual seed-73 two-car physical blocking from 3606s
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real-core headless (Release)
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Compare full-city checkpoint under .1s .5s and 2s quanta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- repro grid --seed=73 --warmup=0 --rows=10 --length=800 --signals=1 | tee artifacts/integrated-scale-probe/authentic-repro.log
          grep -q '^PR57_REAL_INVARIANTS OK$' artifacts/integrated-scale-probe/authentic-repro.log
          test "$(grep -c '^PR57_REAL_RESULT ' artifacts/integrated-scale-probe/authentic-repro.log)" -eq 3
          test "$(grep -c '^PR57_REAL_VEHICLE ' artifacts/integrated-scale-probe/authentic-repro.log)" -eq 9
      - name: Preserve checkpoint replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-authentic-repro
          path: artifacts/integrated-scale-probe/authentic-repro.log
          if-no-files-found: warn
          retention-days: 30
