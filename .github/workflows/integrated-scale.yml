name: Integrated core PR57 real-construction bypass housing expansion

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  real-housing-growth:
    name: Seed42 real-built bypass housing growth through first maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated simulation
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: One fresh process, real construction and maintenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-real-housing
          echo "PR57_GROWTH_MODE seed=42 bypass=1 housesRequested=32 extraSouthFrontage=1 horizon=13x43200 allPerformanceFlags=0"
          PR57_CYCLE_SOUTH_HOUSING=1 PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 PR57_PROFILE_FROM_WINDOW=13 timeout 240s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --warmup=0 --cycle-houses=32 --cycle-bypass=1 --days=13 --window=43200 --cap=210 | tee artifacts/pr57-real-housing/expanded.log
      - name: Validate real expansion, checkpoints, activity, and save/load
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('artifacts/pr57-real-housing/expanded.log').read_text()
          housing=re.search(r'^CYCLE_HOUSING requested=(\d+) placed=(\d+) attempted=(\d+) ',s,re.M)
          assert housing, 'missing housing orders'
          print(f'PR57_GROWTH_HOUSING requested={housing[1]} placed={housing[2]} attempted={housing[3]}',flush=True)
          assert int(housing[2])>18, 'no legal new houses on bypass; negative layout result'
          windows=re.findall(r'^WINDOW (\d+) seconds=43200 wall=([0-9.]+)s eff=\S+ cpu=([0-9.]+)s allocMB=([0-9.]+) gc0=(\d+) gc2=(\d+) (.*)$',s,re.M)
          checks=re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]{64}) (.*)$',s,re.M)
          assert [int(x[0]) for x in windows]==list(range(1,14)),('incomplete windows',len(windows))
          assert [int(x[0]) for x in checks]==list(range(1,14)),('incomplete checkpoints',len(checks))
          save=re.search(r'^SAVE .* sha256=([A-F0-9]{64})$',s,re.M)
          assert save and save[1]==checks[-1][1],'final save/load checkpoint mismatch'
          assert 'INVARIANTS OK' in s and 'STOP limite' not in s,'invariants or time limit'
          final=windows[-1][6]
          for key in ('alive','employed','vehicles','travelling','ledger','history','meals','wages','openWorks'):
              assert re.search(r'\b'+key+r'=\S+',final),('missing economic evidence',key)
          total=sum(float(w[1]) for w in windows)
          alloc=sum(float(w[3]) for w in windows)
          print(f'PR57_GROWTH_RESULT windows=13 simSeconds=561600 wall={total:.2f}s throughput={561600/total:.1f}simSecPerWallSec totalAllocMB={alloc:.1f} window13Wall={windows[-1][1]} window13AllocMB={windows[-1][3]} final={final} finalSha={save[1]}',flush=True)
          print('PR57_GROWTH_LIMITATION real-built seed42 city, not a same-city algorithm A/B; no proof of 10k/80y or full causal event trace.',flush=True)
          PY
      - name: Preserve evidence even if viability fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-housing
          path: artifacts/pr57-real-housing/*.log
          if-no-files-found: warn
          retention-days: 14
