name: Integrated real-core load step and peak activity

on:
  push:
    branches:
      - experimento/escala-motor-integrado-10k-80y
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-step:
    name: Paired small vs medium grid, plus peak mobility census
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real simulation CLI (Release)
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Paired workload and 2-second peak activity census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-load
          echo "LOAD_STEP_COMMIT=${GITHUB_SHA}"
          echo "OS=$(uname -srmo)"
          dotnet --info | head -n 22
          # Paired controls in the SAME job: do not compare timings across runners.
          # No game rules change. Grid still uses instant construction, boosted
          # utilities and money; medium is a workload step, NOT a viable city.
          for fixture in small medium; do
            if [[ "$fixture" == small ]]; then rows=3; length=400; else rows=6; length=600; fi
            for repeat in 1 2; do
              echo "=== LOAD_START fixture=${fixture} repeat=${repeat} seed=42 rows=${rows} length=${length} ==="
              TIMEFORMAT='TIME totalReal=%3R cpuUser=%3U cpuSystem=%3S'
              { time timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- scale grid --seed=42 --warmup=1 --days=1 --cap=150 --rows="${rows}" --length="${length}" --signals=1; } 2>&1 | tee "artifacts/integrated-scale-load/${fixture}-scale${repeat}.log"
              grep -q '^SUMMARY days=1 ' "artifacts/integrated-scale-load/${fixture}-scale${repeat}.log"
              grep -q '^SAVE ' "artifacts/integrated-scale-load/${fixture}-scale${repeat}.log"
              grep -q '^INVARIANTS OK$' "artifacts/integrated-scale-load/${fixture}-scale${repeat}.log"
            done
            echo "=== PEAK_CENSUS_START fixture=${fixture} seed=42 rows=${rows} length=${length} ==="
            { time timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- census grid --seed=42 --warmup=1 --days=1 --cap=150 --rows="${rows}" --length="${length}" --signals=1; } 2>&1 | tee "artifacts/integrated-scale-load/${fixture}-census.log"
            grep -q '^CENSUS steps=43200 ' "artifacts/integrated-scale-load/${fixture}-census.log"
            grep -q '^  PICOS ' "artifacts/integrated-scale-load/${fixture}-census.log"
            grep -q '^  CARGA_HORARIA horas=24 ' "artifacts/integrated-scale-load/${fixture}-census.log"
            grep -q '^INVARIANTS OK$' "artifacts/integrated-scale-load/${fixture}-census.log"
            b1=$(sed -n 's/.*sha256=\([0-9A-F]*\).*/\1/p' "artifacts/integrated-scale-load/${fixture}-scale1.log" | tail -n 1)
            b2=$(sed -n 's/.*sha256=\([0-9A-F]*\).*/\1/p' "artifacts/integrated-scale-load/${fixture}-scale2.log" | tail -n 1)
            census=$(sed -n 's/.*sha256=\([0-9A-F]*\).*/\1/p' "artifacts/integrated-scale-load/${fixture}-census.log" | tail -n 1)
            test -n "$b1" && test -n "$b2" && test -n "$census"
            echo "LOAD_SHA_COMPARE fixture=${fixture} scale1=${b1} scale2=${b2} census=${census} baselineRepeatEqual=$([[ "$b1" == "$b2" ]] && echo true || echo false) granularityEqual=$([[ "$b1" == "$census" ]] && echo true || echo false)"
            if [[ "$b1" != "$b2" ]]; then echo "::error::Same-configuration replay diverged"; exit 1; fi
            if [[ "$b1" != "$census" ]]; then echo "::warning::Advance(2) census differs from Advance(86400); investigate before interpreting"; fi
          done
      - name: Attach raw paired workload and census logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-load-step-raw
          path: artifacts/integrated-scale-load/*.log
          if-no-files-found: warn
          retention-days: 30
