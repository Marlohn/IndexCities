name: Integrated core PR57 real-city cargo congestion scan A/B

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  ab:
    name: Compare exact scan against parked-car filter plus fast scan on saved real city
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore authentic six-day city checkpoint, not synthetic grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/pr57-source
          gh run download 40169101306 -n integrated-scale-pr57-legal-workplaces-8d -D artifacts/pr57-source
          test -s artifacts/pr57-source/pr57-jobs-20/checkpoint-10.json
      - name: Build integrated core Release once
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Same runner ABBA, fresh dotnet processes, identical saved economy and roads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-real-scan-ab
          for mode in controlA candidateA candidateB controlB; do
            active=0; fast=0
            if [[ "$mode" == candidate* ]]; then active=1; fast=1; fi
            mkdir -p "artifacts/pr57-real-scan-ab/$mode"
            {
              echo "PR57_FLAGS mode=$mode active=$active fast=$fast bitset=0 zeroSite=0 dispatchLookup=1"
              PR57_SAVE_CAPTURE_DIR="artifacts/pr57-real-scan-ab/$mode" \
              PR57_AB_CHECKPOINT=1 PR57_DISPATCH_SHIPMENT_LOOKUP=1 \
              PR57_ACTIVE_SCAN="$active" PR57_FAST_SCAN="$fast" PR57_BEND_PREFILTER=0 \
              PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 \
              PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 \
              PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 \
              PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 \
              timeout 110s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                profile cycle --seed=42 --resume=artifacts/pr57-source/pr57-jobs-20/checkpoint-10.json \
                --warmup=0 --days=12 --window=300 --cap=100
            } | tee "artifacts/pr57-real-scan-ab/$mode/run.log"
          done
      - name: Verify full-state checkpoints and compare actual wall CPU GC and scans
        shell: bash
        run: |
          python3 - <<'PY' | tee artifacts/pr57-real-scan-ab/audit.log
          import json, pathlib, re
          root=pathlib.Path('artifacts/pr57-real-scan-ab')
          modes=['controlA','candidateA','candidateB','controlB']
          pattern=re.compile(r'^WINDOW (\d+) seconds=300 wall=([\d.]+)s eff=[\d.]+x cpu=([\d.]+)s allocMB=([\d.]+) gc0=(\d+) gc2=(\d+)',re.M)
          baseline=[(root/'controlA'/f'checkpoint-{i}.json').read_bytes() for i in range(13)]
          initial=json.loads(baseline[0]); final=json.loads(baseline[-1])
          assert final['ElapsedSecondsUnits']-initial['ElapsedSecondsUnits']==3_600_000_000
          initialVehicles={v['Id']:v for v in initial['Vehicles']}
          finalVehicles={v['Id']:v for v in final['Vehicles']}
          moved=sum(v['Position']!=initialVehicles[v['Id']]['Position'] for v in final['Vehicles'] if v['Id'] in initialVehicles)
          assert moved>0, 'No actual vehicle progress'
          assert len(final['Ledger'])>len(initial['Ledger']), 'No actual economic transactions'
          assert sum(len(c['History']) for c in final['Citizens'])>sum(len(c['History']) for c in initial['Citizens']), 'No personal history progress'
          measurements={}
          for mode in modes:
            log=(root/mode/'run.log').read_text()
            expected=1 if mode.startswith('candidate') else 0
            assert f'PR57_FLAGS mode={mode} active={expected} fast={expected}' in log
            assert 'INVARIANTS OK' in log and '\nSAVE ' in log
            assert 'STEP_PROFILE steps=' in log and 'VEHICLE_PROFILE steps=' in log
            windows=pattern.findall(log)
            assert len(windows)==12 and [int(w[0]) for w in windows]==list(range(1,13)),(mode,len(windows))
            for i in range(13):
              actual=(root/mode/f'checkpoint-{i}.json').read_bytes()
              assert actual==baseline[i],f'Full save diverged at {mode}, checkpoint {i}'
            wall=sum(float(w[1]) for w in windows)
            cpu=sum(float(w[2]) for w in windows)
            alloc=sum(float(w[3]) for w in windows)
            gc0=sum(int(w[4]) for w in windows)
            scans=re.findall(r'^  VEHICLE_SCAN name=(\S+) wall=([\d.]+)s visits=(\d+)',log,re.M)
            slices=re.search(r'VEHICLE_PROFILE steps=(\d+) batched=(\d+) unsplit=(\d+) slices=(\d+)',log)
            assert slices and len(scans)>=2
            measurements[mode]=dict(wall=wall,cpu=cpu,allocMB=alloc,gc0=gc0,throughput=3600/wall,slices=int(slices[4]),scans={x[0]:dict(wall=float(x[1]),visits=int(x[2])) for x in scans})
            print('PR57_REAL_SCAN',mode,json.dumps(measurements[mode],sort_keys=True))
          for control,candidate in [('controlA','candidateA'),('controlB','candidateB')]:
            a=measurements[control];b=measurements[candidate]
            assert a['slices']==b['slices'],'Substeps changed without explanation'
            print('PR57_REAL_SCAN_PAIR',control,candidate,f'wallDeltaPct={100*(b["wall"]/a["wall"]-1):.2f}',f'allocDeltaPct={100*(b["allocMB"]/a["allocMB"]-1):.2f}')
          print('PR57_REAL_SCAN_CAUSAL',f'fullCheckpoints=13',f'processes=4',f'vehiclesMoved={moved}',f'ledgerNew={len(final["Ledger"])-len(initial["Ledger"])}',f'historyNew={sum(len(c["History"]) for c in final["Citizens"])-sum(len(c["History"]) for c in initial["Citizens"])}',f'residentAlive={sum(c["Alive"] and c["Resident"] for c in final["Citizens"])}')
          print('PR57_REAL_SCAN_LIMIT','Same saves at 300s intervals include cumulative history/ledger, but do not prove every intermediate event or long-run economic sustainability.')
          PY
      - name: Preserve independent-process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-cargo-scan-ab
          path: artifacts/pr57-real-scan-ab/**
          if-no-files-found: warn
          retention-days: 14
