name: 'PR57 causal phase profile at measured scale'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/Program.cs
      - src/IndexCities.Simulation/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  phase-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build unchanged integrated headless motor
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Restore same real economic checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/source
          gh run download 40200371479 -n integrated-scale-pr57-work-access-index-ab -D artifacts/source
          test -s "$(find artifacts/source -type f -name checkpoint-16.json | grep real-maintenance-control-a | head -n 1)"
      - name: Profile real and artificial scale points in independent processes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          root=pathlib.Path('artifacts/phase-profile')
          root.mkdir(parents=True,exist_ok=True)
          sources=[p for p in pathlib.Path('artifacts/source').rglob('checkpoint-16.json') if 'real-maintenance-control-a' in str(p)]
          assert len(sources)==1,sources
          for name,rows in [('real',None),('grid-6',6),('grid-12',12)]:
              opts=['profile','cycle','--seed=42','--warmup=0','--days=1','--window=7200','--cap=120']
              if rows is None: opts.append('--resume='+str(sources[0].resolve()))
              else: opts=['profile','grid','--seed=42','--rows='+str(rows),'--length=600','--warmup=0','--days=1','--window=7200','--cap=120']
              cmd=['dotnet','run','--no-build','-c','Release','--project','src/IndexCities.Headless/IndexCities.Headless.csproj','--',*opts]
              env={k:v for k,v in os.environ.items() if not k.startswith('PR57_')}
              env['PR57_HOST_QUANTUM']='1'
              try:
                  p=subprocess.run(cmd,env=env,text=True,capture_output=True,timeout=180)
                  status='ok' if p.returncode==0 else 'exit-'+str(p.returncode)
                  stdout=p.stdout
                  stderr=p.stderr
              except subprocess.TimeoutExpired as ex:
                  status='timeout-180s'
                  stdout=ex.stdout or b''
                  stderr=ex.stderr or b''
                  if isinstance(stdout,bytes): stdout=stdout.decode('utf-8','replace')
                  if isinstance(stderr,bytes): stderr=stderr.decode('utf-8','replace')
              (root/(name+'.log')).write_text(stdout+'\nSTDERR\n'+stderr)
              phases={}
              for line in stdout.splitlines():
                  if not line.startswith('  STEP_PHASE '): continue
                  m=re.search(r'name=(\S+) wall=([0-9.]+)s share=([0-9.]+)%',line)
                  if m: phases[m.group(1)]={'wall':float(m.group(2)),'share':float(m.group(3))}
              window=next((x for x in stdout.splitlines() if x.startswith('WINDOW ')),'')
              print('PR57_SCALE_PHASE',json.dumps({'scenario':name,'status':status,'window':window,'phases':phases,'profileSteps':next((x for x in stdout.splitlines() if x.startswith('STEP_PROFILE ')),''),'invariants':'INVARIANTS OK' in stdout,'save':'SAVE ' in stdout},sort_keys=True),flush=True)
              if status!='ok' or not phases or 'INVARIANTS OK' not in stdout:
                  raise SystemExit('Profile incomplete: '+name)
          PY
      - name: Preserve profile raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-scale-phase-profile
          path: artifacts/phase-profile/**
          retention-days: 14
