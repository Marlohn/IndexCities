name: Integrated core PR57 real-construction housing 14-day viability

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  real-housing-growth:
    name: Seed42 real-built housing 14-day economic and maintenance viability
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated simulation
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: One fresh process, real construction and maintenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-real-housing
          echo "PR57_GROWTH_MODE seed=42 bypass=1 housesRequested=32 extraSouthFrontage=1 horizon=28x43200 allPerformanceFlags=0"
          PR57_CYCLE_SOUTH_HOUSING=1 PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 PR57_PROFILE_FROM_WINDOW=25 timeout 240s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --warmup=0 --cycle-houses=32 --cycle-bypass=1 --days=28 --window=43200 --cap=210 | tee artifacts/pr57-real-housing/expanded.log
      - name: Validate real expansion, checkpoints, activity, and save/load
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('artifacts/pr57-real-housing/expanded.log').read_text()
          housing=re.search(r'^CYCLE_HOUSING requested=(\d+) placed=(\d+) attempted=(\d+) ',s,re.M)
          assert housing, 'missing housing orders'
          print(f'PR57_GROWTH_HOUSING requested={housing[1]} placed={housing[2]} attempted={housing[3]}',flush=True)
          assert int(housing[2])>18, 'no legal new houses on bypass; negative layout result'
          windows=re.findall(r'^WINDOW (\d+) seconds=43200 wall=([0-9.]+)s eff=\S+ cpu=([0-9.]+)s allocMB=([0-9.]+) gc0=(\d+) gc2=(\d+) (.*)$',s,re.M)
          checks=re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]{64}) (.*)$',s,re.M)
          assert [int(x[0]) for x in windows]==list(range(1,29)),('incomplete 14-day windows',len(windows))
          assert [int(x[0]) for x in checks]==list(range(1,29)),('incomplete 14-day checkpoints',len(checks))
          save=re.search(r'^SAVE .* sha256=([A-F0-9]{64})$',s,re.M)
          assert save and save[1]==checks[-1][1],'final save/load checkpoint mismatch'
          assert 'INVARIANTS OK' in s and 'STOP limite' not in s,'invariants or time limit'
          final=windows[-1][6]
          for key in ('alive','employed','vehicles','travelling','ledger','history','meals','wages','openWorks'):
              assert re.search(r'\b'+key+r'=\S+',final),('missing economic evidence',key)
          total=sum(float(w[1]) for w in windows)
          alloc=sum(float(w[3]) for w in windows)
          sim_seconds=28*43200
          def stat(i,key):
              m=re.search(r'\b'+key+r'=([^\s]+)',windows[i][6])
              assert m,('missing window statistic',i+1,key)
              return float(m[1])
          peak_alive=max(stat(i,'alive') for i in range(28))
          peak_residents=max(stat(i,'pop') for i in range(28))
          worst=max(range(28),key=lambda i:float(windows[i][1]))
          print(f'PR57_GROWTH_RESULT windows=28 simSeconds={sim_seconds} wall={total:.2f}s throughput={sim_seconds/total:.1f}simSecPerWallSec totalAllocMB={alloc:.1f} worstWindow={worst+1} worstWall={windows[worst][1]} final={final} finalSha={save[1]}',flush=True)
          print(f'PR57_GROWTH_VIABILITY peakAlive={peak_alive:.0f} peakResidents={peak_residents:.0f} startAlive={stat(0,"alive"):.0f} endAlive={stat(27,"alive"):.0f} startResidents={stat(0,"pop"):.0f} endResidents={stat(27,"pop"):.0f} endDead={stat(27,"dead"):.0f} endEmployed={stat(27,"employed"):.0f} endVehicles={stat(27,"vehicles"):.0f} endTravelling={stat(27,"travelling"):.0f} endOpenWorks={stat(27,"openWorks"):.0f}',flush=True)
          for key in ('ledger','history','meals','wages'):
              print(f'PR57_GROWTH_ACTIVITY key={key} firstWeekDelta={stat(13,key)-stat(0,key):.2f} secondWeekDelta={stat(27,key)-stat(13,key):.2f}',flush=True)
          first=sum(float(w[1]) for w in windows[:14])
          second=sum(float(w[1]) for w in windows[14:])
          print(f'PR57_GROWTH_THROUGHPUT firstWeek={14*43200/first:.1f} secondWeek={14*43200/second:.1f} simSecPerWallSec firstWeekAllocMB={sum(float(w[3]) for w in windows[:14]):.1f} secondWeekAllocMB={sum(float(w[3]) for w in windows[14:]):.1f}',flush=True)
          print('PR57_GROWTH_LIMITATION real-built seed42 city over 14 days, not an algorithm A/B; no proof of generations, long-term sustainability, 10k/80y or full causal event trace.',flush=True)
          PY
      - name: Preserve evidence even if viability fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-housing
          path: artifacts/pr57-real-housing/*.log
          if-no-files-found: warn
          retention-days: 14
