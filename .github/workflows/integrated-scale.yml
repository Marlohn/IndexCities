name: Integrated core PR57 conservative lane corridor on exact-order bitset A/B

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grid-bitset-ab:
    name: Real integrated core grid seed73 bitset conservative lane corridor ABBA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real integrated headless
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Adversarial movement parity with bitset and conservative lane corridor
        run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter FullyQualifiedName~DualExitConflictExperiment
      - name: Grid seed73 bitset conservative lane corridor ABBA with full checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          run_one() {
            local mode="$1" label="$2" corridor=0
            if [[ "$mode" == "corridor" ]]; then corridor=1; fi
            PR57_ACTIVE_SCAN=1 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=1 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=1 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN="$corridor" PR57_FAST_SCAN=1 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile grid --seed=73 --warmup=0 --days=3 --window=1500 --cap=180 --rows=10 --length=800 --signals=1 | tee "artifacts/integrated-scale-probe/${label}.log"
          }
          run_one control a_control
          run_one corridor a_corridor
          run_one corridor b_corridor
          run_one control b_control
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/integrated-scale-probe')
          results={}
          for label in ('a_control','a_corridor','b_corridor','b_control'):
              data=(root/(label+'.log')).read_text()
              for token in ('WINDOW 1 ','WINDOW 3 ','SUMMARY windows=3 secondsEach=1500','INVARIANTS OK','SAVE '):
                  assert token in data,(label,token)
              assert 'STOP limite' not in data,(label,'cap exceeded')
              walls=[float(x) for x in re.findall(r'^WINDOW \d+ .* wall=([0-9.]+)s',data,re.M)]
              assert len(walls)==3,(label,walls)
              checkpoints=tuple(re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]+).*$',data,re.M))
              assert [x[0] for x in checkpoints]==['1','2','3'],(label,checkpoints)
              sha=re.search(r'^SAVE .* sha256=([A-F0-9]+)$',data,re.M).group(1)
              assert sha==checkpoints[-1][1],(label,'save mismatch')
              stats=tuple(re.findall(r'^PR57_AB_CHECKPOINT window=\d+ sha256=[A-F0-9]+ (.*)$',data,re.M))
              scans=re.findall(r'^\s*VEHICLE_SCAN name=(\S+) wall=([0-9.]+)s visits=(\d+) hits=(\d+)',data,re.M)
              assert len(scans)>=2,(label,scans)
              summary=[line for line in data.splitlines() if line.startswith('SUMMARY windows=3 ')][0]
              results[label]=(sha,round(sum(walls),3),checkpoints,stats,scans,summary)
              print(f'PR57_LANE_CORRIDOR label={label} wall={sum(walls):.3f}s sha={sha} scans={scans} stats={stats[-1]} summary={summary}',flush=True)
          assert len({r[0] for r in results.values()})==1,'final save divergence'
          assert len({r[2] for r in results.values()})==1,'checkpoint SHA divergence'
          assert len({r[3] for r in results.values()})==1,'checkpoint activity divergence'
          assert len({tuple((x[0],x[3]) for x in r[4]) for r in results.values()})==1,'scan hits divergence'
          for letter in ('a','b'):
              c=results[f'{letter}_control'][1]
              b=results[f'{letter}_corridor'][1]
              print(f'PR57_LANE_CORRIDOR_AB order={letter} control={c:.3f}s corridor={b:.3f}s speedup={c/b:.3f}x',flush=True)
          PY
      - name: Preserve full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-lane-corridor-grid-seed73-abba
          path: artifacts/integrated-scale-probe/*.log
          if-no-files-found: warn
          retention-days: 30
