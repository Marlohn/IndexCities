name: Integrated core PR57 bounded physical gridlock checkpoint replay

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  replay:
    name: Replay two minutes from real six-day checkpoint; audit physical block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve prior six-day real-city state, without rebuilding the city
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/pr57-replay-source
          gh run download 40169101306 -n integrated-scale-pr57-legal-workplaces-8d -D artifacts/pr57-replay-source
          test -s artifacts/pr57-replay-source/pr57-jobs-20/checkpoint-10.json
      - name: Build integrated headless Release
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Replay 120 simulated seconds with every system and vehicle active
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-replay
          PR57_SAVE_CAPTURE_DIR=artifacts/pr57-replay PR57_AB_CHECKPOINT=1 PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 timeout 120s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --resume=artifacts/pr57-replay-source/pr57-jobs-20/checkpoint-10.json --warmup=0 --days=1 --window=120 --cap=60 | tee artifacts/pr57-replay/run.log
      - name: Verify physical mutual exclusion, activity, saves and actual movement profile
        shell: bash
        run: |
          python3 - <<'PY' | tee artifacts/pr57-replay/audit.log
          import json, math, pathlib
          source=pathlib.Path('artifacts/pr57-replay-source/pr57-jobs-20/checkpoint-10.json')
          root=pathlib.Path('artifacts/pr57-replay')
          start=json.loads(source.read_text())
          before=json.loads((root/'checkpoint-0.json').read_text())
          after=json.loads((root/'checkpoint-1.json').read_text())
          log=(root/'run.log').read_text()
          assert 'PR57 saved-cycle replay' in log and 'INVARIANTS OK' in log and '\nSAVE ' in log
          assert 'STEP_PROFILE steps=' in log and 'VEHICLE_PROFILE steps=' in log
          assert 'WINDOW 1 seconds=120 ' in log
          assert before['ElapsedSecondsUnits']==start['ElapsedSecondsUnits']
          assert after['ElapsedSecondsUnits']-before['ElapsedSecondsUnits']==120_000_000
          roads={r['Id']:r for r in before['Roads']}
          vehicles={v['Id']:v for v in before['Vehicles']}
          afterVehicles={v['Id']:v for v in after['Vehicles']}
          entrant=vehicles[1174]; lane=vehicles[487]
          def delta(a,b): return (a['X']-b['X'],a['Z']-b['Z'])
          def dot(a,b): return a[0]*b[0]+a[1]*b[1]
          def norm(a): return math.hypot(*a)
          def side(origin,axis,p): return ((p['X']-origin['X'])*axis[1]-(p['Z']-origin['Z'])*axis[0])/norm(axis)
          def along(origin,axis,p): return dot(delta(p,origin),axis)/norm(axis)
          node=roads[entrant['Route'][0]]['Position']
          following=roads[entrant['Route'][1]]['Position']
          axis=delta(following,node)
          length=norm(axis)
          target={'X':node['X']+axis[1]/length*1.65,'Z':node['Z']-axis[0]/length*1.65}
          fromSide=side(node,axis,entrant['Position'])
          toSide=side(node,axis,target)
          otherSide=side(node,axis,lane['Position'])
          fraction=(otherSide-fromSide)/(toSide-fromSide)
          crossAlong=along(node,axis,entrant['Position'])*(1-fraction)+along(node,axis,target)*fraction
          gap=along(node,axis,lane['Position'])-crossAlong
          direction=dot((math.sin(lane['Heading']),math.cos(lane['Heading'])),axis)/length
          assert entrant['PassengerCar'] and entrant['RouteIndex']==0 and entrant['Status']=='Travelling'
          assert abs(otherSide)<before['Tuning']['RoadWidth']/2
          assert min(fromSide,toSide)-.9<=otherSide<=max(fromSide,toSide)+.9
          assert 0<fraction<1 and 0<gap<8 and direction<-.5 and gap*direction<0
          # Same separating-axis geometry and body dimensions as BodiesOverlap.
          def overlap(a,ap,ah,b,bp,bh):
              af=(math.sin(ah),math.cos(ah)); ar=(af[1],-af[0])
              bf=(math.sin(bh),math.cos(bh)); br=(bf[1],-bf[0])
              d=delta(bp,ap)
              al=2.1 if a['PassengerCar'] else 3.6
              aw=.9 if a['PassengerCar'] else 1.45
              bl=2.1 if b['PassengerCar'] else 3.6
              bw=.9 if b['PassengerCar'] else 1.45
              return all(abs(dot(d,x))<al*abs(dot(af,x))+aw*abs(dot(ar,x))+bl*abs(dot(bf,x))+bw*abs(dot(br,x))+.1 for x in (af,ar,bf,br))
          i=lane['RouteIndex']
          n=roads[lane['Route'][i]]['Position']
          previous=roads[lane['Route'][i-1]]['Position']
          advance=delta(n,previous)
          d=norm(advance)
          laneTarget={'X':n['X']+advance[1]/d*1.65,'Z':n['Z']-advance[0]/d*1.65}
          dist=norm(delta(laneTarget,lane['Position']))
          first={'X':lane['Position']['X']+(laneTarget['X']-lane['Position']['X'])*.5/dist,'Z':lane['Position']['Z']+(laneTarget['Z']-lane['Position']['Z'])*.5/dist}
          assert dist>.5
          assert not overlap(lane,lane['Position'],lane['Heading'],entrant,entrant['Position'],entrant['Heading'])
          assert overlap(lane,first,lane['Heading'],entrant,entrant['Position'],entrant['Heading'])
          for vid in (487,1174):
              v=vehicles[vid]; later=afterVehicles[vid]
              assert later['Status']=='Travelling' and later['Position']==v['Position']
              assert later['RouteIndex']==v['RouteIndex'] and later['WaitingSince']==v['WaitingSince']
              print('PR57_PAIR_REPLAY',f'id={vid}',f'cause={later["Cause"]}',f'waitingSince={later["WaitingSince"]}',f'position={later["Position"]}')
          print('PR57_PAIR_GEOMETRY',f'entrant=1174',f'lane=487',f'gap={gap:.6f}',f'approachDirection={direction:.6f}',f'firstStepBodyOverlap=1',f'laneTargetDistance={dist:.6f}')
          print('PR57_PAIR_LIMIT', 'snapshot geometry and 120s replay prove these local holds, not a global deadlock or 10k viability')
          PY
      - name: Preserve replay and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-cargo-pair-120s
          path: artifacts/pr57-replay/**
          if-no-files-found: warn
          retention-days: 14
