name: 'PR57 legitimate economic growth load probe'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/Program.cs
      - src/IndexCities.Headless/Fixtures.cs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and existing simulation tests
        run: |
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Genuine paid-road, housing and workplace growth in Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-growth
          # Two different economic LOADS, not an optimization A/B. All construction,
          # migration, hiring, wages and transport use the normal engine.
          for load in reference growth; do
            houses=40
            workplaces=0
            if [[ "$load" == growth ]]; then houses=48; workplaces=20; fi
            mkdir -p "artifacts/real-growth/$load"
            echo "PR57_REAL_GROWTH load=$load requestedHouses=$houses requestedWorkplaces=$workplaces cadence=2"
            PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 \
            PR57_CYCLE_SOUTH_EXTENSION=1 PR57_CYCLE_SOUTH_HOUSING=1 \
            PR57_CYCLE_NORTH_HOUSING=1 PR57_CYCLE_WORKFRONT=1 \
            PR57_CYCLE_WORKPLACES="$workplaces" \
            PR57_DYNAMIC_BVH=0 PR57_PARALLEL_NEEDS=0 PR57_STAFF_PHASE_FUSION=0 \
            PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 PR57_PARALLEL_POLLUTION=0 \
            PR57_CONSTRUCTION_WAIT_AGENDA=0 PR57_DISPATCH_SHIPMENT_LOOKUP=0 \
            PR57_ROUTE_TREE=0 PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 \
            PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 PR57_PEDESTRIAN_GRID=0 \
            PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0 \
            PR57_SAVE_CAPTURE_DIR="$PWD/artifacts/real-growth/$load" \
              timeout 720s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                scale cycle --seed=42 --cycle-bypass=1 --cycle-houses="$houses" \
                --warmup=0 --days=6 --window=43200 --cap=300 \
              | tee "artifacts/real-growth/$load.log"
          done
      - name: Check complete windows and publish reproducible scale measurements
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('artifacts/real-growth')
          for load in ('reference','growth'):
              log=(root/f'{load}.log').read_text()
              assert 'PR57_WORKFRONT_READY completed=2/2' in log,(load,'road construction incomplete')
              assert 'CYCLE_HOUSING requested=' in log,(load,'housing orders missing')
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(load,'save/invariants')
              windows=[s for s in log.splitlines() if s.startswith('WINDOW ')]
              assert len(windows)==6,(load,'incomplete windows',len(windows))
              def get(row,key):
                  match=re.search(r'\b'+re.escape(key)+r'=([0-9.]+)',row)
                  assert match,(load,key,row)
                  return float(match.group(1))
              stats={k:round(sum(get(s,k) for s in windows),3) for k in ('wall','cpu','allocMB')}
              stats['seconds']=6*43200
              stats['throughput']=round(stats['seconds']/stats['wall'],2)
              stats['final']={k:get(windows[-1],k) for k in ('pop','alive','dead','employed','travelling','openWorks','ledger','history','meals','wages')}
              for i in range(7):
                  assert (root/load/f'checkpoint-{i}.json').is_file(),(load,'checkpoint',i)
              print('PR57_REAL_GROWTH_RESULT',json.dumps(dict(load=load,**stats),sort_keys=True))
          PY
      - name: Preserve complete checkpoints and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          path: artifacts/real-growth/**
          retention-days: 14
