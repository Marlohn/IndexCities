name: Integrated core PR57 progressive real-housing 40-house viability

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  progressive-cycle:
    name: Real construction 40-house load, 8 days capped
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated simulation Release
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Observe economic and causal progress with ordinary construction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-cycle-40
          echo "PR57_LOAD_PROBE seed=42 cycle-houses=40 bypass=1 days=16 window=43200 cap=240 lookup=1 profile-from-window=16" | tee artifacts/pr57-cycle-40/run.log
          PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_CYCLE_SOUTH_HOUSING=1 PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 PR57_PROFILE_FROM_WINDOW=16 timeout 480s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --warmup=0 --cycle-houses=40 --cycle-bypass=1 --days=16 --window=43200 --cap=240 | tee -a artifacts/pr57-cycle-40/run.log
      - name: Report completed windows and growth without assuming success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/pr57-cycle-40/summary.log
          import pathlib,re
          log=pathlib.Path('artifacts/pr57-cycle-40/run.log').read_text()
          match=re.search(r'CYCLE_HOUSING requested=(\d+) placed=(\d+) attempted=(\d+)',log)
          assert match, 'missing actual ordered house count'
          requested,placed,attempted=map(int,match.groups())
          windows=re.findall(r'^WINDOW (\d+) seconds=43200 .*$',log,re.M)
          checkpoints=re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]{64}) ',log,re.M)
          print(f'PR57_LOAD_RESULT requested={requested} placed={placed} attempted={attempted} windows={len(windows)}/16 checkpoints={len(checkpoints)}')
          for line in re.findall(r'^(?:WINDOW (?:1|12|13|14|15|16) |STEP_PHASE |STEP_PROFILE |SUMMARY |SAVE |INVARIANTS ).*$',log,re.M):
              print(line)
          assert requested==40 and placed>=32, 'housing orders did not expand as expected'
          assert len(windows)==16 and len(checkpoints)==16, '8 days not completed within bounded wall cap'
          assert [int(x) for x in windows]==list(range(1,17)), 'window continuity'
          assert [int(x) for x,_ in checkpoints]==list(range(1,17)), 'checkpoint continuity'
          assert 'INVARIANTS OK' in log and 'SAVE ' in log, 'invariants or save/load missing'
          print('PR57_LOAD_SCOPE no A/B speedup claim; genuine construction and economic throughput only; not 10k/80y',flush=True)
          PY
      - name: Preserve logs even on incomplete horizon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-cycle-40-viability
          path: artifacts/pr57-cycle-40/**
          if-no-files-found: warn
          retention-days: 14
