name: Integrated core PR57 maintenance-onset discriminant

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  maintenance-profile:
    name: Seed42 real-road cycle, first maintenance burst at 6.5d
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated simulation
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Profile first costly window, preserve all real systems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-maintenance
          echo "PR57_MODE seed42 bypass=1 housesRequested=32 (18 valid last run), horizon=6.5d, profile ONLY window13, no performance flags, same real construction and maintenance"
          PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 PR57_PROFILE_FROM_WINDOW=13 timeout 220s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --warmup=0 --cycle-houses=32 --cycle-bypass=1 --days=13 --window=43200 --cap=210 | tee artifacts/pr57-maintenance/seed42-onset.log
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('artifacts/pr57-maintenance/seed42-onset.log').read_text()
          windows=re.findall(r'^WINDOW (\d+) seconds=43200 wall=([0-9.]+)s .*allocMB=([0-9.]+) .*$',s,re.M)
          checks=re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]{64}) ',s,re.M)
          assert [int(w[0]) for w in windows]==list(range(1,14)),('incomplete maintenance onset',len(windows))
          assert [int(c[0]) for c in checks]==list(range(1,14)),('missing checkpoints',len(checks))
          assert 'INVARIANTS OK' in s and 'STOP limite' not in s, 'incomplete simulation'
          save=re.search(r'^SAVE .* sha256=([A-F0-9]{64})$',s,re.M)
          assert save and save.group(1)==checks[-1][1], 'save/load mismatch'
          assert 'STEP_PROFILE steps=' in s and 'STEP_PHASE name=' in s, 'missing window13 profile'
          assert re.search(r'^PR57_WORK_DIAG window=13 .*$',s,re.M), 'missing final work diagnostics'
          expected={12:'ECAC898C015D950F2DDA480E4C5D939B25A0C9A658B078674FF2CE8E05A86349',13:'E37C553ADFCD791E9322B20F023D4B739BB9DD3734307DB45675F0AFC3DD3153'}
          for i,sha in checks:
              if int(i) in expected:print(f'PR57_PROFILE_CHECKPOINT window={i} sameAsUnprofiled={sha==expected[int(i)]} sha={sha}',flush=True)
          print(f'PR57_PROFILE_RESULT seconds=561600 wall={sum(float(w[1]) for w in windows):.2f} window13Wall={windows[-1][1]} window13AllocMB={windows[-1][2]} finalSha={save.group(1)}',flush=True)
          PY
      - name: Preserve maintenance-onset logs including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-maintenance-onset
          path: artifacts/pr57-maintenance/*.log
          if-no-files-found: warn
          retention-days: 14
