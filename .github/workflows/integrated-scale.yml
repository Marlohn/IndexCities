name: Integrated core PR57 zero-distance safety economic 48h A/B

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-site-economic-ab:
    name: Real integrated grid seed73 zero-distance site 48h economic ABBA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real integrated headless
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Adversarial movements with and without zero-site optimization
        run: |
          for zero in 0 1; do
            PR57_ACTIVE_SCAN=1 PR57_BITSET_SCAN=1 PR57_CORRIDOR_SCAN=1 PR57_SPLIT_CORRIDOR=0 PR57_ZERO_BEND_SKIP=1 PR57_ZERO_SITE_SKIP="$zero" dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter "FullyQualifiedName~DualExitConflictExperiment|FullyQualifiedName~DockCorridorTests|FullyQualifiedName~LaneEntrySlotTests|FullyQualifiedName~LaneTurnBodyTests|FullyQualifiedName~PedestrianCrossingTests|FullyQualifiedName~SharedSpaceTests"
          done
      - name: Seed73 integrated grid 48h wages meals zero-site ABBA and checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          run_one() {
            local mode="$1" label="$2" zero=0
            if [[ "$mode" == "candidate" ]]; then zero=1; fi
            PR57_ACTIVE_SCAN=1 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=1 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=1 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=1 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ZERO_BEND_SKIP=1 PR57_ZERO_SITE_SKIP="$zero" PR57_FAST_SCAN=1 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 timeout 150s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile grid --seed=73 --warmup=0 --days=8 --window=21600 --cap=150 --rows=6 --length=600 --signals=1 | tee "artifacts/integrated-scale-probe/${label}.log"
          }
          run_one control a_control
          run_one candidate a_candidate
          run_one candidate b_candidate
          run_one control b_control
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/integrated-scale-probe')
          results={}
          for label in ('a_control','a_candidate','b_candidate','b_control'):
              data=(root/(label+'.log')).read_text()
              for token in ('WINDOW 1 ','WINDOW 8 ','SUMMARY windows=8 secondsEach=21600','INVARIANTS OK','SAVE '):
                  assert token in data,(label,token)
              assert 'STOP limite' not in data,(label,'cap exceeded')
              windows=re.findall(r'^WINDOW (\d+) seconds=21600 wall=([0-9.]+)s eff=\d+x cpu=([0-9.]+)s allocMB=([0-9.]+) gc0=(\d+) gc2=(\d+) (.*)$',data,re.M)
              assert len(windows)==8 and [int(x[0]) for x in windows]==list(range(1,9)),(label,windows)
              checkpoints=tuple(re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]{64}) (.*)$',data,re.M))
              assert len(checkpoints)==8 and [int(x[0]) for x in checkpoints]==list(range(1,9)),(label,checkpoints)
              save=re.search(r'^SAVE .* sha256=([A-F0-9]{64})$',data,re.M)
              assert save and save.group(1)==checkpoints[-1][1],(label,'save mismatch')
              scans=re.findall(r'^\s*VEHICLE_SCAN name=(\S+) wall=([0-9.]+)s visits=(\d+) hits=(\d+)',data,re.M)
              assert len(scans)>=2,(label,scans)
              summary=[line for line in data.splitlines() if line.startswith('SUMMARY windows=8 ')][0]
              wall=sum(float(x[1]) for x in windows)
              cpu=sum(float(x[2]) for x in windows)
              alloc=sum(float(x[3]) for x in windows)
              gc0=sum(int(x[4]) for x in windows)
              gc2=sum(int(x[5]) for x in windows)
              meals=int(re.search(r'\bmeals=(\d+)',checkpoints[-1][2]).group(1))
              wages=float(re.search(r'\bwages=([0-9.]+)',checkpoints[-1][2]).group(1))
              assert meals>0 and wages>0,(label,meals,wages,'economic cycle not exercised')
              results[label]={'wall':wall,'cpu':cpu,'alloc':alloc,'gc0':gc0,'gc2':gc2,'checkpoints':checkpoints,'save':save.group(1),'scans':scans,'summary':summary}
              print(f'PR57_ZERO_SITE label={label} wall={wall:.3f}s cpu={cpu:.3f}s allocMB={alloc:.1f} gc0={gc0} gc2={gc2} sha={save.group(1)} scans={scans} finalActivity={checkpoints[-1][2]} summary={summary}',flush=True)
          assert len({r['save'] for r in results.values()})==1,'final save divergence'
          assert len({tuple((x[0],x[1]) for x in r['checkpoints']) for r in results.values()})==1,'checkpoint SHA divergence'
          assert len({tuple((x[0],x[2]) for x in r['checkpoints']) for r in results.values()})==1,'checkpoint activity divergence'
          assert len({r['scans'][0][3] for r in results.values()})==1,'lane scan hits divergence'
          for letter in ('a','b'):
              c=results[f'{letter}_control']
              b=results[f'{letter}_candidate']
              assert [(x[0],x[2],x[3]) for x in b['scans']]==[(x[0],x[2],x[3]) for x in c['scans']],'physical scan count divergence'
              print(f'PR57_ZERO_SITE_AB order={letter} control={c["wall"]:.3f}s candidate={b["wall"]:.3f}s speedup={c["wall"]/b["wall"]:.3f}x cpuControl={c["cpu"]:.3f}s cpuCandidate={b["cpu"]:.3f}s allocControlMB={c["alloc"]:.1f} allocCandidateMB={b["alloc"]:.1f}',flush=True)
          print('PR57_ZERO_SITE_ACTIVITY '+results['a_control']['checkpoints'][-1][2],flush=True)
          PY
      - name: Preserve full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-zero-distance-site-seed73-48h-abba
          path: artifacts/integrated-scale-probe/*.log
          if-no-files-found: warn
          retention-days: 30
