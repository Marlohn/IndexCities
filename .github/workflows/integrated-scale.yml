name: Integrated core PR57 real-cycle stranded tow diagnosis

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  cycle-real-tow-diagnosis:
    name: Seed42 6h stranded vehicle and tow state, unflagged
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real integrated simulation
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Observe stranded vehicle and physical tow plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          echo 'PR57_MODE base no PR57 performance flags, fresh dotnet process, diagnostic-only'
          PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 timeout 90s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- scale cycle --seed=42 --warmup=0 --cycle-houses=16 --days=1 --window=21600 --cap=60 | tee artifacts/integrated-scale-probe/cycle-tow-diagnosis.log
          python3 - <<'PY'
          import pathlib,re
          data=pathlib.Path('artifacts/integrated-scale-probe/cycle-tow-diagnosis.log').read_text()
          checkpoint=re.search(r'^PR57_AB_CHECKPOINT window=1 sha256=([A-F0-9]{64}) ',data,re.M)
          assert checkpoint and checkpoint.group(1)=='6D32238F95E83F47A749BB6F4314C58BABFCAE94428A572BD2D364CE04F0CB6D','6h state mismatch'
          assert 'INVARIANTS OK' in data and 'STOP limite' not in data,'incomplete run'
          save=re.search(r'^SAVE .* sha256=([A-F0-9]{64})$',data,re.M)
          assert save and save.group(1)==checkpoint.group(1),'save mismatch'
          stranded=re.findall(r'^PR57_TOW_STATE window=1 .*$',data,re.M)
          assert any('id=22 ' in line for line in stranded),'missing stranded vehicle 22'
          for line in stranded:print(line,flush=True)
          print('PR57_TOW_VALIDATED seconds=21600 sha='+save.group(1),flush=True)
          PY
      - name: Preserve diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-cycle-real-tow-seed42
          path: artifacts/integrated-scale-probe/*.log
          if-no-files-found: warn
          retention-days: 30
