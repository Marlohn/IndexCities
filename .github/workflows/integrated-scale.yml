name: 'PR57 real 121-citizen active economy phase profile'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-active-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and existing simulation tests
        run: |
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic paid-workplace economic checkpoint from prior successful CI
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/real-growth
      - name: Same real 121-SIM save, baseline wall then causal phase profile
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/real-growth -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          test -n "$source" && test -s "$source"
          echo "PR57_REPRESENTATIVE_SOURCE path=$source sha256=$(sha256sum "$source" | cut -d' ' -f1)"
          for mode in scale profile; do
            mkdir -p "artifacts/real-121/$mode"
            echo "PR57_REPRESENTATIVE_MODE mode=$mode cadence=Advance(2) windows=2 windowSeconds=7200 seed=42"
            PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 \
            PR57_DYNAMIC_BVH=0 PR57_PARALLEL_NEEDS=0 PR57_STAFF_PHASE_FUSION=0 \
            PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 PR57_PARALLEL_POLLUTION=0 \
            PR57_CONSTRUCTION_WAIT_AGENDA=0 PR57_DISPATCH_SHIPMENT_LOOKUP=0 \
            PR57_ROUTE_TREE=0 PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 \
            PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 PR57_PEDESTRIAN_GRID=0 \
            PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0 \
            PR57_SAVE_CAPTURE_DIR="$PWD/artifacts/real-121/$mode" \
              timeout 480s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$mode" cycle --resume="$source" --warmup=0 --days=2 --window=7200 --cap=300 \
              | tee "artifacts/real-121/$mode.log"
          done
      - name: Validate all intermediate saves and report actual dominant phase
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,re
          root=pathlib.Path('artifacts/real-121')
          for mode in ('scale','profile'):
              log=(root/f'{mode}.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(mode,'invariants/save')
              windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(windows)==2,(mode,'incomplete',len(windows))
              print('PR57_REAL121',mode,'; '.join(windows))
              for i in range(3):
                  file=root/mode/f'checkpoint-{i}.json'
                  assert file.is_file(),(mode,i)
                  assert file.read_bytes()==(root/'scale'/f'checkpoint-{i}.json').read_bytes(),(mode,'causal mismatch',i)
          phases=[]
          for line in (root/'profile.log').read_text().splitlines():
              if 'STEP_PHASE name=' not in line:continue
              m=re.search(r'name=([\w-]+) wall=([0-9.]+)s share=([0-9.]+)%',line)
              assert m,line
              phases.append((float(m.group(2)),m.group(1),float(m.group(3))))
          assert len(phases)==13,('missing phases',len(phases))
          print('PR57_REAL121_DOMINANT_PHASES',sorted(phases,reverse=True)[:6])
          print('PR57_REAL121_CHECKPOINTS_MATCH',3,'no optimizer enabled; profile observation only')
          PY
      - name: Preserve raw baseline, profile and exact checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-121-phase
          path: artifacts/real-121/**
          retention-days: 14
