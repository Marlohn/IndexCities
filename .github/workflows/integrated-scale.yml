name: Integrated core PR57 paid-road population expansion viability

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  paid-road-growth:
    name: Real south extension, 40 legal housing orders, four simulated days
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated simulation Release
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Observe normal road construction and real housing, without boosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-paid-road
          PR57_CYCLE_SOUTH_EXTENSION=1 PR57_CYCLE_SOUTH_HOUSING=1 PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=0 PR57_PROFILE_FROM_WINDOW=8 timeout 420s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile cycle --seed=42 --warmup=0 --cycle-houses=40 --cycle-bypass=1 --days=8 --window=43200 --cap=260 | tee artifacts/pr57-paid-road/run.log
      - name: Validate the discriminating growth observations
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PR57_EXTENSION_READY completed=2/2' artifacts/pr57-paid-road/run.log
          grep -Eq 'CYCLE_HOUSING requested=40 placed=(3[3-9]|40) ' artifacts/pr57-paid-road/run.log
          grep -q 'WINDOW 8 seconds=43200 ' artifacts/pr57-paid-road/run.log
          grep -q 'PR57_AB_CHECKPOINT window=8 ' artifacts/pr57-paid-road/run.log
          grep -q 'INVARIANTS OK' artifacts/pr57-paid-road/run.log
          grep -q '^SAVE ' artifacts/pr57-paid-road/run.log
          echo 'PR57_PAID_ROAD_RESULT: new legal frontage and >32 new housing orders observed; four days, not 10k/80y'
      - name: Preserve real-economy and performance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-paid-road-growth
          path: artifacts/pr57-paid-road/**
          if-no-files-found: warn
          retention-days: 14
