name: Integrated core PR57 short causal trace of real blocked movement boundaries

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  blocked-boundary:
    name: Independent control/trace of authentic checkpoint 12, 120 seconds
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore authentic six-day city without regenerating it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/pr57-source
          gh run download 40169101306 -n integrated-scale-pr57-legal-workplaces-8d -D artifacts/pr57-source
          test -s artifacts/pr57-source/pr57-jobs-20/checkpoint-12.json
      - name: Build integrated core Release with observational trace
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Fresh-process control and read-only trace, same real city and physics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-target-trace
          run_one() {
            local mode="$1" trace=0
            if [ "$mode" = "trace" ]; then trace=1; fi
            mkdir -p "artifacts/pr57-target-trace/$mode"
            echo "PR57_TARGET_MODE mode=$mode trace=$trace seed=42 source=checkpoint12 seconds=120 window=30 dispatchLookup=1 otherFlags=0"
            PR57_SAVE_CAPTURE_DIR="artifacts/pr57-target-trace/$mode" PR57_AB_CHECKPOINT=1 PR57_PROFILE_FROM_WINDOW=1 \
            PR57_TARGET_BLOCK_TRACE="$trace" PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_PENETRATION_STACK_AXES=0 \
            PR57_ACTIVE_SCAN=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_SPATIAL_SCAN=0 \
            PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 \
            PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 \
            PR57_ENTRY_FRAME_REUSE=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 \
            timeout 90s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
              profile cycle --seed=42 --resume=artifacts/pr57-source/pr57-jobs-20/checkpoint-12.json \
              --warmup=0 --days=4 --window=30 --cap=85
          }
          run_one control | tee artifacts/pr57-target-trace/control.log
          run_one trace | tee artifacts/pr57-target-trace/trace.log
      - name: Audit complete causal checkpoints and real population without freezing demographics
        shell: bash
        run: |
          python3 - <<'PY' | tee artifacts/pr57-target-trace/audit.log
          import hashlib, json, pathlib
          root=pathlib.Path('artifacts/pr57-target-trace')
          source=pathlib.Path('artifacts/pr57-source/pr57-jobs-20/checkpoint-12.json').read_bytes()
          start=json.loads(source)['ElapsedSecondsUnits']
          for mode in ('control','trace'):
              log=(root/f'{mode}.log').read_text()
              assert 'INVARIANTS OK' in log and any(x.startswith('SAVE ') for x in log.splitlines()),mode
              lines=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(lines)==4 and [int(x.split()[1]) for x in lines]==[1,2,3,4],(mode,lines)
              assert (root/mode/'checkpoint-0.json').read_bytes()==source,(mode,'source')
              if mode=='trace':
                  assert 'PR57_TRACE_OUTER' in log and 'PR57_TRACE_SLICE' in log and 'PR57_TARGET_HOLD vehicle=1107' in log
          for i in range(5):
              a=(root/'control'/f'checkpoint-{i}.json').read_bytes()
              b=(root/'trace'/f'checkpoint-{i}.json').read_bytes()
              control=json.loads(a); trace=json.loads(b)
              assert control['ElapsedSecondsUnits']==start+i*30_000_000,('clock',i)
              assert trace['ElapsedSecondsUnits']==control['ElapsedSecondsUnits'],('clock trace',i)
              print('PR57_TARGET_CHECKPOINT',json.dumps(dict(window=i,controlSha256=hashlib.sha256(a).hexdigest(),
                traceSha256=hashlib.sha256(b).hexdigest(),sameBytes=a==b,
                livingResidents=sum(c['Alive'] and c['Resident'] for c in control['Citizens']),
                livingExternal=sum(c['Alive'] and not c['Resident'] for c in control['Citizens']),
                dead=sum(not c['Alive'] for c in control['Citizens']),
                travelling=sum(v['Status']=='Travelling' for v in control['Vehicles']),
                ledger=len(control['Ledger']),history=sum(len(c['History']) for c in control['Citizens'])),sort_keys=True))
              assert a==b,('Full-state mismatch; inspect both preserved saves',i)
          print('PR57_TARGET_RESULT','4 windows x 30s, two fresh .NET processes, exact checkpoint bytes, no speed claim; trace samples only net state changes per slice, not every internal event.')
          PY
      - name: Preserve logs and complete saves, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-targeted-boundary-trace
          path: artifacts/pr57-target-trace/**
          if-no-files-found: warn
          retention-days: 14
