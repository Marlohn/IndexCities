name: Integrated core PR57 real-cycle construction bottleneck diagnosis

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  cycle-real-work-diagnosis:
    name: Seed42 real construction 4d, unflagged, work states and causality
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real integrated simulation
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Observe pending construction, material flow and real activity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          echo 'PR57_MODE base no PR57 performance flags, fresh dotnet process, diagnostic-only'
          PR57_ACTIVE_SCAN=0 PR57_SPATIAL_SCAN=0 PR57_BITSET_SCAN=0 PR57_BEND_REUSE=0 PR57_DOCK_GATE_HOIST=0 PR57_DOCK_AABB=0 PR57_GATE_REUSE=0 PR57_CORRIDOR_SCAN=0 PR57_SPLIT_CORRIDOR=0 PR57_BATCH_ORDER=0 PR57_ZERO_BEND_SKIP=0 PR57_ZERO_SITE_SKIP=0 PR57_FAST_SCAN=0 PR57_BEND_PREFILTER=0 PR57_AB_CHECKPOINT=1 PR57_WORK_DIAG=1 timeout 240s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- scale cycle --seed=42 --warmup=0 --cycle-houses=16 --days=8 --window=43200 --cap=180 | tee artifacts/integrated-scale-probe/cycle-work-diagnosis.log
          python3 - <<'PY'
          import pathlib,re
          data=pathlib.Path('artifacts/integrated-scale-probe/cycle-work-diagnosis.log').read_text()
          windows=re.findall(r'^WINDOW (\d+) seconds=43200 wall=([0-9.]+)s .*$',data,re.M)
          checkpoints=re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]{64}) ',data,re.M)
          diagnostics=re.findall(r'^PR57_WORK_DIAG window=(\d+) .*$',data,re.M)
          assert [int(w[0]) for w in windows]==list(range(1,9)),('incomplete windows',len(windows))
          assert [int(x[0]) for x in checkpoints]==list(range(1,9)),('missing checkpoints',len(checkpoints))
          assert diagnostics==['1','4','8'],('missing diagnostics',diagnostics)
          assert 'INVARIANTS OK' in data and 'SAVE ' in data and 'STOP limite' not in data,'incomplete run'
          save=re.search(r'^SAVE .* sha256=([A-F0-9]{64})$',data,re.M)
          assert save and save.group(1)==checkpoints[-1][1],'save/checkpoint mismatch'
          expected='3AA8052D533C4133EEE5EDF6521DE441CDD5A7B19E2662BE1E3FB310E1E84645'
          assert checkpoints[-1][1]==expected,('diagnostic changed state or baseline changed',checkpoints[-1][1])
          for w in ('1','4','8'):
              projects=re.findall(r'^PR57_WORK_PROJECT window='+w+r' .*$',data,re.M)
              print(f'PR57_WORK_COUNT window={w} projects={len(projects)}',flush=True)
              for p in projects:print(p,flush=True)
          print('PR57_WORK_VALIDATED windows=8 seconds=345600 sha='+save.group(1)+' wall='+str(sum(float(x[1]) for x in windows)),flush=True)
          PY
      - name: Preserve diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-cycle-real-work-diagnosis-seed42
          path: artifacts/integrated-scale-probe/*.log
          if-no-files-found: warn
          retention-days: 30
