name: PR57 opt-in pedestrian spatial index causal A/B

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  pedestrian-index:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore previously captured authentic economic city (no regeneration)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/pr57-source
          gh run download 40169101306 -n integrated-scale-pr57-legal-workplaces-8d -D artifacts/pr57-source
          test -s artifacts/pr57-source/pr57-jobs-20/checkpoint-0.json
          test -s artifacts/pr57-source/pr57-jobs-20/checkpoint-12.json
      - name: Build and run existing simulation tests
        run: |
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Separate-process A/B on authentic uncongested and congested checkpoints and artificial grid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-pedestrian-grid
          run_one() {
            local scenario="$1" mode="$2" source="$3" windows="$4" seconds="$5"
            local enabled=0
            if [ "$mode" = "candidate" ]; then enabled=1; fi
            mkdir -p "artifacts/pr57-pedestrian-grid/$scenario/$mode"
            echo "PR57_GRID_RUN scenario=$scenario mode=$mode enabled=$enabled seed=42 windows=$windows seconds=$seconds"
            if [ "$scenario" = "artificial-grid" ]; then
              PR57_PEDESTRIAN_GRID="$enabled" PR57_GRID_DIAG=1 PR57_DISPATCH_SHIPMENT_LOOKUP=1 \
              PR57_AB_CHECKPOINT=1 PR57_SAVE_CAPTURE_DIR="artifacts/pr57-pedestrian-grid/$scenario/$mode" \
              timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                scale grid --seed=42 --rows=8 --length=600 --signals=1 --warmup=0 --days="$windows" --window="$seconds" --cap=150
            else
              PR57_PEDESTRIAN_GRID="$enabled" PR57_GRID_DIAG=1 PR57_DISPATCH_SHIPMENT_LOOKUP=1 \
              PR57_AB_CHECKPOINT=1 PR57_SAVE_CAPTURE_DIR="artifacts/pr57-pedestrian-grid/$scenario/$mode" \
              timeout 100s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                scale cycle --seed=42 --resume="$source" --warmup=0 --days="$windows" --window="$seconds" --cap=90
            fi
          }
          run_one real-low control artifacts/pr57-source/pr57-jobs-20/checkpoint-0.json 4 120 | tee artifacts/pr57-pedestrian-grid/real-low-control.log
          run_one real-low candidate artifacts/pr57-source/pr57-jobs-20/checkpoint-0.json 4 120 | tee artifacts/pr57-pedestrian-grid/real-low-candidate.log
          run_one real-congested candidate artifacts/pr57-source/pr57-jobs-20/checkpoint-12.json 4 120 | tee artifacts/pr57-pedestrian-grid/real-congested-candidate.log
          run_one real-congested control artifacts/pr57-source/pr57-jobs-20/checkpoint-12.json 4 120 | tee artifacts/pr57-pedestrian-grid/real-congested-control.log
          run_one artificial-grid control none 3 300 | tee artifacts/pr57-pedestrian-grid/artificial-grid-control.log
          run_one artificial-grid candidate none 3 300 | tee artifacts/pr57-pedestrian-grid/artificial-grid-candidate.log
      - name: Audit intermediate full saves, activity, actual wall/cpu/alloc and save-load
        shell: bash
        run: |
          python3 - <<'PY' | tee artifacts/pr57-pedestrian-grid/audit.log
          import hashlib,json,pathlib,re
          root=pathlib.Path('artifacts/pr57-pedestrian-grid')
          for scenario,windows in [('real-low',4),('real-congested',4),('artificial-grid',3)]:
              metrics={}
              for mode in ('control','candidate'):
                  log=(root/f'{scenario}-{mode}.log').read_text()
                  assert f'PR57_PEDESTRIAN_GRID active={str(mode=="candidate")}' in log,(scenario,mode,'flag')
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(scenario,mode,'invariants/save')
                  lines=[x for x in log.splitlines() if x.startswith('WINDOW ')]
                  assert len(lines)==windows,(scenario,mode,len(lines))
                  rows=[]
                  for line in lines:
                      row={k:float(v) for k,v in re.findall(r'\b(wall|cpu|allocMB|eff)=([0-9.]+)',line)}
                      assert {'wall','cpu','allocMB','eff'}<=row.keys(),(scenario,mode,line)
                      rows.append(row)
                  metrics[mode]={k:sum(row[k] for row in rows) for k in ('wall','cpu','allocMB')}
              for i in range(windows+1):
                  a=(root/scenario/'control'/f'checkpoint-{i}.json').read_bytes()
                  b=(root/scenario/'candidate'/f'checkpoint-{i}.json').read_bytes()
                  state=json.loads(a)
                  summary=dict(scenario=scenario,window=i,sameBytes=a==b,
                    shaControl=hashlib.sha256(a).hexdigest(),shaCandidate=hashlib.sha256(b).hexdigest(),
                    livingResidents=sum(c['Alive'] and c['Resident'] for c in state['Citizens']),
                    livingExternal=sum(c['Alive'] and not c['Resident'] for c in state['Citizens']),
                    movingWalkers=sum(c['Alive'] and c['Moving'] and c['VehicleId'] is None for c in state['Citizens']),
                    travelling=sum(v['Status']=='Travelling' for v in state['Vehicles']),
                    ledger=len(state['Ledger']),cityEvents=len(state['CityEvents']),
                    history=sum(len(c['History']) for c in state['Citizens']))
                  print('PR57_GRID_CHECKPOINT',json.dumps(summary,sort_keys=True))
                  assert a==b,('Full causal checkpoint mismatch; inspect preserved saves',scenario,i)
              c=metrics['control'];v=metrics['candidate']
              print('PR57_GRID_AB',json.dumps(dict(scenario=scenario,control=c,candidate=v,
                wallGainPct=100*(c['wall']-v['wall'])/c['wall'],
                cpuGainPct=100*(c['cpu']-v['cpu'])/max(.001,c['cpu']),
                allocGainPct=100*(c['allocMB']-v['allocMB'])/max(.001,c['allocMB']),
                incrementalOverDispatchLookup=True,artificial=scenario=='artificial-grid'),sort_keys=True))
          PY
      - name: Preserve logs and complete saves even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-pedestrian-grid-ab
          path: artifacts/pr57-pedestrian-grid/**
          if-no-files-found: warn
          retention-days: 14
