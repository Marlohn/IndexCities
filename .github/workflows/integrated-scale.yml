name: Integrated real-core bounded first-hour seed divergence

on:
  push:
    branches:
      - experimento/escala-motor-integrado-10k-80y
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase-profile:
    name: Expanded first-hour seeds 42/73 control vs profile
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real-core headless (Release)
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Compare bounded four-hour windows, no skipped quanta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          echo "PROBE_SHA=${GITHUB_SHA}"
          for seed in 42 73; do
            fixture="expanded-seed${seed}"
            rows=10; length=800
            for mode in scale profile; do
              echo "=== PROBE_START fixture=${fixture} mode=${mode} seed=${seed} rows=${rows} length=${length} seconds=3600 warmup=0 ==="
              TIMEFORMAT='TIME totalReal=%3R cpuUser=%3U cpuSystem=%3S'
              { time timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- "${mode}" grid --seed=${seed} --warmup=0 --days=1 --window=3600 --cap=150 --rows="${rows}" --length="${length}" --signals=1; } 2>&1 | tee "artifacts/integrated-scale-probe/${fixture}-${mode}.log"
              grep -q '^SUMMARY windows=1 secondsEach=3600 ' "artifacts/integrated-scale-probe/${fixture}-${mode}.log"
              grep -q '^INVARIANTS OK$' "artifacts/integrated-scale-probe/${fixture}-${mode}.log"
            done
            test "$(grep -c '^  STEP_PHASE ' "artifacts/integrated-scale-probe/${fixture}-profile.log")" -eq 13
            test "$(grep -c '^  STEP_DETAIL ' "artifacts/integrated-scale-probe/${fixture}-profile.log")" -eq 8
            grep -q '^STEP_PROFILE steps=1800 ' "artifacts/integrated-scale-probe/${fixture}-profile.log"
            grep -q '^VEHICLE_PROFILE steps=1800 ' "artifacts/integrated-scale-probe/${fixture}-profile.log"
            test "$(grep -c '^  VEHICLE_DETAIL ' "artifacts/integrated-scale-probe/${fixture}-profile.log")" -eq 4
            test "$(grep -c '^  VEHICLE_SCAN ' "artifacts/integrated-scale-probe/${fixture}-profile.log")" -eq 2
            grep -q '^LANE_HOLD_RADIUS hits=' "artifacts/integrated-scale-probe/${fixture}-profile.log"
            grep -q '^LANE_LEADER_WINNERS selected=' "artifacts/integrated-scale-probe/${fixture}-profile.log"
            base=$(sed -n 's/.*sha256=\([0-9A-F]*\).*/\1/p' "artifacts/integrated-scale-probe/${fixture}-scale.log" | tail -n 1)
            observed=$(sed -n 's/.*sha256=\([0-9A-F]*\).*/\1/p' "artifacts/integrated-scale-probe/${fixture}-profile.log" | tail -n 1)
            echo "PROBE_SHA_COMPARE fixture=${fixture} base=${base} profiled=${observed} equal=$([[ -n "$base" && "$base" == "$observed" ]] && echo true || echo false)"
            if [[ -z "$base" || "$base" != "$observed" ]]; then echo "::error::Profile changed final save"; exit 1; fi
          done
      - name: Attach bounded raw controls and phase timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-4h-probe-raw
          path: artifacts/integrated-scale-probe/*.log
          if-no-files-found: warn
          retention-days: 30
