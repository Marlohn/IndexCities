name: 'PR57 waiting-project causal invalidations - truck return and paid road reconnection'

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Simulation/**
      - tests/IndexCities.Simulation.Tests/Pr57ConstructionWaitAdversarial.cs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false

jobs:
  wait-invalidations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build experimental causal tests
        run: dotnet build tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Independent .NET processes, identical one-truck causal scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr57-wait-invalidations
          for mode in control candidate; do
            flag=0
            if [[ "$mode" == candidate ]]; then flag=1; fi
            mkdir -p "artifacts/pr57-wait-invalidations/$mode"
            PR57_CONSTRUCTION_WAIT_AGENDA="$flag" PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ROUTE_TREE=0 PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 PR57_WORK_ACCESS_INDEX=0 PR57_GRID_DIAG=1 \
            PR57_WAIT_ADVERSARIAL_DIR="$PWD/artifacts/pr57-wait-invalidations/$mode" \
              timeout 180s dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj --no-build -c Release \
              --filter FullyQualifiedName~Pr57ConstructionWaitAdversarial --logger "console;verbosity=detailed" \
              | tee "artifacts/pr57-wait-invalidations/$mode.log"
          done
      - name: Compare all intermediate saves and verify physical economic effects
        shell: bash
        run: |
          python3 - <<'PY' | tee artifacts/pr57-wait-invalidations/audit.log
          import pathlib,json,hashlib
          root=pathlib.Path('artifacts/pr57-wait-invalidations')
          for mode in ('control','candidate'):
              log=(root/f'{mode}.log').read_text()
              assert 'Test Run Successful.' in log and 'Passed:' in log,mode
              assert ('PR57_CONSTRUCTION_WAIT_AGENDA active=True' if mode=='candidate' else 'PR57_CONSTRUCTION_WAIT_AGENDA active=False') in log,mode
          for scenario,windows in [('truck-return',24),('road-rebuild',3)]:
              for i in range(windows+1):
                  a=(root/'control'/scenario/f'checkpoint-{i}.json').read_bytes()
                  b=(root/'candidate'/scenario/f'checkpoint-{i}.json').read_bytes()
                  assert a==b,('checkpoint divergence',scenario,i,hashlib.sha256(a).hexdigest(),hashlib.sha256(b).hexdigest())
              start=json.loads((root/'control'/scenario/'checkpoint-0.json').read_text())
              end=json.loads((root/'control'/scenario/f'checkpoint-{windows}.json').read_text())
              print('PR57_WAIT_INVALIDATIONS',json.dumps(dict(scenario=scenario,checkpoints=windows+1,
                  initialShipments=len(start['Shipments']),finalShipments=len(end['Shipments']),
                  initialLedger=len(start['Ledger']),finalLedger=len(end['Ledger']),
                  initialEvents=len(start['CityEvents']),finalEvents=len(end['CityEvents']),
                  elapsedSeconds=end['ElapsedSeconds']-start['ElapsedSeconds']),sort_keys=True))
          PY
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-wait-invalidations
          path: artifacts/pr57-wait-invalidations/**
          if-no-files-found: warn
          retention-days: 14
