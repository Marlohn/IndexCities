name: Integrated real-core hourly cost versus actual mobility

on:
  push:
    branches:
      - experimento/escala-motor-integrado-10k-80y
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hourly-cost:
    name: One-day hourly CPU, GC and active-mobility profile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real-core headless observer (Release)
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Compare per-hour observed costs in existing small and medium fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-hourly
          echo "HOURLY_COST_SHA=${GITHUB_SHA}"
          for fixture in small medium; do
            if [[ "$fixture" == small ]]; then
              rows=3; length=400
              expected=2D095BC89EB9A34D4A6AE8B1012F161B766720E806F9E5577C33F3029375C5E7
            else
              rows=6; length=600
              expected=0C5185A3A0A9B53EE7E53B228C7D8B0C9F8BF6FBE8C1A7C68C4DE3E8E89A562F
            fi
            echo "=== HOURLY_START fixture=${fixture} seed=42 rows=${rows} length=${length} ==="
            TIMEFORMAT='TIME totalReal=%3R cpuUser=%3U cpuSystem=%3S'
            { time timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- census grid --seed=42 --warmup=1 --days=1 --cap=150 --rows="${rows}" --length="${length}" --signals=1; } 2>&1 | tee "artifacts/integrated-scale-hourly/${fixture}.log"
            test "$(grep -c '^  HOUR_COST day=1 ' "artifacts/integrated-scale-hourly/${fixture}.log")" -eq 24
            grep -q '^SUMMARY days=1 ' "artifacts/integrated-scale-hourly/${fixture}.log"
            grep -q '^INVARIANTS OK$' "artifacts/integrated-scale-hourly/${fixture}.log"
            actual=$(sed -n 's/.*sha256=\([0-9A-F]*\).*/\1/p' "artifacts/integrated-scale-hourly/${fixture}.log" | tail -n 1)
            echo "HOURLY_SHA_COMPARE fixture=${fixture} current=${actual} priorCensus=${expected} equal=$([[ "$actual" == "$expected" ]] && echo true || echo false)"
            if [[ "$actual" != "$expected" ]]; then echo "::error::Observational profiler changed final save"; exit 1; fi
          done
      - name: Attach raw per-hour cost and mobility measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-hourly-cost-raw
          path: artifacts/integrated-scale-hourly/*.log
          if-no-files-found: warn
          retention-days: 30
