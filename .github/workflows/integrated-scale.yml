name: Integrated core PR57 cheap broad-phase and trig-hoist A/B

on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/integrated-scale.yml
      - src/IndexCities.Headless/**
      - src/IndexCities.Simulation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spatial-ab:
    name: Real integrated core fast scan ABBA and seed cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real integrated headless
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Compare exact control versus spatial candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated-scale-probe
          run_one() {
            local seed="$1" mode="$2" label="$3"
            local fast=0
            if [[ "$mode" == "candidate" ]]; then fast=1; fi
            PR57_ACTIVE_SCAN=1 PR57_SPATIAL_SCAN=0 PR57_FAST_SCAN="$fast" PR57_AB_CHECKPOINT=1 dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- profile grid --seed="$seed" --warmup=0 --days=3 --window=1500 --cap=150 --rows=10 --length=800 --signals=1 | tee "artifacts/integrated-scale-probe/${label}.log"
          }
          # Same runner and load; order reversal distinguishes warm-cache noise.
          run_one 73 control 73a_control
          run_one 73 candidate 73a_candidate
          run_one 73 candidate 73b_candidate
          run_one 73 control 73b_control
          # Distinct seed to test the filter outside the original queue.
          run_one 42 candidate 42_candidate
          run_one 42 control 42_control
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/integrated-scale-probe')
          results={}
          for seed in (73,42):
              names=(f'{seed}a_control',f'{seed}a_candidate',f'{seed}b_candidate',f'{seed}b_control') if seed==73 else ('42_candidate','42_control')
              for label in names:
                  s=(root/(label+'.log')).read_text()
                  for token in ('WINDOW 1 ','WINDOW 2 ','WINDOW 3 ','SUMMARY windows=3 secondsEach=1500','INVARIANTS OK','SAVE '):
                      assert token in s,(label,token)
                  sha=re.search(r'^SAVE .* sha256=([A-F0-9]+)$',s,re.M).group(1)
                  walls=[float(x) for x in re.findall(r'^WINDOW \d+ .* wall=([0-9.]+)s',s,re.M)]
                  assert len(walls)==3,(label,walls)
                  wall=sum(walls)
                  checkpoints=tuple(re.findall(r'^PR57_AB_CHECKPOINT window=(\d+) sha256=([A-F0-9]+)',s,re.M))
                  assert [x[0] for x in checkpoints]==['1','2','3'],(label,checkpoints)
                  visits=dict((name,int(num)) for name,num in re.findall(r'VEHICLE_SCAN name=(\S+) .* visits=(\d+)',s))
                  near=re.search(r'^BEND_PREFILTER total=(\d+) near=(\d+)',s,re.M)
                  results[label]=(sha,wall,visits,checkpoints)
                  print(f'PR57_FAST {label} sha={sha} wall={wall:.3f}s visits={visits} bendNear={near.groups() if near else None} checkpoints={checkpoints}',flush=True)
              assert len({results[n][0] for n in names})==1,f'save divergence seed {seed}'
              assert len({results[n][3] for n in names})==1,f'checkpoint divergence seed {seed}'
          for n in ('a','b'):
              control=results[f'73{n}_control'];candidate=results[f'73{n}_candidate']
              print(f'PR57_FAST_AB seed=73 order={n} speedup={control[1]/candidate[1]:.3f}x',flush=True)
          print(f'PR57_FAST_AB seed=42 speedup={results["42_control"][1]/results["42_candidate"][1]:.3f}x',flush=True)
          PY
      - name: Preserve full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-fast-ab
          path: artifacts/integrated-scale-probe/*.log
          if-no-files-found: warn
          retention-days: 30
