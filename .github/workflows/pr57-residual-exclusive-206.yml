      - name: Preserve full checkpoints and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-residual-exclusive-206
          path: artifacts/residual-exclusive-206/**
          retention-days: 14

      # Independent from PR comments: a status on the exact SHA is discoverable
      # by GitHub get_commit_combined_status and survives bot comment failures.
      - name: Publish final status on tested commit
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR57_TEST_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const status = process.env.PR57_TEST_JOB_STATUS;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.sha,
              state: status === 'success' ? 'success' : status === 'cancelled' ? 'error' : 'failure',
              context: 'pr57/residual-exclusive-206',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              description: `PR57 #206: ${status}; inspect full JSON parity and cost logs`
            });
