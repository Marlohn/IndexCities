name: 'PR57 #505 REAL late physical read/write graph'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-read-graph-505.yml, scripts/pr57-505-late-writer-samples.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  bounded-read-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_PARALLEL_NEEDS: '0'
      PR57_NEEDS_SINGLE_PASS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational read graph in disposable checkout
        run: |
          python3 scripts/pr57-504-inject-read-graph.py
          python3 scripts/pr57-505-late-writer-samples.py
      - name: Build and run full regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input259
      - name: Four fresh-process ABBA observations and exact save parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUN'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          source=Path('artifacts/input259/real14hREAL-control/checkpoint-0.json')
          raw=source.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'
          state=json.loads(raw)
          assert sum(bool(c['Alive']) for c in state['Citizens'])==121
          assert len(state['Vehicles'])==98
          root=Path('artifacts/pr57-505');root.mkdir(parents=True,exist_ok=True)
          arms={};starts=[];ends=[];observations=[]
          for arm in ('A1','B1','B2','A2'):
            dest=root/arm;dest.mkdir(parents=True,exist_ok=True)
            probe=arm.startswith('B')
            env=os.environ.copy()
            env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',PR57_GRID_DIAG='0',
                       PR57_SAVE_CAPTURE_DIR=str(dest.resolve()),
                       PR57_505_READ_GRAPH='1' if probe else '0')
            cmd=['dotnet','run','--no-build','-c','Release',
                 '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                 '--','profile','cycle','--seed=42','--warmup=0','--days=1',
                 '--window=200','--cap=300',f'--resume={source.resolve()}']
            with (dest/'full.log').open('w') as out:
              subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,check=True,timeout=300)
            log=(dest/'full.log').read_text()
            assert 'INVARIANTS OK' in log and 'SAVE ' in log,(arm,log[-2500:])
            assert 'STEP_PROFILE steps=100 ' in log,arm
            start=(dest/'checkpoint-0.json').read_bytes()
            end=(dest/'checkpoint-1.json').read_bytes()
            assert start==raw,arm
            starts.append(start);ends.append(end)
            rows=[line for line in log.splitlines() if line.startswith('PR57_505_READ_GRAPH ')]
            assert (len(rows)>=2 if probe else len(rows)==0),(arm,len(rows))
            if probe:
              parsed=[]
              for i,row in enumerate(rows,1):
                vals=dict(re.findall(r'(\w+)=(\d+)',row))
                assert int(vals['sample'])>=i and int(vals['fleet'])==98
                assert int(vals['rawEdges'])>=int(vals['eligibleEdges'])
                assert 1<=int(vals['rawLargest'])<=98
                assert 1<=int(vals['eligibleLargest'])<=98
                parsed.append({k:int(v) for k,v in vals.items()})
              observations.append(parsed)
            arms[arm]={'probe':probe,'initialSha256':hashlib.sha256(start).hexdigest(),
                       'finalSha256':hashlib.sha256(end).hexdigest(),'readGraph':rows}
            print('PR57_504_ARM',arm,'rows',len(rows),flush=True)
          assert all(x==starts[0] for x in starts)
          assert all(x==ends[0] for x in ends),'FULL_SAVE_PARITY_FAIL'
          assert observations[0]==observations[1],'READ_GRAPH_NONDETERMINISTIC'
          (root/'summary.json').write_text(json.dumps({'experiment':505,
            'scope':'four partial readers; physical slices sampled across 200 simulated seconds','authenticReal':True,
            'cadence':'individual Advance(2)','fullSaveParity':True,
            'acceptedGain':False,'arms':arms},indent=2,sort_keys=True))
          print('PR57_505_LATE_READ_GRAPH_ABBA_PASS',flush=True)
          PY_RUN
      - name: Preserve full checkpoints and read graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-read-graph-505
          path: artifacts/pr57-505
          retention-days: 14
          if-no-files-found: warn
