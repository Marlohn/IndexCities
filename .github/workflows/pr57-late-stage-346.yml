name: 'PR57 #346 REAL late-jam exclusive actor stages'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-late-stage-346.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  late-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject checkout-only late-stage and hourly phase observers
        run: |
          python3 scripts/pr57-346-inject.py
          python3 scripts/pr57-345-observe.py
      - name: Build authentic REAL replay and run simulation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Control and nine-slice observational probe, each Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/stage346/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_206_RESIDUAL_EXCLUSIVE="$flag" \
            PR57_244_STATE_COST="$flag" \
            PR57_244_PERSISTENT_IDS="1071,1243,1282,1380" \
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/stage346/$mode" > "artifacts/stage346/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|206_RESIDUAL|244_STATE) ' \
              "artifacts/stage346/$mode/full.log" > "artifacts/stage346/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/stage346/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/stage346/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/stage346/$mode/census.log"
          done
          cmp artifacts/stage346/control/checkpoint-10800.json \
              artifacts/stage346/probe/checkpoint-10800.json
          python3 - <<'PY' | tee artifacts/stage346/summary.txt
          from pathlib import Path
          root=Path("artifacts/stage346")
          def parse(mode,prefix):
              return [
                  {k:v for k,v in (item.split("=",1) for item in line.split()[1:] if "=" in item)}
                  for line in (root/mode/"census.log").read_text().splitlines()
                  if line.startswith(prefix+" ")
              ]
          rows=parse("probe","PR57_206_RESIDUAL")
          states=parse("probe","PR57_244_STATE")
          assert not parse("control","PR57_206_RESIDUAL")
          assert not parse("control","PR57_244_STATE")
          expected=[40001,40002,40003,50001,50002,50003,65001,65002,65003]
          assert [int(r["eligibleSlice"]) for r in rows]==expected, rows
          assert len(states)==45 and all(int(r["vehicles"])==98 for r in rows)
          assert all(int(r["cohortIds"])==4 for r in states)
          stages=[sum(float(r[f"s{i}Ms"]) for r in rows) for i in range(9)]
          total=sum(float(r["totalMs"]) for r in rows)
          assert abs(sum(stages)-total)<0.1,(stages,total)
          state_total=sum(float(r["totalMs"]) for r in states)
          assert abs(state_total-total)<0.1,(state_total,total)
          print(f"PR57_346_TOTAL samples={len(rows)} actors={sum(int(r['vehicles']) for r in rows)} "
                f"moved={sum(int(r['moved']) for r in rows)} totalActorMs={total:.6f} "
                "scope=NINE_INTRUSIVE_ACTOR_LOOPS_NOT_WALL_AB")
          for i,v in enumerate(stages):
              print(f"PR57_346_STAGE stage={i} ms={v:.6f} shareOfActorPct={100*v/total:.4f}")
          for name,subset in [("early",rows[:3]),("middle",rows[3:6]),("late",rows[6:9])]:
              subtotal=sum(float(r["totalMs"]) for r in subset)
              s3=sum(float(r["s3Ms"]) for r in subset)
              s4=sum(float(r["s4Ms"]) for r in subset)
              s6=sum(float(r["s6Ms"]) for r in subset)
              s7=sum(float(r["s7Ms"]) for r in subset)
              print(f"PR57_346_WINDOW name={name} totalMs={subtotal:.6f} "
                    f"lanePct={100*s3/subtotal:.4f} bendPct={100*s4/subtotal:.4f} "
                    f"postSafetyPct={100*s6/subtotal:.4f} admissionPct={100*s7/subtotal:.4f} "
                    "scope=ONLY_3_CONSECUTIVE_SLICES")
          for name in sorted({r["group"] for r in states}):
              group=[r for r in states if r["group"]==name]
              print(f"PR57_346_COHORT name={name} actors={sum(int(r['actors']) for r in group)} "
                    f"actorMs={sum(float(r['totalMs']) for r in group):.6f} "
                    "scope=POST_ACTOR_CLASSIFICATION")
          print("PR57_346_PARITY byteIdentical=TRUE noSkippedSlices=TRUE")
          PY
      - name: Upload raw logs, stage census, and canonical checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-late-stage-346
          path: artifacts/stage346/**
          if-no-files-found: warn
