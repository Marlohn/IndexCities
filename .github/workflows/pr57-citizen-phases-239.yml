name: 'PR57 #239 citizen phase setup and due-routine breakdown'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-citizen-phases-239.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  citizen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore exact #237 initial and later states
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Replay Advance(2) controls and intrusive citizen profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/citizen-239
          for case in worksREAL queueREAL gridARTIFICIAL; do
            fixture=cycle; horizon=200
            if [[ "$case" == gridARTIFICIAL ]]; then fixture=grid; horizon=100; fi
            for epoch in early late; do
              index=0
              if [[ "$epoch" == late ]]; then index=5; fi
              source="$(find artifacts/prior -type f -path "*/$case-control1/checkpoint-$index.json" -print -quit)"
              test -s "$source"
              echo "PR57_239_SOURCE case=$case epoch=$epoch sha256=$(sha256sum "$source" | cut -d' ' -f1)"
              for mode in control profile; do
                output="$PWD/artifacts/citizen-239/$case-$epoch-$mode"
                mkdir -p "$output"
                command=scale; enabled=0
                if [[ "$mode" == profile ]]; then command=profile; enabled=1; fi
                echo "PR57_239_RUN case=$case epoch=$epoch mode=$mode horizon=$horizon cadence=ADVANCE_2"
                PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
                PR57_SAVE_CAPTURE_DIR="$output" PR57_236_POSE_NOOP_SKIP=1 \
                PR57_239_CITIZEN_PHASES="$enabled" PR57_224_CITIZEN_STATE_COST="$enabled" \
                PR57_206_RESIDUAL_EXCLUSIVE=0 PR57_207_POSE_GUARD=0 \
                PR57_208_BODY_SAT_CENSUS=0 PR57_209_SHIPMENT_READ_CENSUS=0 \
                PR57_LANE_READWRITE_PROBE=0 PR57_BLOCK_DEP_PROBE=0 \
                PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0 \
                  timeout 180s dotnet run --no-build -c Release \
                  --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                  "$command" "$fixture" --seed=42 --warmup=0 --days=1 \
                  --window="$horizon" --cap=300 --resume="$source" | tee "$output.log"
              done
            done
          done
      - name: Assert full state parity and print citizen cost decomposition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('artifacts/citizen-239')
          def val(row,key):
              m=re.search(r'(?:^| )'+re.escape(key)+r'=([-0-9.]+)',row)
              assert m,(key,row)
              return float(m.group(1))
          names=('update-crosswalks-cold','refresh-crosswalks','pedestrian-grid-rebuild',
                 'citizen-routine-total','seek-food','family-adults-shopper','start-journey')
          for case in ('worksREAL','queueREAL','gridARTIFICIAL'):
              for epoch in ('early','late'):
                  stem=f'{case}-{epoch}'
                  control=(root/f'{stem}-control.log').read_text()
                  profile=(root/f'{stem}-profile.log').read_text()
                  for mode,log in [('control',control),('profile',profile)]:
                      assert 'INVARIANTS OK' in log and 'SAVE ' in log,(stem,mode)
                      assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1,(stem,mode)
                  for i in (0,1):
                      a=(root/f'{stem}-control'/f'checkpoint-{i}.json').read_bytes()
                      b=(root/f'{stem}-profile'/f'checkpoint-{i}.json').read_bytes()
                      assert a==b,(stem,i,'FULL_JSON_MISMATCH')
                  rows=[x for x in profile.splitlines() if x.startswith('PR57_239_CITIZEN ')]
                  assert len(rows)==7,(stem,'missing probe rows',len(rows))
                  stages={}
                  for row in rows:
                      name=row.split('name=',1)[1].split(' ',1)[0]
                      assert name in names and name not in stages,(stem,row)
                      stages[name]=(int(val(row,'calls')),val(row,'ms'))
                  assert set(stages)==set(names),(stem,stages)
                  assert stages['refresh-crosswalks'][0] in (50,100),(stem,stages)
                  assert stages['update-crosswalks-cold'][0] in (0,1),(stem,stages)
                  assert stages['citizen-routine-total'][0]>0,(stem,stages)
                  phases=[x.strip() for x in profile.splitlines() if x.strip().startswith('STEP_PHASE ')]
                  citizen=next(x for x in phases if 'name=citizen-mobility ' in x)
                  citizen_ms=val(citizen,'wall')*1000
                  setup=sum(stages[n][1] for n in names[:3])
                  routine=stages['citizen-routine-total'][1]
                  print('PR57_239_RESULT',stem,'citizenPhaseMs',round(citizen_ms,3),
                        'setupMeasuredMs',round(setup,3),'routineMs',round(routine,3),
                        'remainingMs',round(citizen_ms-setup-routine,3),
                        'details',';'.join(f'{n}:{stages[n][0]}:{stages[n][1]:.4f}' for n in names),
                        'scope','INTRUSIVE_NOT_ABBA')
                  states=[x for x in profile.splitlines() if x.startswith('PR57_224_CITIZEN_STATE ')]
                  assert len(states)==4,(stem,'missing state rows',len(states))
                  print('PR57_239_PARITY',stem,'processes',2,'checkpoints',2,'fullJSON','EXACT','cadence','ADVANCE_2')
          PY
      - name: Preserve raw logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-citizen-phases-239
          path: artifacts/citizen-239/**
          retention-days: 14
