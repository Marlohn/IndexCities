name: 'PR57 #178 exact empty-depot workset guard ABBA'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-empty-depot-guard-178.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run full suite with candidate enabled
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          PR57_EMPTY_DEPOT_RESERVATION_GUARD=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore real works, real queue and artificial GRID checkpoints
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: ABBA real host cadence and complete save comparison
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          test -s "$works"; test -s "$queue"; test -s "$grid"
          mkdir -p artifacts/empty-depot-178
          for case in worksREAL queueREAL gridARTIFICIAL; do
            source="$works"; fixture=cycle; window=1800
            if [[ "$case" == queueREAL ]]; then source="$queue";window=1200;fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid";fixture=grid;window=300;fi
            echo "PR57_178_SOURCE case=$case sha256=$(sha256sum "$source" | cut -d' ' -f1)"
            for mode in off0 on0 on1 off1; do
              enabled=0
              if [[ "$mode" == on* ]]; then enabled=1;fi
              output="$PWD/artifacts/empty-depot-178/$case-$mode"
              mkdir -p "$output"
              PR57_EMPTY_DEPOT_RESERVATION_GUARD="$enabled" PR57_GRID_DIAG=1 \
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_SAVE_CAPTURE_DIR="$output" \
              PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
              PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
              PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
              PR57_SAFE_SITE_BUFFER=1 \
                timeout 300s dotnet run --no-build -c Release \
                  --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                  scale "$fixture" --seed=42 --warmup=0 --days=1 \
                  --window="$window" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Compare all full checkpoints and summarize ABBA
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,statistics
          root=pathlib.Path("artifacts/empty-depot-178")
          for case,seconds in (("worksREAL",1800),("queueREAL",1200),("gridARTIFICIAL",300)):
              results={}
              reference=None
              for mode in ("off0","on0","on1","off1"):
                  log=(root/f"{case}-{mode}.log").read_text()
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode)
                  rows=[s for s in log.splitlines() if s.startswith("WINDOW ")]
                  assert len(rows)==1,(case,mode)
                  row=rows[0]
                  def value(key):
                      m=re.search(r"\b"+key+r"=([0-9.]+)",row)
                      assert m,(case,mode,key,row)
                      return float(m.group(1))
                  results[mode]={k:value(k) for k in ("wall","cpu","allocMB","alive","openWorks")}
                  for i in (0,1):
                      current=(root/f"{case}-{mode}"/f"checkpoint-{i}.json").read_bytes()
                      if reference is None:
                          reference=[(root/f"{case}-off0"/f"checkpoint-{j}.json").read_bytes() for j in (0,1)]
                      assert current==reference[i],(case,mode,i,"full JSON mismatch")
                  exercised="PR57_EMPTY_DEPOT_RESERVATION_GUARD exercised=true" in log
                  if case=="worksREAL" and mode.startswith("on"):
                      assert exercised,(case,mode,"guard not exercised")
                  if mode.startswith("off"): assert not exercised,(case,mode)
              off=statistics.mean(results[m]["wall"] for m in ("off0","off1"))
              on=statistics.mean(results[m]["wall"] for m in ("on0","on1"))
              print("PR57_178_ABBA",case,"simSeconds",seconds,"results",results,
                    "offMeanWall",round(off,6),"onMeanWall",round(on,6),
                    "observedRatio",round(off/on,4),
                    "completeCheckpoints",2,
                    "note=SHORT_RUN_NOT_10K_OR_80Y")
          PY
      - name: Preserve ABBA logs and full checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-empty-depot-178
          path: artifacts/empty-depot-178/**
          retention-days: 14
