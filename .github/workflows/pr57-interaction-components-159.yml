name: PR57 physical interaction component census (observational)
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-interaction-components-159.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and test
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore REAL moving economy save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore REAL pre-gridlock save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Profile sampled components and plain wall in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          test -s "$works"; test -s "$queue"
          for case in works queue10; do
            source="$works"; window=900
            if [[ "$case" == queue10 ]]; then source="$queue"; window=300; fi
            echo "PR57_GRAPH_CASE case=$case class=REAL sha256=$(sha256sum "$source" | cut -d' ' -f1) window=$window windows=4 cadence=Advance2"
            for mode in profile plain; do
              output="$PWD/artifacts/graph/$case-$mode"; mkdir -p "$output"
              command=scale; probe=0
              if [[ "$mode" == profile ]]; then command=profile; probe=1; fi
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_SAVE_CAPTURE_DIR="$output" \
              PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
              PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
              PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
              PR57_BLOCK_DEP_PROBE="$probe" PR57_GRAPH_PROBE="$probe" \
              PR57_VEHICLE_COST_PROBE=0 PR57_IDLE_SCAN_PROBE=0 PR57_HOT_TIMING=0 \
                timeout 240s dotnet run --no-build -c Release \
                  --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                  "$command" cycle --seed=42 --warmup=0 --days=4 --window="$window" \
                  --cap=200 --resume="$source" | tee "artifacts/graph/$case-$mode.log"
            done
          done
      - name: Validate observational evidence and full checkpoint parity
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/graph")
          for case,window in (("works",900),("queue10",300)):
              logs={m:(root/f"{case}-{m}.log").read_text() for m in ("profile","plain")}
              for mode,log in logs.items():
                  assert "INVARIANTS OK" in log and "SAVE " in log,(case,mode,"invariants/save")
                  lines=[s for s in log.splitlines() if s.startswith("WINDOW ")]
                  assert len(lines)==4,(case,mode,"windows")
                  wall=sum(float(re.search(r"\bwall=([0-9.]+)s",s).group(1)) for s in lines)
                  cpu=sum(float(re.search(r"\bcpu=([0-9.]+)s",s).group(1)) for s in lines)
                  alloc=sum(float(re.search(r"\ballocMB=([0-9.]+)",s).group(1)) for s in lines)
                  print(f"PR57_GRAPH_WALL case={case} mode={mode} seconds={4*window} wall={wall:.2f}s cpu={cpu:.2f}s allocMB={alloc:.1f} sps={4*window/wall:.2f} optimizationAB=False")
              rows=[s for s in logs["profile"].splitlines() if s.startswith("PR57_GRAPH ")]
              assert rows,(case,"probe inactive")
              assert "PR57_GRAPH " not in logs["plain"],(case,"plain contaminated")
              values={k:float(v) for k,v in re.findall(r"(\w+)=([0-9.]+)",rows[-1])}
              assert values["samples"]>0 and values["vehicles"]>0
              assert values["meanDirectLargestBlocked"]<=values["meanLocalLargestBlocked"]+0.001
              assert values["meanLocalLargestBlocked"]<=values["meanBlocked"]+0.001
              print("PR57_GRAPH_FINAL case="+case+" "+rows[-1])
              for i in range(5):
                  a=(root/f"{case}-profile"/f"checkpoint-{i}.json").read_bytes()
                  b=(root/f"{case}-plain"/f"checkpoint-{i}.json").read_bytes()
                  assert a==b,(case,i,"byte-exact checkpoint mismatch")
              print(f"PR57_GRAPH_PARITY case={case} checkpoints=5 exact=True")
          PY
      - name: Preserve logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-interaction-components-159
          path: artifacts/graph/**
          retention-days: 14
