name: 'PR57 #272 exact per-slice Penetration memo A/B'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-penetration-memo-272.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  memo-abba:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic real economic queue at 14h from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/real-prior
      - name: Restore authentic construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works-prior
      - name: Restore explicitly artificial GRID checkpoint from #237
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/grid-prior
      - name: Fresh processes ABBA with Advance(2) and full-state parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import os, subprocess, json, hashlib, re, statistics
          root=Path('artifacts/penetration-memo-272')
          root.mkdir(parents=True,exist_ok=True)
          real=Path('artifacts/real-prior/overnight-08/checkpoint-1.json')
          works=list(Path('artifacts/works-prior').rglob('growth/checkpoint-0.json'))
          grid=list(Path('artifacts/grid-prior').rglob('gridARTIFICIAL-control1/checkpoint-5.json'))
          assert real.is_file() and len(works)==1 and len(grid)==1
          cases=[('queueREAL14h',real,'cycle',200,600,600),
                 ('worksREAL',works[0],'cycle',200,600,100),
                 ('gridARTIFICIAL',grid[0],'grid',100,300,50)]
          common={'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
                  'PR57_GRID_DIAG':'0','PR57_206_RESIDUAL_EXCLUSIVE':'0',
                  'PR57_271_PENETRATION_KEYS':'0','PR57_270_MANOEUVRE_SCRATCH':'0'}
          for name,source,fixture,horizon,cap,report_at in cases:
              state=json.loads(source.read_text())
              print('PR57_272_SOURCE',name,'sha256',hashlib.sha256(source.read_bytes()).hexdigest(),
                    'alive',sum(bool(c.get('Alive')) for c in state['Citizens']),
                    'vehicles',len(state['Vehicles']),flush=True)
              modes=['control1','memo1','memo2','control2']
              paths={};stats={}
              for mode in modes:
                  dest=root/f'{name}-{mode}';dest.mkdir(parents=True,exist_ok=True)
                  env=os.environ.copy();env.update(common)
                  env['PR57_272_PENETRATION_MEMO']='1' if mode.startswith('memo') else '0'
                  env['PR57_272_REPORT_AT']=str(report_at)
                  env['PR57_SAVE_CAPTURE_DIR']=str(dest.resolve())
                  cmd=['dotnet','run','--no-build','-c','Release',
                       '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                       '--','scale',fixture,'--seed=42','--warmup=0',
                       '--days=1',f'--window={horizon}',f'--cap={cap}',
                       f'--resume={source.resolve()}']
                  logpath=root/f'{name}-{mode}.log'
                  with logpath.open('w') as out:
                      subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                     check=True,timeout=240)
                  log=logpath.read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,mode,log[-2000:])
                  assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
                  assert (dest/'checkpoint-1.json').is_file()
                  rows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
                  assert len(rows)==1,(name,mode,rows)
                  def metric(k):
                      m=re.search(r'(?:^| )'+re.escape(k)+r'=([-0-9.]+)',rows[0])
                      assert m,(k,rows[0])
                      return float(m.group(1))
                  stats[mode]={k:metric(k) for k in ('wall','cpu','allocMB')}
                  print('PR57_272_WINDOW',name,mode,rows[0],flush=True)
                  if mode.startswith('memo'):
                      memo=[x for x in log.splitlines() if x.startswith('PR57_272_MEMO ')]
                      print('PR57_272_MEMO_RESULT',name,mode,memo[-1] if memo else 'noReportAtReached',flush=True)
                  paths[mode]=dest
              original=[(paths['control1']/f'checkpoint-{i}.json').read_bytes() for i in (0,1)]
              for mode in modes:
                  for i in (0,1):
                      assert (paths[mode]/f'checkpoint-{i}.json').read_bytes()==original[i],(name,mode,i,'FULL_JSON_MISMATCH')
                  assert json.loads((paths[mode]/'checkpoint-1.json').read_text(),parse_float=Decimal)==json.loads(original[1],parse_float=Decimal)
              for k in ('wall','cpu','allocMB'):
                  a=statistics.mean(stats[x][k] for x in ('control1','control2'))
                  b=statistics.mean(stats[x][k] for x in ('memo1','memo2'))
                  print('PR57_272_ABBA',name,'metric',k,'controlMean',round(a,6),
                        'memoMean',round(b,6),'controlOverMemo',round(a/b,5) if b else 'NA',flush=True)
              print('PR57_272_PARITY',name,'fullJson=EXACT','decimalDiffs=0',
                    'Advance2CallsPerArm',horizon//2,'noSkippedSlices=True',flush=True)
          PY
      - name: Preserve raw logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-penetration-memo-272
          path: artifacts/penetration-memo-272/**
          retention-days: 14
