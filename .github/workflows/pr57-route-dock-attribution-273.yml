name: 'PR57 #273 authentic route/dock helper attribution'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-route-dock-attribution-273.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  route-dock-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic 11h and 14h economic checkpoints from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Three fresh processes, every Advance(2), compare complete states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import os, subprocess, json, hashlib, re
          root=Path('artifacts/route-dock-273')
          root.mkdir(parents=True,exist_ok=True)
          earlier=Path('artifacts/prior/overnight-05/checkpoint-1.json')
          source=Path('artifacts/prior/overnight-08/checkpoint-1.json')
          assert earlier.is_file() and source.is_file()
          def load(p): return json.loads(p.read_text(),parse_float=Decimal)
          before=load(earlier); after=load(source)
          av={v['Id']:v for v in before['Vehicles'] if v.get('Status')=='Travelling'}
          bv={v['Id']:v for v in after['Vehicles'] if v.get('Status')=='Travelling'}
          fields=('Position','Heading','WaitingSince','Cause','RouteIndex')
          persistent=sorted(i for i in av.keys()&bv.keys()
                            if all(av[i].get(k)==bv[i].get(k) for k in fields))
          assert len(persistent)==24 and {23,1453,1477}.issubset(persistent),persistent
          assert sum(bool(c.get('Alive')) for c in after['Citizens'])==121
          assert len(after['Vehicles'])==98
          print('PR57_273_SOURCE',hashlib.sha256(source.read_bytes()).hexdigest(),
                'persistentIds',','.join(map(str,persistent)),
                'alive',121,'vehicles',98,flush=True)
          paths={}
          for mode in ('control','probe1','probe2'):
              dest=root/mode;dest.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy()
              env.update({
                  'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
                  'PR57_GRID_DIAG':'0','PR57_206_RESIDUAL_EXCLUSIVE':'0',
                  'PR57_270_MANOEUVRE_SCRATCH':'0',
                  'PR57_271_PENETRATION_KEYS':'0',
                  'PR57_272_PENETRATION_MEMO':'0',
                  'PR57_244_PERSISTENT_IDS':','.join(map(str,persistent)),
                  'PR57_273_ROUTE_DOCK':'1' if mode!='control' else '0',
                  'PR57_266_COHORT_STAGES':'1' if mode!='control' else '0',
                  'PR57_269_STAGE_BYTES':'1' if mode!='control' else '0',
                  'PR57_SAVE_CAPTURE_DIR':str(dest.resolve())
              })
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','profile','cycle','--seed=42','--warmup=0',
                   '--days=1','--window=200','--cap=600',
                   f'--resume={source.resolve()}']
              logpath=root/f'{mode}.log'
              with logpath.open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=240)
              log=logpath.read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(mode,log[-2000:])
              assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
              assert (dest/'checkpoint-1.json').is_file()
              windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(windows)==1,(mode,windows)
              print('PR57_273_WINDOW',mode,windows[0],flush=True)
              if mode!='control':
                  helpers=[x for x in log.splitlines() if x.startswith('PR57_273_HELPER ')]
                  summaries=[x for x in log.splitlines() if x.startswith('PR57_273_SUM ')]
                  stages=[x for x in log.splitlines() if x.startswith('PR57_266_ROW ')]
                  assert len(helpers)==36 and len(summaries)==6 and len(stages)==144,(
                      mode,len(helpers),len(summaries),len(stages))
                  for line in summaries:print(line,flush=True)
                  for line in helpers:
                      if 'window=1 ' in line:print(line,flush=True)
                  for line in stages:
                      if 'window=5 ' in line and any(f'id={i} ' in line for i in (23,1453,1477)):
                          print('PR57_273_STAGE',mode,line,flush=True)
              paths[mode]=dest
          original=[(paths['control']/f'checkpoint-{i}.json').read_bytes() for i in (0,1)]
          for mode in paths:
              for i in (0,1):
                  assert (paths[mode]/f'checkpoint-{i}.json').read_bytes()==original[i],(
                      mode,i,'FULL_JSON_MISMATCH')
              assert load(paths[mode]/'checkpoint-1.json')==json.loads(
                  original[1],parse_float=Decimal)
          print('PR57_273_PARITY fullJson=EXACT decimalDiffs=0',
                'processes=3','Advance2CallsPerArm=100',
                'physicalSlicesPerArm=600','noSkippedSlices=True',
                'observationOnly=True',flush=True)
          PY
      - name: Preserve logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-route-dock-273
          path: artifacts/route-dock-273/**
          retention-days: 14
