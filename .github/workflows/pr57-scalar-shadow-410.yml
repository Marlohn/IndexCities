name: 'PR57 #410 scalar ordinary-leader shadow REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-scalar-shadow-410.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-scalar-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational probes in disposable checkout
        run: |
          set -euo pipefail
          python3 scripts/pr57-408-inject.py
          python3 scripts/pr57-410-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, 10800 individual Advance(2) per arm
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            mkdir -p "artifacts/scalar410/$arm"
            PR57_408_WINNER_CAUSE="$flag" PR57_410_SCALAR_SHADOW="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/scalar410/$arm" \
                > "artifacts/scalar410/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/scalar410/$arm/full.log"
          done
          cmp artifacts/scalar410/base/checkpoint-10800.json artifacts/scalar410/probe/checkpoint-10800.json
          sha256sum artifacts/scalar410/*/checkpoint-10800.json | tee artifacts/scalar410/checkpoints.sha256
          python3 - <<'PY_SUMMARY' | tee artifacts/scalar410/summary.json
          import json
          from pathlib import Path
          root=Path('artifacts/scalar410')
          arms={}
          for arm in ('base','probe'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              cells=rows('PR57_408_CELL')
              shadow=rows('PR57_410_SUMMARY')
              witnesses=rows('PR57_410_WITNESS')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert int(boundaries[-1]['calls'])==10800 and final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              if arm=='probe':
                  assert len(cells)==28 and len(shadow)==1
                  s=shadow[0]
                  assert s['observational']=='True' and s['causalClosure']=='False'
                  assert int(s['scans'])==sum(int(x['scans']) for x in cells)
                  assert int(s['bindingOrdinary'])==sum(int(x['scans']) for x in cells if x['cause']=='6' and x['binding']=='1')
                  assert int(s['bindingOrdinaryExact'])<=int(s['bindingOrdinarySameId'])<=int(s['bindingOrdinary'])
                  assert int(s['witnesses'])==len(witnesses)
              else:
                  assert not cells and not shadow and not witnesses
              arms[arm]={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                         'cpuMs':sum(float(h['cpuMs']) for h in hours),
                         'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                         'final':final[0], 'shadow':shadow[0] if shadow else None,
                         'witnesses':witnesses}
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
                            'advance2PerArm':10800,'arms':arms,
                            'observational':True,'causalClosure':False,
                            'optimizationGainAccepted':False},sort_keys=True))
          PY_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-scalar-shadow-410
          path: artifacts/scalar410
          retention-days: 14
