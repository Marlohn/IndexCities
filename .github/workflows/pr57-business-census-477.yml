name: 'PR57 #477 REAL business-phase cost and causal-work census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-business-census-477.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  business-census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Add strictly observational cost counters in disposable checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/IndexCities.Simulation/Economy.cs')
          source=p.read_text()
          def once(old,new):
              global source
              assert source.count(old)==1,(old,source.count(old))
              source=source.replace(old,new,1)
          once('var staff=StaffByWorkplace();',
               'var pr57477=Pr57Business477Enabled;\n'
               '        var pr57477Start=pr57477?System.Diagnostics.Stopwatch.GetTimestamp():0L;\n'
               '        var staff=StaffByWorkplace();\n'
               '        var pr57477Staff=pr57477?System.Diagnostics.Stopwatch.GetTimestamp():0L;\n'
               '        var pr57477Buildings=0;var pr57477Wages=0;var pr57477Farms=0;\n'
               '        var pr57477Full=0;var pr57477Produced=0;')
          once('foreach(var b in State.Buildings.Where(b=>b.Completed&&!b.Removed)){',
               'foreach(var b in State.Buildings.Where(b=>b.Completed&&!b.Removed)){\n'
               '            if(pr57477)pr57477Buildings++;')
          once('foreach(var c in presentWorkers){c.AddWorkSecondsToday(dt);AccrueWage(c,dt);}',
               'foreach(var c in presentWorkers){if(pr57477)pr57477Wages++;c.AddWorkSecondsToday(dt);AccrueWage(c,dt);}')
          once('foreach(var c in workers.Where(c=>c.Alive&&c.VehicleId==null&&c.ConstructionProjectId==null&&!c.Moving&&c.Position.Distance(b.Door)<3&&ShiftActive(c))){c.AddWorkSecondsToday(dt);AccrueWage(c,dt);}',
               'foreach(var c in workers.Where(c=>c.Alive&&c.VehicleId==null&&c.ConstructionProjectId==null&&!c.Moving&&c.Position.Distance(b.Door)<3&&ShiftActive(c))){if(pr57477)pr57477Wages++;c.AddWorkSecondsToday(dt);AccrueWage(c,dt);}')
          once('if(b.Kind!=BuildingKind.Farm||b.CompanyId==null||b.OperationalCapacity<=0||!Open(b))continue;',
               'if(b.Kind!=BuildingKind.Farm||b.CompanyId==null||b.OperationalCapacity<=0||!Open(b))continue;\n'
               '            if(pr57477)pr57477Farms++;')
          once('if(b.Quantity(ResourceKind.Food)>=target){b.Cause="Estoque de segurança completo; produção acompanha pedidos reais";continue;}',
               'if(b.Quantity(ResourceKind.Food)>=target){if(pr57477)pr57477Full++;b.Cause="Estoque de segurança completo; produção acompanha pedidos reais";continue;}')
          once('if(amount<=0)continue;b.AddStock(ResourceKind.Food,amount);b.AddFoodProduced(amount);',
               'if(amount<=0)continue;if(pr57477)pr57477Produced++;b.AddStock(ResourceKind.Food,amount);b.AddFoodProduced(amount);')
          once('OperateMechanicShops(dt,staff);',
               'var pr57477Loop=pr57477?System.Diagnostics.Stopwatch.GetTimestamp():0L;\n'
               '        var pr57477Services=pr57477?_serviceVehicles.Count:0;\n'
               '        OperateMechanicShops(dt,staff);\n'
               '        if(pr57477)Pr57Business477Record(pr57477Start,pr57477Staff,pr57477Loop,\n'
               '            System.Diagnostics.Stopwatch.GetTimestamp(),pr57477Buildings,pr57477Wages,\n'
               '            pr57477Farms,pr57477Full,pr57477Produced,pr57477Services);')
          p.write_text(source)
          Path('src/IndexCities.Simulation/Pr57Business477.Disposable.cs').write_text('''
          namespace IndexCities.Simulation;
          public sealed partial class CitySimulation
          {
              static readonly bool Pr57Business477Enabled=Environment.GetEnvironmentVariable("PR57_477_BUSINESS_PROBE")=="1";
              long _pr57477Calls,_pr57477Buildings,_pr57477Wages,_pr57477Farms,_pr57477Full,_pr57477Produced,_pr57477Services;
              long _pr57477StaffTicks,_pr57477LoopTicks,_pr57477MechanicTicks;
              void Pr57Business477Record(long start,long staff,long loop,long end,int buildings,int wages,
                  int farms,int full,int produced,int services)
              {
                  _pr57477Calls++;
                  _pr57477Buildings+=buildings;_pr57477Wages+=wages;
                  _pr57477Farms+=farms;_pr57477Full+=full;_pr57477Produced+=produced;
                  _pr57477Services+=services;
                  _pr57477StaffTicks+=staff-start;
                  _pr57477LoopTicks+=loop-staff;
                  _pr57477MechanicTicks+=end-loop;
              }
              public string Pr57Business477Report()
              {
                  var total=_pr57477StaffTicks+_pr57477LoopTicks+_pr57477MechanicTicks;
                  return FormattableString.Invariant($"PR57_477_BUSINESS calls={_pr57477Calls} buildings={_pr57477Buildings} wages={_pr57477Wages} farmReady={_pr57477Farms} farmFull={_pr57477Full} farmProduced={_pr57477Produced} serviceVehicles={_pr57477Services} staffTicks={_pr57477StaffTicks} loopTicks={_pr57477LoopTicks} mechanicTicks={_pr57477MechanicTicks} totalTicks={total} frequency={System.Diagnostics.Stopwatch.Frequency}");
              }
          }
          ''')
          p=Path('src/IndexCities.Headless/Program.cs')
          source=p.read_text()
          anchor='// PR57 #224: print observational citizen state cost only when explicitly enabled.'
          assert source.count(anchor)==1
          source=source.replace(anchor,
              'if(Environment.GetEnvironmentVariable("PR57_477_BUSINESS_PROBE")=="1")\n'
              '    Console.WriteLine(sim.Pr57Business477Report());\n'+anchor)
          p.write_text(source)
          print('PR57_477_DISPOSABLE_INSTRUMENTATION_ONLY')
          PY
      - name: Build and run complete regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Download authentic 68-worksite checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossphase-access-445
          run-id: 41052837425
          github-token: ${{ github.token }}
          path: artifacts/input445
      - name: Download authentic midnight checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-midnight-history-465
          run-id: 41089003924
          github-token: ${{ github.token }}
          path: artifacts/input465
      - name: ABBA individual Advance(2) on two REAL economic states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,time
          from pathlib import Path
          cases=[
            ('worksREAL68',Path('artifacts/input445/pr57-445/A/checkpoint-0.json'),200,47,42,
             'b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'),
            ('midnightREAL121',Path('artifacts/input465/A-mid/checkpoint-0.json'),3600,121,98,
             'e31ad0aa321c8aa4272dd400e83575c5a600677ecb8a83879287c654eff1ce92')
          ]
          root=Path('artifacts/pr57-477');root.mkdir(parents=True,exist_ok=True)
          summary={'experiment':477,'observationOnly':True,'gainAccepted':False,
                   'allAdvance2':True,'comparison':'same-composed-flags-ABBA','cases':{}}
          for name,source,seconds,alive,vehicles,expected in cases:
            raw=source.read_bytes()
            assert hashlib.sha256(raw).hexdigest()==expected,name
            state=json.loads(raw)
            assert sum(bool(c['Alive']) for c in state['Citizens'])==alive
            assert len(state['Vehicles'])==vehicles
            if name=='worksREAL68':
              assert sum(p['Status'] in ('Waiting','InProgress') for p in state['Projects'])>=68
            if name=='midnightREAL121':
              assert state['Now']=='2026-01-07T23:59:58'
            snapshots=[]; probes=[]
            for arm in ('A1','B1','B2','A2'):
              dest=root/name/arm;dest.mkdir(parents=True,exist_ok=True)
              probe=arm.startswith('B')
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                         PR57_GRID_DIAG='0',PR57_SAVE_CAPTURE_DIR=str(dest.resolve()),
                         PR57_477_BUSINESS_PROBE='1' if probe else '0')
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','scale','cycle','--seed=42','--warmup=0','--days=1',
                   f'--window={seconds}','--cap=300',f'--resume={source.resolve()}']
              start=time.perf_counter()
              with (dest/'full.log').open('w') as out:
                subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,check=True,timeout=240)
              elapsed=time.perf_counter()-start
              log=(dest/'full.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,arm,log[-2500:])
              assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1
              assert (dest/'checkpoint-0.json').read_bytes()==raw
              final=(dest/'checkpoint-1.json').read_bytes()
              snapshots.append(final)
              lines=[x for x in log.splitlines() if x.startswith('PR57_477_BUSINESS ')]
              assert len(lines)==int(probe),(name,arm,lines)
              if probe:
                fields=dict(re.findall(r'([A-Za-z][A-Za-z0-9]*)=([^ ]+)',lines[0]))
                assert int(fields['calls'])==seconds//2,(name,fields)
                assert int(fields['totalTicks'])==sum(int(fields[k]) for k in ('staffTicks','loopTicks','mechanicTicks'))
                probes.append(fields)
              summary['cases'].setdefault(name,{'steps':seconds//2,'inputSha256':expected,'arms':{}})
              summary['cases'][name]['arms'][arm]={
                'probe':probe,'elapsedProcessSeconds':round(elapsed,6),
                'sha256':hashlib.sha256(final).hexdigest(),'bytes':len(final),
                'window':next(x for x in log.splitlines() if x.startswith('WINDOW ')),
                'census':lines[0] if probe else None
              }
              print('PR57_477_ARM',name,arm,'seconds',seconds,'processWall',round(elapsed,3),flush=True)
            assert all(x==snapshots[0] for x in snapshots),name
            assert probes[0]==probes[1],(name,'non-deterministic counters')
            summary['cases'][name]['fullJsonParity']=True
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_477_ABBA_PARITY_PASS',flush=True)
          PY
      - name: Upload full checkpoints, logs, and raw census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-business-census-477
          path: artifacts/pr57-477
          retention-days: 14
          if-no-files-found: warn
