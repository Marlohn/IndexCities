name: 'PR57 #241 citizen arrival purpose and nested costs'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-arrival-purpose-241.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  arrivals:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore exact #237 initial and later states
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Replay Advance(2) controls and arrival-purpose profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/arrival-241
          for spec in worksREAL:early queueREAL:early gridARTIFICIAL:early gridARTIFICIAL:late; do
            case="${spec%%:*}"; epoch="${spec#*:}"
            fixture=cycle; horizon=200; index=0
            if [[ "$case" == gridARTIFICIAL ]]; then fixture=grid; horizon=100; fi
            if [[ "$epoch" == late ]]; then index=5; fi
            source="$(find artifacts/prior -type f -path "*/$case-control1/checkpoint-$index.json" -print -quit)"
            test -s "$source"
            echo "PR57_241_SOURCE case=$case epoch=$epoch sha256=$(sha256sum "$source" | cut -d' ' -f1)"
            for mode in control profile; do
              output="$PWD/artifacts/arrival-241/$case-$epoch-$mode"
              mkdir -p "$output"
              command=scale; enabled=0
              if [[ "$mode" == profile ]]; then command=profile; enabled=1; fi
              echo "PR57_241_RUN case=$case epoch=$epoch mode=$mode horizon=$horizon cadence=ADVANCE_2"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_236_POSE_NOOP_SKIP=1 \
              PR57_241_ARRIVAL_SPLIT="$enabled" PR57_224_CITIZEN_STATE_COST="$enabled" \
              PR57_240_WALK_SPLIT=0 PR57_239_CITIZEN_PHASES=0 \
              PR57_206_RESIDUAL_EXCLUSIVE=0 PR57_207_POSE_GUARD=0 \
              PR57_208_BODY_SAT_CENSUS=0 PR57_209_SHIPMENT_READ_CENSUS=0 \
              PR57_LANE_READWRITE_PROBE=0 PR57_BLOCK_DEP_PROBE=0 \
              PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" "$fixture" --seed=42 --warmup=0 --days=1 \
                --window="$horizon" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify full state and report arrival purposes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('artifacts/arrival-241')
          def val(row,key):
              m=re.search(r'(?:^| )'+re.escape(key)+r'=([-0-9.]+)',row)
              assert m,(key,row)
              return float(m.group(1))
          for case,epoch in [('worksREAL','early'),('queueREAL','early'),('gridARTIFICIAL','early'),('gridARTIFICIAL','late')]:
              stem=f'{case}-{epoch}'
              control=(root/f'{stem}-control.log').read_text()
              profile=(root/f'{stem}-profile.log').read_text()
              for mode,log in [('control',control),('profile',profile)]:
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(stem,mode)
                  assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1,(stem,mode)
              for i in (0,1):
                  assert (root/f'{stem}-control'/f'checkpoint-{i}.json').read_bytes()==(root/f'{stem}-profile'/f'checkpoint-{i}.json').read_bytes(),(stem,i,'FULL_JSON_MISMATCH')
              rows=[x for x in profile.splitlines() if x.startswith('PR57_241_ARRIVAL purpose=')]
              nested=[x for x in profile.splitlines() if x.startswith('PR57_241_NESTED name=')]
              assert rows and len(nested)==3,(stem,rows,nested)
              purposes={x.split('purpose=',1)[1].split(' ',1)[0]:(int(val(x,'calls')),val(x,'ms')) for x in rows}
              stages={x.split('name=',1)[1].split(' ',1)[0]:(int(val(x,'calls')),val(x,'ms')) for x in nested}
              assert len(purposes)==len(rows) and set(stages)=={'try-buy-food','seek-food','start-journey'},(stem,rows,nested)
              assert sum(v[0] for v in purposes.values())>0,(stem,purposes)
              states=[x for x in profile.splitlines() if x.startswith('PR57_224_CITIZEN_STATE ')]
              walking=next(x for x in states if 'name=walking ' in x)
              print('PR57_241_RESULT',stem,'walkingMs',val(walking,'actorMs'),
                    'arrivalCalls',sum(v[0] for v in purposes.values()),
                    'arrivalMs',round(sum(v[1] for v in purposes.values()),5),
                    'purposes',';'.join(f'{k}:{v[0]}:{v[1]:.5f}' for k,v in purposes.items()),
                    'nested',';'.join(f'{k}:{v[0]}:{v[1]:.5f}' for k,v in stages.items()),
                    'scope','INTRUSIVE_NOT_ABBA')
              print('PR57_241_PARITY',stem,'processes',2,'checkpoints',2,'fullJSON','EXACT','cadence','ADVANCE_2')
          PY
      - name: Preserve raw logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-arrival-241
          path: artifacts/arrival-241/**
          retention-days: 14
