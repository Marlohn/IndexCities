name: PR57 host-quantum integrated scaling curve (real and artificial)
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-scale-curve.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  host-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build headless Release
        run: dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
      - name: Restore authentic 121-resident congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real-congested
      - name: Measure unchanged integrated engine at Advance(2), fresh process per case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/scale-curve
          congested="$(find artifacts/real-congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$congested"
          echo "PR57_REAL_SOURCE sha256=$(sha256sum "$congested" | cut -d' ' -f1)"
          # Opposite ordering to expose order/thermal sensitivity; no optimization
          # candidate, no fake population or economic claims from GRID.
          for case in grid2 grid6 grid12 grid18 real121 grid18 grid12 grid6 grid2 real121; do
            n=$(find artifacts/scale-curve -maxdepth 1 -type d -name "$case-*" | wc -l)
            output="artifacts/scale-curve/$case-$n"
            mkdir -p "$output"
            if [[ "$case" == real121 ]]; then
              args=(scale cycle --seed=42 --warmup=0 --days=1 --window=3600 --cap=300 --resume="$congested")
              class=REAL
            else
              rows="${case#grid}"
              args=(scale grid --seed=42 --rows="$rows" --length=600 --warmup=0 --days=1 --window=3600 --cap=300)
              class=ARTIFICIAL
            fi
            echo "PR57_CURVE_RUN class=$class case=$case replicate=$n hostQuantum=2 profiler=off"
            PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
            PR57_BUILDING_WORK_ACCESS=0 PR57_DYNAMIC_BVH=0 PR57_PARALLEL_NEEDS=0 \
            PR57_STAFF_PHASE_FUSION=0 PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 \
            PR57_PARALLEL_POLLUTION=0 PR57_CONSTRUCTION_WAIT_AGENDA=0 \
            PR57_DISPATCH_SHIPMENT_LOOKUP=0 PR57_ROUTE_TREE=0 \
            PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 \
            PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 \
            PR57_PEDESTRIAN_GRID=0 PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0 \
            PR57_SAVE_CAPTURE_DIR="$PWD/$output" \
              timeout 360s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- "${args[@]}" \
              | tee "$output.log"
          done
      - name: Verify identical intermediate saves and summarize wall CPU allocation
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/scale-curve')
          for case in ('grid2','grid6','grid12','grid18','real121'):
              runs=[]
              for n in (0,1):
                  log=(root/f'{case}-{n}.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,n,'invariants/save')
                  windows=[s for s in log.splitlines() if s.startswith('WINDOW ')]
                  assert len(windows)==1,(case,n,'windows')
                  row=windows[0]
                  def val(key):
                      m=re.search(r'\b'+re.escape(key)+r'=([0-9.]+)',row)
                      assert m,(case,n,key,row)
                      return float(m.group(1))
                  stats={k:val(k) for k in ('wall','cpu','allocMB','pop','alive','openWorks')}
                  runs.append(stats)
                  for i in (0,1):
                      path=root/f'{case}-{n}'/f'checkpoint-{i}.json'
                      ref=root/f'{case}-0'/f'checkpoint-{i}.json'
                      assert path.is_file() and path.read_bytes()==ref.read_bytes(),(case,n,i,'causal divergence')
              print('PR57_SCALE_CURVE',case,'classification',('REAL' if case=='real121' else 'ARTIFICIAL'),
                    'horizonSimSeconds',3600,'replicates',runs,
                    'simSecondsPerWallSecond',[round(3600/r['wall'],2) for r in runs],
                    'fullIntermediateSavesMatch',True)
          PY
      - name: Preserve full logs and causal checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          path: artifacts/scale-curve/**
          retention-days: 14
