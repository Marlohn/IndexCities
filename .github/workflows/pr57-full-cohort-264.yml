name: 'PR57 #264 authentic 600-slice full vehicle cohort cost'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-full-cohort-264.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  full-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and regression tests
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic economic checkpoints from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Compare canonical full-window cohort observation at Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import os, subprocess, json, hashlib, re
          root=Path('artifacts/real-full-cohort-264')
          root.mkdir(parents=True,exist_ok=True)
          earlier=Path('artifacts/prior/overnight-05/checkpoint-1.json')
          source=Path('artifacts/prior/overnight-08/checkpoint-1.json')
          assert earlier.is_file() and source.is_file()
          def load(p): return json.loads(p.read_text(),parse_float=Decimal)
          before=load(earlier); after=load(source)
          av={v['Id']:v for v in before['Vehicles'] if v.get('Status')=='Travelling'}
          bv={v['Id']:v for v in after['Vehicles'] if v.get('Status')=='Travelling'}
          fields=('Position','Heading','WaitingSince','Cause','RouteIndex')
          persistent=sorted(i for i in av.keys()&bv.keys()
                            if all(av[i].get(k)==bv[i].get(k) for k in fields))
          assert len(persistent)==24,('expected authentic cohort',persistent)
          assert sum(bool(c.get('Alive')) for c in after['Citizens'])==121
          assert len(after['Vehicles'])==98
          print('PR57_264_SOURCE',hashlib.sha256(source.read_bytes()).hexdigest(),
                'persistentIds',','.join(map(str,persistent)),'alive',121,'vehicles',98,flush=True)
          common={
              'PR57_HOST_QUANTUM':'1','PR57_AB_CHECKPOINT':'1',
              'PR57_206_RESIDUAL_EXCLUSIVE':'0','PR57_IDLE_SCAN_PROBE':'0',
              'PR57_261_PATH_REACH':'0','PR57_263_ALL_CAN_TURN':'0',
              'PR57_253_STATE_EFFECTS':'0','PR57_260_READ_EXPOSURE':'0',
              'PR57_244_STATE_COST':'0','PR57_244_PERSISTENT_IDS':','.join(map(str,persistent))
          }
          def run(mode):
              dest=root/mode;dest.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy();env.update(common)
              env['PR57_264_FULL_COHORT']='1' if mode=='probe' else '0'
              env['PR57_SAVE_CAPTURE_DIR']=str(dest.resolve())
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','profile' if mode=='probe' else 'scale','cycle','--seed=42',
                   '--warmup=0','--days=1','--window=200','--cap=600',
                   f'--resume={source.resolve()}']
              with (root/f'{mode}.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=300)
              log=(root/f'{mode}.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(mode,log[-4000:])
              assert (dest/'checkpoint-0.json').read_bytes()==source.read_bytes()
              assert (dest/'checkpoint-1.json').is_file()
              for line in log.splitlines():
                  if line.startswith(('WINDOW ','STEP_PROFILE','  STEP_PHASE','PR57_264_')):
                      print('PR57_264_LOG',mode,line.strip(),flush=True)
              if mode=='probe':
                  summaries=[x for x in log.splitlines() if x.startswith('PR57_264_COHORT ')]
                  windows=[x for x in log.splitlines() if x.startswith('PR57_264_WINDOW ')]
                  assert len(summaries)==1 and len(windows)==6,(summaries,windows)
                  summary=summaries[0]
                  assert 'slices=600 persistentIds=24 ' in summary,summary
                  assert int(re.search(r'persistentPasses=(\d+)',summary).group(1))==14400,summary
                  assert int(re.search(r'passes=(\d+)',summary).group(1))>=14400,summary
                  assert sum(Decimal(re.search(r'persistentMs=([0-9.]+)',x).group(1))
                             for x in windows)>0
              return dest
          control=run('control')
          probe=run('probe')
          a=(control/'checkpoint-1.json').read_bytes()
          b=(probe/'checkpoint-1.json').read_bytes()
          assert a==b,'full JSON checkpoint mismatch'
          assert load(control/'checkpoint-1.json')==load(probe/'checkpoint-1.json')
          print('PR57_264_PARITY fullJson=EXACT decimalDiffs=0',
                'Advance2CallsPerArm=100 noSkippedSlices=True',
                'noOptimization=True',flush=True)
          PY
      - name: Preserve raw logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-real-full-cohort-264
          path: artifacts/real-full-cohort-264/**
          retention-days: 14
