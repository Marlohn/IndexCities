name: 'PR57 #480 REAL exact observed CanTurnNow prefix inputs'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-prefix-inputs-480.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  prefix-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational input comparison into disposable checkout
        run: python3 scripts/pr57-480-inject.py
      - name: Compile and run complete regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore original REAL congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/real
      - name: ABBA authentic 100 Advance(2) per process and full-save parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CENSUS'
          import hashlib,json,os,re,subprocess,time
          from pathlib import Path
          root=Path('artifacts/pr57-480')
          root.mkdir(parents=True,exist_ok=True)
          source=Path('artifacts/real/real14hREAL-control/checkpoint-0.json')
          raw=source.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'
          state=json.loads(raw)
          assert sum(bool(c['Alive']) for c in state['Citizens'])==121
          assert len(state['Vehicles'])==98
          finals=[]; probes=[]; arms={}
          for arm in ('A1','B1','B2','A2'):
              dest=root/arm
              dest.mkdir(parents=True,exist_ok=True)
              enabled=arm.startswith('B')
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                         PR57_GRID_DIAG='0',PR57_SAVE_CAPTURE_DIR=str(dest.resolve()),
                         PR57_270_MANOEUVRE_SCRATCH='0',
                         PR57_272_PENETRATION_MEMO='0',
                         PR57_PENETRATION_STACK_AXES='0',
                         PR57_480_PREFIX_INPUTS='1' if enabled else '0')
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','scale','cycle','--seed=42','--warmup=0',
                   '--days=1','--window=200','--cap=300',f'--resume={source.resolve()}']
              started=time.perf_counter()
              with (dest/'full.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                 check=True,timeout=300)
              wall=time.perf_counter()-started
              log=(dest/'full.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(arm,log[-3000:])
              assert (dest/'checkpoint-0.json').read_bytes()==raw
              final=(dest/'checkpoint-1.json').read_bytes()
              finals.append(final)
              windows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
              assert len(windows)==1 and re.search(r'\bseconds=200\b',windows[0]),(arm,windows)
              rows=[x for x in log.splitlines() if x.startswith('PR57_480_SUM ')]
              if enabled:
                  assert len(rows)>0,arm
                  fields={k:int(v) for k,v in re.findall(r'([A-Za-z][A-Za-z0-9]*)=(\d+)',rows[-1])}
                  assert fields['slices']==len(rows)
                  assert fields['calls']>0
                  assert 0<=fields['sameObserved']<=fields['pairs']<=fields['calls']
                  assert fields['sameObserved']<=min(fields['sameActor'],fields['samePoses'],fields['sameCandidates'])
                  assert fields['sameTime']<=fields['pairs']
                  assert fields['matchedVisits']<=fields['allVisits']
                  probes.append(fields)
                  arms[arm]={'census':fields,'lastRow':rows[-1],'window':windows[0],'wallSeconds':wall}
              else:
                  assert not rows
                  arms[arm]={'window':windows[0],'wallSeconds':wall}
              arms[arm]['finalSha256']=hashlib.sha256(final).hexdigest()
          assert all(x==finals[0] for x in finals),'FULL_SAVE_JSON_MISMATCH'
          assert probes[0]==probes[1],('NONDETERMINISTIC_CENSUS',probes)
          summary={'experiment':480,'scope':'REAL congested 121 living/98 vehicles',
                   'allAdvance2':True,'callsAdvance2PerArm':100,
                   'baseline':'same composed PR57 flags; stack axes off',
                   'observational':True,'acceptedGain':False,
                   'inputSha256':hashlib.sha256(raw).hexdigest(),
                   'finalSha256':hashlib.sha256(finals[0]).hexdigest(),
                   'fullSaveByteParity':True,'arms':arms,
                   'limits':'Full persisted actor/candidate JSON and exact pose bits; not causal closure: roads, signals, pedestrians, transient writers and external mutations not proven.'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_480_CENSUS',json.dumps(probes[0],sort_keys=True),flush=True)
          print('PR57_480_FULL_SAVE_PARITY',summary['finalSha256'],flush=True)
          PY_CENSUS
      - name: Preserve original full checkpoints, logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-prefix-inputs-480
          path: artifacts/pr57-480
          retention-days: 14
          if-no-files-found: warn
