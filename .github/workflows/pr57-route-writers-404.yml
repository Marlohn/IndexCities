name: 'PR57 #404 canonical Route writer census REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-route-writers-404.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-route-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject writer probes in disposable checkout
        run: |
          set -euo pipefail
          python3 scripts/pr57-399-inject.py
          python3 scripts/pr57-400-inject.py
          python3 scripts/pr57-401-inject.py
          python3 scripts/pr57-404-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, 10800 individual Advance(2) per arm
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            mkdir -p "artifacts/writers404/$arm"
            PR57_399_WRITER_METHODS="$flag" \
            PR57_400_RESTOCK_WRITERS="$flag" \
            PR57_401_DIRECT_WRITERS="$flag" \
            PR57_404_ROUTE_WRITERS="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/writers404/$arm" \
                > "artifacts/writers404/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/writers404/$arm/full.log"
          done
          cmp artifacts/writers404/base/checkpoint-10800.json artifacts/writers404/probe/checkpoint-10800.json
          sha256sum artifacts/writers404/*/checkpoint-10800.json | tee artifacts/writers404/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/writers404/summary.json
          import json
          from pathlib import Path
          root=Path('artifacts/writers404')
          arms={}
          for arm in ('base','probe'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              summary=rows('PR57_404_SUMMARY')
              writes=rows('PR57_404_WRITE')
              direct=rows('PR57_401_WRITE')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert int(boundaries[-1]['calls'])==10800 and final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              assert len(summary)==(1 if arm=='probe' else 0)
              if summary:
                  s=summary[0]
                  assert s['observational']=='True' and s['causalClosure']=='False'
                  assert s['noSkippedSlices']=='True' and int(s['steps'])==1820
                  assert int(s['writes'])==int(s['assigns'])+int(s['clears'])+int(s['inserts'])
                  assert int(s['changed'])>=len(writes)
              arms[arm]={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                         'cpuMs':round(sum(float(h['cpuMs']) for h in hours),3),
                         'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                         'summary404':summary[0] if summary else None,
                         'writes404':writes,'direct401':direct}
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
                            'advance2PerArm':10800,'arms':arms,
                            'observational':True,'causalClosure':False,
                            'optimizationGainAccepted':False},sort_keys=True))
          PY
      - name: Upload original logs and saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-route-writers-404
          path: artifacts/writers404/
          if-no-files-found: warn
