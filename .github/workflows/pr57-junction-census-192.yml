name: 'PR57 #192 authentic GRID all-slice junction dependency census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-junction-census-192.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  junction-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-retained-heap-184
          run-id: 40451480020
          github-token: ${{ github.token }}
          path: artifacts/reference
      - name: Replay control and all-slice observational census
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/reference -type f -path '*/gridARTIFICIAL/plain/checkpoint-0.json' -print -quit)"
          test -s "$source"
          mkdir -p artifacts/junction-192/control artifacts/junction-192/probe
          timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/junction-192/control" | tee artifacts/junction-192/control.log
          PR57_192_JUNCTION_CENSUS=1 timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/junction-192/probe" | tee artifacts/junction-192/probe.log
      - name: Check complete JSON parity and census coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/junction-192')
          for i in (0,50,100,150,200):
              assert (root/'control'/f'checkpoint-{i}.json').read_bytes()==(root/'probe'/f'checkpoint-{i}.json').read_bytes(),('FULL_JSON_DIFFERENCE',i)
          lines=(root/'probe.log').read_text().splitlines()
          rows=[dict(kv.split('=',1) for kv in s.split()[1:] if '=' in kv) for s in lines if s.startswith('PR57_192_JUNCTION_CENSUS ')]
          assert len(rows)==1,('CENSUS_COUNT',len(rows))
          row=rows[0]
          assert int(row['slices'])>0,row
          assert int(row['admissions'])>=int(row['signalPotential']),row
          assert int(row['signalPotential'])>=int(row['signalReached'])>=int(row['signalRedReached']),row
          assert float(row['observerMs'])>=0,row
          for mode in ('control','probe'):
              assert any(s.startswith('PR57_186_DONE ') and 'cadence=ADVANCE_2' in s for s in (root/f'{mode}.log').read_text().splitlines())
          print('PR57_192_VALIDATED checkpoints=5 parity=EXACT_FULL_JSON scope=INTRUSIVE_CENSUS_NOT_AB')
          print('PR57_192_SAMPLE',row)
          PY
      - name: Preserve logs and complete saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-junction-census-192
          path: artifacts/junction-192/**
          retention-days: 14
