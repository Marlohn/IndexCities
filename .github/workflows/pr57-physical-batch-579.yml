name: PR57 physical batch proposal REAL ABBA
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-physical-batch-579.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  physical-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full tests in both modes
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          for flag in 0 1; do
            PR57_PHYSICAL_BATCH_PLAN="$flag" PR57_PHYSICAL_BATCH_SHADOW=1 \
              dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          done
      - uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/congested
      - name: Fresh-process ABBA with every public Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          congested="$(find artifacts/congested -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$works"; test -s "$congested"
          sha256sum "$works" "$congested"
          mkdir -p artifacts/physical-batch
          for case in works congested grid; do
            if [[ "$case" == works ]]; then
              args=(scale cycle --seed=42 --warmup=0 --days=1 --window=900 --cap=300 --resume="$works")
            elif [[ "$case" == congested ]]; then
              args=(scale cycle --seed=42 --warmup=0 --days=1 --window=900 --cap=300 --resume="$congested")
            else
              args=(scale grid --seed=42 --rows=12 --length=600 --warmup=0 --days=1 --window=200 --cap=300)
            fi
            i=0
            for mode in control candidate candidate control; do
              enabled=0
              if [[ "$mode" == candidate ]]; then enabled=1; fi
              out="artifacts/physical-batch/$case-$i"
              mkdir -p "$out"
              echo "PR57_PHYSICAL_BATCH_AB case=$case mode=$mode index=$i enabled=$enabled"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_PHYSICAL_BATCH_PLAN="$enabled" PR57_PHYSICAL_BATCH_SHADOW=0 \
              PR57_DYNAMIC_BVH=0 PR57_BITSET_SCAN=0 PR57_SPATIAL_SCAN=0 \
              PR57_ACTIVE_SCAN=0 PR57_PARALLEL_NEEDS=0 PR57_STAFF_PHASE_FUSION=0 \
              PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 PR57_PARALLEL_POLLUTION=0 \
              PR57_CONSTRUCTION_WAIT_AGENDA=0 PR57_DISPATCH_SHIPMENT_LOOKUP=0 \
              PR57_ROUTE_TREE=0 PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 \
              PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 PR57_PEDESTRIAN_GRID=0 \
              PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0 \
              PR57_SAVE_CAPTURE_DIR="$PWD/$out" \
                timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- "${args[@]}" | tee "$out.log"
              i=$((i+1))
            done
          done
      - name: Check full intermediate saves and report end-to-end A/B
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/physical-batch')
          exercised=[]
          for case,windows in (('works',4),('congested',4),('grid',1)):
              results=[]
              for i in range(4):
                  log=(root/f'{case}-{i}.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,i,'invariants/save')
                  if i in (1,2) and 'PR57_PHYSICAL_BATCH used=True' in log:
                      exercised.append((case,i))
                  rows=[s for s in log.splitlines() if s.startswith('WINDOW ')]
                  assert len(rows)==windows,(case,i,'window count',len(rows))
                  def val(row,key):
                      m=re.search(r'\b'+re.escape(key)+r'=([0-9.]+)',row)
                      assert m,(case,i,key,row)
                      return float(m.group(1))
                  stats={k:sum(val(row,k) for row in rows) for k in ('wall','cpu','allocMB')}
                  stats.update({k:val(rows[-1],k) for k in ('pop','alive','openWorks')})
                  results.append(stats)
                  for n in range(windows+1):
                      a=root/f'{case}-{i}'/f'checkpoint-{n}.json'
                      b=root/f'{case}-0'/f'checkpoint-{n}.json'
                      assert a.is_file() and a.read_bytes()==b.read_bytes(),(case,i,n,'causal divergence')
              gain=lambda a,b,k:round(100*(results[a][k]-results[b][k])/results[a][k],2)
              print('PR57_PHYSICAL_BATCH_RESULT',case,'data',results,
                    'wallGainAB',[gain(0,1,'wall'),gain(3,2,'wall')],
                    'cpuGainAB',[gain(0,1,'cpu'),gain(3,2,'cpu')],
                    'allocGainAB',[gain(0,1,'allocMB'),gain(3,2,'allocMB')],
                    'fullIntermediateSavesMatch',True)
          assert ('works',1) in exercised and ('congested',1) in exercised,('no REAL hits',exercised)
          print('PR57_PHYSICAL_BATCH_EXERCISED',exercised)
          PY
      - name: Adversarial shadow under external edits
        shell: bash
        run: |
          set -euo pipefail
          PR57_PHYSICAL_BATCH_PLAN=1 PR57_PHYSICAL_BATCH_SHADOW=1 PR57_GRID_DIAG=1 \
          PR57_ACCESS_LIVE_EDIT=1 PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 \
          timeout 180s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
            scale cycle --seed=42 --warmup=0 --days=1 --window=900 --cap=300 --resume="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)" \
            | tee artifacts/physical-batch/shadow.log
          grep -q 'INVARIANTS OK' artifacts/physical-batch/shadow.log
      - name: Preserve logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-physical-batch-ab
          path: artifacts/physical-batch/**
          retention-days: 14
