name: 'PR57 #361 REAL negative lane dependency graph'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-361-inject.py, .github/workflows/pr57-negative-read-361.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  bounded-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject bounded observational state ceiling only in checkout
        run: |
          python3 scripts/pr57-345-observe.py
          python3 scripts/pr57-359-inject.py
          python3 scripts/pr57-360-inject.py
          python3 scripts/pr57-361-inject.py
      - name: Build authentic replay and test canonical engine
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay each individual Advance(2) with control and probe
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/negative361/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_206_RESIDUAL_EXCLUSIVE="1" \
            PR57_244_STATE_COST="1" \
            PR57_360_COMPONENT_SHADOW="$flag" \
            PR57_361_NEGATIVE_READ_GRAPH="$flag" \
            PR57_244_PERSISTENT_IDS="1071,1243,1282,1380" \
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/negative361/$mode" \
              > "artifacts/negative361/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|359_(WINDOW|GROUP)|360_WINDOW|361_SLICE) ' \
              "artifacts/negative361/$mode/full.log" \
              > "artifacts/negative361/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/negative361/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/negative361/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/negative361/$mode/census.log"
          done
          cmp artifacts/negative361/control/checkpoint-10800.json \
              artifacts/negative361/probe/checkpoint-10800.json
          sha256sum artifacts/negative361/{control,probe}/checkpoint-10800.json \
            | tee artifacts/negative361/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/negative361/summary.txt
          from pathlib import Path
          root=Path("artifacts/negative361")
          def parse(mode,prefix):
              return [
                  {k:v for k,v in (x.split("=",1) for x in line.split()[1:] if "=" in x)}
                  for line in (root/mode/"census.log").read_text().splitlines()
                  if line.startswith(prefix+" ")
              ]
          windows=parse("probe","PR57_359_WINDOW")
          groups=parse("probe","PR57_359_GROUP")
          assert len(windows)==2 and len(groups)==10,(windows,groups)
          assert len(parse("control","PR57_359_WINDOW"))==2
          assert [int(w["start"]) for w in windows]==[40001,50001]
          for w in windows:
              start=int(w["start"])
              assert int(w["slices"])==600,w
              rows=[g for g in groups if int(g["start"])==start]
              assert len(rows)==5,rows
              assert sum(int(g["actors"]) for g in rows)==600*98,rows
              actor=sum(float(g["totalMs"]) for g in rows)
              assert abs(actor-float(w["actorLoopMs"]))<0.01,(actor,w)
              selected=sum(float(g[f"s{i}Ms"]) for g in rows
                           if g["group"]=="other-travelling-still" for i in range(1,5))
              assert abs(selected-float(w["selectedStillS1to4Ms"]))<0.01,(selected,w)
              assert 0<=float(w["selectedShareOfPhysicalSlice"])<1,w
              print("PR57_359_WINDOW_VERIFIED "+ " ".join(
                  f"{k}={w[k]}" for k in
                  ("start","end","slices","movedActors","physicalSliceMs",
                   "actorLoopMs","selectedStillS1to4Ms",
                   "selectedShareOfPhysicalSlice","idealPhysicalCeiling")))
              for g in rows:
                  print("PR57_359_GROUP_VERIFIED "+ " ".join(
                      f"{k}={g[k]}" for k in
                      ("start","group","actors","totalMs","s1Ms","s2Ms","s3Ms",
                       "s4Ms","s7Ms")))
          shadow=parse("probe","PR57_360_WINDOW")
          assert len(shadow)==2,shadow
          assert not parse("control","PR57_360_WINDOW")
          assert [int(s["start"]) for s in shadow]==[40001,50001]
          for s in shadow:
              assert int(float(s["slices"]))==600 and int(s["actors"])==600*98,s
              assert 0<=int(s["largestSelectedComponentMax"])<=98,s
              print("PR57_360_SHADOW_VERIFIED "+ " ".join(
                  f"{k}={v}" for k,v in s.items()))
          negative=parse("probe","PR57_361_SLICE")
          assert len(negative)==12,negative
          assert not parse("control","PR57_361_SLICE")
          assert [int(x["ordinal"]) for x in negative]==list(range(40001,40007))+list(range(50001,50007))
          for x in negative:
              assert int(x["vehicles"])==98,x
              assert int(x["occupiesCalls"])>0,x
              assert int(x["directedDistinct"])>0,x
              assert int(x["readLargest"])<=98,x
              assert int(x["selectedLargest"])<=98,x
              assert int(x["readComponents"])+int(x["readEdges"])>=98,x
              print("PR57_361_READ_GRAPH_VERIFIED "+ " ".join(f"{k}={v}" for k,v in x.items()))
          print("PR57_359_PARITY checkpointByteIdentical=True REAL121=True "+
                "GRID=NOT_TESTED individualAdvance2=True "+
                "notIntegratedAmdahl=True intrusive=True "+
                "noSkippedSlices=True integratedSpeedupAccepted=False")
          PY
      - name: Upload raw logs, summaries and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-negative-read-361
          path: artifacts/negative361/**
          if-no-files-found: warn
