name: 'PR57 #397 true-entry vs cleanup path boundaries REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-true-entry-397.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-path-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject #394/#395/#396/#397 into disposable checkout only
        run: |
          set -euo pipefail
          python3 scripts/pr57-394-inject.py
          python3 scripts/pr57-395-inject.py
          python3 scripts/pr57-396-inject.py
          python3 scripts/pr57-397-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, each 10800 individual Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            mkdir -p "artifacts/path397/$arm"
            PR57_394_PATH_SHADOW="$flag" \
            PR57_395_PATH_BOUNDARY="$flag" \
            PR57_396_ALL_UNSPLIT="$flag" \
            PR57_397_ENTRY_CLEANUP="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/path397/$arm" \
                > "artifacts/path397/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/path397/$arm/full.log"
          done
          cmp artifacts/path397/base/checkpoint-10800.json artifacts/path397/probe/checkpoint-10800.json
          sha256sum artifacts/path397/*/checkpoint-10800.json | tee artifacts/path397/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/path397/summary.json
          import json
          from pathlib import Path
          root=Path('artifacts/path397')
          result={}
          for arm in ('base','probe'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(v.split('=',1) for v in line.split()[1:] if '=' in v)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundary=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              shadow=rows('PR57_394_PATH')
              cross=rows('PR57_394_CROSS')
              boundary395=rows('PR57_395_BOUNDARY')
              changes395=rows('PR57_395_CHANGE')
              boundary396=rows('PR57_396_BOUNDARY')
              changes396=rows('PR57_396_CHANGE')
              boundary397=rows('PR57_397_BOUNDARY')
              changes397=rows('PR57_397_CHANGE')
              assert len(hours)==6 and len(boundary)==108 and len(final)==1
              assert int(boundary[-1]['calls'])==10800
              assert final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              assert len(shadow)==(1 if arm=='probe' else 0)
              assert len(boundary395)==(1 if arm=='probe' else 0)
              assert len(boundary396)==(1 if arm=='probe' else 0)
              assert len(boundary397)==(1 if arm=='probe' else 0)
              summary={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                       'cpuMs':round(sum(float(h['cpuMs']) for h in hours),3),
                       'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours)}
              if shadow:
                  x=shadow[0]
                  assert x['observational']=='True' and x['noDecisionReuse']=='True'
                  assert x['noSkippedSlices']=='True'
                  assert int(x['physical'])==12000 and int(x['samples'])==600
                  assert int(x['initial'])==58800 and int(x['published'])==58800
                  assert int(x['missing'])==0
                  assert int(x['stale'])==int(x['self'])+int(x['cross'])
                  assert int(x['cross'])>=len(cross) and int(x['frequency'])>0
                  summary['shadow']={k:(int(v) if v.isdecimal() else v) for k,v in x.items()}
                  summary['shadow']['capturePublishMs']=round(
                      (int(x['initialTicks'])+int(x['publishTicks'])+int(x['endTicks']))
                      *1000/int(x['frequency']),3)
                  summary['sampleCross']=cross
              if boundary395:
                  b=boundary395[0]
                  assert int(b['physical'])==12000 and int(b['calls'])==12000
                  assert b['exactContent']=='True' and b['observational']=='True'
                  assert b['netBoundariesOnly']=='True' and b['noSkippedSlices']=='True'
                  assert int(b['traces'])==len(changes395)
                  summary['boundary395']={k:(int(v) if v.isdecimal() else v) for k,v in b.items()}
                  summary['changes395']=changes395
              if boundary396:
                  q=boundary396[0]
                  assert q['observational']=='True' and q['noSkippedSlices']=='True'
                  assert int(q['physical'])==int(q['physicalCalls'])==12000
                  assert int(q['operationCalls'])>0
                  assert int(q['roster'])==0
                  assert int(q['traces'])==len(changes396)
                  for key in ('events','route','site','admission'):
                      assert len(q[key].split(','))==6
                  assert sum(map(int,q['events'].split(',')))>=int(boundary395[0]['inside'])
                  summary['boundary396']=q
                  summary['changes396']=changes396
              if boundary397:
                  q=boundary397[0]
                  assert q['observational']=='True' and q['noSkippedSlices']=='True'
                  assert int(q['physical'])==12000 and int(q['roster'])==0
                  assert int(q['traces'])==len(changes397)
                  for key in ('events','route','site','admission'):
                      assert len(q[key].split(','))==6
                  summary['boundary397']=q
                  summary['changes397']=changes397
              result[arm]=summary
          print(json.dumps({'arms':result,'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'sampleEveryPhysicalCall':20,
              'sampledPhysicalCalls':600,'boundaryCalls395':12000,'observational':True,'causalClosure':False,
              'optimizationGainAccepted':False},sort_keys=True))
          PY
      - name: Upload original logs and saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-true-entry-397
          path: artifacts/path397/
          if-no-files-found: warn
