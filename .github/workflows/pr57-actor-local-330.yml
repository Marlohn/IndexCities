name: 'PR57 #330 actor-local versus actor-major physical publication'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-actor-local-330.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  physical-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational same-slice probe
        run: python3 scripts/pr57-330-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL and explicitly ARTIFICIAL GRID saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process ABBA, canonical Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/physical-330
          for case in real14hREAL gridARTIFICIAL; do
            input="artifacts/input/$case-control/checkpoint-0.json"
            test -s "$input"
            calls=100
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; fi
            for arm in scan1 local1 local2 scan2; do
              output="artifacts/physical-330/$case-$arm"
              mkdir -p "$output"
              local=0
              if [[ "$arm" == local* ]]; then local=1; fi
              PR57_329_PHYSICAL_EXPOSURE=1 PR57_330_ACTOR_LOCAL="$local" dotnet run --no-build -c Release \
                --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj \
                -- "$input" "$case" probe "$calls" "$output" \
                > "artifacts/physical-330/$case-$arm.log" 2>&1
            done
          done
      - name: Verify complete checkpoint parity and partial read/write census
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr57-330-audit.py artifacts/physical-330
      - name: Preserve raw logs and complete checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-physical-330
          path: artifacts/physical-330/**
          retention-days: 14
