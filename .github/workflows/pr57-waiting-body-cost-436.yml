name: 'PR57 #436 exact junction body and path costs REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-waiting-body-cost-436.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-stage-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject bounded observational timers in disposable checkout
        run: python3 scripts/pr57-436-inject.py
      - name: Build and full regression suite
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh .NET processes, individual Advance(2), same save and horizon
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base shadow; do
            flag=0
            if [[ "$arm" == shadow ]]; then flag=1; fi
            mkdir -p "artifacts/stage436/$arm"
            PR57_420_COHORT_SHADOW="$flag" PR57_432_STAGE_COST="$flag" PR57_434_ADMISSION_COST="$flag" PR57_435_REASON_COST="$flag" PR57_436_BODY_COST="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/stage436/$arm" \
                > "artifacts/stage436/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/stage436/$arm/full.log"
          done
          cmp artifacts/stage436/base/checkpoint-10800.json artifacts/stage436/shadow/checkpoint-10800.json
          sha256sum artifacts/stage436/*/checkpoint-10800.json > artifacts/stage436/checkpoints.sha256
          python3 - <<'PY_AUDIT' | tee artifacts/stage436/summary.json
          import json,hashlib
          from pathlib import Path
          root=Path('artifacts/stage436')
          arms={}; signatures=[]
          for arm in ('base','shadow'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              cohort=rows('PR57_420_COHORT')
              persistence=rows('PR57_420_SUMMARY')
              sample=rows('PR57_432_SUMMARY')
              admission=rows('PR57_434_SUMMARY')
              reasons=rows('PR57_435_REASON')
              components=rows('PR57_436_COMPONENT')
              stages=rows('PR57_432_STAGE')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert [int(x['calls']) for x in boundaries]==list(range(100,10801,100))
              assert all(x['quantum']=='2' for x in boundaries)
              assert all(int(x['living'])==121 for x in hours)
              assert final[0]['parity']=='IDENTICAL'
              signatures.append([tuple(h[k] for k in
                  ('hour','slices','actors','claimChanges','spaceCountChanges',
                   'living','ledger','history')) for h in hours])
              if arm=='shadow':
                  assert len(cohort)==4 and len(persistence)==len(sample)==1
                  assert len(stages)==11 and len(admission)==1 and len(reasons)==18 and len(components)==4
                  assert {x['component'] for x in components}=={'bend_turn_way','bend_body_on_way','onward_turn_way','onward_body_on_way'}
                  assert all(x['observational']=='True' and x['causalClosure']=='False' for x in components)
                  c={x['component']:x for x in components}
                  reason={x['reason']:int(x['calls']) for x in reasons}
                  assert int(c['bend_turn_way']['calls'])>=int(c['bend_body_on_way']['calls'])
                  assert int(c['onward_turn_way']['calls'])>=int(c['onward_body_on_way']['calls'])
                  assert int(c['bend_body_on_way']['hits'])==reason['BendBody']
                  assert int(c['onward_body_on_way']['hits'])==reason['OnwardBody']
                  assert all(int(x['ticks'])>=0 for x in components)
                  assert len({r['reason'] for r in reasons})==18
                  assert sum(int(r['calls']) for r in reasons)==int(admission[0]['mayCalls'])
                  assert all(r['observational']=='True' and r['causalClosure']=='False' for r in reasons)
                  a=admission[0]
                  assert int(a['admissionVisits'])==int(stages[9]['visits'])
                  assert int(a['mayAllowed'])+int(a['mayDenied'])==int(a['mayCalls'])
                  assert int(a['movementVisits'])<=int(a['admissionVisits'])
                  assert int(a['mayTicks'])>=0 and int(a['movementTicks'])>=0
                  assert int(a['admissionTicks'])>0
                  assert a['noDecisionReuse']=='True' and a['causalClosure']=='False'
                  assert {int(x['stage']) for x in stages}==set(range(11))
                  assert int(sample[0]['sampledPhysical'])==60
                  assert int(sample[0]['sampledActors'])==1669
                  assert int(sample[0]['blocked'])>0
                  assert int(sample[0]['bypassCalls'])>=int(sample[0]['bypassSuccess'])
                  assert sum(int(x['ticks']) for x in stages)>0
                  assert sum(int(x['ticks']) for x in stages)>=int(sample[0]['bypassTicks'])
                  assert sample[0]['observational']=='True'
                  assert sample[0]['causalClosure']=='False'
                  assert sample[0]['noDecisionReuse']=='True'
                  assert int(persistence[0]['physical'])==600
              else:
                  assert not cohort and not persistence and not sample and not stages and not admission and not reasons and not components
              arms[arm]={
                  'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                  'cpuMs':sum(float(h['cpuMs']) for h in hours),
                  'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                  'cohort':cohort,'persistence':persistence,
                  'sample':sample,'stages':stages,'admission':admission,'reasons':reasons,'components':components}
          assert signatures[0]==signatures[1], 'intermediate economy/history mismatch'
          saves=[(root/a/'checkpoint-10800.json').read_bytes() for a in ('base','shadow')]
          assert saves[0]==saves[1]
          sha=hashlib.sha256(saves[0]).hexdigest()
          assert len(saves[0])==2254838
          assert sha=='e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa'
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'arms':arms,'saveSha256':sha,
              'observational':True,'causalClosure':False,'optimizationGainAccepted':False},
              sort_keys=True))
          PY_AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-junction-body-cost-436
          path: artifacts/stage436
          retention-days: 14
