name: 'PR57 #450 REAL junction preference allocation attribution'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-preference-alloc-450.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  preference-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observation only in disposable checkout
        run: python3 scripts/pr57-450-inject.py
      - name: Build and regression tests
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Control A and observation B in separate .NET processes
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in A B; do
            flag=0
            if [[ "$arm" == B ]]; then flag=1; fi
            mkdir -p "artifacts/preference450/$arm"
            PR57_450_PREFERENCE_ALLOC="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/preference450/$arm" \
                > "artifacts/preference450/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/preference450/$arm/full.log"
          done
          cmp artifacts/preference450/A/checkpoint-10800.json artifacts/preference450/B/checkpoint-10800.json
          sha256sum artifacts/preference450/*/checkpoint-10800.json > artifacts/preference450/checkpoints.sha256
          python3 - <<'PY_SUMMARY' | tee artifacts/preference450/summary-console.log
          import json,re,hashlib
          from pathlib import Path
          root=Path('artifacts/preference450')
          def rows(arm,prefix):
              return [dict(part.split('=',1) for part in line.split()[1:] if '=' in part)
                      for line in (root/arm/'full.log').read_text().splitlines()
                      if line.startswith(prefix+' ')]
          a,b=(root/arm/'checkpoint-10800.json' for arm in 'AB')
          assert a.read_bytes()==b.read_bytes()
          sha=hashlib.sha256(a.read_bytes()).hexdigest()
          assert sha=='e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa'
          assert len(a.read_bytes())==2254838
          assert len(rows('A','PR57_450_PREFERENCE'))==0
          obs=rows('B','PR57_450_PREFERENCE')
          assert len(obs)==6
          fields=('preferenceCalls','preferenceBytes','canTurnCalls','canTurnBytes',
                  'canTurnAllowed','turnWayCalls','turnWayBytes','laneBodyCalls',
                  'laneBodyBytes','entryPlanCalls','entryPlanBytes','dockBodyCalls',
                  'dockBodyBytes','residualCanTurnBytes')
          sums={k:sum(int(row[k]) for row in obs) for k in fields}
          assert sums['canTurnCalls']>=sums['canTurnAllowed']
          assert sums['turnWayCalls']==sums['canTurnCalls']
          assert sums['laneBodyCalls']<=sums['turnWayCalls']
          assert sums['entryPlanCalls']<=sums['laneBodyCalls']
          assert sums['dockBodyCalls']<=sums['entryPlanCalls']
          assert sums['preferenceBytes']>=sums['canTurnBytes']
          assert sums['canTurnBytes']==sum(sums[k] for k in
                  ('turnWayBytes','laneBodyBytes','entryPlanBytes',
                   'dockBodyBytes','residualCanTurnBytes'))
          assert all(len(rows(arm,'PR57_337_HOUR'))==6 for arm in 'AB')
          assert all(len(rows(arm,'PR57_337_GROUP'))==48 for arm in 'AB')
          assert all(len(rows(arm,'PR57_337_FINAL'))==1 for arm in 'AB')
          summary={'experiment':450,'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
                   'observationOnly':True,'canonicalAdvance2PerArm':10800,
                   'fullJsonParity':True,'saveSha256':sha,'counters':sums,
                   'preferenceCanTurnAllocationSharePct':round(
                       100*sums['canTurnBytes']/sums['preferenceBytes'],4)
                       if sums['preferenceBytes'] else None,
                   'turnWayShareOfCanTurnPct':round(
                       100*sums['turnWayBytes']/sums['canTurnBytes'],4)
                       if sums['canTurnBytes'] else None,
                   'speedupAccepted':False,
                   'limitations':'Intrusive GC accounting; bytes are not CPU or avoidable work; no executor replacement'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_450_SUMMARY '+json.dumps(summary,sort_keys=True))
          PY_SUMMARY
      - name: Preserve raw logs, counters and full checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-preference-alloc-450
          path: artifacts/preference450
          retention-days: 14
          if-no-files-found: warn
