name: 'PR57 #369 REAL direct in-place/list reference writers'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-369-inject.py, .github/workflows/pr57-direct-list-369.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  bounded-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject reversible scalar, canonical and list observers in checkout only
        run: |
          set -euo pipefail
          python3 scripts/pr57-367-inject.py
          python3 scripts/pr57-368-inject.py
          python3 scripts/pr57-369-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Separate .NET processes, 10800 Advance(2) each, parity and direct event census
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/list369/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_367_DIRECT_WRITERS=1 PR57_368_CANONICAL_GUARD=1 PR57_369_INPLACE_WRITERS="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/list369/$mode" \
                > "artifacts/list369/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|367_(FIELD|PHASE|SUMMARY)|368_GUARD|369_(FIELD|PHASE|EXAMPLE|SUMMARY)) ' \
              "artifacts/list369/$mode/full.log" \
              > "artifacts/list369/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/list369/$mode/census.log")" -eq 6
            grep -q 'parity=IDENTICAL' "artifacts/list369/$mode/census.log"
          done
          cmp artifacts/list369/control/checkpoint-10800.json \
              artifacts/list369/probe/checkpoint-10800.json
          sha256sum artifacts/list369/{control,probe}/checkpoint-10800.json \
            | tee artifacts/list369/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/list369/summary.txt
          from pathlib import Path
          root=Path("artifacts/list369")
          def rows(mode,prefix):
              return [dict(x.split("=",1) for x in line.split()[1:] if "=" in x)
                      for line in (root/mode/"census.log").read_text().splitlines()
                      if line.startswith(prefix+" ")]
          assert not rows("control","PR57_369_SUMMARY")
          s=rows("probe","PR57_369_SUMMARY")
          assert len(s)==1 and int(s[0]["canonical"])==98
          fields=rows("probe","PR57_369_FIELD")
          phases=rows("probe","PR57_369_PHASE")
          assert len(fields)==int(s[0]["keys"])
          assert sum(int(x["attempts"]) for x in fields)==(
              int(s[0]["inPlaceCalls"])+int(s[0]["referenceReplacements"]))
          assert sum(int(x["attempts"]) for x in phases)==sum(int(x["attempts"]) for x in fields)
          assert sum(int(x["changed"]) for x in fields)==(
              int(s[0]["countChanges"])+int(s[0]["referenceReplacements"]))
          assert int(s[0]["countChanges"])<=int(s[0]["inPlaceCalls"])
          for prefix in ("PR57_367_FIELD","PR57_367_PHASE"):
              assert sorted(tuple(sorted(x.items())) for x in rows("control",prefix))==\
                     sorted(tuple(sorted(x.items())) for x in rows("probe",prefix))
          for mode in ("control","probe"):
              assert len(rows(mode,"PR57_337_HOUR"))==6
              assert len(rows(mode,"PR57_337_FINAL"))==1
              scalar=rows(mode,"PR57_367_SUMMARY")
              assert len(scalar)==1 and int(scalar[0]["writes"])==1852
              guard=rows(mode,"PR57_368_GUARD")
              assert len(guard)==1 and guard[0]["enabled"] in ("True","true","1")
              assert int(scalar[0]["noncanonical"])==0
              print("PR57_369_ARM",mode,
                    "hour1WallMs",rows(mode,"PR57_337_HOUR")[0]["wallMs"],
                    "hour1AllocatedBytes",rows(mode,"PR57_337_HOUR")[0]["totalAllocatedBytes"])
          print("PR57_369_AUDIT",s[0])
          for x in fields: print("PR57_369_FIELD_AUDIT",x)
          print("PR57_369_PARITY fieldsAndPhases=True savesIdentical=True")
          PY
      - name: Upload raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-list-369
          path: artifacts/list369/
          if-no-files-found: warn
