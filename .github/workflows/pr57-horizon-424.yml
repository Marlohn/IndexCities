name: 'PR57 #424 first-scan remaining versus dt REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-limiter-divergence-422.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject bounded observation only in disposable checkout
        run: python3 scripts/pr57-424-inject.py
      - name: Build and run complete regression suite
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, individual Advance(2), same save and horizon
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base shadow; do
            flag=0
            if [[ "$arm" == shadow ]]; then flag=1; fi
            mkdir -p "artifacts/horizon424/$arm"
            PR57_420_COHORT_SHADOW="$flag" PR57_422_LIMITER_SHADOW="$flag" PR57_424_HORIZON_SHADOW="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/horizon424/$arm" \
                > "artifacts/horizon424/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/horizon424/$arm/full.log"
          done
          cmp artifacts/horizon424/base/checkpoint-10800.json artifacts/horizon424/shadow/checkpoint-10800.json
          sha256sum artifacts/horizon424/*/checkpoint-10800.json | tee artifacts/horizon424/checkpoints.sha256
          python3 - <<'PY_SUMMARY' | tee artifacts/horizon424/summary.json
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts/horizon424')
          arms={}
          for arm in ('base','shadow'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              cohorts=rows('PR57_420_COHORT')
              persistence=rows('PR57_420_SUMMARY')
              limiter=rows('PR57_422_SUMMARY')
              horizon=rows('PR57_424_SUMMARY')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert int(boundaries[-1]['calls'])==10800 and final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              if arm=='shadow':
                  assert len(cohorts)==4 and len(persistence)==1,(cohorts,persistence)
                  p=persistence[0]
                  assert len(limiter)==1,limiter
                  assert len(horizon)==1,horizon
                  z=horizon[0]
                  assert z['observational']=='True' and z['causalClosure']=='False'
                  assert int(z['physical'])==600
                  assert int(z['first'])==int(p['firstScans'])
                  assert int(z['remainingEqDt'])+int(z['remainingNeDt'])==int(z['first'])
                  assert int(z['changed'])==int(l['readerChanged'])
                  assert int(z['dtChanged'])+int(z['dtSame'])==int(z['changed'])
                  assert int(z['eqDtBoth'])+int(z['preConsumedEither'])==int(z['changed'])
                  l=limiter[0]
                  assert l['observational']=='True' and l['causalClosure']=='False' and l['noDecisionReuse']=='True'
                  assert int(l['physical'])==600
                  assert int(l['readerChanged'])==int(p['sameReader'])-int(p['sameReaderDecision'])
                  keys=('leader','initial','stop','poses','bend','site','crossing','steer','unexplained')
                  assert sum(int(l[k]) for k in keys)==int(l['readerChanged'])
                  assert int(l['unexplained'])==0
                  assert int(l['sameLeaderStepChanged'])<=int(l['readerStepChanged'])<=int(l['readerChanged'])
                  assert p['observational']=='True' and p['causalClosure']=='False'
                  assert p['noSkippedSlices']=='True' and p['noDecisionReuse']=='True'
                  assert int(p['physical'])==600
                  assert int(p['scans'])>=int(p['firstScans'])>=int(p['consecutive'])
                  assert int(p['sameReaderDecision'])<=min(int(p['sameReader']),int(p['sameDecision']))
                  assert all(int(p[k])<=int(p['consecutive']) for k in ('sameReader','sameBlocker','sameDistance','sameStep','sameDecision'))
                  assert sorted(int(c['kind']) for c in cohorts)==[0,1,2,3]
                  assert sum(int(c['actors']) for c in cohorts)==98*600
                  assert all(int(c['scalarStable'])<=int(c['actors']) for c in cohorts)
              else:
                  assert not cohorts and not persistence and not limiter
              arms[arm]={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                         'cpuMs':sum(float(h['cpuMs']) for h in hours),
                         'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                         'final':final[0], 'cohorts':cohorts, 'persistence':persistence[0] if persistence else None,
                         'limiter':limiter[0] if limiter else None, 'horizon':horizon[0] if arm=='shadow' else None}
          saves=[(root/a/'checkpoint-10800.json').read_bytes() for a in ('base','shadow')]
          assert saves[0]==saves[1]
          sha=hashlib.sha256(saves[0]).hexdigest()
          assert sha=='e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa',sha
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
                            'advance2PerArm':10800,'arms':arms,'saveSha256':sha,
                            'observational':True,'causalClosure':False,'optimizationGainAccepted':False},sort_keys=True))
          PY_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-horizon-424
          path: artifacts/horizon424
          retention-days: 14
