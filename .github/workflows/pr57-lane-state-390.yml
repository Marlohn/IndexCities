name: 'PR57 #390 REAL lane state binding census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-390-inject.py, .github/workflows/pr57-lane-state-390.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-lane-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational #390 in disposable checkout
        run: |
          set -euo pipefail
          python3 scripts/pr57-390-inject.py
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, each 10800 individual Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            mkdir -p "artifacts/order390/$arm"
            PR57_390_LANE_SHADOW="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/order390/$arm" \
                > "artifacts/order390/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/order390/$arm/full.log"
          done
          cmp artifacts/order390/base/checkpoint-10800.json artifacts/order390/probe/checkpoint-10800.json
          sha256sum artifacts/order390/*/checkpoint-10800.json | tee artifacts/order390/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/order390/summary.json
          import json
          from pathlib import Path
          root=Path('artifacts/order390')
          result={}
          for arm in ('base','probe'):
              data=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(v.split('=',1) for v in line.split()[1:] if '=' in v)
                          for line in data if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundary=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              cells=rows('PR57_390_CELL')
              assert len(hours)==6 and len(boundary)==108 and len(final)==1
              assert int(boundary[-1]['calls'])==10800
              assert final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              assert len(cells)==(12 if arm=='probe' else 0)
              summary={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                       'cpuMs':round(sum(float(h['cpuMs']) for h in hours),3),
                       'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours)}
              if cells:
                  assert sorted(int(c['cell']) for c in cells)==list(range(12))
                  assert all(int(c['physicalCalls'])==600 and c['observationOnly']=='True'
                             and c['noReorder']=='True' and c['noSkippedSlices']=='True'
                             for c in cells)
                  assert len({int(c['frequency']) for c in cells})==1
                  frequency=int(cells[0]['frequency'])
                  assert frequency>0
                  total=lambda k:sum(int(c[k]) for c in cells)
                  counts={str(k):sum(int(c['calls']) for c in cells if int(c['outcome'])==k)
                          for k in range(3)}
                  assert total('calls')>0
                  assert total('finalZero')<=total('calls')
                  assert total('rawZero')<=total('calls')
                  assert all(int(c['finalZero'])<=int(c['calls']) for c in cells)
                  summary['lane']={'calls':total('calls'),'candidates':total('candidates'),
                     'ticks':total('ticks'),'frequency':frequency,
                     'scanMs':round(total('ticks')*1000/frequency,3),
                     'outcomes':counts,'finalZero':total('finalZero'),
                     'rawZero':total('rawZero'),'cells':cells}
              result[arm]=summary
          print(json.dumps({'arms':result,'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'sampledPhysicalCalls':600,
              'observational':True,'causalClosure':False,
              'optimizationGainAccepted':False},sort_keys=True))
          PY
      - name: Upload original logs and saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-lane-state-390
          path: artifacts/order390/
          if-no-files-found: warn
