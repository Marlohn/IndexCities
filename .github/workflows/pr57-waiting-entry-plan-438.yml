name: 'PR57 #438 exact shared-space setup helper cost REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-waiting-entry-plan-438.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-setup-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational timers in disposable checkout
        run: python3 scripts/pr57-438-inject.py
      - name: Build and full regression suite
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, public individual Advance(2), six simulated hours
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base shadow; do
            flag=0
            if [[ "$arm" == shadow ]]; then flag=1; fi
            mkdir -p "artifacts/stage438/$arm"
            PR57_420_COHORT_SHADOW="$flag" PR57_432_STAGE_COST="$flag" PR57_437_SETUP_COST="$flag" PR57_277_ENTRY_PLAN="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/stage438/$arm" \
                > "artifacts/stage438/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/stage438/$arm/full.log"
          done
          cmp artifacts/stage438/base/checkpoint-10800.json artifacts/stage438/shadow/checkpoint-10800.json
          sha256sum artifacts/stage438/*/checkpoint-10800.json > artifacts/stage438/checkpoints.sha256
          python3 - <<'PY_AUDIT' | tee artifacts/stage438/summary.json
          import json,hashlib
          from pathlib import Path
          root=Path('artifacts/stage438')
          arms={}; signatures=[]
          for arm in ('base','shadow'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(x.split('=',1) for x in line.split()[1:] if '=' in x)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              boundaries=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              cohort=rows('PR57_420_COHORT')
              sample=rows('PR57_432_SUMMARY')
              stages=rows('PR57_432_STAGE')
              components=rows('PR57_437_COMPONENT')
              entry=rows('PR57_277_ENTRY')
              entryStages=rows('PR57_277_STAGE')
              baySum=rows('PR57_438_SUM')
              bayIds=rows('PR57_438_ID')
              bayGates=rows('PR57_438_GATE')
              assert len(hours)==6 and len(boundaries)==108 and len(final)==1
              assert [int(x['calls']) for x in boundaries]==list(range(100,10801,100))
              assert all(x['quantum']=='2' for x in boundaries)
              assert all(int(x['living'])==121 for x in hours)
              assert final[0]['parity']=='IDENTICAL'
              signatures.append([tuple(h[k] for k in
                  ('hour','slices','actors','claimChanges','spaceCountChanges',
                   'living','ledger','history')) for h in hours])
              if arm=='shadow':
                  assert len(cohort)==4 and len(sample)==1 and len(stages)==11
                  assert int(sample[0]['sampledPhysical'])==60
                  assert int(sample[0]['sampledActors'])==1669
                  assert {int(x['stage']) for x in stages}==set(range(11))
                  assert len(components)==4
                  assert len(entry)==2 and len(entryStages)==10 and len(baySum)==1
                  assert int(baySum[0]['bayCalls'])==60
                  assert int(entry[0]['calls'])>0 and int(entry[1]['calls'])==0
                  assert sum(int(x['calls']) for x in bayIds)==60
                  assert sum(int(x['calls']) for x in bayGates)>=60
                  assert all(float(x['ms'])>=0 for x in entryStages)
                  assert all(x['observational']=='True' and x['causalClosure']=='False'
                             for x in baySum)
                  assert {x['component'] for x in components}=={
                      'next_shared','hold_before','claim_holder_poses','bay_entry_hold'}
                  assert all(int(x['calls'])>=int(x['hits'])>=0 and int(x['ticks'])>=0
                             for x in components)
                  assert all(x['observational']=='True' and x['causalClosure']=='False'
                             and x['noDecisionReuse']=='True' for x in components)
              else:
                  assert not cohort and not sample and not stages and not components and not entry and not entryStages and not baySum and not bayIds and not bayGates
              arms[arm]={
                  'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                  'cpuMs':sum(float(h['cpuMs']) for h in hours),
                  'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours),
                  'sample':sample,'stages':stages,'components':components,
                  'entry':entry,'entryStages':entryStages,'baySum':baySum,
                  'bayIds':bayIds,'bayGates':bayGates}
          assert signatures[0]==signatures[1], 'intermediate economy/history mismatch'
          saves=[(root/a/'checkpoint-10800.json').read_bytes() for a in ('base','shadow')]
          assert saves[0]==saves[1]
          sha=hashlib.sha256(saves[0]).hexdigest()
          assert len(saves[0])==2254838
          assert sha=='e92293faf61a6ea2aab7dd0fdac83c14bd4668f611a126c701dc6705587bb9fa'
          print(json.dumps({'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'arms':arms,'saveSha256':sha,
              'observational':True,'causalClosure':False,'optimizationGainAccepted':False},
              sort_keys=True))
          PY_AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-entry-plan-438
          path: artifacts/stage438
          retention-days: 14
