name: 'PR57 #344 REAL exclusive negative BodyOnWay cost'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-exclusive-body-344.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  exclusive-body:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject checkout-only observational timing
        run: python3 scripts/pr57-344-inject.py
      - name: Build authentic replay and run simulation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Control and probe in fresh .NET processes, individual Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/body344/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_344_EXCLUSIVE="$flag" dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/body344/$mode" > "artifacts/body344/$mode/full.log"
            grep -E '^PR57_(344_(FINAL|GROUP)|337_(HOUR|FINAL)) ' \
              "artifacts/body344/$mode/full.log" > "artifacts/body344/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/body344/$mode/census.log")" -eq 6
            grep -q 'parity=IDENTICAL' "artifacts/body344/$mode/census.log"
            grep '^PR57_344_FINAL ' "artifacts/body344/$mode/census.log"
          done
          cmp artifacts/body344/control/checkpoint-10800.json \
              artifacts/body344/probe/checkpoint-10800.json
          grep '^PR57_344_GROUP ' artifacts/body344/probe/census.log
          echo 'PR57_344_CHECKPOINTS_IDENTICAL'
      - name: Upload raw logs and canonical checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-exclusive-body-344
          path: artifacts/body344/**
          if-no-files-found: warn
