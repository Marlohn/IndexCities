name: 'PR57 #382 REAL operational vs physical unsplit stage cost'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [scripts/pr57-382-inject.py, .github/workflows/pr57-regime-cost-382.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject reversible observational hooks in disposable checkout
        run: |
          set -euo pipefail
          for n in 367 368 369 370 372 374 376 377 378 379 381 382; do
            python3 "scripts/pr57-$n-inject.py"
          done
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Fresh-process control and reader-regime shadow
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in control regime; do
            flag=0
            if [[ "$arm" == regime ]]; then flag=1; fi
            mkdir -p "artifacts/regime382/$arm"
            PR57_367_DIRECT_WRITERS=1 PR57_368_CANONICAL_GUARD=1 \
            PR57_369_INPLACE_WRITERS=1 PR57_370_NONLOCAL_WRITERS=1 \
            PR57_372_WRITER_FRONTIER=1 PR57_372_PUBLISH=0 \
            PR57_374_NEXT_SLICE_FANOUT=1 PR57_376_REVERSE_SHADOW=0 \
            PR57_377_BITSET_SHADOW=1 PR57_378_CHURN_SHADOW=1 \
            PR57_379_PRESENCE_SHADOW=1 PR57_381_READER_REGIME="$flag" \
            PR57_382_REGIME_COST="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/regime382/$arm" \
                > "artifacts/regime382/$arm/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|367_SUMMARY|369_SUMMARY|370_SUMMARY|372_SUMMARY|374_SUMMARY|377_SUMMARY|378_SUMMARY|379_SUMMARY|381_SUMMARY|382_(SUMMARY|BOUND)) ' \
              "artifacts/regime382/$arm/full.log" > "artifacts/regime382/$arm/census.log"
            grep -q 'parity=IDENTICAL' "artifacts/regime382/$arm/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/regime382/$arm/census.log")" -eq 6
          done
          cmp artifacts/regime382/control/checkpoint-10800.json \
              artifacts/regime382/regime/checkpoint-10800.json
          sha256sum artifacts/regime382/*/checkpoint-10800.json \
            | tee artifacts/regime382/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/regime382/summary.json
          import json
          from pathlib import Path
          root=Path("artifacts/regime382")
          def rows(arm,prefix):
              return [dict(x.split("=",1) for x in line.split()[1:] if "=" in x)
                      for line in (root/arm/"census.log").read_text().splitlines()
                      if line.startswith(prefix+" ")]
          def one(arm,prefix):
              found=rows(arm,prefix)
              assert len(found)==1,(arm,prefix,len(found))
              return found[0]
          arms={}
          for arm in ("control","regime"):
              h=rows(arm,"PR57_337_HOUR")
              assert len(h)==6 and all(int(x["living"])==121 for x in h)
              assert one(arm,"PR57_337_FINAL")["parity"]=="IDENTICAL"
              assert int(one(arm,"PR57_377_SUMMARY")["uniqueReadPairs"])==1327930
              assert int(one(arm,"PR57_379_SUMMARY")["zeroActive"])==83
              assert int(one(arm,"PR57_379_SUMMARY")["prevActiveSum"])==13690
              arms[arm]={"wallMs":round(sum(float(x["wallMs"]) for x in h),3),
                         "cpuMs":round(sum(float(x["cpuMs"]) for x in h),3),
                         "allocatedBytes":sum(int(x["totalAllocatedBytes"]) for x in h)}
          assert rows("control","PR57_381_SUMMARY")==[]
          r=one("regime","PR57_381_SUMMARY")
          n=lambda k:int(r[k])
          assert n("calls")==600
          assert n("dtZero")+n("dtPositive")==600
          assert n("operationsNonNull")+n("operationsNull")==600
          assert n("zeroReaders")==n("zeroDtZero")+n("zeroDtPositive")==84
          assert n("zeroNoEligible")+n("zeroWithEligible")==84
          assert n("readerOccurrences")==13690
          assert n("opsReaders")+n("motionReaders")==13690
          assert n("zeroBatchNull")+n("zeroBatchEmpty")+n("zeroBatchNonempty")==84
          assert all(r[k]=="True" for k in
                     ("noCausalClosure","noDecisionReuse","noSkippedSlices","observational"))
          cost=rows("regime","PR57_382_SUMMARY")
          assert len(cost)==2
          by_regime={x["regime"]:x for x in cost}
          assert set(by_regime)=={"operational","physical"}
          assert int(by_regime["operational"]["calls"])==84
          assert int(by_regime["physical"]["calls"])==516
          assert int(by_regime["operational"]["operationsNonNull"])==84
          assert int(by_regime["physical"]["operationsNonNull"])==0
          for x in cost:
              assert x["noCausalClosure"]=="True" and x["noSkippedSlices"]=="True"
              total=float(x["totalMs"])
              parts=sum(float(x[k+"Ms"]) for k in
                        ("setup","cleanup","prepare","actor","towSync","post"))
              assert abs(total-parts)<.02,(x["regime"],total,parts)
              assert int(x["allocatedBytes"])==sum(int(x[k+"Bytes"]) for k in
                        ("setup","cleanup","prepare","actor","towSync","post"))
          bound=one("regime","PR57_382_BOUND")
          assert int(bound["measuredCalls"])==600
          assert abs(float(bound["operationsPct"])+float(bound["physicalPct"])-100)<.01
          assert rows("control","PR57_382_SUMMARY")==[]
          print(json.dumps({"arms":arms,"regime":r,"cost":by_regime,"bound":bound,
                            "partialGate":True,"causalClosure":False,
                            "acceptedSpeedup":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-scale-pr57-regime-cost-382
          path: artifacts/regime382
          if-no-files-found: warn
