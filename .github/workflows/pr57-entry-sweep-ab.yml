name: PR57 exact lane-entry projected recheck sweep A/B
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-entry-sweep-ab.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  entry-sweep-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and verify unchanged contract in both modes
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          for flag in 0 1; do
            PR57_ENTRY_SWEEP_FILTER="$flag" dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          done
      - name: Restore authentic congested economy and artificial large-grid saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real-source
      - name: Restore artificial scale fixture from existing reference
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/curve-reference
      - name: ABBA in fresh processes, unchanged quanta and intermediate full saves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/entry-sweep
          real="$(find artifacts/real-source -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          grid="artifacts/curve-reference/grid18-0/checkpoint-1.json"
          test -s "$real"
          test -s "$grid"
          for scenario in real121 grid18 cycle; do
            if [[ "$scenario" == real121 ]]; then
              args=(scale cycle --seed=42 --warmup=0 --days=4 --window=900 --cap=300 --resume="$real")
              classification=REAL
            elif [[ "$scenario" == grid18 ]]; then
              args=(scale grid --seed=42 --warmup=0 --days=3 --window=100 --cap=300 --resume="$grid")
              classification=ARTIFICIAL
            else
              args=(scale cycle --seed=42 --warmup=0 --days=3 --window=600 --cap=300)
              classification=REAL_INITIAL
            fi
            n=0
            for mode in control candidate candidate control; do
              out="artifacts/entry-sweep/$scenario-$n"
              mkdir -p "$out"
              if [[ "$mode" == candidate ]]; then enabled=1; else enabled=0; fi
              echo "PR57_SWEEP_AB case=$scenario class=$classification index=$n mode=$mode enabled=$enabled cadence=Advance2"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_ENTRY_SWEEP_FILTER="$enabled" \
              PR57_BUILDING_WORK_ACCESS=0 PR57_DYNAMIC_BVH=0 PR57_PARALLEL_NEEDS=0 \
              PR57_STAFF_PHASE_FUSION=0 PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 \
              PR57_PARALLEL_POLLUTION=0 PR57_CONSTRUCTION_WAIT_AGENDA=0 \
              PR57_DISPATCH_SHIPMENT_LOOKUP=0 PR57_ROUTE_TREE=0 \
              PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0 \
              PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 \
              PR57_PEDESTRIAN_GRID=0 PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0 \
              PR57_SAVE_CAPTURE_DIR="$PWD/$out" \
                timeout 150s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- "${args[@]}" | tee "$out.log"
              n=$((n+1))
            done
          done
      - name: Verify snapshots, actual flag use, invariants and A/B wall CPU allocations
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/entry-sweep')
          for case,seconds,windows in (('real121',3600,4),('grid18',300,3),('cycle',1800,3)):
              results=[]
              for i in range(4):
                  log=(root/f'{case}-{i}.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,i,'invariants/save')
                  rows=[s for s in log.splitlines() if s.startswith('WINDOW ')]
                  assert len(rows)==windows,(case,i,'window count',len(rows))
                  def metric(row,key):
                      m=re.search(r'\b'+re.escape(key)+r'=([0-9.]+)',row)
                      assert m,(case,i,key,row)
                      return float(m.group(1))
                  result={key:sum(metric(row,key) for row in rows) for key in ('wall','cpu','allocMB')}
                  result['pop']=metric(rows[-1],'pop')
                  result['alive']=metric(rows[-1],'alive')
                  results.append(result)
                  for n in range(windows+1):
                      candidate=root/f'{case}-{i}'/f'checkpoint-{n}.json'
                      control=root/f'{case}-0'/f'checkpoint-{n}.json'
                      assert candidate.is_file() and candidate.read_bytes()==control.read_bytes(),(case,i,n,'causal divergence')
              if case=='real121':
                  assert 'PR57_ENTRY_SWEEP_FILTER active=True' in (root/f'{case}-1.log').read_text(),('flag did not narrow any candidate',case)
              print('PR57_SWEEP_RESULT',case,'seconds',seconds,'order',('control','candidate','candidate','control'),
                    'results',results,'pairWallImprovement',[
                        round(100*(results[c]['wall']-results[t]['wall'])/results[c]['wall'],2)
                        for c,t in ((0,1),(3,2))],
                    'throughput',[round(seconds/x['wall'],2) for x in results],
                    'checkpoints',windows+1,'equal',True)
          PY
      - name: Preserve independent logs and complete saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-entry-sweep-ab
          path: artifacts/entry-sweep/**
          retention-days: 14
