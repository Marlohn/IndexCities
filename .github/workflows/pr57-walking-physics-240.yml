name: 'PR57 #240 walking physics cost split, initial/later states'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-walking-physics-240.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  walking:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore exact #237 initial and later states
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/prior
      - name: Replay Advance(2), full state control and walking profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/walk-240
          for spec in worksREAL:early queueREAL:early gridARTIFICIAL:early gridARTIFICIAL:late; do
            case="${spec%%:*}"; epoch="${spec#*:}"
            fixture=cycle; horizon=200; index=0
            if [[ "$case" == gridARTIFICIAL ]]; then fixture=grid; horizon=100; fi
            if [[ "$epoch" == late ]]; then index=5; fi
            source="$(find artifacts/prior -type f -path "*/$case-control1/checkpoint-$index.json" -print -quit)"
            test -s "$source"
            echo "PR57_240_SOURCE case=$case epoch=$epoch sha256=$(sha256sum "$source" | cut -d' ' -f1)"
            for mode in control profile; do
              output="$PWD/artifacts/walk-240/$case-$epoch-$mode"
              mkdir -p "$output"
              command=scale; enabled=0
              if [[ "$mode" == profile ]]; then command=profile; enabled=1; fi
              echo "PR57_240_RUN case=$case epoch=$epoch mode=$mode horizon=$horizon cadence=ADVANCE_2"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_236_POSE_NOOP_SKIP=1 \
              PR57_240_WALK_SPLIT="$enabled" PR57_224_CITIZEN_STATE_COST="$enabled" \
              PR57_239_CITIZEN_PHASES=0 PR57_206_RESIDUAL_EXCLUSIVE=0 \
              PR57_207_POSE_GUARD=0 PR57_208_BODY_SAT_CENSUS=0 \
              PR57_209_SHIPMENT_READ_CENSUS=0 PR57_LANE_READWRITE_PROBE=0 \
              PR57_BLOCK_DEP_PROBE=0 PR57_VEHICLE_COST_PROBE=0 \
              PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" "$fixture" --seed=42 --warmup=0 --days=1 \
                --window="$horizon" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify full state and print bounded walking cost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('artifacts/walk-240')
          def val(row,key):
              m=re.search(r'(?:^| )'+re.escape(key)+r'=([-0-9.]+)',row)
              assert m,(key,row)
              return float(m.group(1))
          for case,epoch in [('worksREAL','early'),('queueREAL','early'),('gridARTIFICIAL','early'),('gridARTIFICIAL','late')]:
              stem=f'{case}-{epoch}'
              control=(root/f'{stem}-control.log').read_text()
              profile=(root/f'{stem}-profile.log').read_text()
              for mode,log in [('control',control),('profile',profile)]:
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(stem,mode)
                  assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1,(stem,mode)
              for i in (0,1):
                  a=(root/f'{stem}-control'/f'checkpoint-{i}.json').read_bytes()
                  b=(root/f'{stem}-profile'/f'checkpoint-{i}.json').read_bytes()
                  assert a==b,(stem,i,'FULL_JSON_MISMATCH')
              rows=[x for x in profile.splitlines() if x.startswith('PR57_240_WALK name=')]
              assert len(rows)==4,(stem,'missing probe rows',len(rows))
              stages={}
              for row in rows:
                  name=row.split('name=',1)[1].split(' ',1)[0]
                  assert name not in stages,(stem,name)
                  stages[name]=(int(val(row,'calls')),val(row,'ms'))
              assert set(stages)=={'crossing-reached','pedestrian-gap','crossing-occupancy','citizen-arrived'},(stem,stages)
              summary=next(x for x in profile.splitlines() if x.startswith('PR57_240_WALK_SUM '))
              visits=int(val(summary,'visits')); segments=int(val(summary,'segments'))
              assert visits>0 and segments>0,(stem,summary)
              assert stages['crossing-reached'][0]==segments,(stem,summary,stages)
              assert stages['pedestrian-gap'][0]<=segments,(stem,summary,stages)
              if case=='gridARTIFICIAL':
                  assert stages['pedestrian-gap'][0]>0,(stem,stages)
              states=[x for x in profile.splitlines() if x.startswith('PR57_224_CITIZEN_STATE ')]
              walking=next(x for x in states if 'name=walking ' in x)
              print('PR57_240_RESULT',stem,'walkingMs',val(walking,'actorMs'),
                    'visits',visits,'segments',segments,
                    'crossingMs',stages['crossing-reached'][1],
                    'gapMs',stages['pedestrian-gap'][1],
                    'occupancyMs',stages['crossing-occupancy'][1],
                    'arrivalMs',stages['citizen-arrived'][1],
                    'crossingCalls',stages['crossing-reached'][0],
                    'gapCalls',stages['pedestrian-gap'][0],
                    'crosswalkCandidates',int(val(summary,'crosswalkCandidates')),
                    'citizenCandidates',int(val(summary,'citizenCandidates')),
                    'replans',int(val(summary,'replans')),
                    'scope','INTRUSIVE_NOT_ABBA')
              print('PR57_240_PARITY',stem,'processes',2,'checkpoints',2,'fullJSON','EXACT','cadence','ADVANCE_2')
          PY
      - name: Preserve logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-walking-240
          path: artifacts/walk-240/**
          retention-days: 14
