name: PR57 residual movement hotspot attribution at host cadence
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-movement-hotpath.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  movement-hotpath:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and regression suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic economic construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/real
      - name: Restore artificial load checkpoints
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Plain wall and separate intrusive hotspot profile on identical Advance(2) saves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hotpath
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          real="$(find artifacts/real -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          test -s "$works"; test -s "$real"; test -s "$grid"
          for case in works4h real121 grid18 cycle; do
            for mode in plain timed; do
              source=""
              fixture=cycle
              horizon=1800
              if [[ "$case" == works4h ]]; then source="$works";horizon=14400; fi
              if [[ "$case" == real121 ]]; then source="$real";horizon=3600; fi
              if [[ "$case" == grid18 ]]; then source="$grid";fixture=grid;horizon=300; fi
              command=scale
              timed=0
              if [[ "$mode" == timed ]]; then command=profile;timed=1; fi
              output="artifacts/hotpath/$case-$mode"
              mkdir -p "$output"
              args=("$command" "$fixture" --seed=42 --warmup=0 --days=4 --window="$horizon" --cap=300)
              if [[ -n "$source" ]]; then args+=(--resume="$source"); fi
              echo "PR57_HOT_RUN case=$case mode=$mode quantum=2 profile=$timed source=$source"
              PR57_HOT_TIMING="$timed" PR57_IDLE_SCAN_PROBE="$timed" PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1               PR57_GRID_DIAG=1 PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1               PR57_STRANDED_GRAPH=0 PR57_SHARED_NODE_GRID=0 PR57_ENTRY_SWEEP_FILTER=0               PR57_DYNAMIC_BVH=0 PR57_PARALLEL_NEEDS=0 PR57_STAFF_PHASE_FUSION=0               PR57_UTILITY_REPLAY=0 PR57_POLLUTION_SIMD=0 PR57_PARALLEL_POLLUTION=0               PR57_CONSTRUCTION_WAIT_AGENDA=0 PR57_DISPATCH_SHIPMENT_LOOKUP=0               PR57_ROUTE_TREE=0 PR57_ORDER_SHIPMENT_INDEX=0 PR57_MAINTENANCE_SCHEDULE=0               PR57_SOURCE_DISTANCE_CACHE=0 PR57_WORK_ACCESS_INDEX=0 PR57_PEDESTRIAN_GRID=0               PR57_LIVING_ROSTER=0 PR57_CITIZEN_AGENDA=0               PR57_SAVE_CAPTURE_DIR="$PWD/$output"                 timeout 210s dotnet run --no-build -c Release --project src/IndexCities.Headless/IndexCities.Headless.csproj -- "${args[@]}"                 | tee "$output.log"
            done
          done
      - name: Validate exact causal checkpoints and report subroutine timing
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('artifacts/hotpath')
          for case in ('works4h','real121','grid18','cycle'):
              plain=(root/f'{case}-plain.log').read_text()
              timed=(root/f'{case}-timed.log').read_text()
              for mode,log in [('plain',plain),('timed',timed)]:
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,mode,'invariants/save')
                  paths=sorted((root/f'{case}-{mode}').glob('checkpoint-*.json'))
                  assert len(paths)>=2,(case,mode,'checkpoints')
              plain_paths=sorted((root/f'{case}-plain').glob('checkpoint-*.json'))
              timed_paths=sorted((root/f'{case}-timed').glob('checkpoint-*.json'))
              assert [p.name for p in plain_paths]==[p.name for p in timed_paths],(case,'checkpoint names')
              for a,b in zip(plain_paths,timed_paths):
                  assert a.read_bytes()==b.read_bytes(),(case,a.name,'causal divergence')
              assert 'PR57_HOT_TIMING' not in plain and 'PR57_IDLE_PROBE ' not in plain,(case,'profile leakage')
              assert 'PR57_IDLE_PROBE ' in timed,(case,'idle probe not engaged')
              hot=[line for line in timed.splitlines() if line.startswith('PR57_HOT_TIMING ')]
              assert hot,(case,'profile not engaged')
              last=hot[-1]
              def value(key):
                  match=re.search(r'\b'+re.escape(key)+r'=([0-9.]+)',last)
                  assert match,(case,key,last)
                  return float(match.group(1))
              assert value('siteCalls')>0 and value('junctionCalls')>0,(case,'no hot calls')
              windows=[line for line in plain.splitlines() if line.startswith('WINDOW ')]
              assert windows,(case,'no plain wall')
              print('PR57_HOT_RESULT',case,'checkpoints',len(plain_paths),'plainWindows',len(windows),
                    'profile',last,'idle',next(line for line in reversed(timed.splitlines()) if line.startswith('PR57_IDLE_PROBE ')),'plainWallRows',windows)
          PY
      - name: Preserve logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-movement-hotpath
          path: artifacts/hotpath/**
          retention-days: 14
