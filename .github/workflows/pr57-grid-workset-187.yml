name: 'PR57 #187 GRID sub-slice partial workset census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-grid-workset-187.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  grid-workset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
      PR57_187_SLICE_WORKSET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build observer and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore exact authentic GRID checkpoint from #184
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-retained-heap-184
          run-id: 40451480020
          github-token: ${{ github.token }}
          path: artifacts/reference
      - name: Run full Advance(2) replay with sub-slice census
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/reference -type f -path '*/gridARTIFICIAL/plain/checkpoint-0.json' -print -quit)"
          test -s "$source"
          mkdir -p artifacts/workset-187
          timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj \
            -c Release --no-build -- "$source" "$PWD/artifacts/workset-187" \
            | tee artifacts/workset-187.log
      - name: Verify full checkpoints and complete slice census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          ref=next(pathlib.Path('artifacts/reference').glob('**/gridARTIFICIAL/plain/checkpoint-0.json')).parent
          out=pathlib.Path('artifacts/workset-187')
          for i in range(5):
              assert (ref/f'checkpoint-{i}.json').read_bytes()==(out/f'checkpoint-{i*50}.json').read_bytes(),i
          lines=pathlib.Path('artifacts/workset-187.log').read_text().splitlines()
          batches=[]
          for line in lines:
              if not line.startswith('PR57_187_BATCH '): continue
              row=dict(part.split('=',1) for part in line.split()[1:] if '=' in part)
              batches.append(row)
          assert batches,'no active sub-slice census'
          sums={key:sum(int(r[key]) for r in batches) for key in
                ('slices','initialEligible','actualAttempts','partialChanged','moved','otherChanged')}
          assert sums['slices']==210,sums
          assert sums['actualAttempts']>0,sums
          assert 0<=sums['partialChanged']<=sums['initialEligible'],sums
          assert sums['moved']<=sums['partialChanged'],sums
          assert any(x.startswith('PR57_186_DONE ') for x in lines)
          print('PR57_187_VALIDATED',sums,'parity=EXACT_JSON', 'scope=OBSERVATIONAL_NOT_AB')
          PY
      - name: Preserve full checkpoints and sub-slice logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-grid-workset-187
          path: |
            artifacts/workset-187/**
            artifacts/workset-187.log
          retention-days: 14
