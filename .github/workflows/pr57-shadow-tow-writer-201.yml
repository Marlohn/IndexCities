name: 'PR57 #201 third-party tow reservation shadow adversarial'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-shadow-tow-writer-201.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  tow-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Focused third-party writer and stale public mutation repro
        run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter FullyQualifiedName~Pr57ReservationShadowTowWriterTests --verbosity normal
      - name: Full regression suite
        run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
