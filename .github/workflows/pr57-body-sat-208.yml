name: 'PR57 #208 bounded SAT calls inside s6 pose guard'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-body-sat-208.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  residual-exclusive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and run full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic real works checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-growth
          run-id: 40250545171
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Restore authentic congested checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: ${{ github.token }}
          path: artifacts/queue
      - name: Restore clearly ARTIFICIAL GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-host-scale-curve
          run-id: 40258405557
          github-token: ${{ github.token }}
          path: artifacts/grid
      - name: Execute independent Advance(2) control and bounded probe
        shell: bash
        run: |
          set -euo pipefail
          works="$(find artifacts/works -type f -path '*/growth/checkpoint-0.json' -print -quit)"
          queue="$(find artifacts/queue -type f -path '*/pr57-jobs-20/checkpoint-10.json' -print -quit)"
          grid="artifacts/grid/grid18-0/checkpoint-1.json"
          for source in "$works" "$queue" "$grid"; do test -s "$source"; sha256sum "$source"; done
          mkdir -p artifacts/body-sat-208
          for case in worksREAL queueREAL gridARTIFICIAL; do
            source="$works"; fixture=cycle; horizon=300
            if [[ "$case" == queueREAL ]]; then source="$queue"; fi
            if [[ "$case" == gridARTIFICIAL ]]; then source="$grid"; fixture=grid; horizon=100; fi
            for mode in plain probe; do
              output="$PWD/artifacts/body-sat-208/$case-$mode"
              mkdir -p "$output"
              command=scale; enabled=0
              if [[ "$mode" == probe ]]; then command=profile; enabled=1; fi
              echo "PR57_207_RUN case=$case mode=$mode horizon=$horizon cadence=ADVANCE_2"
              PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 PR57_GRID_DIAG=1 \
              PR57_SAVE_CAPTURE_DIR="$output" PR57_206_RESIDUAL_EXCLUSIVE="$enabled" PR57_207_POSE_GUARD="$enabled" PR57_208_BODY_SAT_CENSUS="$enabled" \
              PR57_LANE_READWRITE_PROBE=0 PR57_BLOCK_DEP_PROBE=0 \
              PR57_VEHICLE_COST_PROBE=0 PR57_HOT_TIMING=0 PR57_PHASE_ALLOC_PROBE=0 \
                timeout 180s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" "$fixture" --seed=42 --warmup=0 --days=1 \
                --window="$horizon" --cap=300 --resume="$source" | tee "$output.log"
            done
          done
      - name: Verify full-state parity and bounded SAT call attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('artifacts/body-sat-208')
          def metric(line,key):
              m=re.search(r'(?:^| )'+re.escape(key)+r'=([-0-9.]+)',line)
              assert m,(key,line)
              return float(m.group(1))
          for case,horizon in [('worksREAL',300),('queueREAL',300),('gridARTIFICIAL',100)]:
              logs={mode:(root/f'{case}-{mode}.log').read_text() for mode in ('plain','probe')}
              for mode,log in logs.items():
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,mode)
                  assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1,(case,mode)
                  for i in (0,1):
                      assert (root/f'{case}-{mode}'/f'checkpoint-{i}.json').is_file(),(case,mode,i)
              for i in (0,1):
                  assert (root/f'{case}-plain'/f'checkpoint-{i}.json').read_bytes()==(root/f'{case}-probe'/f'checkpoint-{i}.json').read_bytes(),(case,i,'full JSON mismatch')
              assert 'PR57_206_RESIDUAL ' not in logs['plain']
              rows=[x for x in logs['probe'].splitlines() if x.startswith('PR57_206_RESIDUAL ')]
              assert len(rows)==3,(case,'expected three consecutive physical slices',len(rows))
              for i,row in enumerate(rows,1):
                  assert int(metric(row,'sample'))==i,(case,row)
                  assert int(metric(row,'eligibleSlice'))==36+i,(case,row)
                  ticks=[metric(row,f's{j}Ms') for j in range(9)]
                  bytes_=[metric(row,f's{j}MB') for j in range(9)]
                  segments=[int(metric(row,f's{j}Segments')) for j in range(9)]
                  assert all(x>=0 for x in ticks+bytes_) and all(x>=0 for x in segments),(case,row)
                  assert abs(sum(ticks)-metric(row,'totalMs'))<0.00005,(case,row)
                  assert abs(sum(bytes_)-metric(row,'totalMB'))<0.00002,(case,row)
                  assert segments[0]>=metric(row,'vehicles')>0,(case,row)
                  assert metric(row,'moved')<=metric(row,'vehicles'),(case,row)
                  assert metric(row,'travelling')<=metric(row,'vehicles'),(case,row)
                  print('PR57_206_SLICE',case,'sample',i,'vehicles',metric(row,'vehicles'),
                        'moved',metric(row,'moved'),'exclusiveMs',ticks,'exclusiveMB',bytes_,
                        'segments',segments,'scope','ORDERED_VEHICLE_LOOP_INTRUSIVE')
              assert 'PR57_207_POSE ' not in logs['plain']
              poses=[x for x in logs['probe'].splitlines() if x.startswith('PR57_207_POSE ')]
              assert len(poses)==3,(case,'pose rows',len(poses))
              for i,pose in enumerate(poses,1):
                  assert int(metric(pose,'sample'))==i and int(metric(pose,'eligibleSlice'))==36+i,(case,pose)
                  calls=metric(pose,'calls')
                  eligible=metric(pose,'eligible')
                  reached=metric(pose,'geometryCandidates')
                  changed=metric(pose,'headingChanges')
                  guard=metric(pose,'guardMs')
                  guardMB=metric(pose,'guardMB')
                  assert 0<=changed<=eligible<=calls,(case,pose)
                  assert reached>=0 and guard>=0 and guardMB>=0,(case,pose)
                  s6=metric(rows[i-1],'s6Ms')
                  assert guard<=s6+0.01,(case,'guard exceeds enclosing stage',guard,s6)
                  print('PR57_207_POSE_RESULT',case,'sample',i,'calls',calls,
                        'eligible',eligible,'geometryCandidates',reached,
                        'headingChanges',changed,'guardMs',guard,'guardMB',guardMB,
                        'enclosingS6Ms',s6,'intrusive',True)
              assert 'PR57_208_SAT ' not in logs['plain']
              sats=[x for x in logs['probe'].splitlines() if x.startswith('PR57_208_SAT ')]
              assert len(sats)==3,(case,'SAT rows',len(sats))
              for i,sat in enumerate(sats,1):
                  assert int(metric(sat,'sample'))==i and int(metric(sat,'eligibleSlice'))==36+i,(case,sat)
                  calls=int(metric(sat,'satCalls'))
                  reached=int(metric(sat,'geometryCandidates'))
                  assert 0<=calls<=2*reached,(case,'SAT calls outside expected predicate',sat)
                  assert reached==int(metric(poses[i-1],'geometryCandidates')),(case,'candidate mismatch',sat)
                  assert abs(metric(sat,'guardMB')-metric(poses[i-1],'guardMB'))<0.000002,(case,'guard byte mismatch',sat)
                  print('PR57_208_SAT_RESULT',case,'sample',i,'satCalls',calls,
                        'geometryCandidates',reached,
                        'nominalAxisArrayMB_64bit',round(calls*88/1e6,6),
                        'guardMB',metric(sat,'guardMB'),
                        'scope','BOUNDED_S6_ONLY_INTRUSIVE')
              plain=next(x for x in logs['plain'].splitlines() if x.startswith('WINDOW '))
              print('PR57_206_RESULT',case,'horizon',horizon,
                    'plainWall',metric(plain,'wall'),'plainCpu',metric(plain,'cpu'),
                    'plainAllocMB',metric(plain,'allocMB'),
                    'plainSimSecondsPerWallSecond',round(horizon/metric(plain,'wall'),2),
                    'checkpoints',2,'parity','EXACT_FULL_JSON')
          PY
      - name: Preserve full checkpoints and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-body-sat-208
          path: artifacts/body-sat-208/**
          retention-days: 14
