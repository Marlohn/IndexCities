name: 'PR57 #552 bounded causal writer publication'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-phase-writer-journal-552.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  writer-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_PARALLEL_NEEDS: '0'
      PR57_NEEDS_SINGLE_PASS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and tests with journal off and on
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          PR57_PHASE_WRITER_JOURNAL=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --verbosity quiet
      - name: Restore REAL congested save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input259
      - name: Restore REAL construction save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossphase-access-445
          run-id: 41052837425
          github-token: ${{ github.token }}
          path: artifacts/input445
      - name: Check public Advance(2) and byte-exact full saves in three scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,subprocess
          from pathlib import Path
          cases=[
            ('congestedREAL121',Path('artifacts/input259/real14hREAL-control/checkpoint-0.json'),'779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'),
            ('worksREAL47',Path('artifacts/input445/pr57-445/A/checkpoint-0.json'),'b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'),
            ('gridARTIFICIAL',None,None)]
          root=Path('artifacts/pr57-552')
          for name,source,expected in cases:
            if source:assert hashlib.sha256(source.read_bytes()).hexdigest()==expected
            checkpoints={}
            for mode in ('control','journal'):
              out=root/name/mode;out.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',PR57_GRID_DIAG='0',
                         PR57_PHASE_WRITER_JOURNAL='1' if mode=='journal' else '0',
                         PR57_SAVE_CAPTURE_DIR=str(out.resolve()))
              cmd=['dotnet','run','--no-build','-c','Release','--project',
                   'src/IndexCities.Headless/IndexCities.Headless.csproj','--','scale',
                   'cycle' if source else 'grid','--seed=42','--warmup=0','--days=2',
                   '--window=100','--cap=300']
              if source:cmd.append('--resume='+str(source.resolve()))
              else:cmd.extend(['--rows=3','--length=400'])
              with (out/'full.log').open('w') as log:
                subprocess.run(cmd,env=env,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=240)
              text=(out/'full.log').read_text()
              assert 'INVARIANTS OK' in text and 'SAVE ' in text,(name,mode,text[-1000:])
              if mode=='journal':assert 'PR57_552_SUM steps=32' in text,(name,text[-1000:])
              checkpoints[mode]=[(out/f'checkpoint-{i}.json').read_bytes() for i in range(3)]
            for i in range(3):assert checkpoints['control'][i]==checkpoints['journal'][i],(name,i)
            print('PR57_552_EXACT_SAVE_PARITY',name,'checkpoints=3',flush=True)
          print('PR57_552_WRITER_SHADOW_PASS',flush=True)
          PY
      - name: Preserve complete logs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-writer-journal-552
          path: artifacts/pr57-552
          retention-days: 14
          if-no-files-found: warn

# Re-run after fixing independent C# property declarations in #552.
