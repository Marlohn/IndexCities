name: 'PR57 #445 REAL construction cross-phase access observation'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-construction-access-445.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  construction-access:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observation only into disposable checkout
        run: python3 scripts/pr57-445-inject.py
      - name: Build and run regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/works
      - name: Fresh-process control and observation, each Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REPLAY' | tee artifacts/pr57-445-console.log
          import hashlib, json, os, re, subprocess
          from decimal import Decimal
          from pathlib import Path
          matches=list(Path('artifacts/works').rglob('worksREAL-control1/checkpoint-0.json'))
          assert len(matches)==1,matches
          source=matches[0]
          original=source.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'
          state=json.loads(original,parse_float=Decimal)
          assert sum(bool(c['Alive']) for c in state['Citizens'])==47
          assert len(state['Vehicles'])==42
          assert sum(p['Status'] in ('Waiting','InProgress') for p in state['Projects'])>=68
          root=Path('artifacts/pr57-445')
          result={}
          for mode in ('A','B'):
              dest=root/mode
              dest.mkdir(parents=True,exist_ok=True)
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                         PR57_GRID_DIAG='0',PR57_445_ACCESS_OBS='1' if mode=='B' else '0',
                         PR57_SAVE_CAPTURE_DIR=str(dest.resolve()))
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','profile','cycle','--seed=42','--warmup=0',
                   '--days=1','--window=200','--cap=600',f'--resume={source.resolve()}']
              with (dest/'full.log').open('w') as out:
                  subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,check=True,timeout=240)
              log=(dest/'full.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log
              assert 'STEP_PROFILE steps=100' in log
              assert len([x for x in log.splitlines() if x.startswith('WINDOW ')])==1
              assert len([x for x in log.splitlines() if x.startswith('PR57_AB_CHECKPOINT ')])==1
              assert len([x for x in log.splitlines() if x.lstrip().startswith('STEP_PHASE ')])==13
              rows=[x for x in log.splitlines() if x.startswith('PR57_445_ACCESS ')]
              assert len(rows)==(1 if mode=='B' else 0),(mode,rows)
              assert (dest/'checkpoint-0.json').read_bytes()==original
              final=(dest/'checkpoint-1.json').read_bytes()
              assert hashlib.sha256(final).hexdigest()=='686ed27e0cc458d3d8f411a1e308a2dc98e87bf588c12d5dcf1ea787bad1c883'
              if mode=='B':
                  values={k:float(v) if k.endswith('Ms') else int(v)
                          for k,v in re.findall(r'(\w+)=([^ ]+)',rows[0])}
                  assert values['steps']==100
                  assert values['matched']+values['noProgress']==values['dispatch']
                  assert values['sameNonNull']+values['sameNull']+values['differentAccess']==values['matched']
                  assert values['progress']>=values['matched']
                  result['observed']=values
              result[mode]={'sha256':hashlib.sha256(final).hexdigest(),'callsAdvance2':100}
          assert (root/'A/checkpoint-1.json').read_bytes()==(root/'B/checkpoint-1.json').read_bytes()
          summary={'experiment':445,'scope':'AUTHENTIC_REAL_CONSTRUCTION_68_ACTIVE',
                   'observationOnly':True,'allAdvance2':True,'fullJsonParity':True,
                   'gainAccepted':False,'result':result}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_445_SUMMARY',json.dumps(summary,sort_keys=True),flush=True)
          PY_REPLAY
      - name: Preserve raw logs and full checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-crossphase-access-445
          path: |
            artifacts/pr57-445
            artifacts/pr57-445-console.log
          retention-days: 14
