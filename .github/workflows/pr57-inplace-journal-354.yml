name: 'PR57 #354 REAL selected in-place writer journal'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-inplace-journal-354.yml, scripts/pr57-354-inject.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_246_JUNCTION_RETURNS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject #353 setter journal and #354 selected in-place callsites (checkout only)
        run: |
          python3 scripts/pr57-346-inject.py
          python3 scripts/pr57-345-observe.py
          python3 scripts/pr57-348-inject.py
          python3 scripts/pr57-351-inject.py
          python3 scripts/pr57-353-inject.py
          python3 scripts/pr57-354-inject.py
      - name: Build authentic REAL replay and run simulation tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore pinned authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay 10800 individual Advance(2) control and probe
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for mode in control probe; do
            mkdir -p "artifacts/inplace354/$mode"
            if [[ "$mode" == "probe" ]]; then flag=1; else flag=0; fi
            PR57_206_RESIDUAL_EXCLUSIVE="$flag" \
            PR57_244_STATE_COST="$flag" \
            PR57_348_STAGE_EFFECTS="$flag" \
            PR57_351_LANE_WITNESS="$flag" \
            PR57_353_JOURNAL="$flag" \
            PR57_244_PERSISTENT_IDS="1071,1243,1282,1380" \
            dotnet run --no-build -c Release \
              --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
              -- "$input" "artifacts/inplace354/$mode" > "artifacts/inplace354/$mode/full.log"
            grep -E '^PR57_(337_(HOUR|FINAL)|345_PHASE|206_RESIDUAL|244_STATE|348_(EFFECT|ACTOR)|351_WITNESS|353_JOURNAL|354_INPLACE) ' \
              "artifacts/inplace354/$mode/full.log" > "artifacts/inplace354/$mode/census.log"
            test "$(grep -c '^PR57_337_HOUR ' "artifacts/inplace354/$mode/census.log")" -eq 6
            test "$(grep -c '^PR57_345_PHASE ' "artifacts/inplace354/$mode/census.log")" -eq 78
            grep -q 'parity=IDENTICAL' "artifacts/inplace354/$mode/census.log"
          done
          cmp artifacts/inplace354/control/checkpoint-10800.json \
              artifacts/inplace354/probe/checkpoint-10800.json
          python3 - <<'PY' | tee artifacts/inplace354/summary.txt
          from pathlib import Path
          root=Path("artifacts/inplace354")
          def parse(mode,prefix):
              return [
                  {k:v for k,v in (item.split("=",1) for item in line.split()[1:] if "=" in item)}
                  for line in (root/mode/"census.log").read_text().splitlines()
                  if line.startswith(prefix+" ")
              ]
          def number(row,key):
              return int(row[key].lstrip("$"))
          witness=parse("probe","PR57_351_WITNESS")
          journal=parse("probe","PR57_353_JOURNAL")
          inplace=parse("probe","PR57_354_INPLACE")
          assert len(witness)==6,len(witness)
          assert len(journal)==2,len(journal)
          assert len(inplace)==2,len(inplace)
          assert [number(x,"window") for x in inplace]==[40001,50001]
          assert not parse("control","PR57_354_INPLACE")
          assert [number(x,"eligibleSlice") for x in witness]==[40001,40002,40003,50001,50002,50003]
          assert [number(x,"window") for x in journal]==[40001,50001]
          assert len(parse("probe","PR57_206_RESIDUAL"))==6
          assert len(parse("probe","PR57_348_ACTOR"))==186
          assert not parse("control","PR57_353_JOURNAL")
          assert not parse("control","PR57_351_WITNESS")
          for r in journal:
              assert number(r,"eligible")==60,r
              assert number(r,"compared")==40,r
              assert number(r,"clean")+number(r,"dirty")==40,r
              assert number(r,"canonicalEvents")>=0
              assert number(r,"tempEvents")>=0
              assert number(r,"exposedEvents")==sum(number(r,k) for k in ("selfEvents","winnerEvents","otherEvents"))
              print("PR57_353_WINDOW "+" ".join(f"{k}={r[k]}" for k in (
                  "window","eligible","compared","clean","dirty","canonicalEvents",
                  "tempEvents","exposedEvents","selfEvents","winnerEvents","otherEvents",
                  "clockChanged","entryChanged","roadChanged","fleetChanged","hookMs","fields")))
          for row,inc in zip(journal,inplace):
              assert number(inc,"attempts")==number(inc,"canonicalAttempts")+number(inc,"temporaryAttempts"),inc
              assert number(inc,"changed")==number(inc,"canonicalChanged")+number(inc,"temporaryChanged"),inc
              assert number(inc,"canonicalChanged")<=number(row,"canonicalEvents"),(inc,row)
              print("PR57_354_WINDOW "+" ".join(f"{k}={inc[k]}" for k in (
                  "window","attempts","changed","canonicalAttempts","canonicalChanged",
                  "temporaryAttempts","temporaryChanged","sites")))
          last=witness[-1]
          assert number(last,"compared")==80,last
          assert number(last,"allCandidatesSame")==80,last
          print("PR57_354_PARITY byteIdentical=TRUE windows=2 Advance2=TRUE "+
                "scope=SELECTED_SETTERS_AND_17_INPLACE_CALLS otherInPlaceWritersUnseen=TRUE "+
                "otherSystemsUnclosed=TRUE noSkippedSlices=TRUE")
          PY
      - name: Upload raw logs, writer journal, summary and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-inplace-journal-354
          path: artifacts/inplace354/**
          if-no-files-found: warn
