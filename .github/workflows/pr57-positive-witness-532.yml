name: 'PR57 #532 exact-positive blocker witness A/B'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-positive-witness-532.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  positive-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_PARALLEL_NEEDS: '0'
      PR57_NEEDS_SINGLE_PASS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational probe in disposable checkout
        run: python3 scripts/pr57-532-inject-positive-witness.py
      - name: Build and run full regression suite
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input259
      - name: Restore authentic REAL construction checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossphase-access-445
          run-id: 41052837425
          github-token: ${{ github.token }}
          path: artifacts/input445
      - name: ABBA fresh processes and full JSON parity at each Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUN'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          cases=[
            ('congestedREAL121',Path('artifacts/input259/real14hREAL-control/checkpoint-0.json'),3600,121,98,'779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'),
            ('worksREAL47',Path('artifacts/input445/pr57-445/A/checkpoint-0.json'),200,47,42,'b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'),
            ('gridARTIFICIAL',None,100,None,None,None)
          ]
          root=Path('artifacts/pr57-532');root.mkdir(parents=True,exist_ok=True)
          summary={'experiment':532,'observational':True,'gainAccepted':False,
                   'scope':'positive blocker revalidated by current exact geometry; no cached false decision',
                   'cadence':'individual Advance(2)','comparison':'composed flags, fresh ABBA processes','cases':{}}
          for name,source,seconds,alive,vehicles,expected in cases:
            raw=source.read_bytes() if source else None
            if raw is not None:
              assert hashlib.sha256(raw).hexdigest()==expected,name
              state=json.loads(raw)
              assert sum(bool(c['Alive']) for c in state['Citizens'])==alive
              assert len(state['Vehicles'])==vehicles
            starts=[];ends=[];observations=[];arms={}
            for arm in ('A1','B1','B2','A2'):
              dest=root/name/arm;dest.mkdir(parents=True,exist_ok=True)
              probe=arm.startswith('B')
              env=os.environ.copy()
              env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',PR57_GRID_DIAG='0',
                         PR57_SAVE_CAPTURE_DIR=str(dest.resolve()),
                         PR57_532_POSITIVE_WITNESS='1' if probe else '0')
              cmd=['dotnet','run','--no-build','-c','Release',
                   '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                   '--','profile','cycle' if source else 'grid',
                   '--seed=42','--warmup=0','--days=1',f'--window={seconds}','--cap=300']
              if source:cmd.append(f'--resume={source.resolve()}')
              else:cmd.extend(['--rows=3','--length=400'])
              with (dest/'full.log').open('w') as out:
                subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,check=True,timeout=300)
              log=(dest/'full.log').read_text()
              assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,arm,log[-2500:])
              assert f'STEP_PROFILE steps={seconds//2} ' in log,(name,arm,'step count')
              start=(dest/'checkpoint-0.json').read_bytes()
              end=(dest/'checkpoint-1.json').read_bytes()
              if raw is not None:assert start==raw,(name,arm)
              starts.append(start);ends.append(end)
              rows=[line for line in log.splitlines() if line.startswith('PR57_532_WITNESS_SUM ')]
              witnesses=[line for line in log.splitlines() if line.startswith('PR57_532_WITNESS_DETAIL ')]
              assert bool(rows)==probe and (not witnesses or probe),(name,arm,'probe engagement')
              if probe:
                parsed=[]
                for row in rows:
                  vals={k:int(v) for k,v in re.findall(r'\b(\w+)=(\d+)',row)}
                  assert vals['attempts']==vals['hits']+vals['misses']
                  assert vals['attempts']<=vals['calls']
                  assert vals['records']<=vals['calls']
                  assert vals['hits']<=vals['attempts']
                  assert vals['distinct']<=vals['records']
                  assert vals['slices']>=1
                  parsed.append(vals)
                assert parsed==sorted(parsed,key=lambda x:x['slices'])
                observations.append((parsed,witnesses))
              profile=next(x for x in log.splitlines() if x.startswith('STEP_PROFILE steps='))
              arms[arm]={'stepProfile':profile,'probe':probe,'inputSha256':hashlib.sha256(start).hexdigest(),
                         'finalSha256':hashlib.sha256(end).hexdigest(),
                         'window':next(x for x in log.splitlines() if x.startswith('WINDOW ')),
                         'lastSummary':rows[-1] if rows else None,'witnesses':witnesses}
              print('PR57_532_ARM',name,arm,'summaries',len(rows),'witnesses',len(witnesses),flush=True)
            assert all(x==starts[0] for x in starts),(name,'input mismatch')
            assert all(x==ends[0] for x in ends),(name,'FULL_JSON_PARITY_FAIL')
            assert observations[0]==observations[1],(name,'NONDETERMINISTIC_WITNESS')
            if name=='congestedREAL121':
              assert observations[0][0][-1]['hits']>0,(name,'WITNESS_FAST_PATH_NOT_EXERCISED')
            summary['cases'][name]={'stepsPerArm':seconds//2,'fullJsonParity':True,
                                     'artificial':source is None,'arms':arms}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_532_EXACT_POSITIVE_WITNESS_ABBA_PASS',flush=True)
          PY_RUN
      - name: Preserve full logs and checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-positive-witness-532
          path: artifacts/pr57-532
          retention-days: 14
          if-no-files-found: warn
