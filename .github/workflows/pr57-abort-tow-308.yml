name: 'PR57 #308 adversarial AbortTow target publication'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths:
      - .github/workflows/pr57-abort-tow-308.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Real abort writer against artificial fixture (not throughput)
        run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --filter FullyQualifiedName~Pr57BodyShadow308Tests --verbosity normal
      - name: Full simulation regression tests
        run: dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
