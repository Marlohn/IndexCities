name: PR57 vehicle cost by blocked outcome (observational)
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-vehicle-cost-155.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  vehicle-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and test simulation
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore REAL congested save
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-legal-workplaces-8d
          run-id: 40169101306
          github-token: \${{ github.token }}
          path: artifacts/real
      - name: Profile four successive 60-second windows and measure plain wall separately
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/real -type f -path '*/pr57-jobs-20/checkpoint-11.json' -print -quit)"
          test -s "$source"
          echo "PR57_VEHICLE_COST_CASE class=REAL sourceSha256=$(sha256sum "$source" | cut -d' ' -f1) alive=121 window=60 windows=4 cadence=Advance2"
          for mode in profile plain; do
            mkdir -p "artifacts/vehicle-cost/$mode"
            probe=0; command=scale
            if [[ "$mode" == profile ]]; then probe=1; command=profile; fi
            PR57_HOST_QUANTUM=1 PR57_AB_CHECKPOINT=1 \
            PR57_SAVE_CAPTURE_DIR="$PWD/artifacts/vehicle-cost/$mode" \
            PR57_SITE_OWNER_ROSTER=1 PR57_BUILDING_WORK_ACCESS=1 \
            PR57_DISPATCH_SHIPMENT_LOOKUP=1 PR57_ORDER_SHIPMENT_INDEX=1 \
            PR57_PROGRESS_SHIPMENT_LOOKUP=1 PR57_SINGLE_CREW_ASSIGNMENT=1 \
            PR57_VEHICLE_COST_PROBE="$probe" PR57_IDLE_SCAN_PROBE=0 PR57_HOT_TIMING=0 \
              timeout 240s dotnet run --no-build -c Release \
                --project src/IndexCities.Headless/IndexCities.Headless.csproj -- \
                "$command" cycle --seed=42 --warmup=0 --days=4 --window=60 \
                --cap=200 --resume="$source" \
                | tee "artifacts/vehicle-cost/$mode.log"
          done
      - name: Verify complete checkpoints and report intrusive cost distribution
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("artifacts/vehicle-cost")
          logs={mode:(root/f"{mode}.log").read_text() for mode in ("profile","plain")}
          for mode,log in logs.items():
              assert "INVARIANTS OK" in log and "SAVE " in log,(mode,"invariants/save")
              assert "PR57_ORDER_SHIPMENT_INDEX active=True" in log,(mode,"composed baseline")
              assert "PR57_SINGLE_CREW_ASSIGNMENT active=True" in log,(mode,"sixth flag")
              assert sum(x.startswith("WINDOW ") for x in log.splitlines())==4,(mode,"window count")
          for i in range(5):
              assert (root/"profile"/f"checkpoint-{i}.json").read_bytes()==(root/"plain"/f"checkpoint-{i}.json").read_bytes(),(i,"complete checkpoint mismatch")
          rows=[x for x in logs["profile"].splitlines() if x.startswith("PR57_VEHICLE_COST ")]
          assert len(rows)>=8,("probe did not execute",len(rows))
          assert "PR57_VEHICLE_COST " not in logs["plain"],"plain wall contaminated"
          last_slices=int(re.search(r"slices=(\d+)",rows[-1]).group(1))
          final=[x for x in rows if f"slices={last_slices} " in x]
          assert len(final)==8,(last_slices,len(final))
          data={}
          for line in final:
              group=re.search(r"group=([a-z-]+)",line).group(1)
              data[group]={k:float(v) for k,v in re.findall(r"([A-Za-z]+)=([0-9.]+)",line)}
              print(line)
          assert len(data)==8,len(data)
          assert abs(sum(v["sharePct"] for v in data.values())-100)<0.2,"timing shares"
          assert data["operations"]["calls"]>0 and data["moved"]["calls"]+data["queue"]["calls"]+data["junction"]["calls"]+data["waiting"]["calls"]>0,"physical classification missing"
          print(f"PR57_VEHICLE_COST_SUMMARY slices={last_slices} groups=8 intrusive=True noOptimization=True")
          for mode in ("profile","plain"):
              rows=[x for x in logs[mode].splitlines() if x.startswith("WINDOW ")]
              wall=sum(float(re.search(r"\bwall=([0-9.]+)s",x).group(1)) for x in rows)
              cpu=sum(float(re.search(r"\bcpu=([0-9.]+)s",x).group(1)) for x in rows)
              alloc=sum(float(re.search(r"\ballocMB=([0-9.]+)",x).group(1)) for x in rows)
              print(f"PR57_VEHICLE_COST_RUN mode={mode} simSeconds=240 wall={wall:.3f}s cpu={cpu:.3f}s allocMB={alloc:.1f} throughput={240/wall:.2f}sps note=NO_AB_SPEEDUP")
          print("PR57_VEHICLE_COST_PARITY checkpoints=5 complete=True")
          PY
      - name: Preserve probe and plain logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-vehicle-cost-155
          path: artifacts/vehicle-cost/**
          retention-days: 14
