name: 'PR57 #281 walk-route validation boundary census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-walk-validation-281.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  walk_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Release and full regression
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic late REAL/GRID states from #237
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/prior-237
      - name: Restore authentic economic REAL 14h state from #243
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-real-coexist-243
          run-id: 40601570843
          github-token: ${{ github.token }}
          path: artifacts/prior-243
      - name: Four states, eight fresh .NET processes, exact full JSON parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import subprocess, os, json, hashlib, re
          root=Path('artifacts/walk-validation-281')
          root.mkdir(parents=True,exist_ok=True)
          def source_for(case):
              if case=='real14hREAL':
                  return Path('artifacts/prior-243/overnight-08/checkpoint-1.json')
              files=list(Path('artifacts/prior-237').rglob(f'{case}-control1/checkpoint-5.json'))
              assert len(files)==1,(case,files)
              return files[0]
          cases=[
              ('worksREAL','cycle',200),
              ('queueREAL','cycle',200),
              ('real14hREAL','cycle',200),
              ('gridARTIFICIAL','grid',100)
          ]
          for i,(case,fixture,horizon) in enumerate(cases):
              source=source_for(case)
              assert source.is_file() and source.stat().st_size>0,(case,source)
              original=source.read_bytes()
              state=json.loads(original,parse_float=Decimal)
              living=sum(bool(c.get('Alive')) for c in state['Citizens'])
              if case=='real14hREAL':
                  assert living==121 and len(state['Vehicles'])==98
              paths={}
              order=('control','probe') if i%2==0 else ('probe','control')
              for mode in order:
                  dest=root/f'{case}-{mode}'
                  dest.mkdir(parents=True,exist_ok=True)
                  env=os.environ.copy()
                  env.update({
                      'PR57_HOST_QUANTUM':'1',
                      'PR57_AB_CHECKPOINT':'1',
                      'PR57_GRID_DIAG':'0',
                      'PR57_281_WALK_VALIDATION':'1' if mode=='probe' else '0',
                      'PR57_239_CITIZEN_PHASES':'0',
                      'PR57_224_CITIZEN_STATE_COST':'0',
                      'PR57_272_PENETRATION_MEMO':'0',
                      'PR57_273_ROUTE_DOCK':'0',
                      'PR57_SAVE_CAPTURE_DIR':str(dest.resolve())
                  })
                  cmd=['dotnet','run','--no-build','-c','Release',
                       '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                       '--','scale',fixture,'--seed=42','--warmup=0','--days=1',
                       f'--window={horizon}','--cap=600',f'--resume={source.resolve()}']
                  logpath=root/f'{case}-{mode}.log'
                  with logpath.open('w') as out:
                      subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                     check=True,timeout=240)
                  log=logpath.read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(case,mode,log[-2000:])
                  assert (dest/'checkpoint-0.json').read_bytes()==original,(case,mode,'SOURCE_CHANGED')
                  assert (dest/'checkpoint-1.json').is_file(),(case,mode,'NO_FINAL_SAVE')
                  windows=[line for line in log.splitlines() if line.startswith('WINDOW ')]
                  assert len(windows)==1,(case,mode,windows)
                  print('PR57_281_WINDOW',case,mode,windows[0],flush=True)
                  if mode=='probe':
                      rows=[line for line in log.splitlines() if line.startswith('PR57_281_WALK ')]
                      assert rows,(case,'MISSING_OBSERVATION')
                      final=rows[-1]
                      expected=horizon//2
                      assert f'calls={expected} ' in final,(case,final)
                      print('PR57_281_RESULT',case,'living',living,final,flush=True)
                  paths[mode]=dest
              for checkpoint in (0,1):
                  a=(paths['control']/f'checkpoint-{checkpoint}.json').read_bytes()
                  b=(paths['probe']/f'checkpoint-{checkpoint}.json').read_bytes()
                  assert a==b,(case,checkpoint,'FULL_JSON_MISMATCH')
                  assert json.loads(a,parse_float=Decimal)==json.loads(b,parse_float=Decimal)
                  print('PR57_281_CHECKPOINT',case,checkpoint,'sha256',
                        hashlib.sha256(a).hexdigest(),flush=True)
              print('PR57_281_PARITY',case,'processes=2','cadence=ADVANCE_2',
                    f'callsPerArm={horizon//2}','fullJson=EXACT',
                    'observationOnly=True',flush=True)
          PY
      - name: Preserve raw logs and complete checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-walk-validation-281
          path: artifacts/walk-validation-281/**
          retention-days: 14
