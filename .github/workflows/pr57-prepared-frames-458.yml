name: 'PR57 #458 per-invocation prepared SAT frames ABBA'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-prepared-frames-458.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  prepared-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject opt-in per-invocation prepared geometry into disposable checkout
        run: python3 scripts/pr57-458-inject.py
      - name: Build and test canonical and opt-in
        run: |
          set -euo pipefail
          dotnet build src/IndexCities.Headless/IndexCities.Headless.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
          PR57_458_PREPARED_FRAMES=1 dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --no-build --verbosity quiet
      - name: Restore authentic REAL congestion checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/real
      - name: Restore authentic works and artificial GRID checkpoints
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-pose-noop-237
          run-id: 40589313790
          github-token: ${{ github.token }}
          path: artifacts/mixed
      - name: ABBA with individual Advance(2), full checkpoints and CPU/GC
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_458' | tee artifacts/pr57-458-console.log
          import hashlib,json,os,re,statistics,subprocess,time
          from decimal import Decimal
          from pathlib import Path
          root=Path('artifacts/prepared-458')
          root.mkdir(parents=True,exist_ok=True)
          real=Path('artifacts/real/real14hREAL-control/checkpoint-0.json')
          works=list(Path('artifacts/mixed').rglob('worksREAL-control1/checkpoint-0.json'))
          grid=list(Path('artifacts/mixed').rglob('gridARTIFICIAL-control1/checkpoint-5.json'))
          assert real.is_file() and len(works)==1 and len(grid)==1
          cases=[('economyREAL14h',real,'cycle',3600,3900,121,98),
                 ('worksREAL',works[0],'cycle',200,600,47,42),
                 ('gridARTIFICIAL',grid[0],'grid',100,300,1111,None)]
          results={}
          for name,source,fixture,horizon,cap,alive,vehicles in cases:
              original=source.read_bytes()
              state=json.loads(original,parse_float=Decimal)
              assert sum(bool(c['Alive']) for c in state['Citizens'])==alive
              if vehicles is not None: assert len(state['Vehicles'])==vehicles
              if name=='economyREAL14h':
                  assert hashlib.sha256(original).hexdigest()=='779c144f2d6b2b64ece079f5740bf8a0a473a47286ca40d8b5f6b9dd61ab616f'
              if name=='worksREAL':
                  assert hashlib.sha256(original).hexdigest()=='b7c52ab87928e7eaa93cfc557b9f3dc935d5b17da44820b405990071940f95b5'
              stats={};all_checkpoints={}
              for arm in ('A1','B1','B2','A2'):
                  dest=root/name/arm
                  dest.mkdir(parents=True,exist_ok=True)
                  env=os.environ.copy()
                  env.update(PR57_HOST_QUANTUM='1',PR57_AB_CHECKPOINT='1',
                             PR57_GRID_DIAG='0',PR57_270_MANOEUVRE_SCRATCH='0',
                             PR57_271_PENETRATION_KEYS='0',
                             PR57_272_PENETRATION_MEMO='0',
                             PR57_PENETRATION_STACK_AXES='0',
                             PR57_458_PREPARED_FRAMES='1' if arm.startswith('B') else '0',
                             PR57_SAVE_CAPTURE_DIR=str(dest.resolve()))
                  cmd=['dotnet','run','--no-build','-c','Release',
                       '--project','src/IndexCities.Headless/IndexCities.Headless.csproj',
                       '--','scale',fixture,'--seed=42','--warmup=0',
                       '--days=1',f'--window={horizon}',f'--cap={cap}',
                       f'--resume={source.resolve()}']
                  start=time.perf_counter()
                  with (dest/'full.log').open('w') as out:
                      subprocess.run(cmd,env=env,stdout=out,stderr=subprocess.STDOUT,
                                     check=True,timeout=360)
                  process_wall=time.perf_counter()-start
                  log=(dest/'full.log').read_text()
                  assert 'INVARIANTS OK' in log and 'SAVE ' in log,(name,arm)
                  if name=='economyREAL14h':
                      assert ('PR57_458_FAST_USED' in log)==arm.startswith('B'),(name,arm,'fast path not exercised')
                  checkpoints={p.name:p.read_bytes() for p in dest.glob('checkpoint-*.json')}
                  assert len(checkpoints)>=2 and checkpoints['checkpoint-0.json']==original,(name,arm,'missing checkpoint')
                  all_checkpoints[arm]=checkpoints
                  rows=[x for x in log.splitlines() if x.startswith('WINDOW ')]
                  assert len(rows)==1,(name,arm,rows)
                  def metric(k):
                      m=re.search(r'(?:^| )'+re.escape(k)+r'=([-0-9.]+)',rows[0])
                      assert m,(name,arm,k,rows[0])
                      return float(m.group(1))
                  stats[arm]={'wall':metric('wall'),'cpu':metric('cpu'),
                              'allocMB':metric('allocMB'),'processWall':process_wall,
                              'fastPathUsed':'PR57_458_FAST_USED' in log}
                  print('PR57_458_WINDOW',name,arm,rows[0],flush=True)
              keys=set(all_checkpoints['A1'])
              assert all(set(c)==keys for c in all_checkpoints.values()),(name,'CHECKPOINT_NAMES_MISMATCH')
              for checkpoint in sorted(keys):
                  assert len({all_checkpoints[arm][checkpoint] for arm in all_checkpoints})==1,(name,checkpoint,'FULL_JSON_MISMATCH')
              means={mode:{k:statistics.mean(stats[arm][k] for arm in arms)
                           for k in ('wall','cpu','allocMB','processWall')}
                     for mode,arms in (('A',('A1','A2')),('B',('B1','B2')))}
              ratios={k:means['A'][k]/means['B'][k] if means['B'][k] else None
                      for k in means['A']}
              last=max(keys,key=lambda x:int(x.split('-')[1].split('.')[0]))
              results[name]={'living':alive,'vehicles':len(state['Vehicles']),
                             'callsAdvance2PerArm':horizon//2,
                             'inputSha256':hashlib.sha256(original).hexdigest(),
                             'finalSha256':hashlib.sha256(all_checkpoints['A1'][last]).hexdigest(),
                             'fullJsonParity':True,'checkpointsPerArm':len(keys),
                             'stats':stats,'means':means,'ratiosAOverB':ratios}
              print('PR57_458_PARITY',name,'fullJson=EXACT','Advance2PerArm',horizon//2,
                    'checkpoints',len(keys),'wallAOverB',round(ratios['wall'],5),
                    'cpuAOverB',round(ratios['cpu'],5),'allocAOverB',round(ratios['allocMB'],5),flush=True)
          summary={'experiment':458,'optIn':'PR57_458_PREPARED_FRAMES',
                   'baseline':'PR57 composed flags, stack axes off, no geometry memo',
                   'allAdvance2':True,'cases':results,
                   'limitations':'Bounded per-invocation POC, not causal cross-slice reuse or 10k proof; GRID is artificial.'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print('PR57_458_SUMMARY',json.dumps(summary,sort_keys=True),flush=True)
          PY_458
      - name: Preserve raw logs, full JSON checkpoints and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-prepared-458
          path: |
            artifacts/prepared-458
            artifacts/pr57-458-console.log
          retention-days: 14
          if-no-files-found: warn
