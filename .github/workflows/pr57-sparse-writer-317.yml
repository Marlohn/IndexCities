name: 'PR57 #317 sparse writer publication versus full phase diff'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-sparse-writer-317.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  sparse-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run existing tests
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic REAL and GRID saves
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Balanced fresh-process control full-diff sparse-writer comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sparse-writer-317
          for case in real14hREAL gridARTIFICIAL; do
            input="artifacts/input/${case}-control/checkpoint-0.json"
            test -s "$input"
            calls=100; start=76
            if [[ "$case" == gridARTIFICIAL ]]; then calls=50; start=26; fi
            for arm in control1 full1 sparse1 sparse2 full2 control2; do
              output="artifacts/sparse-writer-317/${case}-${arm}"
              mkdir -p "$output"
              cmd=(dotnet run --no-build -c Release --project scripts/pr57-economy-review-294/Pr57EconomyReview294.csproj -- "$input" "$case" control "$calls" "$output")
              case "$arm" in
                full*) PR57_310_PHASE_FANOUT=1 PR57_310_START="$start" "${cmd[@]}" > "artifacts/sparse-writer-317/${case}-${arm}.log" 2>&1 ;;
                sparse*) PR57_317_SPARSE_WRITERS=1 PR57_317_START="$start" "${cmd[@]}" > "artifacts/sparse-writer-317/${case}-${arm}.log" 2>&1 ;;
                control*) "${cmd[@]}" > "artifacts/sparse-writer-317/${case}-${arm}.log" 2>&1 ;;
              esac
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          root=Path('artifacts/sparse-writer-317')
          def fields(line): return dict(re.findall(r'([A-Za-z][A-Za-z0-9]*)=([^\s]+)',line))
          pairs=0
          for case,calls,start in [('real14hREAL',100,76),('gridARTIFICIAL',50,26)]:
              rows={}
              for arm in ('control1','full1','sparse1','sparse2','full2','control2'):
                  log=(root/f'{case}-{arm}.log').read_text()
                  final=[fields(x) for x in log.splitlines() if x.startswith('PR57_294_FINAL ')]
                  assert len(final)==1,(case,arm,'final')
                  f=final[0]
                  assert f['mode']=='control' and f['cadence']=='Advance2'
                  assert f['noCache']=='True' and f['noSkippedSlices']=='True'
                  assert f['exactCheckpoints']=='True' and int(f['calls'])==calls
                  full=[fields(x) for x in log.splitlines() if x.startswith('PR57_310_PHASE ')]
                  sparse=[fields(x) for x in log.splitlines() if x.startswith('PR57_317_WRITERS ')]
                  assert len(full)==(75 if arm.startswith('full') else 0),(case,arm,'full',len(full))
                  assert len(sparse)==(25 if arm.startswith('sparse') else 0),(case,arm,'sparse',len(sparse))
                  if sparse:
                      assert [int(x['call']) for x in sparse]==list(range(start,calls+1))
                      print(f'PR57_317_EVENTS case={case} arm={arm} changed={sum(int(x["changed"]) for x in sparse)} position={sum(int(x["position"]) for x in sparse)} crossing={sum(int(x["crossing"]) for x in sparse)} individualGateDeltas={sum(int(x["individualGateDeltas"]) for x in sparse)} writerScopeMs={sum(float(x["writerScopeMs"]) for x in sparse):.6f} scope=PARTIAL_WRITER_SITES')
                  rows[arm]=f
              for suffix in ('1','2'):
                  for candidate in ('full','sparse'):
                      for step in (0,20,calls//2,calls):
                          a=(root/f'{case}-control{suffix}'/f'checkpoint-{step}.json').read_bytes()
                          b=(root/f'{case}-{candidate}{suffix}'/f'checkpoint-{step}.json').read_bytes()
                          assert a==b,(case,suffix,candidate,step)
                          pairs+=1
              for metric in ('wallMs','cpuMs','allocatedBytes'):
                  values={arm:statistics.mean(float(rows[f'{arm}{i}'][metric]) for i in ('1','2')) for arm in ('control','full','sparse')}
                  print(f'PR57_317_COST case={case} metric={metric} control={values["control"]:.3f} full={values["full"]:.3f} sparse={values["sparse"]:.3f} fullDelta={values["full"]-values["control"]:.3f} sparseDelta={values["sparse"]-values["control"]:.3f} scope=INTRUSIVE_OBSERVATION_NOT_ENGINE_SPEEDUP')
          assert pairs==32,pairs
          print('PR57_317_VERIFIED checkpointPairs=32/32 processes=12 allAdvance2=True sameHarness=True isolatedFlags=True')
          PY
      - name: Preserve raw logs and complete checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-sparse-writer-317
          path: artifacts/sparse-writer-317/**
          retention-days: 14
