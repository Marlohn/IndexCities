name: 'PR57 #335 natural tow in authentic REAL Advance(2)'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-natural-tow-335.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  natural-tow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build observational replay
        run: dotnet build scripts/pr57-natural-tow-335/Pr57NaturalTow335.csproj -c Release
      - name: Restore authentic economy REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Replay up to six simulated hours, individual Advance(2)
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          mkdir -p artifacts/tow335
          dotnet run --no-build -c Release \
            --project scripts/pr57-natural-tow-335/Pr57NaturalTow335.csproj \
            -- "$input" artifacts/tow335 \
            | tee artifacts/tow335/replay.log
      - name: Preserve authentic checkpoints and event census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-natural-tow-335
          path: artifacts/tow335/**
          retention-days: 14
