name: 'PR57 #398 route changes by canonical Step phase REAL'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-route-phases-398.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  real-route-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_236_POSE_NOOP_SKIP: '1'
      PR57_VEHICLE_COST_PROBE: '1'
      PR57_ADVANCE_BOUNDARY_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inject observational #394 through #398 in disposable checkout
        run: |
          set -euo pipefail
          for n in 394 395 396 397 398; do python3 "scripts/pr57-${n}-inject.py"; done
      - name: Build and test
        run: |
          set -euo pipefail
          dotnet build scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release
      - name: Restore authentic REAL 14h checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-crossing-259
          run-id: 40633885112
          github-token: ${{ github.token }}
          path: artifacts/input
      - name: Two fresh processes, 10800 individual Advance(2) per arm
        shell: bash
        run: |
          set -euo pipefail
          input="artifacts/input/real14hREAL-control/checkpoint-0.json"
          test -s "$input"
          for arm in base probe; do
            flag=0
            if [[ "$arm" == probe ]]; then flag=1; fi
            mkdir -p "artifacts/route398/$arm"
            PR57_394_PATH_SHADOW="$flag" \
            PR57_395_PATH_BOUNDARY="$flag" \
            PR57_396_ALL_UNSPLIT="$flag" \
            PR57_397_ENTRY_CLEANUP="$flag" \
            PR57_398_ROUTE_PHASES="$flag" \
              dotnet run --no-build -c Release \
                --project scripts/pr57-actor-regime-337/Pr57ActorRegime337.csproj \
                -- "$input" "artifacts/route398/$arm" \
                > "artifacts/route398/$arm/full.log"
            grep -q '^PR57_337_FINAL .*parity=IDENTICAL' "artifacts/route398/$arm/full.log"
          done
          cmp artifacts/route398/base/checkpoint-10800.json artifacts/route398/probe/checkpoint-10800.json
          sha256sum artifacts/route398/*/checkpoint-10800.json | tee artifacts/route398/checkpoints.sha256
          python3 - <<'PY' | tee artifacts/route398/summary.json
          import json
          from pathlib import Path
          root=Path('artifacts/route398')
          result={}
          for arm in ('base','probe'):
              lines=(root/arm/'full.log').read_text().splitlines()
              def rows(prefix):
                  return [dict(v.split('=',1) for v in line.split()[1:] if '=' in v)
                          for line in lines if line.startswith(prefix+' ')]
              hours=rows('PR57_337_HOUR')
              advance=rows('PR57_ADVANCE_BOUNDARY')
              final=rows('PR57_337_FINAL')
              gap397=rows('PR57_397_BOUNDARY')
              phases=rows('PR57_398_PHASES')
              changes=rows('PR57_398_CHANGE')
              assert len(hours)==6 and len(advance)==108 and len(final)==1
              assert int(advance[-1]['calls'])==10800 and final[0]['parity']=='IDENTICAL'
              assert all(int(h['living'])==121 for h in hours)
              assert len(phases)==len(gap397)==(1 if arm=='probe' else 0)
              row={'wallMs':round(sum(float(h['wallMs']) for h in hours),3),
                   'cpuMs':round(sum(float(h['cpuMs']) for h in hours),3),
                   'allocatedBytes':sum(int(h['totalAllocatedBytes']) for h in hours)}
              if phases:
                  p=phases[0]
                  assert p['observational']=='True' and p['noSkippedSlices']=='True'
                  assert p['exactRoute']=='True' and p['netBoundariesOnly']=='True'
                  assert int(p['steps'])==1800 and int(p['captures'])==25200
                  assert int(p['targetIds'])==11 and int(p['missingTargetSteps'])==0
                  assert int(p['physical'])>=12000 and int(p['frequency'])>0
                  assert len(p['changes'].split(','))==14
                  assert int(p['traces'])==len(changes)
                  g=gap397[0]
                  assert [int(v) for v in g['route'].split(',')]==[0,0,0,11,0,0]
                  row['phase398']=p
                  row['changes398']=changes
                  row['trueGap397']=g
              result[arm]=row
          print(json.dumps({'arms':result,'scope':'AUTHENTIC_REAL_121_LIVING_98_VEHICLES_6H',
              'advance2PerArm':10800,'fixtureSpecificTargetIds':11,
              'observational':True,'causalClosure':False,'optimizationGainAccepted':False},
              sort_keys=True))
          PY
      - name: Upload original logs and saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-route-phases-398
          path: artifacts/route398/
          if-no-files-found: warn
