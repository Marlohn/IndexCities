name: 'PR57 #194 selected junction blocker first/last read state census'
on:
  push:
    branches: [experimento/escala-motor-integrado-10k-80y]
    paths: [.github/workflows/pr57-junction-read-order-194.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integrated-scale-pr57
  cancel-in-progress: false
jobs:
  junction-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR57_SITE_OWNER_ROSTER: '1'
      PR57_BUILDING_WORK_ACCESS: '1'
      PR57_DISPATCH_SHIPMENT_LOOKUP: '1'
      PR57_ORDER_SHIPMENT_INDEX: '1'
      PR57_PROGRESS_SHIPMENT_LOOKUP: '1'
      PR57_SINGLE_CREW_ASSIGNMENT: '1'
      PR57_SAFE_SITE_BUFFER: '1'
      PR57_PHASE_ALLOC_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and full regression
        shell: bash
        run: |
          set -euo pipefail
          dotnet build scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release
          dotnet test tests/IndexCities.Simulation.Tests/IndexCities.Simulation.Tests.csproj -c Release --verbosity quiet
      - name: Restore authentic GRID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: integrated-scale-pr57-retained-heap-184
          run-id: 40451480020
          github-token: ${{ github.token }}
          path: artifacts/reference
      - name: Replay control and bounded first/last read observational census
        shell: bash
        run: |
          set -euo pipefail
          source="$(find artifacts/reference -type f -path '*/gridARTIFICIAL/plain/checkpoint-0.json' -print -quit)"
          test -s "$source"
          mkdir -p artifacts/junction-194/control artifacts/junction-194/probe
          timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/junction-194/control" | tee artifacts/junction-194/control.log
          PR57_193_JUNCTION_READERS=1 timeout 180s dotnet run --project scripts/Pr57RegimeBench/Pr57RegimeBench.csproj -c Release --no-build -- "$source" "$PWD/artifacts/junction-194/probe" | tee artifacts/junction-194/probe.log
      - name: Check complete JSON parity and census coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/junction-194')
          for i in (0,50,100,150,200):
              assert (root/'control'/f'checkpoint-{i}.json').read_bytes()==(root/'probe'/f'checkpoint-{i}.json').read_bytes(),('FULL_JSON_DIFFERENCE',i)
          lines=(root/'probe.log').read_text().splitlines()
          rows=[dict(kv.split('=',1) for kv in s.split()[1:] if '=' in kv) for s in lines if s.startswith('PR57_193_JUNCTION_READERS ')]
          assert len(rows)>0,('CENSUS_COUNT',len(rows))
          assert sum(int(x['signalReaderJunctionPairs']) for x in rows)>0,rows
          assert sum(int(x['admissions']) for x in rows)>0,rows
          assert all(int(x['admissions'])>=int(x['signalReaderJunctionPairs']) for x in rows),rows
          assert all(int(x['signalReaderJunctionPairs'])>=0 and int(x['redSignalChecks'])>=0 for x in rows),rows
          assert all(int(x['changedVehicles'])>=0 for x in rows),rows
          totals={key:sum(int(x[key]) for x in rows) for key in (
              'selectedBlockerEdges','netPhysicalEdges','netCauseOnlyEdges',
              'netUnchangedEdges','missingEndpointEdges','physicalBeforeFirstRead',
              'physicalAfterLastRead','physicalBetweenSelectedReads',
              'causeBeforeFirstRead','causeAfterLastRead','totalSelectedReads')}
          assert totals['selectedBlockerEdges']>0,totals
          assert totals['selectedBlockerEdges']==sum(totals[k] for k in (
              'netPhysicalEdges','netCauseOnlyEdges','netUnchangedEdges','missingEndpointEdges')),totals
          assert totals['totalSelectedReads']>=totals['selectedBlockerEdges'],totals
          assert totals['physicalBeforeFirstRead']<=totals['selectedBlockerEdges'],totals
          assert totals['physicalAfterLastRead']<=totals['selectedBlockerEdges'],totals
          print('PR57_194_TOTALS',totals)
          for mode in ('control','probe'):
              assert any(s.startswith('PR57_186_DONE ') and 'cadence=ADVANCE_2' in s for s in (root/f'{mode}.log').read_text().splitlines())
          print('PR57_194_VALIDATED checkpoints=5 parity=EXACT_FULL_JSON scope=INTRUSIVE_CENSUS_NOT_AB')
          print('PR57_194_SAMPLE',rows)
          PY
      - name: Preserve logs and complete saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-scale-pr57-junction-read-order-194
          path: artifacts/junction-194/**
          retention-days: 14
